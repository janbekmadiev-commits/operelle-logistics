<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEKZHAN LOGISTIC — ЖД: панель управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Шрифты Fira Sans и Fira Sans Condensed выбраны потому, что в них есть все казахские буквы (проверено отрисовкой).
   Стиль «Ночной рейс»: чёрный фон, один акцент (сигнальный оранжевый; переменная по-прежнему называется --gold).
   Заголовки: узкий заглавный шрифт (--cd), цифры: моноширинный (--mono). Цвета статусов (зелёный, жёлтый, красный, синий) оставлены как смысловые. */
:root{
  --bg:#08090B;
  --panel:#0E0F12;
  --card:#121418;
  --card-2:#191C21;
  --line:#2A2E36;
  --line-soft:#20232A;
  --txt:#F2F3F5;
  --txt-2:#B0B6C0;
  --txt-3:#7B828E;
  --gold:#FF6B1A;
  --green:#22C55E;
  --blue:#3B82F6;
  --amber:#F59E0B;
  --red:#EF4444;
  --violet:#A855F7;
  --cyan:#06B6D4;
  --slate:#64748B;
  --r:10px;
  --r-sm:8px;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --mono:'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,monospace;
  --cd:'Fira Sans Condensed','Arial Narrow','Roboto Condensed',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Fira Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A2E36;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3A3F49}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{
  background:var(--panel);border-right:1px solid var(--line-soft);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--line-soft)}
.brand-mark{
  width:36px;height:36px;border-radius:10px;flex:0 0 36px;
  background:linear-gradient(145deg,#FF6B1A,#B8470A);
  display:grid;place-items:center;color:#180900;font-weight:800;font-size:15px;letter-spacing:-.5px;
}
.brand-logo-box{flex:0 0 auto;display:grid;place-items:center;line-height:0}
.brand-name{font-weight:800;letter-spacing:.6px;font-size:13.5px;white-space:nowrap}
.brand-sub{font-size:10px;color:var(--txt-3);letter-spacing:2.6px;text-transform:lowercase;margin-top:1px}
.nav{padding:10px 10px 20px;overflow-y:auto;flex:1}
.nav-group{margin:16px 8px 6px;font:500 10px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-3)}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:9px;min-height:38px;
  color:var(--txt-2);font-size:13.5px;text-align:left;transition:.15s;position:relative;
}
.nav-item:hover{background:#17191D;color:var(--txt)}
.nav-item.active{background:rgba(255,107,26,.13);color:#FFB184;font-weight:700}
.nav-item.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav-badge{margin-left:auto;background:#2C3038;color:#C9CED6;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:600}
.nav-badge.alert{background:rgba(239,68,68,.18);color:#FCA5A5}
.sidebar-foot{padding:12px;border-top:1px solid var(--line-soft)}
.ai-status{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(8,9,11,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:nowrap;
}
.page-title{font:800 26px/1.05 var(--cd);text-transform:uppercase;letter-spacing:.01em}
.page-sub{font-size:12px;color:var(--txt-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-block{flex:1 1 auto;min-width:0}
.page-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;flex:0 1 230px;min-width:150px;color:var(--txt-3)
}
.search input{background:none;border:none;outline:none;width:100%;color:var(--txt);font-size:13px}
.date-chip{display:flex;flex-direction:column;line-height:1.25;padding:4px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.date-chip b{font-size:13px}
.date-chip span{font-size:11px;color:var(--txt-3)}
.role-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.role-switch button{padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--txt-2);white-space:nowrap}
.role-switch button.on{background:var(--gold);color:#180900;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--txt-2)}
.icon-btn:hover{color:var(--txt);border-color:#3A3F49}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.user-chip{display:flex;align-items:center;gap:9px;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#3A3F49,#20232A);display:grid;place-items:center;font-weight:700;font-size:12px;color:#D5D9E0;border:1px solid var(--line);flex:0 0 34px}
.view{padding:20px 22px 40px;flex:1}

/* ---------- primitives ---------- */
.grid{display:grid;gap:14px}
.grid>*,.stack>*{min-width:0}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g-main{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.g-side{grid-template-columns:270px minmax(0,1fr)}
.c2{grid-template-columns:1fr 1fr;gap:10px}
.c3{grid-template-columns:1fr 1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;min-width:0}
.card.compact{padding:13px}
.compact .card-head{margin-bottom:9px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-title{font:800 18px/1.05 var(--cd);text-transform:uppercase;letter-spacing:.02em}
.modal-head .card-title{font-size:23px}
.card-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--txt-3)}
.small{font-size:12px}
.label{font:500 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-3)}
.kpi-val{font:600 24px/1.1 var(--mono);letter-spacing:-.05em;margin:6px 0 2px}
.delta{font-size:11.5px;font-weight:600}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;
  background:var(--card-2);border:1px solid var(--line);color:var(--txt);transition:.15s;white-space:nowrap
}
.btn:hover{border-color:#4A505B;background:#20242B}
.btn-p{background:var(--gold);border-color:var(--gold);color:#180900}
.btn-p:hover{background:#FF8440;border-color:#FF8440}
/* главное действие в окне или разделе: оранжевая кнопка */
.btn-g{background:var(--gold);border-color:var(--gold);color:#180900}
.btn-g:hover{background:#FF8440;border-color:#FF8440}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#180900}
.btn-gold:hover{background:#FF8440}
.btn-r{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.4);color:#FCA5A5}
.btn-r:hover{background:rgba(239,68,68,.28);border-color:var(--red)}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-green{background:rgba(34,197,94,.15);color:#6EE7A0}
.b-blue{background:rgba(59,130,246,.16);color:#93B8FB}
.b-amber{background:rgba(245,158,11,.15);color:#FBD38D}
.b-red{background:rgba(239,68,68,.15);color:#FCA5A5}
.b-violet{background:rgba(168,85,247,.16);color:#D8B4FE}
.b-slate{background:rgba(100,116,139,.2);color:#B4C2D6}
.b-cyan{background:rgba(6,182,212,.16);color:#7DD8E8}
.b-gold{background:rgba(255,107,26,.16);color:#FFB184}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font:500 10px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--txt-3);
  padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap
}
td{padding:10px 9px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tbody tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
.tbl-wrap{overflow-x:auto;margin:0 -16px -16px;padding:0 16px 4px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.list-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:none}
.dot-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px;font-size:13px}
.progress{height:6px;border-radius:6px;background:#20232A;overflow:hidden}
.progress i{display:block;height:100%;border-radius:6px;background:var(--green)}
.tabs{max-width:100%;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line-soft);padding:4px;border-radius:10px;overflow-x:auto}
.tabs button{padding:7px 13px;border-radius:7px;font-size:12.5px;color:var(--txt-2);white-space:nowrap}
.tabs button.on{background:var(--card-2);color:#fff;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;color:var(--txt-3);font-weight:600;letter-spacing:.4px}
.field input,.field select,.field textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;font-size:13px;width:100%
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field input[readonly]{color:var(--txt-2)}
.field input[type=range]{padding:0;border:none;background:none;accent-color:var(--gold)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--txt-2)}
.seg button.on{border-color:var(--gold);background:rgba(255,107,26,.14);color:#FFB184;font-weight:600}
.chk{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;font-size:13px;text-align:left;width:100%}
.chk.on{border-color:var(--green);background:rgba(34,197,94,.08)}
.chk .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 17px;font-size:11px;color:#04240F}
.chk.on .box{background:var(--green);border-color:var(--green)}
.empty{padding:34px;text-align:center;color:var(--txt-3);font-size:13px}
.divider{height:1px;background:var(--line-soft);margin:14px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,8,15,.72);backdrop-filter:blur(3px);z-index:100;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:20px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  width:min(920px,100%);max-width:100%;min-width:0;max-height:90vh;display:flex;flex-direction:column;animation:pop .2s ease
}
.modal.wide{width:min(1120px,100%)}
.modal.narrow{width:min(600px,100%)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.modal-body{padding:18px;overflow-y:auto;min-width:0}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.stepper{display:flex;gap:6px;padding:14px 18px 0}
.step{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.step i{height:3px;border-radius:3px;background:#2A2E36;display:block}
.step.done i{background:var(--green)} .step.on i{background:var(--gold)}
.step span{font-size:10.5px;color:var(--txt-3);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.on span{color:#FFB184;font-weight:600}
.step.done span{color:#7EE8AC}

/* ---------- toast ---------- */
#toast-root{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:360px}
.toast{
  background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;
  padding:12px 14px;box-shadow:var(--shadow);animation:slide .22s ease;font-size:13px
}
.toast.info{border-left-color:var(--blue)} .toast.warn{border-left-color:var(--amber)} .toast.err{border-left-color:var(--red)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

/* ---------- log / document ---------- */
.log{font-family:var(--mono);font-size:11.5px;background:#060708;border:1px solid var(--line-soft);border-radius:9px;padding:11px;max-height:210px;overflow-y:auto;line-height:1.7}
.log .t{color:var(--txt-3)}
.log .ok{color:#6EE7A0} .log .warn{color:#FBD38D} .log .inf{color:#93B8FB} .log .err{color:#FCA5A5}
.doc{background:#F7F7F4;color:#1a1a1a;border-radius:8px;padding:26px 28px;font-family:'Times New Roman',Georgia,serif;font-size:13px;line-height:1.6}
.doc h3{margin:0 0 4px;font-size:16px;text-align:center;letter-spacing:.5px}
.doc .doc-sub{text-align:center;color:#555;font-size:12px;margin-bottom:16px}
.doc table{border-collapse:collapse;margin:10px 0;width:100%}
.doc td,.doc th{border:1px solid #bbb;padding:5px 8px;font-size:12px;color:#1a1a1a;white-space:normal;text-transform:none;letter-spacing:0;font-weight:400;vertical-align:top}
.doc th{background:#eceae4;font-weight:700;width:34%}
.doc .sign{display:flex;justify-content:space-between;gap:16px;margin-top:26px;font-size:12px;flex-wrap:wrap}
.doc .stamp{margin-top:16px;font-size:11px;color:#777;border-top:1px dashed #bbb;padding-top:8px}

/* ---------- misc ---------- */
.tile{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:12px;min-width:0}
.tile.click{cursor:pointer;transition:.15s;text-align:left;width:100%}
.tile.click:hover{border-color:#4A505B;transform:translateY(-1px)}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.hbar{height:8px;border-radius:8px;background:#20232A;overflow:hidden;display:flex}
.hbar i{display:block;height:100%}
.mini{font-size:11.5px;color:var(--txt-3)}
.alert-row{display:flex;gap:11px;padding:11px;border-radius:10px;background:var(--card-2);border:1px solid var(--line-soft);align-items:flex-start}
.alert-row.crit{border-left:3px solid var(--red)}
.alert-row.warn{border-left:3px solid var(--amber)}
.alert-row.info{border-left:3px solid var(--blue)}
.alert-row.ok{border-left:3px solid var(--green)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:600;text-align:right}
.kv span{color:var(--txt-2)}
.nowrap{white-space:nowrap}
.burger{display:none}

/* ---------- command center ---------- */
.command-hero{background:linear-gradient(135deg,#131f35,#172944 55%,#213b5e);border:1px solid #2a4268;border-radius:16px;padding:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px;box-shadow:0 14px 34px rgba(0,0,0,.22)}
.command-hero h2{margin:5px 0 4px;font-size:24px;letter-spacing:-.4px}
.command-hero p{margin:0;color:var(--txt-2);max-width:720px}
.command-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.priority-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.priority-card{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:13px;min-height:118px;display:flex;flex-direction:column;gap:7px}
.priority-card.crit{border-left:3px solid var(--red)}
.priority-card.warn{border-left:3px solid var(--amber)}
.priority-card.info{border-left:3px solid var(--blue)}
.priority-card.ok{border-left:3px solid var(--green)}
.priority-title{font-size:12px;font-weight:700}
.priority-value{font:600 22px/1 var(--mono);letter-spacing:-.05em}
.priority-desc{font-size:11.5px;color:var(--txt-3);flex:1}
.priority-card .btn{align-self:flex-start}
.ops-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-bottom:14px}
.ops-chip{background:var(--card);border:1px solid var(--line-soft);border-radius:11px;padding:11px 12px;min-width:0}
.ops-chip .label{margin-bottom:5px}
.ops-chip b{font:600 17px var(--mono);letter-spacing:-.04em}
.section-label{display:flex;align-items:center;gap:9px;margin:18px 0 9px;font:500 10.5px var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--txt-3)}
.section-label:after{content:'';height:1px;background:var(--line-soft);flex:1}
.action-list{display:grid;gap:7px}
.action-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line-soft);border-radius:9px;background:var(--panel)}
.role-context{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;background:rgba(255,107,26,.12);color:#FFB184;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}

/* ---------- логистика: карта, скоринг, трекинг ---------- */
.map-wrap{background:#0A0B0D;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;position:relative}
.map-svg{cursor:grab;user-select:none;-webkit-user-select:none}
.map-svg:active{cursor:grabbing}
.map-ctl{position:absolute;left:10px;top:10px;z-index:3;display:flex;gap:3px;background:rgba(8,9,11,.8);border:1px solid var(--line);border-radius:9px;padding:3px;backdrop-filter:blur(6px)}
.map-ctl button{padding:5px 9px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--txt-2)}
.map-ctl button:hover{background:var(--card-2);color:#fff}
.map-wrap .stp{cursor:pointer}
.vt-art{display:block;width:100%;height:auto}
.vt-tile .vt-art{margin:-2px 0 7px;background:#0E1013;border-radius:8px}
.art-box{width:132px;flex:0 0 132px;background:#0E1013;border:1px solid var(--line-soft);border-radius:9px;padding:4px 6px}
.art-box.sm{width:76px;flex:0 0 76px;padding:2px 4px}
.art-box.wide{width:100%;flex:none;max-width:330px}
.svc-ic{flex:0 0 auto;vertical-align:-3px}
.pill.on{background:var(--gold);border-color:var(--gold);color:#180900;font-weight:700}
.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:10px 12px;font:inherit;font-size:13px;line-height:1.5;resize:vertical}
/* фото машины от перевозчика и сканы документов */
.shots-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.shot-th{position:relative;width:64px;height:46px;flex:0 0 64px;border-radius:7px;border:1px solid var(--line-soft);background:#0E1013;overflow:hidden;cursor:pointer;padding:0;display:block}
.shot-th:hover{border-color:#4A505B}
.shot-th img{width:100%;height:100%;object-fit:cover;display:block}
.shot-th .vt-art{position:absolute;inset:2px 3px 10px;width:auto;height:auto;aspect-ratio:auto}
.shot-th span{position:absolute;left:0;right:0;bottom:0;font-size:9px;line-height:1.25;padding:1px 2px;background:rgba(8,12,20,.78);color:#C9D1DD;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-view{display:grid;place-items:center;background:#0C0D10;border-radius:10px;padding:10px;min-height:240px}
.file-view img{max-width:100%;max-height:62vh;border-radius:8px}
.req-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line-soft)}
.req-row:last-child{border-bottom:none}
/* фото техники без фона: машина стоит на тёмной подложке карточки */
.vt-photo{aspect-ratio:2/1}
.art-box:has(.vt-photo),.vt-tile .vt-photo{background-color:#0E1013}
.art-box:has(.vt-photo){background-image:radial-gradient(85% 85% at 50% 92%,rgba(255,107,26,.16),#0E1013 72%)}
.modal.xl{width:min(1320px,100%)}
.trip-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
.trip-side{min-width:0}
.stop-row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;border:1px solid var(--line-soft);border-radius:10px;background:var(--card-2);margin-bottom:7px;font-size:12.5px}
.stop-row:hover{border-color:#4A505B}
.stop-row.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.stop-n{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;font-size:11px;font-weight:800;flex:0 0 22px}
.stop-addr{color:var(--txt);margin:3px 0 2px}
.chat-scroll{max-height:320px;overflow-y:auto}
.pill{padding:5px 11px;border-radius:20px;border:1px solid var(--line);font-size:12px;color:var(--txt-2);background:var(--panel)}
.pill:hover{border-color:#4A505B;color:#fff}
.trip-row{padding:11px 12px}
.trip-list{max-height:470px;overflow-y:auto;padding-right:2px}
.fleet-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line-soft)}
.fleet-row:last-child{border-bottom:none}
.veh-form{background:var(--panel)}
.place-new{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) 74px auto;gap:8px;margin-top:8px}
.place-new input,.place-new select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;font-size:13px;width:100%;min-width:0}
.role-me{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;color:var(--txt);max-width:170px;margin-left:4px;outline:none}
.doc.scan{position:relative;overflow:hidden}
.doc.scan::after{content:'КОПИЯ · BEKZHAN LOGISTIC';position:absolute;right:-20px;top:46%;transform:rotate(-22deg);font:700 28px/1 Arial,sans-serif;color:rgba(160,30,30,.1);letter-spacing:4px;pointer-events:none}
.map-wrap svg{display:block;width:100%;height:auto}
.map-wrap .trk{cursor:pointer}
.map-wrap .trk:hover circle{stroke-width:3.5}
.tier{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font-size:11px;font-weight:800}
.tier-A{background:rgba(34,197,94,.2);color:#7EE8AC}
.tier-B{background:rgba(59,130,246,.2);color:#9CC0FC}
.tier-C{background:rgba(245,158,11,.2);color:#FBD38D}
.tier-D{background:rgba(239,68,68,.2);color:#FCA5A5}
.score{display:flex;align-items:center;gap:7px;min-width:84px}
.score .progress{width:50px;flex:0 0 50px}
.stars{color:#F5C542;font-weight:700;white-space:nowrap}
.route{font-weight:650}
td .route{white-space:nowrap}
.route i{font-style:normal;color:var(--txt-3);margin:0 5px}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.check-row:last-child{border-bottom:none}
.ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 20px;margin-top:1px}
.ck.ok{background:rgba(34,197,94,.2);color:#7EE8AC}
.ck.bad{background:rgba(239,68,68,.2);color:#FCA5A5}
.ck.warn{background:rgba(245,158,11,.2);color:#FBD38D}
.ck.wait{background:rgba(100,116,139,.25);color:#B4C2D6}
.tline{display:flex;flex-direction:column}
.tline .ev{position:relative;padding:0 0 12px 18px;border-left:2px solid var(--line);margin-left:5px;font-size:12.5px}
.tline .ev:last-child{border-left-color:transparent;padding-bottom:0}
.tline .ev::before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--panel)}
.tline .ev.warn::before{background:var(--amber)} .tline .ev.ok::before{background:var(--green)} .tline .ev.err::before{background:var(--red)}
.chat{display:flex;flex-direction:column;gap:7px;background:#0C0D10;border:1px solid var(--line-soft);border-radius:10px;padding:12px}
.bub{max-width:84%;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.45}
.bub.out{align-self:flex-end;background:rgba(255,107,26,.2);color:#FFE3D1;border-bottom-right-radius:4px}
.bub.in{align-self:flex-start;background:var(--card-2);border-bottom-left-radius:4px}
.bub small{display:block;font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:176px;height:176px;background:#fff;padding:9px;border-radius:10px;flex:0 0 176px}
.qr i{display:block}
.qr i.b{background:#10151c}
.vt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:9px}
.stage{display:flex;gap:4px;margin:4px 0 2px}
.stage div{flex:1;min-width:0}
.stage i{display:block;height:4px;border-radius:4px;background:#2A2E36}
.stage .d i{background:var(--green)} .stage .c i{background:var(--gold)}
.stage span{display:block;font-size:10px;color:var(--txt-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .c span{color:#FFB184;font-weight:700} .stage .d span{color:#7EE8AC}
.src-tag{font-family:var(--mono);font-size:11px;color:var(--txt-2);background:#0C0D10;border:1px solid var(--line-soft);border-radius:7px;padding:7px 9px;line-height:1.5}
.switch{width:36px;height:20px;border-radius:20px;background:#2C3038;position:relative;flex:0 0 36px;transition:.15s}
.switch::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#D5D9E0;transition:.15s}
.switch.on{background:var(--green)}
.switch.on::after{left:18px;background:#fff}

/* ---------- диспетчерская: карта во всю ширину, список рейсов поверх неё ---------- */
.gl{background:rgba(15,17,20,.88);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.cr-strip{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:10px;flex-wrap:wrap}
.cr-kp{display:flex;align-items:baseline;gap:8px;padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.05);white-space:nowrap;font-size:12.5px;color:var(--txt-3)}
.cr-kp b{font:600 17px var(--mono);color:#fff;letter-spacing:-.04em}
.cr-kp:first-child b{color:var(--gold)}
.cr-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cr{position:relative;margin-bottom:10px}
.cr .map-wrap{border-radius:10px;border-color:var(--line)}
.cr .map-ctl{left:auto;right:10px}
.cr-legend{position:absolute;right:10px;bottom:10px;z-index:3;padding:7px 11px}
.cr-left{position:absolute;left:10px;top:10px;bottom:10px;width:320px;z-index:4;display:flex;flex-direction:column;overflow:hidden}
.cr-left .card-head{padding:13px 14px 11px;margin:0}
.cr-left .trip-list{max-height:none;flex:1;overflow-y:auto;gap:0;padding:0}
.cr-trip{display:block;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line-soft)}
.cr-trip:hover{background:rgba(255,255,255,.045)}
.cr-trip b{display:block;font-size:14.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-trip b u{text-decoration:none;color:var(--gold);padding:0 3px}
.cr-no{font:500 11.5px var(--mono);color:var(--txt-3)}
.tabbar{display:none}

@media (max-width:1500px){.user-chip>div:last-child{display:none}}
@media (max-width:1180px){
  .g-main,.g-side,.trip-grid{grid-template-columns:minmax(0,1fr)}
  .priority-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .date-chip,.topbar .search{display:none}
  .cr-left{position:static;width:auto;margin-top:10px;max-height:440px}
  .cr-legend{position:static;margin-top:8px;display:inline-block}
  .ops-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:250px;z-index:90;transform:translateX(-100%);transition:.25s}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .burger{display:grid !important}
  .topbar{padding:10px 14px;flex-wrap:wrap}
  .view{padding:14px}
  .search{display:none}
  /* нижняя панель разделов на телефоне */
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(14,15,18,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{display:grid;justify-items:center;gap:3px;padding:8px 2px 9px;font-size:10.5px;font-weight:600;color:var(--txt-3)}
  .tabbar button.on{color:var(--gold)}
  .view{padding-bottom:86px}
  #toast-root{bottom:78px;left:12px;right:12px;max-width:none}
  .topbar .page-title{font-size:22px}
  .cr-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .cr-kp{justify-content:space-between;min-width:0;white-space:normal;flex-wrap:wrap;gap:2px 8px;font-size:12px}
  .cr-kp b{white-space:nowrap}
  /* шапка на телефоне: название раздела и уведомления, ниже переключатель роли */
  .topbar{gap:8px}
  .page-sub,.date-chip,.user-chip{display:none}
  .role-switch{order:5;flex:1 1 0}
  #fx-lang{order:6}
  .topbar .icon-btn[aria-label="Уведомления"]{order:3}
  #fx-cur{order:2;margin-left:auto}
  .title-block{order:1}
  .topbar .burger{order:0}
  .role-switch button{flex:1}
  .role-me{flex:1;max-width:none}
  .cr-acts{margin-left:0;grid-column:1/-1}
  .cr-acts .btn{flex:1 1 auto;justify-content:center}
  .role-switch button{padding:6px 9px;font-size:11.5px}
  .c3{grid-template-columns:1fr 1fr}
}
@media(max-width:700px){
  .priority-grid,.ops-strip{grid-template-columns:minmax(0,1fr)}
  .g2,.g3,.g4,.g-kpi{grid-template-columns:minmax(0,1fr)}
  .seg button,.tabs button{padding:7px 10px}
  .command-hero{align-items:flex-start;flex-direction:column}
  .command-actions{justify-content:flex-start}
  .c2,.c3{grid-template-columns:1fr}
  .stepper .step span{display:none}
  /* окна на телефоне: почти во весь экран, кнопки и вкладки переносятся */
  input,select,textarea,.field input,.field select,.field textarea{font-size:16px !important}
  .overlay{padding:8px}
  .modal{max-height:94vh;border-radius:14px}
  .modal-head{padding:13px 14px}
  .modal-body{padding:14px}
  .modal-foot{padding:12px 14px;gap:8px}
  .modal-foot .btn{flex:1 1 auto}
  .tabs{flex-wrap:wrap}
  .kv{gap:10px}
  .kv b{min-width:0;overflow-wrap:anywhere}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- ЖД-панель: дополнения к стилю «Ночной рейс» ---------- */
.art-box .wg-art{display:block}
.art-box{padding:6px 8px 2px}
.tag{display:inline-block;font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.real{border:1px solid #2E6B4F;color:#8FE0B5}
.tag.demo{border:1px solid #6B3A1E;color:#FFB184}
.cr-trip .progress{margin-top:7px;height:4px}
.cr-trip .progress i{background:var(--gold)}
.cr-trip small{display:block;font-size:11.5px;color:var(--txt-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .map-wrap{min-height:420px}
.cr .map-wrap .rm{padding-left:0}
.sum-big{font:600 26px/1.1 var(--mono);letter-spacing:-.05em;color:var(--gold)}
.rowline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line-soft);font-size:13px;align-items:baseline}
.rowline:last-child{border-bottom:none}
.rowline b{font:500 13px var(--mono);letter-spacing:-.02em;text-align:right;white-space:nowrap}
.rowline.tot{border-top:1px solid var(--line);border-bottom:none;margin-top:4px;padding-top:10px;font-weight:700}
.rowline.tot b{font-size:15px;color:var(--gold)}
.offer-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line-soft);border-radius:9px;background:var(--card-2);margin-bottom:7px;font-size:13px}
.offer-row.win{border-color:var(--green);background:rgba(34,197,94,.07)}
.offer-row b.sum{font:600 14px var(--mono);letter-spacing:-.03em;white-space:nowrap}
.op-card{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center}
.wn{font:500 12.5px var(--mono);letter-spacing:.02em}
.wn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.wn-cell{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid var(--line-soft);border-radius:8px;background:var(--card-2)}
.price-tbl td,.price-tbl th{text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
.price-tbl td:first-child,.price-tbl th:first-child{text-align:left}
.price-tbl th{position:sticky;top:0;background:var(--card)}
.intg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start}
.intg p{margin:4px 0 0;color:var(--txt-2);font-size:12.5px}
.intg .cost{grid-column:1/-1;font:500 12px var(--mono);color:var(--txt-2);border-top:1px dashed var(--line-soft);padding-top:8px;margin-top:4px}
.news-row{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.news-row:last-child{border-bottom:none}
.news-row b.d{font:500 12px var(--mono);color:var(--gold)}
.news-row span{color:var(--txt-2);display:block;font-size:12.5px;margin-top:1px}
.topbar .fx-slot{flex:0 0 auto}
@media (max-width:860px){
  .cr .map-wrap{min-height:0}
  .op-card{grid-template-columns:100px minmax(0,1fr)}
  .offer-row{grid-template-columns:minmax(0,1fr) auto}
  .offer-row .btn{grid-column:1/-1;justify-content:center}
  .trip-grid .map-wrap{margin-bottom:4px}
}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo-box" id="brand-logo"></div>
      <div>
        <div class="brand-name" id="brand-name">BEKZHAN LOGISTIC</div>
        <div class="brand-sub" id="brand-sub">operelle</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="ai-status">
        <div class="ai-dot"></div>
        <div style="flex:1">
          <div style="font-size:12.5px;font-weight:600">DURUS.AI</div>
          <div style="font-size:11px;color:var(--txt-3)" id="ai-count">слежение за вагонами включено</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn burger" onclick="document.getElementById('sidebar').classList.toggle('open')" aria-label="Меню">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
      </button>
      <div class="title-block">
        <div class="page-title" id="page-title">Командный центр</div>
        <div class="page-sub" id="page-sub">Железнодорожные перевозки</div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
        <input id="global-search" placeholder="Заявка, вагон, станция, клиент…" autocomplete="off">
      </div>
      <div class="date-chip">
        <b id="date-main">—</b><span id="date-sub">—</span>
      </div>
      <div class="fx-slot" data-part="cur" id="fx-cur"></div>
      <div class="role-switch" id="role-switch"></div>
      <div class="fx-slot" data-part="lang" id="fx-lang"></div>
      <button class="icon-btn" onclick="openAlerts()" aria-label="Уведомления">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 2a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3V8a6 6 0 0 0-6-6zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z"/></svg>
        <span class="dot"></span>
      </button>
      <div class="user-chip">
        <div class="avatar" id="user-initials">ЕК</div>
        <div style="line-height:1.25">
          <div style="font-size:13px;font-weight:600" id="user-name">—</div>
          <div style="font-size:11px;color:var(--txt-3)" id="user-role">—</div>
        </div>
      </div>
    </header>
    <div class="view" id="view"></div>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Быстрые разделы"></nav>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
/* ============================================================
   OPERELLE Logistics · ЖД-пилот (железнодорожные перевозки)
   Общий блок сайта и панели: утилиты и хранилище в браузере.
   Отправки, клиенты и предложения операторов демонстрационные.
   Реальные данные: прейскуранты операторов вагонов и сборы перевозчика (источники в RAIL_SRC).
   ============================================================ */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>Math.round(n).toLocaleString('ru-RU');

  const cfg=getRailCfg(), r=route(q.from,q.to), km=r.km, W=wg(q.wg), C=cg(q.cargo), mode=modeOf(q.from,q.to);
  const n=Math.max(1,Math.ceil((+q.tons||W.cap)/W.cap));

  const rate=cfg.kmRate[W.id]||cfg.kmRate[C.cls]||cfg.kmRate[3];
  const tariff=Math.round((cfg.start+rate*km)*(mode==='tr'?2.2:1)/100)*100;
  const days=Math.ceil(km/cfg.kmDay)+2;
  const shunt=W.unit==='вагон'?FEES.shunt*2*Math.ceil(n/5):0;

  const track=Math.round(FEES.track*days*n);

/* ============================================================
   КАРТА ЖЕЛЕЗНЫХ ДОРОГ КАЗАХСТАНА: сеть, станции, отправки
   ============================================================ */
const RM_W=1000,RM_H=590,RM_LON0=45.6,RM_LON1=88.4,RM_LAT0=39.7,RM_LAT1=56.3;
const rpx=lon=>(lon-RM_LON0)/(RM_LON1-RM_LON0)*RM_W, rpy=lat=>(RM_LAT1-lat)/(RM_LAT1-RM_LAT0)*RM_H;
const rxy=k=>[rpx(CITY[k][2]),rpy(CITY[k][1])];
const rpoly=a=>a.map(p=>rpx(p[0]).toFixed(1)+','+rpy(p[1]).toFixed(1)).join(' ');
const rline=(a,b)=>{const p=rxy(a),q=rxy(b);return 'M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+'L'+q[0].toFixed(1)+' '+q[1].toFixed(1)};
const rpath=ids=>ids.map((k,i)=>{const p=rxy(k);return(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
/* точка отправки на карте */
function shipXY(s){const g=shipPos(s),p=rxy(g.a),q=rxy(g.b);return[p[0]+(q[0]-p[0])*g.f,p[1]+(q[1]-p[1])*g.f]}
/* o: {id, route:[станции], done:[пройденные станции и точка], trains:[{id,xy,label,cls}], click:'имя функции', fit:true, all:true} */
function railMap(o){
  o=o||{}; const u=o.id||'m';
  let vb=[0,0,RM_W,RM_H];
  if(o.fit&&o.route&&o.route.length>1){
    const pts=o.route.map(rxy),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),m=70;
    let x0=Math.min.apply(null,xs)-m,x1=Math.max.apply(null,xs)+m,y0=Math.min.apply(null,ys)-m,y1=Math.max.apply(null,ys)+m;
    const ar=RM_W/RM_H; let w=x1-x0,h=y1-y0; if(w/h<ar){const nw=h*ar;x0-=(nw-w)/2;w=nw}else{const nh=w/ar;y0-=(nh-h)/2;h=nh}
    w=Math.max(w,RM_W*.38);h=w/ar; vb=[clamp(x0,0,RM_W-w),clamp(y0,0,RM_H-h),w,h];
  }
  if(o.padL)vb=[-RM_W*o.padL,0,RM_W*(1+o.padL),RM_H];
  const mob=typeof window!=='undefined'&&window.innerWidth<700, fk=(mob?1.7:1)/Math.sqrt(RM_W/vb[2]);
  const z=RM_W/vb[2], onSet=new Set(o.route||[]), onEdge=new Set();
  (o.route||[]).forEach((k,i,a)=>{if(i){onEdge.add(a[i-1]+'|'+k);onEdge.add(k+'|'+a[i-1])}});
  const m=['<svg class="rm" viewBox="'+vb.map(v=>v.toFixed(1)).join(' ')+'" role="img" aria-label="Карта железных дорог Казахстана">',

/* ============================================================
   КУРСЫ НАЦБАНКА КАЗАХСТАНА
   Файл rates.json на сайте OPERELLE обновляется каждый час с официального сайта Нацбанка.
   Страница читает его при открытии и раз в час и кладёт курсы в общий ключ operelleFx,
   из которого суммы считают все программы. Ручная правка курса в головной панели держится до следующего изменения курсов Нацбанка.
   ============================================================ */
(function(){
  if(typeof fetch!=='function'||typeof localStorage==='undefined'||window.__operelleRates) return; window.__operelleRates=1;
  var URL_='https://janbekmadiev-commits.github.io/operelle-logistics/rates.json', KEY='operelleFx', META='operelleFxMeta';
  var T={ru:'Курсы Нацбанка Казахстана на ',kk:'ҚР Ұлттық Банкінің бағамдары, ',en:'National Bank of Kazakhstan rates, ',zh:'哈萨克斯坦国家银行汇率，'};
  var get=function(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return {}}};
  function note(){
    var m=get(META); if(!m.date||!document.querySelectorAll) return;
    var lang=typeof LANG!=='undefined'&&T[LANG]?LANG:'ru';
    document.querySelectorAll('.fxs-cur .fxs-menu').forEach(function(el){
      var n=el.querySelector('.fx-src'); if(!n){n=document.createElement('div');n.className='fx-src';n.style.cssText='padding:9px 10px 5px;margin-top:4px;border-top:1px solid #2A2E36;color:#8F96A3;font:500 12px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif';el.appendChild(n)}
      n.textContent=T[lang]+m.date;
    });
  }
  function apply(d){
    if(!d||!d.rates||typeof FX_LIST==='undefined') return;
    var pick={}; FX_LIST.forEach(function(x){var v=d.rates[x[0]]; if(x[0]!=='KZT'&&v>0) pick[x[0]]=v});
    var sig=d.date+'|'+JSON.stringify(pick), meta=get(META);
    if(meta.sig===sig){ note(); return; }
    var cur=get(KEY); Object.keys(pick).forEach(function(c){cur[c]=pick[c]});
    try{localStorage.setItem(KEY,JSON.stringify(cur));localStorage.setItem(META,JSON.stringify({date:d.date,at:d.fetched,sig:sig}))}catch(e){return}
    try{ if(typeof onCurChange==='function') onCurChange(); }catch(e){}
    try{ if(typeof fxRefresh==='function') fxRefresh(); }catch(e){}
    note();
  }
  if(typeof fxRefresh==='function'){ var _fr=fxRefresh; fxRefresh=function(){ _fr.apply(this,arguments); note(); }; }
  function run(){ fetch(URL_+'?h='+Math.floor(Date.now()/36e5),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(apply).catch(function(){}); }
  note(); run(); setInterval(run,36e5);
})();

function askOps(id){
  const r=reqById(id); if(!r)return; const have=new Set((r.offers||[]).map(o=>o.op));
  const add=demoOffers(r).filter(o=>!have.has(o.op)); if(!add.length){toast('Операторы уже ответили','info');return}
  r.offers=(r.offers||[]).concat(add); if(r.status==='new')r.status='offer'; saveReq(r); openReq(id); render(); toast('Пришли ставки операторов: '+add.length);
}
function sendOffer(id){
  const r=reqById(id); if(!r)return; const price=+$('#of-price').value, days=+$('#of-days').value||r.days, supply=+$('#of-sup').value||3;
  if(!(price>0)){toast('Укажите цену','warn');return}
  r.offers=(r.offers||[]).filter(o=>o.op!=='co').concat([{op:'co',name:getCompany().name,price,days,supply,ts:Date.now()}]); r.status='offer'; saveReq(r);
  openReq(id); render(); toast('Предложение отправлено клиенту в кабинет');
}
function toShip(id){const r=reqById(id);if(!r)return;r.status='plan';saveReq(r);closeModal();go('ships');openShip(id.replace('RQ','RW'));toast('Отправка создана. Следующий шаг: заявка ГУ-12 в КТЖ.')}

  const tab=state.sub.tab||'all', F={all:()=>true,transit:s=>s.status==='transit',arrived:s=>s.status==='arrived',wait:s=>s.status==='plan'||s.status==='supplied'}[tab];

   '<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Отправка</th><th>Маршрут</th><th>Груз</th><th>Вагоны</th><th>Сейчас</th><th>Осталось</th><th>Прибытие</th><th>Статус</th></tr></thead><tbody>'+

   '</tbody></table></div>'+(S.length?'':'<div class="empty">Отправок в этом списке нет</div>')+'</div>';
}
function openShip(id,tab){
  const s=shipById(id); if(!s){toast('Отправка не найдена','warn');return} tab=tab||'way';
  const g=shipPos(s), q=railQuote({from:s.from,to:s.to,cargo:s.cargo,wg:s.wg,tons:s.tons}), si=stageIdx(s.status);
  let acc=0, body='';
  if(tab==='way'){
    body='<div class="tline">'+s.path.map((k,i)=>{if(i)acc+=EK[s.path[i-1]+'|'+k];const passed=s.prog>0&&acc<=g.done+1, cur=(s.status==='transit'&&k===g.b)||(s.status==='arrived'&&i===s.path.length-1);
      const t=new Date(s.start.getTime()+acc/Math.max(1,s.km)*s.days*864e5);
      return '<div class="ev '+(cur?'warn':passed?'ok':'')+'"><b>'+cn(k)+'</b>'+(BORDER[k]?' <span class="badge b-gold">граница: '+BORDER[k]+'</span>':'')+'<div class="mini">'+num(acc)+' км · '+(passed&&!cur?'прошёл ':'по плану ')+fDT(t)+'</div></div>'}).join('')+'</div>';
  }else if(tab==='wag'){
    const day=Math.round(FEES.track*s.n);
    body='<div class="alert-row info" style="margin-bottom:10px"><div>Слежение: '+money(FEES.track)+' за вагон в сутки, по этой отправке '+money(day)+' в сутки.</div></div><div class="wn-grid">'+s.nums.map(n=>'<div class="wn-cell"><span class="wn" data-noi18n>'+n+'</span><span class="badge '+(s.status==='arrived'&&lateH(s)>0?'b-red':s.prog>0?'b-green':'b-slate')+'">'+(s.status==='arrived'?'на станции':s.prog>0?'в пути':'ждёт')+'</span></div>').join('')+'</div>';
  }else if(tab==='docs'){
    const done={els:si>=3,op:si>=3,gu12:si>=4,supply:si>=4,weigh:si>=5,bill:si>=5,arrive:si>=7};
    body=RAIL_DOCS.map(d=>'<div class="check-row"><span class="ck '+(done[d[0]]?'ok':'wait')+'">'+(done[d[0]]?'✓':'·')+'</span><div><b>'+d[1]+'</b><div class="mini">'+d[2]+'</div></div></div>').join('')+
      '<div class="src-tag" style="margin-top:10px">Заявку ГУ-12 и накладную оформляют в системе перевозчика АСУ ДКР под электронной подписью отправителя или экспедитора. Открытого обмена данными у системы нет, поэтому здесь отмечается только этап.</div>';
  }else{
    const f=s.status==='arrived'&&lateH(s)>0?delayFee(s.wg,lateH(s)):null;
    body=q.rows.map(x=>'<div class="rowline"><span>'+x.name+srcTag(x.src)+'</span><b>'+money(x.sum)+'</b></div>').join('')+
      (f?'<div class="rowline"><span>Простой на выгрузке: '+lateH(s)+' ч сверх срока, множитель ×'+f.mult+srcTag('ktz')+'</span><b>'+money(f.sum*s.n)+'</b></div>':'')+
      '<div class="rowline tot"><span>Итого без НДС</span><b>'+money(q.total+(f?f.sum*s.n:0))+'</b></div><div class="rowline"><span>НДС '+getRailCfg().vat+'%</span><b>'+money(Math.round((q.total+(f?f.sum*s.n:0))*getRailCfg().vat/100))+'</b></div>';
  }
  const tabs=[['way','Ход'],['wag','Вагоны'],['docs','Документы'],['cost','Расходы']];
  const next={plan:'Заявка в КТЖ согласована, вагон подан',supplied:'Погружен и отправлен',transit:'Прибыл на станцию',arrived:'Выгружен, закрыть'}[s.status];
  modal(mHead('<span data-noi18n>'+s.id+'</span> · <span>'+cn(s.from)+' → '+cn(s.to)+'</span>',cg(s.cargo).name+' · '+num(s.tons)+' т · '+s.n+' × '+wg(s.wg).name+' · '+num(s.km)+' км')+
   '<div class="modal-body">'+stageBar(s.status)+'<div class="grid trip-grid" style="margin-top:14px"><div><div class="map-wrap">'+shipMap(s,'sh')+'</div>'+
     '<div class="card compact" style="margin-top:12px"><div class="kv"><span>Сейчас</span><b>'+(s.status==='transit'?cn(g.a)+' → '+cn(g.b)+', осталось '+num(g.left)+' км':s.status==='arrived'?cn(s.to)+', стоит '+s.idle+' ч':cn(s.from)+', ждёт подачи')+'</b></div>'+
     '<div class="kv"><span>Клиент</span><b>'+esc(s.client)+'</b></div><div class="kv"><span>Оператор вагонов</span><b>'+esc(opName(s))+'</b></div><div class="kv"><span>Сумма отправки</span><b>'+money(s.total)+'</b></div></div></div>'+
   '<div class="trip-side"><div class="tabs" style="margin-bottom:12px">'+tabs.map(t=>'<button class="'+(tab===t[0]?'on':'')+'" onclick="openShip(\''+s.id+'\',\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div><div class="card compact">'+body+'</div></div></div></div>'+
   '<div class="modal-foot"><button class="btn" onclick="closeModal()">Закрыть</button>'+(s.req&&next?'<button class="btn btn-g" onclick="nextStage(\''+s.req+'\')">'+next+'</button>':'')+'</div>','xl');
}
function nextStage(reqId){
  const r=reqById(reqId); if(!r)return; const order=['plan','supplied','transit','arrived','closed'], i=order.indexOf(r.status); if(i<0||i===order.length-1)return;
  r.status=order[i+1]; saveReq(r); render(); if(r.status==='closed'){closeModal();toast('Отправка закрыта')}else{openShip(reqId.replace('RQ','RW'));toast('Этап: '+stageName(r.status))}
}

/* ---------- расчёт цены ---------- */
const C0={from:'ekibastuz',to:'almaty',cargo:'coal',wg:'pv',tons:690};
function calcSet(k,v){
  const c=state.sub.c=Object.assign({},C0,state.sub.c||{}); c[k]=k==='tons'?(+v||0):v;
  if(k==='cargo'&&!cg(v).wg.includes(c.wg))c.wg=cg(v).wg[0];
  if(k==='tons'){const el=$('#calc-out');if(el){el.innerHTML=calcOut(c);return}}
  render();
}
function calcOut(c){
  if(c.from===c.to) return '<div class="card"><div class="empty">Выберите разные станции</div></div>';
  const q=railQuote(c), cfg=getRailCfg();
  return '<div class="card"><div class="card-head"><div class="art-box">'+wgArt(c.wg)+'</div><div><div class="card-title">'+q.n+' × '+q.W.name+'</div><div class="mini">'+num(q.km)+' км · '+q.days+' дн. в пути · '+MODE_NAME[q.mode]+'</div></div><div class="card-actions"><span class="sum-big">'+money(q.total)+'</span></div></div>'+
    q.rows.map(x=>'<div class="rowline"><span>'+x.name+srcTag(x.src)+(x.one?' <span class="mini">'+money(x.one)+' × '+q.n+'</span>':'')+'</span><b>'+money(x.sum)+'</b></div>').join('')+
    '<div class="rowline tot"><span>Итого без НДС</span><b>'+money(q.total)+'</b></div><div class="rowline"><span>НДС '+cfg.vat+'%</span><b>'+money(q.vat)+'</b></div><div class="rowline"><span>За '+q.W.unit+'</span><b>'+money(q.per)+'</b></div><div class="rowline"><span>За тонну</span><b>'+money(q.perTon)+'</b></div></div>'+
    '<div class="card" style="margin-top:14px"><div class="card-head"><div class="card-title">Другие вагоны под этот груз</div></div><div class="tbl-wrap"><table><thead><tr><th>Вагон</th><th>Штук</th><th>Цена вагона</th><th>Всего</th><th>За тонну</th></tr></thead><tbody>'+

<script>
/* мост единого файла OPERELLE: язык и валюта из соседних окон, пауза приёма заявок,
   объявление головной панели и заявки, которые она передала. Источник заявки сюда не попадает.
   У моря пауза своя (настройка сайта в морской программе), поэтому здесь для него остаются язык, валюта и объявление. */
(function(){
  var DIR='rail', KIND='dash';
  var get=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  var pref=function(k,d){try{return typeof fxLS==='function'?fxLS(k,d):get(k,d)}catch(e){return d}};
  var T={
    pause:{ru:'Приём заявок временно приостановлен. Попробуйте позже.',kk:'Өтінімдерді қабылдау уақытша тоқтатылды. Кейінірек қайталап көріңіз.',en:'Requests are temporarily paused. Please try again later.',zh:'暂停接收需求，请稍后再试。'},
    pauseDash:{ru:'OPERELLE поставила приём заявок на паузу: сайт новые заявки не принимает.',kk:'OPERELLE өтінімдерді қабылдауды тоқтатты: сайт жаңа өтінімдерді қабылдамайды.',en:'OPERELLE has paused request intake: the website is not accepting new requests.',zh:'OPERELLE 已暂停接收需求：网站暂不接受新需求。'},
    note:{ru:'Объявление OPERELLE',kk:'OPERELLE хабарландыруы',en:'OPERELLE notice',zh:'OPERELLE 公告'},
    fresh:{ru:'OPERELLE прислала новые заявки',kk:'OPERELLE жаңа өтінімдер жіберді',en:'OPERELLE sent new requests',zh:'OPERELLE 发来了新需求'},
    close:{ru:'Закрыть',kk:'Жабу',en:'Close',zh:'关闭'}
  };
  var t=function(k){var l='ru';try{if(typeof LANG!=='undefined'&&T[k][LANG])l=LANG}catch(e){}return T[k][l]};
  var uni=function(){return (get('operelleUni',{})||{})[DIR]||{}};
  var bar=null;

    var u=uni(), lines=[], seen=null, note=KIND==='dash'&&u.note?String(u.note):'';

    if(!lines.length){ if(bar){bar.remove();bar=null} return; }

      bar=document.createElement('div'); bar.setAttribute('data-noi18n',''); bar.setAttribute('role','status');
      bar.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:'+(KIND==='dash'?'76px':'16px')+';z-index:2147483000;box-sizing:border-box;width:max-content;max-width:min(680px,calc(100vw - 24px));display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;background:#16181D;border:1px solid #F59E0B;color:#F2F3F5;font:500 13.5px/1.4 "Fira Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.55)';
      document.body.appendChild(bar);
    }
    bar.innerHTML='';

    }catch(e){}
  }
  /* заявки от головной панели в ленту панели автоперевозок */
