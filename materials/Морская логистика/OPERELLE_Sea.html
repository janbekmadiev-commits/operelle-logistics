<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<title>OPERELLE SEA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Один файл с двумя программами: сверху переключатель, ниже сайт для заказчиков и панель управления.
   Обе программы встроены целиком и открываются во внутренних окнах; данные у них общие, поэтому заявка с сайта сразу видна в панели. */
:root{--w-bg:#08090B;--w-bar:#0E0F12;--w-line:#262A31;--w-text:#F2F3F5;--w-muted:#A7ADB8;--w-accent:#FF6B1A;--w-ink:#180900;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--w-bg);color:var(--w-text);font-family:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.w-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;background:var(--w-bar);border-bottom:1px solid var(--w-line)}
.w-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13px;letter-spacing:.1em;white-space:nowrap}
.w-seg{display:flex;gap:3px;margin-left:auto;padding:3px;border:1px solid var(--w-line);border-radius:10px;background:var(--w-bg)}
.w-seg button{min-height:34px;padding:0 14px;border:none;border-radius:7px;background:none;color:var(--w-muted);font:700 13.5px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.w-seg button:hover{color:var(--w-text)}
.w-seg button.on{background:var(--w-accent);color:var(--w-ink)}
.w-seg button:focus-visible{outline:2px solid var(--w-accent);outline-offset:2px}
.w-frames{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);background:var(--w-line);gap:1px}
.w-frames.both{grid-template-columns:minmax(360px,410px) minmax(0,1fr)}
.w-frames iframe{width:100%;height:100%;border:0;display:block;background:var(--w-bg)}
.w-frames iframe[hidden]{display:none}
.w-frames iframe[data-k="site"]{order:1}
.w-frames iframe[data-k="dash"]{order:2}
.w-fall{flex:1;display:grid;place-content:center;gap:12px;padding:24px;text-align:center}
.w-fall[hidden]{display:none}
.w-fall p{margin:0;color:var(--w-muted);max-width:30em}
.w-fall a{display:block;padding:14px 20px;border-radius:10px;background:var(--w-accent);color:var(--w-ink);font-weight:700;text-decoration:none}
@media (max-width:1099px){.w-seg button[data-m="both"]{display:none}}
@media (max-width:520px){.w-bar{gap:8px;padding:5px 10px;min-height:44px}.w-brand span{display:none}.w-seg{flex:1}.w-seg button{flex:1;padding:0 8px}}
</style>
</head>
<body>
<div class="w-bar">
  <div class="w-brand"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#FF6B1A"/><path d="M8 23l3 7h18l4-7zM13 23v-7h13v7M17 16v-5h5v5" fill="none" stroke="#180900" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg><span>OPERELLE SEA</span></div>
  <div class="w-seg" id="wSeg" role="tablist" aria-label="Программа">
    <button type="button" role="tab" data-m="site">Сайт для заказчиков</button>
    <button type="button" role="tab" data-m="dash">Панель управления</button>
    <button type="button" role="tab" data-m="both">Рядом</button>
  </div>
</div>
<div class="w-frames" id="wFrames"></div>
<div class="w-fall" id="wFall" hidden></div>
<script>
const SEA_SRC={site:"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#08090B\">\n<title>OPERELLE SEA — морские перевозки грузов из Казахстана и обратно<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap\">\n<style>\n/* Стиль «Ночной рейс», как у сайта и панели автоперевозок: чёрный фон, один акцент (сигнальный оранжевый, переменная --gold).\n   Шрифты Fira Sans и Fira Sans Condensed содержат все казахские буквы. Цены и цифры: моноширинный шрифт. */\n:root{\n  --bg:#08090B;--bg-2:#0D0F12;--card:#111316;--card-2:#181B20;--line:#262A31;--text:#F2F3F5;--muted:#A7ADB8;--dim:#7A818D;\n  --gold:#FF6B1A;--gold-ink:#180900;--ok:#4ADE95;--green:#22C55E;--amber:#F59E0B;--red:#EF4444;\n  --r-card:10px;--r-field:8px;\n  --font:\"Fira Sans\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --cd:\"Fira Sans Condensed\",\"Arial Narrow\",\"Roboto Condensed\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}\na{text-decoration:none;color:inherit}\nbutton{font:inherit;cursor:pointer;color:inherit;border:none;background:none}\nh1,h2,h3,p{margin:0}\n.wrap{width:min(1240px,92vw);margin:0 auto}\nsection[id]{scroll-margin-top:76px}\n:focus-visible{outline:2px solid var(--gold);outline-offset:2px}\n\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:14px 24px;font-weight:700;font-size:15px;border:1px solid transparent;white-space:nowrap;transition:transform .2s cubic-bezier(.16,1,.3,1),background .2s,border-color .2s}\n.btn:active{transform:scale(.98)}\n.btn-gold{background:var(--gold);color:var(--gold-ink)}\n.btn-gold:hover{background:#FF8440}\n.btn-line{background:transparent;border-color:#3A3F49;color:var(--text)}\n.btn-line:hover{border-color:var(--gold);color:var(--gold)}\n.btn-sm{padding:10px 16px;font-size:14px}\n.btn-block{width:100%}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n\n/* шапка */\n.top{position:fixed;inset:0 0 auto 0;z-index:30;height:64px;background:rgba(8,9,11,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1)}\n.top .wrap{height:100%;display:flex;align-items:center;gap:22px}\n.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.1em;font-size:14px}\n.brand .bn{display:flex;flex-direction:column;line-height:1.1;white-space:nowrap}\n.brand .bn small{font-size:10px;font-weight:600;letter-spacing:.34em;color:var(--muted);text-transform:lowercase;margin-top:3px}\n.nav{display:flex;gap:22px;margin-left:auto;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}\n.nav a{padding:13px 0}\n.nav a:hover{color:var(--gold)}\n.cab-btn .s{display:none}\n.burger{flex:0 0 40px;display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:9px;place-items:center}\n.mnav{position:fixed;top:64px;left:0;right:0;z-index:29;background:rgba(8,9,11,.97);border-bottom:1px solid var(--line);padding:6px 4vw 16px;display:grid}\n.mnav[hidden]{display:none}\n.mnav a{padding:14px 2px;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}\n\n/* первый экран */\n.hero{position:relative;overflow:hidden;min-height:100dvh;padding:132px 0 48px;display:flex;align-items:center}\n.tick{position:absolute;left:0;right:0;top:64px;z-index:2;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(8,9,11,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;white-space:nowrap;padding:9px 0;font:500 12.5px var(--mono);color:#C9CED6}\n.tick div{display:inline-flex;animation:run 70s linear infinite}\n.tick span{padding:0 22px}\n.tick b{color:var(--gold);font-weight:500}\n.tick i,.quote .price i{font-style:normal}\n@keyframes run{to{transform:translateX(-50%)}}\n@keyframes blink{50%{opacity:.35}}\n.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:44px;align-items:start}\n.hero-grid>div:first-child{display:flex;flex-direction:column;align-items:flex-start;min-width:0}\n.live{display:inline-flex;align-items:center;gap:9px;margin-bottom:16px;font:500 12.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#FFC9A6}\n.live i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(255,107,26,.22);animation:blink 1.6s ease-in-out infinite}\n.hero h1{font-family:var(--cd);font-size:clamp(44px,5.6vw,86px);line-height:.92;font-weight:800;text-transform:uppercase;text-wrap:balance}\n.hero h1 em{font-style:normal;color:var(--gold)}\n.hero .lead{font-size:20px;color:var(--muted);margin:18px 0 24px;max-width:28em}\n.hero-cta{display:flex;gap:12px;flex-wrap:wrap}\n/* карта рейсов под заголовком: уходит к левому краю окна, по краям растворяется */\n.hero-map{align-self:stretch;margin:10px -70px 0 calc((100vw - min(1240px,92vw))/-2);\n  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 86%,transparent 100%),linear-gradient(90deg,#000 0,#000 88%,transparent 100%);-webkit-mask-composite:source-in;\n  mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 86%,transparent 100%),linear-gradient(90deg,#000 0,#000 88%,transparent 100%);mask-composite:intersect}\n\n/* расчёт */\n.calc{position:relative;z-index:1;background:rgba(17,19,22,.92);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}\n.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg-2);padding:4px;border-radius:10px;margin-bottom:14px}\n.tabs2 button{padding:10px;border-radius:7px;font-weight:700;font-size:14px;color:var(--muted)}\n.tabs2 button.on{background:var(--card-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}\n.field{margin-bottom:10px;min-width:0}\nlabel{display:block;margin-bottom:5px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\nlabel.check{display:flex;gap:10px;align-items:flex-start;font-family:var(--font);font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--muted);cursor:pointer}\nlabel.check input{width:22px;height:22px;flex:0 0 22px;margin-top:0;padding:0;accent-color:var(--gold)}\ninput,select,textarea{width:100%;padding:12px 13px;border-radius:var(--r-field);border:1px solid var(--line);background:var(--bg-2);color:var(--text);font:inherit;font-size:16px;outline:none}\ninput::placeholder{color:#7A818D}\ninput:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,107,26,.18)}\n.wbox{display:grid;gap:7px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-card);padding:12px;margin-bottom:10px}\n.wbox .cap{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.wrow{display:grid;grid-template-columns:86px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px;color:var(--dim)}\n.wrow i{display:block;height:10px;border-radius:10px;background:#20232A;overflow:hidden}\n.wrow i b{display:block;height:100%;border-radius:10px;background:#4A505B;transition:width .3s}\n.wrow>b{font:600 13.5px var(--mono);text-align:right;color:var(--muted)}\n.wrow.on{color:var(--text)} .wrow.on i b{background:var(--gold)} .wrow.on>b{color:var(--gold)}\n.quote{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;margin-bottom:12px}\n.quote-top{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:center}\n.quote-top b{display:block;font-size:15px}\n.quote-top small{display:block;color:var(--muted);font-size:12.5px}\n.quote .price{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}\n.quote .price b{font:600 25px var(--mono);letter-spacing:-.04em;color:var(--gold)}\n.quote .price span{font-size:12.5px;color:var(--muted)}\n.hint{font-size:12px;color:var(--dim);margin-top:9px}\n\n/* разделы */\n.sec{padding:84px 0;border-top:1px solid rgba(255,255,255,.06)}\n.sec.alt{background:var(--bg-2)}\n.eyebrow{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}\n.sec h2{font:800 clamp(34px,4vw,58px)/.95 var(--cd);text-transform:uppercase;text-wrap:balance}\n.sec .sub{color:var(--muted);font-size:18px;margin-top:12px;max-width:34em}\n.sec-head{margin-bottom:36px}\n\n/* как это работает: линия полёта с пятью точками */\n.how{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;padding-top:34px}\n.how::before{content:\"\";position:absolute;left:0;right:0;top:11px;border-top:2px dashed #3A3F49}\n.how-plane{position:absolute;top:0;left:0;width:24px;height:24px;color:var(--gold);animation:howfly 9s linear infinite}\n@keyframes howfly{from{left:0}to{left:calc(100% - 24px)}}\n.how-step{position:relative}\n.how-step::before{content:\"\";position:absolute;top:-29px;left:0;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}\n.how-step .n{font:600 13px var(--mono);color:var(--gold)}\n.how-step b{display:block;font:800 23px/1.05 var(--cd);text-transform:uppercase;margin:6px 0 6px}\n.how-step p{color:var(--muted);font-size:14.5px}\n\n/* чем летит груз */\n.planes{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.plane-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:22px}\n.plane-card .ac-art{max-width:520px;margin:0 auto 14px}\n.plane-card h3{font:800 28px/1 var(--cd);text-transform:uppercase}\n.plane-card p{color:var(--muted);margin-top:8px}\n.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}\n.fact{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}\n.fact b{color:var(--text);font-family:var(--mono);font-weight:600}\n.caps{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:22px}\n.caps h3{font:800 22px/1 var(--cd);text-transform:uppercase;margin-bottom:14px}\n.cap-row{display:grid;grid-template-columns:170px minmax(0,1fr) 70px;gap:14px;align-items:center;padding:7px 0;font-size:14px}\n.cap-row i{display:block;height:12px;border-radius:12px;background:#20232A;overflow:hidden}\n.cap-row i b{display:block;height:100%;border-radius:12px;background:var(--gold)}\n.cap-row.belly i b{background:#5B626E}\n.cap-row>b{font:600 14px var(--mono);text-align:right}\n.cap-row small{display:block;color:var(--dim);font-size:12px}\n\n/* за какой вес платят */\n.wgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:center}\n.wdraw{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px}\n.wdraw svg{display:block;width:100%;height:auto}\n.wex{display:grid;gap:10px}\n.wex-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px}\n.wex-row b{font-size:16px}\n.wex-row small{display:block;color:var(--muted);font-size:13.5px}\n.wex-row .res{text-align:right;font:600 20px var(--mono);letter-spacing:-.04em;color:var(--gold);white-space:nowrap}\n.wex-row .res small{font:400 12px var(--font);letter-spacing:0;color:var(--dim)}\n\n/* виды груза */\n.ctl{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--card)}\n.ct-row{display:grid;grid-template-columns:56px minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}\n.ct-row:first-child{border-top:none}\n.ct-row .ct-art{color:var(--gold)}\n.ct-row b{font:800 21px/1.05 var(--cd);text-transform:uppercase}\n.ct-row p{color:var(--muted);font-size:14.5px}\n.ct-how{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}\n.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}\n.chip.y{border-color:rgba(74,222,149,.4);color:#8FEFBF}\n.chip.n{color:var(--dim);text-decoration:line-through}\n\n/* направления */\n.dirs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.dir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;transition:border-color .2s}\n.dir:hover{border-color:var(--gold)}\n.dir b{font:800 22px/1.05 var(--cd);text-transform:uppercase}\n.dir b u{text-decoration:none;color:var(--gold)}\n.dir small{display:block;color:var(--muted);font-size:13px;margin-top:3px}\n.dir .p{text-align:right;font:600 18px var(--mono);letter-spacing:-.04em;color:var(--gold);white-space:nowrap}\n.dir .p small{font:400 12px var(--font);color:var(--dim);letter-spacing:0}\n\n/* отслеживание */\n.trk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;max-width:640px}\n.trk input{font-family:var(--mono);font-size:18px;letter-spacing:.04em}\n.demo-awb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:13px;color:var(--dim)}\n.demo-awb button{font:500 13px var(--mono);border:1px solid var(--line);border-radius:999px;padding:11px 14px;color:var(--muted)}\n.demo-awb button:hover{border-color:var(--gold);color:var(--gold)}\n.trk-out{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}\n.trk-out[hidden]{display:none}\n.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;min-width:0}\n.panel h3{font:800 20px/1 var(--cd);text-transform:uppercase;margin-bottom:12px}\n.mapbox{background:#08090B;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}\n.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}\n.kv:last-child{border-bottom:none}\n.kv span{color:var(--muted)}\n.kv b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}\n.tline{display:flex;flex-direction:column}\n.tline .ev{position:relative;padding:0 0 12px 18px;border-left:2px solid var(--line);margin-left:5px;font-size:14px}\n.tline .ev:last-child{border-left-color:transparent;padding-bottom:0}\n.tline .ev::before{content:\"\";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--card)}\n.tline .ev.todo{color:var(--dim)} .tline .ev.todo::before{background:#2A2E36}\n.tline .ev small{display:block;color:var(--dim);font-size:12.5px}\n\n/* экспедиторам */\n.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}\n.ck-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}\n.ck-row:last-child{border-bottom:none}\n.ck-row i{flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;background:rgba(74,222,149,.16);color:#8FEFBF}\n.ck-row b{display:block;font-size:16px}\n.ck-row small{color:var(--muted);font div>\n  <div class=\"wrap hero-grid\">\n    <div>\n      <div class=\"live\"><i><\/i><span>Агенты считают маршруты круглосуточно<\/span><\/div>\n      <h1 id=\"heroH\" data-noi18n>Груз морем из <em>Казахстана<\/em> и обратно<\/h1>\n      <p class=\"lead\" id=\"heroLead\">Каспий, Европа, Азия, Америка. Цены проверенных экспедиторов. Контейнер на карте до выдачи.<\/p>\n      <div class=\"hero-cta\">\n        <a class=\"btn btn-gold\" href=\"#calc\">Рассчитать перевозку<\/a>\n        <a class=\"btn btn-line\" href=\"#track\">Отследить груз<\/a>\n      <\/div>\n      <div class=\"hero-map\" id=\"heroMap\"><\/div>\n    <\/div>\n    <aside class=\"calc\" id=\"calc\" aria-label=\"Расчёт перевозки\">\n      <div class=\"tabs2\" id=\"dirTabs\">\n        <button type=\"button\" data-imp=\"0\">Из Казахстана<\/button>\n        <button type=\"button\" data-imp=\"1\">В Казахстан<\/button>\n      <\/div>\n      <div id=\"calcBody\"><\/div>\n      <div id=\"calcOut\"><\/div>\n      <p class=\"pause\" id=\"pauseNote\" hidden>Приём заявок временно остановлен. Расчёт работает, заявку можно оставить позже.<\/p>\n      <button class=\"btn btn-gold btn-block\" type=\"button\" onclick=\"openOrder()\">Получить цены экспедиторов<\/button>\n      <p class=\"hint\">Цена на этой странице — ориентир. Точную цену и место на судне подтверждает экспедитор.<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"way\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Маршрут на карте<\/p><h2>Как поедет груз<\/h2><p class=\"sub\">Карта показывает маршрут из расчёта: где поезд, где судно и где автодорога, и сколько дней на каждом участке.<\/p><\/div>\n    <div id=\"wayOut\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec alt\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Как это работает<\/p><h2>Пять шагов до выдачи груза<\/h2><\/div>\n    <div class=\"how\">\n      <svg class=\"how-plane\" viewBox=\"-13 -7 26 14\" aria-hidden=\"true\"><path d=\"M12 0L6 -4.2H-9Q-11.5 -4.2 -11.5 -2V2Q-11.5 4.2 -9 4.2H6Z\" fill=\"currentColor\"/><\/svg>\n      <div class=\"how-step\"><span class=\"n\">01<\/span><b>Заявка<\/b><p>Откуда, куда и что везёте. Две минуты.<\/p><\/div>\n      <div class=\"how-step\"><span class=\"n\">02<\/span><b>Маршрут<\/b><p>Показываем путь: поезд, судно, паром.<\/p><\/div>\n      <div class=\"how-step\"><span class=\"n\">03<\/span><b>Цены<\/b><p>Проверенные экспедиторы отвечают ценой и сроком.<\/p><\/div>\n      <div class=\"how-step\"><span class=\"n\">04<\/span><b>Выбор<\/b><p>Вы выбираете предложение, и открываются контакты.<\/p><\/div>\n      <div class=\"how-step\"><span class=\"n\">05<\/span><b>Груз на карте<\/b><p>Статусы по номеру контейнера до выдачи.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"ships\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Чем идёт груз<\/p><h2>Шесть видов судов<\/h2><p class=\"sub\">Оранжевым показан груз.<\/p><\/div>\n    <div class=\"ships\" id=\"shipGal\"><\/div>\n    <div class=\"caps\"><h3>Сколько берёт одно судно<\/h3><div id=\"caps\"><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec alt\" id=\"weight\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Какой контейнер выбрать<\/p><h2>20 или 40 футов<\/h2><p class=\"sub\">Тяжёлое везут в 20 футов. Объёмное в 40 футов. Мало груза — сборный контейнер.<\/p><\/div>\n    <div class=\"wgrid\">\n      <div class=\"wdraw\">\n        <svg viewBox=\"0 0 420 250\" role=\"img\" aria-label=\"Контейнеры 20 и 40 футов\">\n          <g fill=\"#191C21\" stroke=\"#5B626E\" stroke-width=\"2\" stroke-linejoin=\"round\"><path d=\"M20 36h150v56H20z\"/><path d=\"M20 160h380v56H20z\"/><\/g>\n          <g stroke=\"#3A3F49\" stroke-width=\"2\"><path d=\"M45 36v56M70 36v56M95 36v56M120 36v56M145 36v56\"/><path d=\"M45 160v56M70 160v56M95 160v56M120 160v56M145 160v56M170 160v56M195 160v56M220 160v56M245 160v56M270 160v56M295 160v56M320 160v56M345 160v56M370 160v56\"/><\/g>\n          <g stroke=\"#FF6B1A\" stroke-width=\"2\" fill=\"none\"><path d=\"M20 104h150M20 99v10M170 99v10\"/><path d=\"M20 228h380M20 223v10M400 223v10\"/><\/g>\n          <g font-family=\"JetBrains Mono,monospace\" font-size=\"15\" fill=\"#FF6B1A\" font-weight=\"600\"><text x=\"76\" y=\"124\" data-noi18n>5,9 м<\/text><text x=\"194\" y=\"247\" data-noi18n>12 м<\/text><\/g>\n          <g font-family=\"JetBrains Mono,monospace\" font-size=\"12\" letter-spacing=\"1.2\" fill=\"#F2F3F5\"><text x=\"20\" y=\"24\">20 ФУТОВ<\/text><text x=\"20\" y=\"150\">40 ФУТОВ<\/text><\/g>\n          <g font-family=\"JetBrains Mono,monospace\" font-size=\"14\" fill=\"#A7ADB8\"><text x=\"192\" y=\"58\">33 м³<\/text><text x=\"192\" y=\"82\">до 28 т<\/text><text x=\"130\" y=\"150\" font-size=\"12\">67 м³ · до 26 т<\/text><\/g>\n        <\/svg>\n      <\/div>\n      <div class=\"wex\" id=\"wex\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"cargo\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Что возим<\/p><h2>Пять видов груза<\/h2><\/div>\n    <div class=\"ctl\" id=\"ctl\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec alt\" id=\"routes\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Направления<\/p><h2>Из Казахстана по всему миру и обратно<\/h2><p class=\"sub\">Цена за контейнер 40 футов. Выберите город и нажмите на направление, чтобы посчитать свой груз.<\/p><\/div>\n    <div class=\"city-chips\" id=\"dirCity\"><\/div>\n    <div class=\"mapbox world\" id=\"worldMap\"><\/div>\n    <div class=\"dirs\" id=\"dirs\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"track\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Где мой груз<\/p><h2>Отследить по номеру контейнера<\/h2><p class=\"sub\">Номер контейнера даёт экспедитор после брони места на судне.<\/p><\/div>\n    <div class=\"trk\"><input id=\"cnoIn\" autocomplete=\"off\" placeholder=\"OPLU 484707 7\" aria-label=\"Номер контейнера\"><button class=\"btn btn-gold\" type=\"button\" onclick=\"trackFind()\">Найти груз<\/button><\/div>\n    <div class=\"demo-awb\" id=\"demoCno\"><\/div>\n    <div class=\"trk-out\" id=\"trkOut\" hidden><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec alt\" id=\"partners\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Экспедиторам<\/p><h2>Получайте заявки на морскую перевозку<\/h2><p class=\"sub\">Заявки приходят уже с маршрутом, видом контейнера и весом. Вы отвечаете ценой.<\/p><\/div>\n    <div class=\"pgrid\">\n      <div class=\"panel\"><h3>Что мы проверяем<\/h3><div id=\"checks\"><\/div><\/div>\n      <form class=\"panel\" id=\"pForm\" onsubmit=\"return submitPartner(event)\">\n        <h3>Заявка на подключение<\/h3>\n        <div class=\"field\"><label for=\"pName\">Компания<\/label><input id=\"pName\" required maxlength=\"80\" placeholder=\"ТОО «Название»\"><\/div>\n        <div class=\"grid2\"><div class=\"field\"><label for=\"pCity\">Город<\/label><input id=\"pCity\" required maxlength=\"40\" placeholder=\"Актау\"><\/div><div class=\"field\"><label for=\"pPhone\">Телефон<\/label><input id=\"pPhone\" required type=\"tel\" maxlength=\"24\" placeholder=\"+7 700 000 00 00\"><\/div><\/div>\n        <div class=\"field\"><label for=\"pPerson\">Кто отвечает на заявки<\/label><input id=\"pPerson\" required maxlength=\"60\" placeholder=\"Имя и фамилия\"><\/div>\n        <label>Куда возите<\/label><div class=\"cbs\" id=\"pDirs\"><\/div>\n        <label class=\"check\"><input type=\"checkbox\" id=\"pLine\"><span>Есть договор с морской линией или оператором маршрута<\/span><\/label>\n        <button class=\"btn btn-gold btn-block\" type=\"submit\" style=\"margin-top:14px\">Отправить на проверку<\/button>\n      <\/form>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"rules\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Правила площадки<\/p><h2>Мы сводим стороны<\/h2><p class=\"sub\">Перевозят линия и железная дорога, бронирует и отвечает за груз экспедитор.<\/p><\/div>\n    <div class=\"rules\">\n      <div class=\"panel\"><h3>Что делает площадка<\/h3><p>Считает маршрут и ориентир цены<\/p><p>Показывает, каким путём пойдёт груз<\/p><p>Собирает цены проверенных экспедиторов<\/p><p>Показывает статусы по номеру контейнера<\/p><\/div>\n      <div class=\"panel no\"><h3>Чего площадка не делает<\/h3><p>Не принимает деньги за перевозку: вы платите экспедитору<\/p><p>Не бронирует место на судне и не выдаёт коносамент<\/p><p>Не отвечает за груз: отвечают экспедитор и перевозчик<\/p><p>Не гарантирует цену и место: их подтверждает экспедитор<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n\n<footer class=\"foot\"><div class=\"wrap\"><span data-noi18n id=\"footBrand\">OPERELLE SEA · cargo<\/span><span data-noi18n id=\"footContacts\"><\/span><span>Пробная версия. Расписания, часть цен и компании-экспедиторы на сайте демонстрационные.<\/span><\/div><\/footer>\n<div id=\"modal-root\"><\/div>\n<div id=\"toast-root\"><\/div>\n<script>\n\n/* ============================================================\n   ВАЛЮТЫ (общий блок трёх программ)\n   Это не обмен валют. Все суммы считаются и хранятся в тенге, а показываются в валюте,\n   которую человек выбрал вверху страницы: крупно в валюте, ниже мелко в тенге.\n   Выбор хранится в браузере и действует сразу в головной панели, панели компании и на сайте.\n   Курсы демо: ориентир к тенге; в боевой версии загружаются раз в день с сайта Нацбанка РК,\n   головная панель OPERELLE может поправить их вручную (ключ operelleFx).\n   ============================================================ */\nconst fxLS=(k,d)=>{let v=null;try{v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return typeof d==='string'&&typeof v==='string'&&v?v:d}};\nconst fxSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};\n/* код, знак, знак перед числом, название, страны, курс к тенге за 1 единицу */\nconst FX_LIST=[\n ['KZT','₸',0,'Казахстанский тенге','Казахстан',1],\n ['USD','$',1,'Доллар США','США, международные расчёты',520],\n ['EUR','€',1,'Евро','Евросоюз',600],\n ['RUB','₽',0,'Российский рубль','Россия',6.4],\n ['CNY','¥',0,'Китайский юань','Китай',73],\n ['UZS','сўм',0,'Узбекский сум','Узбекистан',0.041],\n ['KGS','сом',0,'Кыргызский сом','Кыргызстан',5.95],\n ['TJS','смн',0,'Таджикский сомони','Таджикистан',48],\n ['TMT','TMT',0,'Туркменский манат','Туркменистан',148],\n ['AZN','₼',0,'Азербайджанский манат','Азербайджан',306],\n ['GEL','₾',0,'Грузинский лари','Грузия',190],\n ['AMD','֏',0,'Армянский драм','Армения',1.34],\n ['BYN','Br',0,'Белорусский рубль','Беларусь',160],\n ['TRY','₺',0,'Турецкая лира','Турция',12.5],\n ['MNT','₮',0,'Монгольский тугрик','Монголия',0.15],\n ['AED','AED',0,'Дирхам ОАЭ','ОАЭ',141.6],\n ['GBP','£',1,'Фунт стерлингов','Великобритания',690],\n ['PLN','zł',0,'Польский злотый','Польша, транзит в ЕС',140],\n ['KRW','₩',0,'Южнокорейская вона','Южная Корея',0.37],\n ['INR','₹',0,'Индийская рупия','Индия',6]\n];\nconst FX=code=>FX_LIST.find(x=>x[0]===code)||FX_LIST[0];\n/* знак валюты: кириллические знаки (сўм, сом, смн) на английском и китайском заменяются кодом */\nconst fxSym=c=>(typeof LANG!=='undefined'&&(LANG==='en'||LANG==='zh')&&/[а-яёў]/i.test(c[1]))?c[0]:c[1];\nconst fxRates=()=>{const o={};FX_LIST.forEach(x=>o[x[0]]=x[5]);return Object.assign(o,fxLS('operelleFx',{}))};\nlet CUR=fxLS('operelleCur','KZT'); if(!FX_LIST.some(x=>x[0]===CUR)) CUR='KZT';\nconst kzt=n=>Math.round(n).toLocaleString('ru-RU')+' ₸';\nconst FX_WORD={ru:['тыс','млн'],kk:['мың','млн'],en:['K','M'],zh:['千','百万']};\nconst fxWord=i=>(FX_WORD[typeof LANG!=='undefined'?LANG:'ru']||FX_WORD.ru)[i];\n/* число в валюте: крупные суммы без копеек, мелкие с двумя знаками, совсем мелкие с тремя */\nconst fxLoc=()=>(typeof LANG!=='undefined'&&(LANG==='en'||LANG==='zh'))?'en-US':'ru-RU';\nconst fxDec=s=>fxLoc()==='en-US'?s:s.replace('.',',');\nfunction fxNum(v){\n  const a=Math.abs(v), d=a>=100?0:a>=1?2:3;\n  return v.toLocaleString(fxLoc(),{minimumFractionDigits:0,maximumFractionDigits:d});\n}\n/* единица после суммы на языке страницы: /км, /т, /ч */\nconst FX_UNIT={kk:{'км':'км','т':'т','м³':'м³','ч':'сағ','час':'сағ','сут':'тәул','мес':'ай','рейс':'рейс','место':'орын'},\n  en:{'км':'km','т':'t','м³':'m³','ч':'h','час':'h','сут':'day','мес':'mo','рейс':'trip','место':'slot'},\n  zh:{'км':'公里','т':'吨','м³':'立方米','ч':'小时','час':'小时','сут':'天','мес':'月','рейс':'趟','место':'个'}};\nconst fxUnit=u=>{if(!u)return '';const m=FX_UNIT[typeof LANG!=='undefined'?LANG:'ru'];const k=u.slice(1);return '/'+(m&&m[k]||k)};\nfunction fxPlain(n,code){\n  const c=FX(code||CUR), v=n/(fxRates()[c[0]]||1);\n  const y=fxSym(c); return c[2]?y+fxNum(v):fxNum(v)+' '+y;\n}\n/* сумма для страницы: в тенге как раньше; в другой валюте крупно валюта, мелко тенге */\nfunction fxMoney(n,u){\n  u=fxUnit(u);\n  if(CUR==='KZT') return kzt(n)+u;\n  return '<span class=\"fx\"><b>'+fxPlain(n)+u+'<\/b><small>'+kzt(n)+u+'<\/small><\/span>';\n}\nfunction fxMln(n){\n  const tenge=(CUR==='KZT'?(n/1e6).toFixed(n>=1e7?1:2).replace('.',','):fxDec((n/1e6).toFixed(n>=1e7?1:2)))+' '+fxWord(1)+' ₸';\n  if(CUR==='KZT') return tenge;\n  const c=FX(CUR), v=n/(fxRates()[c[0]]||1), a=Math.abs(v);\n  const s=a>=1e6?fxDec((v/1e6).toFixed(a>=1e7?1:2))+' '+fxWord(1):a>=1e4?fxDec((v/1e3).toFixed(1))+' '+fxWord(0):fxNum(v);\n  const y=fxSym(c); return '<span class=\"fx\"><b>'+(c[2]?y+s:s+' '+y)+'<\/b><small>'+tenge+'<\/small><\/span>';\n}\n/* суммы внутри готового текста: «от 3 000 ₸», «29 000 ₸ в месяц», «от 170 ₸/км» (единица остаётся при обеих суммах) */\nfunction fxStr(s){\n  if(CUR==='KZT'||!s) return s;\n  return String(s).replace(/(\\d+(?:[   ]\\d{3})*(?:,\\d+)?)[  ]?(млн[  ])?₸(\\/(?:км|т|м³|ч|час|сут|мес|рейс|место))?/g,(m,a,ml,u)=>{\n    const n=parseFloat(a.replace(/[   ]/g 850],'SHA-DXB':[1300,800],\n 'POT-PIR':[950,850],'POT-GOA':[1450,1300],'POT-RTM':[2100,1750],'POT-HAM':[2200,1800],'POT-NYC':[3900,3100],'POT-HOU':[4300,3300],'POT-YMQ':[4100,3200],'POT-MUN':[2600,2300],'POT-NSA':[2700,2350],\n 'BND-DXB':[350,350],'BND-KHI':[480,480],'BND-MUN':[620,600],'BND-NSA':[680,650],\n 'SCO-TKM':[480,480],'SCO-MCX':[480,480],'SCO-ASF':[600,600],'SCO-OLY':[570,570],'SCO-ANZ':[680,680],'SCO-AMR':[650,650],'SCO-NSH':[680,680]};\nconst DREWRY={date:'24.09.2026',all:4468,rows:[['Шанхай – Роттердам',3485],['Шанхай – Генуя',3835],['Шанхай – Лос-Анджелес',7838],['Шанхай – Нью-Йорк',10373]]};\nconst W_EST={IST:[1750,1930,2600,7],IZM:[1900,2090,2800,8]};\nconst FEE_DOC=75, FEE_TRANSIT=50, THC={c20:130,c40:190};\n/* откуда взята цифра: 1 тариф ТМТМ, 2 индекс Drewry, 3 тариф паромов, 0 оценка */\nconst BASIS=['оценка','тариф ТМТМ 2026','индекс Drewry','тариф паромов'];\n\n/* ---------- расчёт: пути между городом Казахстана и портом за рубежом ---------- */\nfunction unitCheck(o,c){\n  const why=[], g=grpOf(o.far), u=c.unit, t=c.type, kg=+c.kg||0;\n  if(u==='trk'&&o.via!=='F') why.push('Фуры на пароме идут на Каспий, в Турцию и Европу. Сюда нужен контейнер');\n  if(t==='temp'&&u!=='rf'&&u!=='trk') why.push('Температурный груз везут в рефрижераторе');\n  if(t==='oog'&&u!=='c40') why.push('Негабарит везут на платформе 40 футов');\n  if(t==='dg'&&u==='lcl') why.push('Опасный груз в сборный контейнер не берут');\n  if(u==='c20'&&kg>28000) why.push('Больше 28 т в контейнер 20 футов не грузят');\n  if((u==='c40'||u==='rf')&&kg>26000) why.push('Больше 26 т в контейнер 40 футов не грузят');\n  if(u==='trk'&&kg>22000) why.push('Больше 22 т в фуру не грузят');\n  if(u==='lcl'&&(g==='cas'||g==='bs'||g==='ru'||g==='gf')) why.push('Сборные контейнеры по этому направлению не собирают');\n  if(u==='lcl'&&(+c.m3||0)>30) why.push('Больше 30 м³ выгоднее везти целым контейнером');\n  return why;\n}\n/* набор участков от города Казахстана до порта: W через Каспий, E через порты Китая, S через Иран, N по железной дороге, F фура на пароме */\nconst CASP_DIRECT=['TKM','MCX','ASF','OLY','ANZ','AMR','NSH'], CN_PORT=['LYG','TAO','SHA','TSN','SZX'];\nfunction chain(via,kz,far){\n  const L=[], west=kz==='GUW'||kz==='AKX'||kz==='SCO', kzw=west?null:VIA.kzW;\n  if(via==='W'){\n    if(kz!=='SCO') L.push(leg('rail',kz,'SCO',kzw,'KTZ'));\n    if(CASP_DIRECT.includes(far)){ L.push(leg('sea','SCO',far)); return L; }\n    L.push(leg('sea','SCO','BAK')); if(far==='BAK') return L;\n    if(far==='IST'||far==='IZM'){ L.push(leg('rail','BAK',far,VIA.ank,'ADY')); return L; }\n    if(far==='MER'){ L.push(leg('rail','BAK','MER',VIA.kars.concat([[37,38.4]]),'ADY')); return L; }\n    const port=far==='BTM'?'BTM':'POT'; L.push(leg('rail','BAK',port,VIA.geo,'ADY')); if(far===port) return L;\n    if(far==='CND'){ L.push(leg('sea',port,'CND')); return L; }\n    if(TMTM_BS[far]){ L.push(leg('sea','POT','CND')); L.push(leg('rail','CND',far,far==='DUI'?VIA.vie:far==='SLW'?VIA.buh.concat([[19.05,47.5]]):VIA.buh,'EUR')); return L; }\n    L.push(leg('sea','POT',far)); return L;\n  }\n  if(via==='E'){\n    L.push(leg('rail',kz,'ALT',west?VIA.kzE:null,'KTZ'));\n    const port=CN_PORT.includes(far)?far:'SHA'; L.push(leg('rail','ALT',port,port==='SZX'?VIA.szx:VIA.cn,'CR')); if(far===port) return L;\n    L.push(leg('sea','SHA',far)); return L;\n  }\n  if(via==='S'){ L.push(leg('rail',kz,'BND',VIA.ir,'KTZ')); if(far==='BND') return L; L.push(leg('sea','BND',far)); return L; }\n  if(via==='N'){ L.push(leg('rail',kz,far,VIA[{NVS:'nvs',LED:'led',VVO:'vvo',RIX:'rix',KLJ:'klj'}[far]],'RZD')); return L; }\n  /* F: фура */\n  L.push(leg('road',kz,'KRK',kzw)); L.push(leg('ferry','KRK','BAK')); if(far==='BAK') return L;\n  const eu=VIA.ank.concat([[28.95,41]]);\n  L.push(leg('road','BAK',far,far==='POT'||far==='BTM'?VIA.geo:far==='MER'?VIA.kars.concat([[37,38.4]]):far==='IST'||far==='IZM'?VIA.ank:far==='CND'?eu:far==='DUI'?eu.concat(VIA.vie):eu.concat(VIA.buh))); return L;\n}\nconst VIA_NAME={W:'Через Каспий',E:'Через порты Китая',S:'Через Иран',N:'По железной дороге',F:'Фура на пароме'};\nconst TRUCK_OK=['BAK','POT','BTM','CND','IST','MER','IZM','BUD','SLW','DUI'];\nfunction viasFor(far,u){\n  const g=grpOf(far);\n  if(u==='trk'&&TRUCK_OK.includes(far)) return ['F'];\n  if(g==='as') return ['E'];\n  if(g==='in') return far==='KHI'?['S','E']:['S','E','W'];\n  if(g==='gf') return far==='BND'?['S']:['S','E'];\n  if(g==='am') return far==='NYC'?['W','E']:far==='LAX'||far==='YVR'?['E']:['W'];\n  if(g==='ru'||far==='RIX'||far==='KLJ') return ['N'];\n  return ['W'];\n}\n/* цена одного пути за одну единицу (контейнер или фуру), в долларах, по строкам */\nfunction priceOf(via,kz,far,L,c,imp){\n  const C=getCfg(), u=c.unit==='lcl'?'c40':c.unit, big=u!=='c20', hv=c.type==='hvy'&&u==='c20', col=hv?1:big?2:0, kS=ct(c.type)[3]*(u==='rf'?1.5:1), kI=imp?C.imp:1;\n  const P=[], add=(t,v,b)=>{ if(v>0) P.push({t,usd:Math.round(v),b:b||0}) };\n  const rail=(l,r20,r40)=>l.km*(big?r40:r20)*(c.type==='oog'?1.5:1)+(u==='rf'?l.km*.06:0);\n  const sea=(key,a,b)=>{ const o=OCEAN[key]; add('Море: '+ptn(imp?b:a)+' – '+ptn(imp?a:b),o[imp?1:0]*(big?1:.6)*kS,o[2]&&!imp?2:0); };\n  const fees=()=>add('Документы и таможенный транзит',FEE_DOC+FEE_TRANSIT), thc=()=>add('Обработка в портах',THC[big?'c40':'c20']*2);\n  if(via==='F'){\n    add('Автодорога до порта Курык',L[0].km*C.road);\n    add('Паром Курык – Алят: '+String(FERRY_M).replace('.',',')+' $ за метр длины',FERRY_M*TRUCK_M+FERRY_PORT,3);\n    if(L[2]) add('Автодорога от порта Алят',L[2].km*C.road*1.1);\n    fees(); return P;\n  }\n  if(via==='N'){ add('Железная дорога до порта',rail(L[0],C.ru20,C.ru40)); fees(); return P; }\n  if(via==='S'){ add('Железная дорога через Туркменистан и Иран',rail(L[0],C.ru20,C.ru40)); if(L[1]){ sea('BND-'+far,'BND',far); thc(); } fees(); return P; }\n  if(via==='E'){\n    add('Железная дорога по Казахстану',rail(L[0],C.kz20,C.kz40));\n    add('Железная дорога по Китаю',rail(L[1],C.cn40*.62,
