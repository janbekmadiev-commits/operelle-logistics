0','road','imp','fee'].forEach(k=>c[k]=CFG_DEF[k]); setCfg(c); render(); toast('Ставки возвращены'); }\n\nVIEWS.site=function(){\n  const S=getSite();\n  const inp=(k,lab,ph,hint)=>'<div class=\"field\"><label>'+lab+'<\/label><input type=\"text\" value=\"'+esc(S[k]||'')+'\" placeholder=\"'+esc(ph||'')+'\" maxlength=\"140\" onchange=\"siteSet(\\''+k+'\\',this.value)\">'+(hint?'<div class=\"mini\">'+hint+'<\/div>':'')+'<\/div>';\n  const sw=(on,act,lab,sub)=>'<div class=\"row-between\" style=\"padding:7px 0;gap:12px\"><div style=\"min-width:0\"><div>'+lab+'<\/div>'+(sub?'<div class=\"mini\">'+sub+'<\/div>':'')+'<\/div><button class=\"switch'+(on?' on':'')+'\" onclick=\"'+act+'\" aria-label=\"'+lab+'\"><\/button><\/div>';\n  const nSec=SITE_SEC.filter(x=>S.sec[x[0]]!==0).length, nG=siteGrps().length, nC=siteCities().length;\n  return '<div class=\"grid g-kpi\" style=\"margin-bottom:14px\"><div class=\"card\"><div class=\"label\">Приём заявок<\/div><div class=\"kpi-val\" style=\"color:'+(S.pause?'var(--amber)':'var(--green)')+'\">'+(S.pause?'Остановлен':'Идёт')+'<\/div><div class=\"mini\">Кнопка заявки на сайте<\/div><\/div>'+\n    '<div class=\"card\"><div class=\"label\">Разделов на сайте<\/div><div class=\"kpi-val\">'+nSec+' из '+SITE_SEC.length+'<\/div><div class=\"mini\">Скрытый раздел пропадает и из меню<\/div><\/div>'+\n    '<div class=\"card\"><div class=\"label\">Направлений<\/div><div class=\"kpi-val\">'+nG+' из '+GRP.length+'<\/div><div class=\"mini\">Что можно выбрать в расчёте<\/div><\/div>'+\n    '<div class=\"card\"><div class=\"label\">Городов отправления<\/div><div class=\"kpi-val\">'+nC+' из '+KZ_PT.length+'<\/div><div class=\"mini\">Города Казахстана в расчёте<\/div><\/div><\/div>'+\n   '<div class=\"grid g2\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Название и первый экран<\/div><\/div><div class=\"stack\">'+\n     inp('brand','Название сайта',SITE_DEF.brand)+inp('sub','Подпись под названием','cargo')+inp('title','Заголовок первого экрана',TITLE_DEF,'Пусто — заголовок по умолчанию на языке посетителя')+inp('lead','Строка под заголовком',LEAD_DEF,'Пусто — строка по умолчанию')+'<\/div><\/div>'+\n    '<div class=\"stack\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Контакты на сайте<\/div><\/div><div class=\"stack\">'+inp('phone','Телефон','+7 700 000 00 00')+inp('mail','Почта','mail@company.kz')+inp('wa','WhatsApp','+7 700 000 00 00')+'<\/div><\/div>'+\n     '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Заявки и объявление<\/div><\/div>'+sw(!S.pause,'siteTog(\\'\\',\\'pause\\')','Принимать заявки с сайта','Если выключить, расчёт работает, а кнопка заявки закрыта')+\n      sw(S.noteOn,'siteTog(\\'\\',\\'noteOn\\')','Показывать объявление','Оранжевая полоса вверху сайта')+inp('note','Текст объявления','например: с 1 ноября новый тариф на паром')+'<\/div><\/div><\/div>'+\n   '<div class=\"grid g3\" style=\"margin-top:14px\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Разделы сайта<\/div><\/div>'+SITE_SEC.map(x=>sw(S.sec[x[0]]!==0,'siteTog(\\'sec\\',\\''+x[0]+'\\')',x[1])).join('')+'<\/div>'+\n    '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Направления на сайте<\/div><\/div>'+GRP.map(g=>sw(S.grp[g[0]]!==0,'siteTog(\\'grp\\',\\''+g[0]+'\\')',g[1],'портов: '+g[2].length)).join('')+'<\/div>'+\n    '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Города отправления<\/div><\/div>'+KZ_PT.map(k=>sw(S.cities[k]!==0,'siteTog(\\'cities\\',\\''+k+'\\')',esc(ptn(k)))).join('')+'<\/div><\/div>'+\n   '<div class=\"card\" style=\"margin-top:14px\"><div class=\"card-head\"><div class=\"card-title\">Как это видит заказчик<\/div><div class=\"card-actions\"><button class=\"btn btn-sm\" onclick=\"siteReset()\">Вернуть как было<\/button><\/div><\/div>'+\n    (S.noteOn&&S.note?'<div data-noi18n style=\"background:var(--gold);color:#180900;font-weight:700;text-align:center;padding:8px 12px;border-radius:8px;margin-bottom:10px\">'+esc(S.note)+'<\/div>':'')+\n    '<div class=\"row\" style=\"gap:10px;margin-bottom:8px\"><span>'+seaLogo(30)+'<\/span><div data-noi18n><b>'+esc(S.brand||SITE_DEF.brand)+'<\/b><div class=\"mini\">'+esc(S.sub||'')+'<\/div><\/div><\/div>'+\n    '<div style=\"font:800 26px/1.05 var(--cd);text-transform:uppercase\">'+esc(S.title||TITLE_DEF)+'<\/div><div class=\"mini\" style=\"margin-top:6px;font-size:13.5px\">'+esc(S.lead||LEAD_DEF)+'<\/div>'+\n    '<div class=\"kv\" style=\"margin-top:10px\"><span>Контакты внизу сайта<\/span><b data-noi18n>'+esc([S.phone,S.mail,S.wa&&S.wa!==S.phone?'WhatsApp '+S.wa:''].filter(Boolean).join(' · ')||'—')+'<\/b><\/div><\/div>'+\n   '<div style=\"margin-top:12px\">'+demoNote('Настройки сразу действуют на сайте: откройте его переключателем «Сайт для заказчиков» вверху. Комиссия и ставки меняются в разделе «Тарифы и ставки», автоматическая работа агентов — в разделе «Агенты DURUS AI»')+'<\/div>';\n};\nfunction siteSet(k,v){ const S=getSite(); S[k]=String(v||'').trim(); setSite(S); render(); toast('Сайт обновлён'); }\nfunction siteTog(map,k){\n  const S=getSite();\n  if(map){ S[map][k]=S[map][k]===0?1:0;\n    if(map==='grp'&&!GRP.some(g=>S.grp[g[0]]!==0)){ toast('Нужно оставить хотя бы одно направление','warn'); return; }\n    if(map==='cities'&&!KZ_PT.some(c=>S.cities[c]!==0)){ toast('Нужно оставить хотя бы один город','warn'); return; } }\n  else S[k]=S[k]?0:1;\n  setSite(S); render(); toast('Сайт обновлён');\n}\nfunction siteReset(){ setSite({}); render(); toast('Настройки сайта возвращены'); }\n\nVIEWS.agents=function(){\n  const c=getCfg(), log=agentLog();\n  return '<div class=\"card\" style=\"margin-bottom:14px\"><div class=\"row-between\"><div><b>Агенты сами ведут заявку с сайта<\/b><div class=\"mini\">Выбирают путь, запрашивают цены у экспедиторов и следят за грузом без оператора<\/div><\/div><button class=\"switch'+(c.auto?' on':'')+'\" onclick=\"cfgToggle(\\'auto\\')\" aria-label=\"Автоматический режим\"><\/button><\/div><\/div>'+\n   '<div class=\"grid g3\">'+AGENTS.map(a=>{const on=c.agents[a[0]], n=log.filter(l=>l.who.includes('«'+a[1]+'»')).length+Math.floor(hash(a[0])*30)+4;\n     return '<div class=\"card\"><div class=\"row-between\"><div class=\"card-title\">'+a[1]+'<\/div><button class=\"switch'+(on?' on':'')+'\" onclick=\"cfgToggle(\\''+a[0]+'\\')\" aria-label=\"'+a[1]+'\"><\/button><\/div><p class=\"ag-desc\">'+a[2]+'<\/p><div class=\"kv\"><span>Источник<\/span><b>'+a[3]+'<\/b><\/div><div class=\"kv\"><span>Действий сегодня<\/span><b>'+(on?n:0)+'<\/b><\/div><\/div>'}).join('')+'<\/div>'+\n   '<div class=\"card\" style=\"margin-top:14px\"><div class=\"card-head\"><div class=\"card-title\">Журнал<\/div><\/div><div class=\"log\" style=\"max-height:320px\">'+log.slice(0,40).map(l=>'<div><span class=\"t\">'+l.t+'<\/span> <span class=\"'+l.c+'\">'+esc(l.who)+'<\/span> '+esc(l.text)+'<\/div>').join('')+'<\/div><\/div>';\n};\nfunction cfgToggle(k){ const c=getCfg(); if(k==='auto') c.auto=c.auto?0:1; else c.agents[k]=c.agents[k]?0:1; setCfg(c); render(); }\n\nVIEWS.api=function(){\n  const c=getCfg(), on=c.api||{}, G=[['Цены и тарифы',['tmtm','drewry','fbx','cma','hlag','maersk']],['Где контейнер и судно',['shipsgo','t49','ais','vf']],['Порты Казахстана',['aktau','kuryk']],['Казахстанские перевозчики',['ktze','kmtf']]];\n  const price=p=>typeof p==='number'?money(usd(p))+' <span>за отправку<\/span>':p;\n  return '<div class=\"grid g-kpi\" style=\"margin-bottom:14px\"><div class=\"card\"><div class=\"label\">Слежение за контейнером<\/div><div class=\"kpi-val\">'+money(usd(2))+'<\/div><div class=\"mini\">За одну отправку, без договора с линией<\/div><\/div>'+\n    '<div class=\"card\"><div class=\"label\">Открыто без договора<\/div><div class=\"kpi-val\">'+API_SRC.filter(a=>a[4]===0).length+'<\/div><div class=\"mini\">Тариф, индексы, слежение, порты<\/div><\/div>'+\n    '<div class=\"card\"><div class=\"label\">Только по договору<\/div><div class=\"kpi-val\">'+API_SRC.filter(a=>a[4]===1).length+'<\/div><div class=\"mini\">Цены океанских линий<\/div><\/div>'+\n    '<div class=\"card\"><div class=\"label\">Только переговоры<\/div><div class=\"kpi-val\">'+API_SRC.filter(a=>a[4]===2).length+'<\/div><div class=\"mini\">Казахстанские перевозчики<\/div><\/div><\/div>'+\n   G.map(g=>'<div class=\"section-label\">'+g[0]+'<\/div><div class=\"card\"><div class=\"tbl-wrap\"><table><thead><tr><th>Сервис<\/th><th>Что даёт<\/th><th>Доступ<\/th><th>Цена<\/th><th>В программе<\/th><\/tr><\/thead><tbody>'+\n    g[1].map(id=>{const a=API_SRC.find(x=>x[0]===id);return '<tr><td><b>'+a[1]+'<\/b><\/td><td>'+a[2]+'<div class=\"mini\">'+a[5]+'<\/div><\/td><td><span class=\"badge '+API_ACCESS[a[4]][1]+'\">'+API_ACCESS[a[4]][0]+'<\/span><\/td><td class=\"nowrap\">'+price(a[3])+'<\/td>'+\n      '<td><div class=\"row\" style=\"gap:8px\"><button class=\"switch'+(on[id]||id==='tmtm'||id==='drewry'?' on':'')+'\" onclick=\"apiToggle(\\''+id+'\\')\" aria-label=\"'+a[1]+'\"><\/button><span class=\"mini\">'+(id==='tmtm'||id==='drewry'?'уже в расчёте':on[id]?'подключён':'демо-данные')+'<\/span><\/div><\/td><\/tr>'}).join('')+'<\/tbody><\/table><\/div><\/div>').join('')+\n   '<div style=\"margin-top:12px\">'+demoNote('Условия сервисов проверены 03.10.2026. Тариф ТМТМ и индекс Drewry уже заложены в расчёт. Остальные переключатели показывают, что будет подключено: в пробной версии программа работает на демо-данных')+'<\/div>';\n};\nfunction apiToggle(id){ if(id==='tmtm'||id==='drewry'){ toast('Этот источник уже заложен в расчёт','info'); return; } const c=getCfg(); c.api=c.api||{}; c.api[id]=c.api[id]?0:1; setCfg(c); render(); }\n\nconst teuOf=c=>c.unit==='c20'?c.n:c.unit==='c40'||c.unit==='rf'?c.n*2:0;\nVIEWS.deals=function(){\n  const D=R().filter(r=>reqOffer(r)), sum=D.reduce((s,r)=>s+reqOffer(r).total,0), fee=D.reduce((s,r)=>s+reqFee(r),0), teu=D.reduce((s,r)=>s+teuOf(r.cargo),0), pc=dec(getCfg().fee*100);\n  return '<div class=\"grid g-kpi\" style=\"margin-bottom:14px\"><div class=\"card\"><div class=\"label\">Сделок<\/div><div class=\"kpi-val\">'+D.length+'<\/div><div class=\"mini\">Заказчик выбрал экспедитора<\/div><\/div>'+\n    '<div class=\"card\"><div class=\"label\">Оборот сделок<\/div><div class=\"kpi-val\">'+mln(sum)+'<\/div><div class=\"mini\">Для статистики: через площадку не проходит<\/div><\/div>'+\n    '<div class=\"card\"><div class=\"label\">Комиссия площадки<\/div><div class=\"kpi-val\" style=\"color:var(--gold)\">'+mln(fee)+'<\/div><div class=\"mini\">'+pc+' % от суммы, платит экспедитор<\/div><\/div>'+\n    '<div class=\"card\"><div class=\"label\">Перевезено<\/div><div class=\"kpi-val\">'+teu+' TEU<\/div><div class=\"mini\">Контейнеры в пересчёте на 20 футов<\/div><\/div><\/div>'+\n   '<div class=\"card\"><div class=\"tbl-wrap\"><table><thead><tr><th>Заявка<\/th><th>Маршрут<\/th><th>Экспедитор<\/th><th>Цена перевозки<\/th><th>Комиссия<\/th><th>Статус<\/th><\/tr><\/thead><tbody>'+\n   D.map(r=>{const o=reqOffer(r);return '<tr class=\"click\" onclick=\"openReq(\\''+r.id+'\\',\\'deal\\')\"><td><b>'+r.id+'<\/b><\/td><td>'+route(r)+'<\/td><td>'+esc(fw(o.fw).name)+'<\/td><td class=\"nowrap\">'+money(o.total)+'<\/td><td class=\"nowrap\"><b>'+money(reqFee(r))+'<\/b><div class=\"mini\">'+(r.st==='done'?'оплачена':'начислится после выдачи')+'<\/div><\/td><td>'+badge(r.st)+'<\/td><\/tr>'}).join('')+\n   '<\/tbody><\/table><\/div><\/div><div style=\"margin-top:12px\">'+demoNote('Размер комиссии и кто её платит — пример. Это решает владелец площадки; процент меняется в разделе «Тарифы и ставки»')+'<\/div>';\n};\n\nVIEWS.rules=function(){\n  const yes=['Принимает заявку и подбирает вид контейнера','Показывает путь: через Каспий, через порты Китая или по железной дороге','Отправляет запрос проверенным экспедиторам и собирает цены в одном окне','Открывает контакты сторон после того, как заказчик выбрал предложение','Показывает статусы груза по номеру контейнера','Проверяет документы экспедитора и ведёт его рейтинг по сделкам'];\n  const no=['Не бронирует место на судне и не выдаёт коносамент: это делает экспедитор','Не принимает деньги за перевозку: заказчик платит экспедитору напрямую','Не отвечает за груз: отвечают экспедитор и перевозчик по коносаменту','Не взвешивает контейнер и не оформляет таможню: это делают терминал и брокер','Не гарантирует цену и свободное место: их подтверждает только экспедитор','Не показывает цены морских линий напрямую: их дают экспедиторы'];\n  const li=(a,c)=>a.map(x=>'<div class=\"check-row\"><span class=\"ck '+c+'\">'+(c==='ok'?'✓':'✕')+'<\/span><span>'+x+'<\/span><\/div>').join('');\n  return '<div class=\"grid g2\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Что делает площадка<\/div><\/div>'+li(yes,'ok')+'<\/div><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Чего площадка не делает<\/div><\/div>'+li(no,'bad')+'<\/div><\/div>'+\n   '<div class=\"card\" style=\"margin-top:14px\"><div class=\"card-head\"><div class=\"card-title\">Что нужно для запуска<\/div><\/div>'+\n    [['Экспедиторы-партнёры','Два-три экспедитора, которые возят через Актау, и агент в Китае. Без них схема не работает'],['Данные перевозчиков','Договориться с KTZ Express и «Казмортрансфлотом» о ставках, расписании и статусах'],['Тариф и индексы','Тариф ТМТМ обновлять вручную раз в год, индекс океана раз в неделю'],['Юрист','Правила площадки и договор с экспедитором должен проверить юрист в Казахстане']].map(x=>'<div class=\"kv\"><span><b style=\"color:var(--txt)\">'+x[0]+'<\/b><\/span><b style=\"font-weight:400;max-width:62%\">'+x[1]+'<\/b><\/div>').join('')+'<\/div>';\n};\n\n/* ---------- запуск ---------- */\nfunction onCurChange(){ render(); if(state.rq&&$('#modal-root').innerHTML) openReq(state.rq.id,state.rq.tab); }\nfunction onLangChange(){ render(); }\n(function init(){\n  $('#brand-logo').innerHTML=seaLogo(36);\n  const d=new Date(); $('#date-main').textContent=fD(d); $('#date-sub').textContent=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][d.getDay()];\n  const gs=$('#global-search'); if(gs&&gs.addEventListener) gs.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=gs.value.trim(), r=findCno(v)||req(v.toUpperCase()); if(r){ openReq(r.id); } else { state.q=v; go('reqs'); } } });\n  if(typeof window!=='undefined'&&window.addEventListener){\n    window.addEventListener('storage',e=>{ if(!e.key||syncPrefs(e.key)) return; if(e.key.indexOf('operelleSea')===0){ reloadStore(); render(); if(state.rq&&$('#modal-root').innerHTML.indexOf(state.rq.id)>0) openReq(state.rq.id,state.rq.tab); } });\n    let ww=wide(); window.addEventListener('resize',()=>{ if(wide()!==ww){ ww=wide(); if(state.view==='center') render(); } });\n    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });\n  }\n  fxRefresh(); render();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"};
const SEA_LINKS=null;
(function(){
  var L={ru:['Сайт для заказчиков','Панель управления','Рядом','Сайт','Панель'],kk:['Тапсырыс берушілер сайты','Басқару панелі','Қатар','Сайт','Панель'],en:['Customer site','Dashboard','Side by side','Site','Dashboard'],zh:['客户网站','管理控制台','并排','网站','控制台']};
  var ls=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
  var box=document.getElementById('wFrames'),seg=document.getElementById('wSeg'),fall=document.getElementById('wFall'),F={},mode=null;
  function labels(){var a=L[ls('operelleLang','ru')]||L.ru,small=window.innerWidth<=520;[].forEach.call(seg.children,function(b,i){b.textContent=small&&i<2?a[i+3]:a[i]})}
  function failed(){
    if(!SEA_LINKS){return}
    box.hidden=true;box.style.display='none';fall.hidden=false;
    fall.innerHTML='<p>Встроенные окна в этом браузере недоступны. Откройте программы по отдельности.</p><a href="'+SEA_LINKS.site+'">Сайт для заказчиков</a><a href="'+SEA_LINKS.dash+'">Панель управления</a>';
  }
  function frame(k){
    if(F[k])return F[k];
    var f=document.createElement('iframe'),done=false;
    f.setAttribute('data-k',k);f.title=k==='site'?'Сайт для заказчиков':'Панель управления';
    var check=function(){if(done)return;done=true;var ok=false;try{var d=f.contentDocument;ok=!!(d&&d.body&&d.body.childElementCount>1)}catch(e){}if(!ok)failed()};
    f.addEventListener('load',function(){setTimeout(check,60)});setTimeout(check,6000);
    f.srcdoc=SEA_SRC[k];F[k]=f;box.appendChild(f);return f;
  }
  function show(m){
    if(m!=='site'&&m!=='dash'&&m!=='both')m='site';
    if(m==='both'&&window.innerWidth<1100)m='site';
    mode=m;['site','dash'].forEach(function(k){var on=m==='both'||m===k;if(on)frame(k);if(F[k])F[k].hidden=!on});
    box.className='w-frames'+(m==='both'?' both':'');
    [].forEach.call(seg.children,function(b){var on=b.getAttribute('data-m')===m;b.className=on?'on':'';b.setAttribute('aria-selected',on?'true':'false')});
    try{localStorage.setItem('operelleSeaMode',JSON.stringify(m))}catch(e){}
  }
  seg.addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.getAttribute('data-m'))});

  var h=(location.hash||'').replace('#','');
  labels();show(h==='site'||h==='dash'||h==='both'?h:ls('operelleSeaMode','site'));
})();
