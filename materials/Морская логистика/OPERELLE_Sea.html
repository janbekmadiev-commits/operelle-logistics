ней';\nfunction toggleNav(){ const m=$('#mnav'); m.hidden=!m.hidden; }\n\n/* ---------- первый экран ---------- */\nfunction renderTick(){\n  const s=siteGrps().map(g=>{const p=POPG[g[0]], b=bestOf('ALA',p,popCargo);return b?'<span>'+esc(ptn('ALA'))+' → '+esc(ptn(p))+' <b><i>от<\/i> '+fxText(money(b.min))+'<\/b><\/span>':''}).join('');\n  $('#tick').innerHTML='<div>'+s+s+'<\/div>';\n}\n/* все линии программы одним списком: по одному пути до каждого порта */\nfunction allLanes(){\n  const seen={}, routes=[];\n  FAR_PT.forEach((f,i)=>seaOptions(i%3===1?'NQZ':'ALA',f,popCargo).forEach(o=>o.legs.forEach(l=>{ const k=l.a+l.b+l.m; if(seen[k]) return; seen[k]=1; const w=l.m==='sea'||l.m==='ferry';\n    routes.push({pts:l.pts,m:l.m,a:l.a,b:l.b,main:w,fly:w,flow:w&&l.ship!=='ocean'?1:0,dur:16+hash(k)*34,delay:hash(k+'d')*20}) })));\n  return routes;\n}\nfunction renderHeroMap(){\n  $('#heroMap').innerHTML=seaMap({id:'h',box:[EUR[0],20,EUR[2],560],routes:allLanes(),labels:['BAK','POT','CND','IST','DUI','RTM','SHA','SIN','PUS','NSA','DXB','BND','NVS','LED','VVO']});\n}\n/* ---------- расчёт ---------- */\nfunction renderCalc(){\n  document.querySelectorAll('#dirTabs button').forEach(b=>b.classList.toggle('on',(+b.dataset.imp)===(C.imp?1:0)));\n  const far='<select id=\"c-far\" onchange=\"cSet(\\'far\\',this.value)\">'+siteGrps().map(g=>'<optgroup label=\"'+g[1]+'\">'+g[2].map(x=>'<option value=\"'+x+'\"'+(C.far===x?' selected':'')+'>'+esc(ptn(x))+', '+COUNTRY[PT[x][1]]+'<\/option>').join('')+'<\/optgroup>').join('')+'<\/select>';\n  const kz='<select id=\"c-kz\" onchange=\"cSet(\\'kz\\',this.value)\">'+siteCities().map(x=>'<option value=\"'+x+'\"'+(C.kz===x?' selected':'')+'>'+esc(ptn(x))+'<\/option>').join('')+'<\/select>';\n  const n=(k,lab)=>'<div class=\"field\"><label for=\"c-'+k+'\">'+lab+'<\/label><input id=\"c-'+k+'\" type=\"number\" min=\"0\" inputmode=\"decimal\" value=\"'+C[k]+'\" oninput=\"cSet(\\''+k+'\\',this.value,1)\"><\/div>';\n  const lcl=C.unit==='lcl';\n  $('#calcBody').innerHTML='<div class=\"grid2\"><div class=\"field\"><label for=\"c-kz\">'+(C.imp?'Куда':'Откуда')+'<\/label>'+kz+'<\/div><div class=\"field\"><label for=\"c-far\">'+(C.imp?'Откуда':'Куда')+'<\/label>'+far+'<\/div><\/div>'+\n   '<div class=\"field\"><label for=\"c-unit\">Как везём<\/label><select id=\"c-unit\" onchange=\"cSet(\\'unit\\',this.value)\">'+UNITS.map(u=>'<option value=\"'+u[0]+'\"'+(C.unit===u[0]?' selected':'')+'>'+u[1]+': '+u[2]+'<\/option>').join('')+'<\/select><\/div>'+\n   '<div class=\"field\"><label for=\"c-type\">Что везём<\/label><select id=\"c-type\" onchange=\"cSet(\\'type\\',this.value)\">'+CT.map(c=>'<option value=\"'+c[0]+'\"'+(C.type===c[0]?' selected':'')+'>'+c[1]+': '+c[2].charAt(0).toLowerCase()+c[2].slice(1)+'<\/option>').join('')+'<\/select><\/div>'+\n   '<div class=\"grid2\">'+(lcl?n('m3','Объём, м³'):n('n',C.unit==='trk'?'Сколько машин':'Сколько контейнеров'))+n('kg',lcl?'Вес всего, кг':C.unit==='trk'?'Вес в одной машине, кг':'Вес в одном, кг')+'<\/div>';\n  renderQuote();\n}\nfunction cSet(k,v,soft){\n  C[k]=['n','kg','m3'].includes(k)?Math.max(0,+v||0):k==='imp'?+v:v; LS.set('operelleSeaCalc',C);\n  way.i=0; if(soft) renderQuote(); else renderCalc();\n}\nconst basisHTML=o=>(o.basis.map(b=>'<span class=\"basis\">'+b+'<\/span>').join(''))+(o.real<.99?'<span class=\"basis est\">'+(o.basis.length?'остальное — оценка':'оценка')+'<\/span>':'');\nconst partsHTML=o=>'<details class=\"parts\"><summary>Из чего складывается цена<\/summary>'+o.parts.map(p=>'<div class=\"kv\"><span>'+esc(p.t)+'<\/span><b>'+money(Math.round(usd(p.usd)/100)*100)+(p.b?'<i>'+BASIS[p.b]+'<\/i>':'')+'<\/b><\/div>').join('')+'<\/details>';\nconst optArt=o=>o.sea?shipArt(o.sea.ship):unArt('c40',64);\nfunction renderQuote(){\n  const c=cCargo(), all=seaOptions(cFrom(),cTo(),c), ok=all.filter(o=>o.ok);\n  let h='';\n  if(ok.length){ const o=ok[0], many=c.unit!=='lcl'&&c.n>1;\n    h='<div class=\"quote\"><div class=\"quote-top\"><div>'+optArt(o)+'<\/div><div><b>'+o.name+'<\/b><small>'+esc(pathText(pathOf(o)))+'<\/small><small>'+daysTxt(o)+' · '+optSub(o)+'<\/small><\/div><\/div>'+legsHTML(o)+\n      '<div class=\"price\"><b>'+money(o.total)+'<\/b><span>'+(c.unit==='lcl'?money(Math.round(usd(o.per)/10)*10,'/м³')+' · ':many?money(Math.round(usd(o.one)/100)*100)+' <span>за один<\/span> · ':'')+'<span>путей: '+ok.length+'<\/span><\/span><\/div>'+\n      basisHTML(o)+backHTML(c)+(c.unit==='lcl'?'':partsHTML(o))+'<a class=\"link-btn\" href=\"#way\">Показать маршрут на карте<\/a><\/div>';\n  } else {\n    h='<div class=\"quote\"><b>'+(all.length?'Так этот груз не повезут':'По этому направлению пути нет')+'<\/b>'+(all.length?'<small class=\"no\">'+esc(all[0].why[0])+'<\/small>':'')+'<small style=\"display:block;color:var(--muted);font-size:13px;margin-top:4px\">Поменяйте вид отправки или оставьте заявку: экспедиторы предложат свой вариант<\/small><\/div>';\n  }\n  $('#calcOut').innerHTML=h; renderWay();\n}\n/* тот же груз в обратную сторону */\nfunction backHTML(c){\n  const b=seaOptions(cTo(),cFrom(),c).filter(o=>o.ok)[0]; if(!b) return '';\n  return '<div class=\"back-row\"><span>Обратно: '+esc(ptn(cTo()))+' → '+esc(ptn(cFrom()))+'<\/span><b>'+money(b.total)+'<\/b><\/div>';\n}\n/* ---------- маршрут на карте: участки по видам транспорта, сутки, судно ---------- */\nconst way={i:0};\nconst lgdHTML='<div class=\"lgd\"><span><i class=\"l\"><\/i>железная дорога<\/span><span><i><\/i>море<\/span><span><i class=\"rd\"><\/i>автодорога<\/span><\/div>';\nfunction waySet(i){ way.i=i; renderWay(); }\nfunction renderWay(){\n  const el=$('#wayOut'); if(!el) return;\n  const c=cCargo(), ok=seaOptions(cFrom(),cTo(),c).filter(o=>o.ok);\n  if(!ok.length){ el.innerHTML='<div class=\"panel\"><div class=\"empty\">Выберите в расчёте направление и вид отправки: здесь появится карта маршрута<\/div><\/div>'; return; }\n  const o=ok[Math.min(way.i,ok.length-1)];\n  const routes=o.legs.map((l,i)=>({pts:l.pts,m:l.m,a:l.a,b:l.b,main:1,fly:1,flow:l.m==='sea'||l.m==='ferry'?1:0,dur:Math.max(8,Math.min(40,l.km/260)),delay:0}));\n  el.innerHTML=(ok.length>1?'<div class=\"way-tabs\">'+ok.map((x,i)=>'<button type=\"button\" class=\"'+(x===o?'on':'')+'\" onclick=\"waySet('+i+')\">'+x.name+' · <span>'+fxText(money(x.total))+'<\/span><\/button>').join('')+'<\/div>':'')+\n   '<div class=\"way-grid\"><div class=\"mapbox\">'+seaMap({id:'y',routes,labels:pathOf(o),box:fitBox(optPts(o),1.6,3.3)})+lgdHTML+'<\/div>'+\n   '<div class=\"panel\"><h3>'+esc(ptn(cFrom()))+' → '+esc(ptn(cTo()))+'<\/h3>'+\n    o.legs.map(l=>'<div class=\"way-leg '+l.m+'\"><span class=\"ic\">'+modeIcon(l.m,18)+'<\/span><div><b>'+esc(ptn(l.a))+' → '+esc(ptn(l.b))+'<\/b><small>'+MODE[l.m]+' · '+num(l.km)+' км · '+esc(whoName(l.who))+'<\/small><\/div><div class=\"d\">'+legDays(l)+' <span>дн.<\/span><\/div><\/div>').join('')+\n    '<div class=\"way-sum\"><span>'+o.name+' · '+daysTxt(o)+'<\/span><b>'+money(o.total)+'<\/b><\/div>'+\n    o.legs.filter(l=>l.m==='sea'||l.m==='ferry').map(l=>'<div class=\"way-ship\"><div>'+shipArt(l.ship)+'<\/div><div><b>'+SHIP[l.ship][0]+'<\/b><small>'+SHIP[l.ship][2]+' · '+SHIP[l.ship][1]+'<\/small><small>'+esc(ptn(l.a))+' → '+esc(ptn(l.b))+' · '+esc(whoName(l.who))+'<\/small><\/div><\/div>').join('')+\n   '<\/div><\/div>';\n}\n\n/* ---------- разделы ---------- */\nfunction renderSections(){\n  $('#shipGal').innerHTML=SHIP_KEYS.map(k=>'<div class=\"ship-card\">'+shipArt(k)+'<h3>'+SHIP[k][0]+'<\/h3><p>'+SHIP[k][2]+'<\/p><span class=\"cap\">'+SHIP[k][1]+'<\/span><small>'+SHIP[k][3]+'<\/small><\/div>').join('');\n  const caps=[['Фидер Каспия','ходит сейчас',350,'350 TEU',0],['Новый фидер Каспия','заказан, придёт в 2028 году',780,'780 TEU',0],['Паром Курык – Алят','фуры и вагоны',108,'54 фуры',0],['Океанский контейнеровоз','для сравнения',14000,'14 000 TEU',1]];\n  $('#caps').innerHTML=caps.map(c=>'<div class=\"cap-row'+(c[4]?' demo':'')+'\"><span>'+c[0]+'<small>'+c[1]+'<\/small><\/span><i><b style=\"width:'+Math.max(3,Math.sqrt(c[2]/14000)*100).toFixed(1)+'%\"><\/b><\/i><b>'+c[3]+'<\/b><\/div>').join('');\n  const ex=[['Плитка: 24 т','Тяжёлый груз: объём не важен','20 футов','один контейнер'],['Мебель: 60 м³, 9 т','Объёмный груз: вес небольшой','40 футов','один контейнер'],['Запчасти: 8 м³, 2 т','Мало груза: целый контейнер не нужен','сборный','платите за кубометры']];\n  $('#wex').innerHTML=ex.map(e=>'<div class=\"wex-row\"><div><b>'+e[0]+'<\/b><small>'+e[1]+'<\/small><\/div><div class=\"res\">'+e[2]+'<small>'+e[3]+'<\/small><\/div><\/div>').join('');\n  const how={gen:['20 футов','40 футов','сборный','фура на пароме'],hvy:['20 футов','фура на пароме'],temp:['рефрижератор','фура на пароме'],dg:['20 футов','40 футов'],oog:['платформа 40 футов']};\n  $('#ctl').innerHTML=CT.map(c=>'<div class=\"ct-row\">'+ctArt(c[0],44)+'<b>'+c[1]+'<\/b><p>'+c[2]+'<\/p><div class=\"ct-how\">'+how[c[0]].map(x=>'<span class=\"chip y\">'+x+'<\/span>').join('')+'<\/div><\/div>').join('');\n  $('#checks').innerHTML=CHECKS.map(c=>'<div class=\"ck-row\"><i>✓<\/i><div><b>'+c[1]+'<\/b><small>'+c[2]+'<\/small><\/div><\/div>').join('');\n  $('#pDirs').innerHTML=siteGrps().map(g=>'<button type=\"button\" data-c=\"'+g[0]+'\" onclick=\"this.classList.toggle(\\'on\\')\">'+g[1]+'<\/button>').join('');\n  const tr=getReqs().filter(r=>r.st==='transit'&&r.cno).slice(0,3);\n  $('#demoCno').innerHTML='<span>Примеры:<\/span>'+tr.map(r=>'<button type=\"button\" data-noi18n onclick=\"trackFind(\\''+r.cno+'\\')\">'+r.cno+'<\/button>').join('');\n  renderDirs();\n}\nfunction renderDirs(){\n  const cities=siteCities().slice(0,6); if(!cities.includes(dirCity)) dirCity=cities[0];\n  $('#dirCity').innerHTML=cities.map(k=>'<button type=\"button\" class=\"'+(k===dirCity?'on':'')+'\" onclick=\"dirSet(\\''+k+'\\')\">'+esc(ptn(k))+'<\/button>').join('');\n  const big=typeof window==='undefined'||!window.innerWidth||window.innerWidth>760;\n  $('#worldMap').innerHTML=seaMap({id:'g',box:big?[0,0,MW,MH]:EUR,routes:allLanes().map(r=>Object.assign(r,{fly:0,flow:0})),kzLabels:0,labels:big?['SCO','BAK','POT','IST','RTM','HAM','DXB','SHA','PUS','YOK','SIN','NSA','LAX','YVR','NYC','HOU','YMQ','LED','VVO']:['SCO','BAK','POT','IST','RTM','DXB','SHA','SIN','NSA','VVO']})+lgdHTML;\n  $('#dirs').innerHTML=siteGrps().map(g=>{const p=POPG[g[0]], b=bestOf(dirCity,p,popCargo); if(!b) return '';\n    const rest=g[2].filter(x=>x!==p).map(ptn);\n    return '<button class=\"dir\" type=\"button\" onclick=\"pickDir(\\''+p+'\\')\"><span><span class=\"g\">'+g[1]+'<\/span><b>'+esc(ptn(dirCity))+' <u>→<\/u> '+esc(ptn(p))+'<\/b><small>'+(rest.length?'<span>ещё:<\/span> '+rest.slice(0,4).map(esc).join(', ')+(rest.length>4?' <span>и другие<\/span>':'')+' · ':'')+'<span>'+daysTxt(b.o)+'<\/span><\/small><\/span><span class=\"p\">'+money(b.min)+'<small>'+b.o.name+'<\/small><\/span><\/button>'}).join('');\n}\nfunction dirSet(k){ dirCity=k; renderDirs(); }\nfunction pickDir(far){ C.imp=0; C.far=far; C.kz=dirCity; C.unit='c40'; C.type='gen'; C.n=1; C.kg=18000; LS.set('operelleSeaCalc',C); renderCalc(); const el=$('#calc'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'}); }\n\n/* ---------- отслеживание ---------- */\nfunction trackHTML(r,id){\n  const t=genTrack(r), o=reqOffer(r), p=pathOf(o), cur=t.ev[Math.max(0,t.done-1)], sea=o.legs.find(l=>l.m==='sea'||l.m==='ferry');\n  return '<div><div class=\"mapbox\">'+seaMap({id:id||'k',routes:optRoutes(o),ships:t.leg?[{pts:t.leg.pts,t:t.leg.t,m:t.leg.m,ground:t.leg.ground}]:[],labels:p,box:fitBox(optPts(o))})+'<\/div>'+\n    '<div class=\"panel\" style=\"margin-top:14px\"><div class=\"kv\"><span>'+(r.cargo.unit==='trk'?'Паромный билет':'Номер контейнера')+'<\/span><b data-noi18n>'+r.cno+'<\/b><\/div><div class=\"kv\"><span>Маршрут<\/span><b>'+esc(pathText(p))+'<\/b><\/div>'+(sea?'<div class=\"kv\"><span>Море<\/span><b>'+esc(whoName(sea.who))+'<\/b><\/div>':'')+\n    '<div class=\"kv\"><span>Сейчас<\/span><b>'+(cur?EV[cur[0]]+' · '+esc(ptn(cur[2])):'—')+'<\/b><\/div><div class=\"kv\"><span>Прибытие<\/span><b>'+(t.eta?fDT(t.eta):'—')+'<\/b><\/div><\/div><\/div>'+\n   '<div class=\"panel\"><h3>Статусы<\/h3><div class=\"tline\">'+t.ev.map((e,i)=>'<div class=\"ev'+(i<t.done?'':' todo')+'\"><b>'+EV[e[0]]+'<\/b><small>'+esc(ptn(e[2]))+' · '+fDT(e[1])+'<\/small><\/div>').join('')+'<\/div><\/div>';\n}\nfunction trackFind(v){\n  const inp=$('#cnoIn'); if(v) inp.value=v; const r=findCno(inp.value), out=$('#trkOut');\n  if(!r){ out.hidden=true; toast('Груз с таким номером не найден. Проверьте буквы и цифры','warn'); return; }\n  out.hidden=false; out.innerHTML=trackHTML(r,'k');\n}\n\n/* ---------- заявка ---------- */\nfunction openModal(html,cls){ $('#modal-root').innerHTML='<div class=\"ov\" onclick=\"if(event.target===this)closeModal()\"><div class=\"dlg '+(cls||'')+'\" role=\"dialog\" aria-modal=\"true\">'+html+'<\/div><\/div>'; if(document.body&&document.body.style) document.body.style.overflow='hidden'; }\nfunction closeModal(){ $('#modal-root').innerHTML=''; if(document.body&&document.body.style) document.body.style.overflow=''; cab.open=false; }\nconst dhead=t=>'<div class=\"dlg-head\"><h3>'+t+'<\/h3><button class=\"x\" type=\"button\" onclick=\"closeModal()\" aria-label=\"Закрыть\">✕<\/button><\/div>';\nfunction openOrder(){\n  const c=cCargo(), me=LS.get('operelleSeaMe',{});\n  if(getSite().pause){ toast('Приём заявок временно остановлен','warn'); return; }\n  if(!c.kg||(c.unit==='lcl'?!c.m3:!c.n)){ toast('Укажите количество и вес груза','warn'); return; }\n  openModal(dhead('Заявка на перевозку')+'<form onsubmit=\"return submitOrder(event)\" style=\"display:flex;flex-direction:column;min-height:0;flex:1\"><div class=\"dlg-body\">'+\n   '<div class=\"kv\"><span>Маршрут<\/span><b>'+esc(ptn(cFrom()))+' → '+esc(ptn(cTo()))+'<\/b><\/div><div class=\"kv\" style=\"margin-bottom:14px\"><span>Отправка<\/span><b>'+cargoQty(c)+' · '+ct(c.type)[1].toLowerCase()+'<\/b><\/div>'+\n   '<div class=\"field\"><label for=\"oName\">Что везём<\/label><input id=\"oName\" required maxlength=\"80\" placeholder=\"например: мука в мешках\"><\/div>'+\n   '<div class=\"grid2\"><div class=\"field\"><label for=\"oMe\">Ваше имя<\/label><input id=\"oMe\" required maxlength=\"60\" value=\"'+esc(me.name||'')+'\"><\/div><div class=\"field\"><label for=\"oPhone\">Телефон<\/label><input id=\"oPhone\" required type=\"tel\" maxlength=\"24\" placeholder=\"+7 700 000 00 00\" value=\"'+esc(me.phone||'')+'\"><\/div><\/div>'+\n   '<div class=\"field\"><label for=\"oCo\">Компания<\/label><input id=\"oCo\" maxlength=\"80\" placeholder=\"ТОО или ИП\" value=\"'+esc(me.company||'')+'\"><\/div>'+\n   '<label class=\"check\"><input type=\"checkbox\" id=\"oOk\" required><span>Согласен с правилами площадки: она сводит стороны, перевозку оплачиваю экспедитору<\/span><\/label>'+\n   '<\/div><div class=\"dlg-foot\"><button class=\"btn btn-line\" type=\"button\" onclick=\"closeModal()\">Отмена<\/button><button class=\"btn btn-gold\" type=\"submit\">Отправить заявку<\/button><\/div><\/form>');\n}\nfunction submitOrder(e){\n  if(e&&e.preventDefault) e.preventDefault();\n  const me={name:$('#oMe').value.trim(),phone:$('#oPhone').value.trim(),company:$('#oCo').value.trim()}; LS.set('operelleSeaMe',me);\n  const r={id:newReqId(),from:cFrom(),to:cTo(),cargo:Object.assign({name:$('#oName').value.trim()},cCargo()),\n    client:{name:me.name,company:me.company||'Частное лицо',phone:me.phone},st:'new',at:new Date().toISOString(),src:'site',sent:[],offers:[],log:[]};\n  logReq(r,'Заявка с сайта','Заказчик'); saveReq(r);\n  openCab(r.id); simulate(r.id); return false;\n}\n/* агенты ведут заявку сами: подбор пути, запрос цен, ответы экспедиторов (в пробной версии по таймеру) */\nconst TM={};\nfunction later(id,ms,fn){ clearTimeout(TM[id]); TM[id]=setTimeout(()=>{ reloadStore(); const r=req(id); if(r){ fn(r); refreshCab(); } },ms); }\nfunction simulate(id){\n  if(!getCfg().auto) return;\n  const r=req(id); if(!r) return;\n  if(r.st==='new') later(id,2600,x=>{ if(x.st!=='new') return; if(fwFor(x).length){ reqSend(x); simulate(id); } });\n  else if(r.st==='rfq') later(id,4200,x=>{ if(x.st!=='rfq') return; reqOffers(x); if(x.st==='offers') toast('Экспедиторы ответили: предложений '+x.offers.length); });\n  else if(r.st==='agreed') later(id,4200,x=>{ if(x.st!=='agreed') return; reqBook(x); toast('Место забронировано. Номер для слежения '+x.cno); simulate(id); });\n  else if(r.st==='booked') later(id,5200,x=>{ if(x.st!=='booked') return; reqDepart(x); toast('Груз отправлен','info'); });\n}\n\n/* ---------- кабинет: мои заявки ---------- */\nconst cab={open:false,id:null};\nconst DEMO_ID='SEA-27044';\nconst myReqs=()=>getReqs().filter(r=>r.src==='site');\nfunction openCab(id){\n  cab.open=true; reloadStore(); const mine=myReqs(); cab.id=id||cab.id||(mine[0]&&mine[0].id)||null;\n  if(cab.id&&!req(cab.id)) cab.id=mine[0]?mine[0].id:null;\n  renderCab();\n}\nfunction refreshCab(){ if(cab.open) renderCab(); }\nfunction cabPick(id){ cab.id=id; renderCab(); if(id) simulate(id); }\nfunction renderCab(){\n  const mine=myReqs(), r=cab.id?req(cab.id):null, demo=req(DEMO_ID);\n  const item=x=>'<button class=\"cab-item'+(r&&r.id===x.id?' on':'')+'\" type=\"button\" onclick=\"cabPick(\\''+x.id+'\\')\"><span style=\"display:flex;justify-content:space-between;gap:8px;align-items:center\"><span class=\"cab-no\">'+x.id+'<\/span><span class=\"badge '+ST[x.st][1]+'\">'+ST[x.st][0]+'<\/span><\/span><b>'+esc(ptn(x.from))+' → '+esc(ptn(x.to))+'<\/b><small>'+esc(x.cargo.name)+' · '+cargoQty(x.cargo)+'<\/small><\/button>';\n  const list=mine.length?mine.map(item).join(''):'<div class=\"empty\">Заявок пока нет.<br>Посчитайте груз и нажмите «Получить цены экспедиторов»<\/div>'+(demo?'<button class=\"btn btn-line btn-sm\" type=\"button\" onclick=\"cabPick(\\''+DEMO_ID+'\\')\">Показать пример заявки<\/button>':'');\n  openModal(dhead('Мои заявки')+'<div class=\"dlg-body\"><div class=\"cab-grid'+(r?' has':'')+'\"><div class=\"cab-list\">'+list+'<\/div><div class=\"cab-main\">'+(r?cabDetail(r):'<div class=\"empty\">Выберите заявку слева<\/div>')+'<\/div><\/div><\/div>','cab');\n  cab.open=true;\n}\nfunction cabDetail(r){\n  const o=reqOffer(r), si=stageIdx(r.st), demo=r.src!=='site';\n  let h='<button class=\"btn btn-line btn-sm cab-back\" type=\"button\" onclick=\"cabPick(null)\">← Все заявки<\/button>'+\n   '<div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center\"><h3 style=\"font:800 30px/1 var(--cd);text-transform:uppercase\">'+esc(ptn(r.from))+' → '+esc(ptn(r.to))+'<\/h3><span class=\"badge '+ST[r.st][1]+'\">'+ST[r.st][0]+'<\/span><\/div>'+\n   '<p style=\"color:var(--muted);margin-top:6px\">'+r.id+' · '+esc(r.cargo.name)+' · '+cargoQty(r.cargo)+' · вес '+wt(cargoKg(r.cargo))+(demo?' · пример':'')+'<\/p>'+stageBar(r)+'<div style=\"height:14px\"><\/div>';\n  if(si===0){\n    h+='<div class=\"wait\"><span class=\"spin\"><\/span><span>Агент «Маршрут» подобрал пути. Агент «Подбор» отправляет запрос экспедиторам<\/span><\/div>'+seaOptions(r.from,r.to,r.cargo).map(optHTML).join('');\n  } else if(si===1){\n    h+='<div class=\"wait\"><span class=\"spin\"><\/span><span>Запрос получили экспедиторы: '+r.sent.length+'. Ждём цены<\/span><\/div>'+seaOptions(r.from,r.to,r.cargo).filter(x=>x.ok).map(optHTML).join('');\n  } else if(si===2){\n    h+='<p style=\"color:var(--muted);margin-bottom:12px\">Выберите предложение. После выбора откроются контакты экспедитора, а он увидит ваши.<\/p>'+r.offers.map((x,i)=>offerHTML(r,x,i,true)).join('');\n  } else {\n    const f=fw(o.fw);\n    if(r.cno) h+='<div class=\"trk-out\" style=\"margin:0 0 14px\">'+trackHTML(r,'cb')+'<\/div>';\n    else h+='<div class=\"wait\"><span class=\"spin\"><\/span><span>Экспедитор бронирует место. Номер для слежения появится здесь<\/span><\/div>';\n    h+='<div class=\"panel\"><h3>Ваш экспедитор<\/h3><div class=\"kv\"><span>Компания<\/span><b>'+esc(f.name)+' <span class=\"stars\">★ '+dec(f.rating)+'<\/span><\/b><\/div><div class=\"kv\"><span>Контакт<\/span><b>'+esc(f.person)+'<\/b><\/div><div class=\"kv\"><span>Телефон<\/span><b>'+esc(f.phone)+'<\/b><\/div>'+\n       '<div class=\"kv\"><span>Цена перевозки<\/span><b>'+money(o.total)+'<\/b><\/div><div class=\"kv\"><span>Кому платить<\/span><b>Экспедитору напрямую<\/b><\/div><\/div>';\n    if(r.st==='arrived') h+='<div class=\"panel\" style=\"margin-top:14px\"><h3>Груз прибыл<\/h3><p style=\"color:var(--muted)\">Экспедитор сообщит, когда груз пройдёт таможню и его можно забрать.<\/p>'+(demo?'':'<button class=\"btn btn-gold btn-sm\" style=\"margin-top:12px\" type=\"button\" onclick=\"cabDone(\\''+r.id+'\\')\">Груз получен<\/button>')+'<\/div>';\n    if(r.st==='done') h+='<div class=\"panel\" style=\"margin-top:14px\"><h3>Оцените экспедитора<\/h3><div class=\"rate\">'+[1,2,3,4,5].map(n=>'<button type=\"button\" class=\"'+(r.rate&&r.rate.c>=n?'on':'')+'\" onclick=\"cabRate(\\''+r.id+'\\','+n+')\" aria-label=\"Оценка '+n+'\">★<\/button>').join('')+'<\/div><\/div>';\n  }\n  return h;\n}\nconst optHTML=o=>'<div class=\"opt'+(o.ok?'':' off')+'\"><div>'+optArt(o)+'<\/div><div><b>'+o.name+'<\/b><small>'+esc(pathText(pathOf(o)))+' · '+daysTxt(o)+'<\/small>'+(o.ok?'<small>'+optSub(o)+' · ориентир <span>'+fxText(money(o.total))+'<\/span><\/small>':'<small class=\"no\">'+esc(o.why[0])+'<\/small>')+'<\/div><\/div>';\nfunction offerHTML(r,x,i,can){\n  const f=fw(x.fw);\n  return '<div class=\"offer'+(r.pick===i?' sel':'')+'\"><div class=\"offer-top\"><div style=\"min-width:0\"><b style=\"font-size:17px\">'+(can?'Экспедитор '+(i+1):esc(f.name))+'<\/b> <span class=\"stars\">★ '+dec(f.rating)+'<\/span><small class=\"m\">'+esc(f.city)+' · сделок: '+f.deals+(f.line?' · договор с линией':'')+' · проверен площадкой<\/small><\/div>'+\n    '<div class=\"p\">'+money(x.total)+'<\/div><\/div>'+\n    '<div class=\"kv\" style=\"margin-top:8px\"><span>Путь<\/span><b>'+x.name+' · '+esc(pathText(pathOf(x)))+'<\/b><\/div><div class=\"kv\"><span>Срок<\/span><b>'+x.days[0]+'–'+x.days[1]+' дней, отправка '+fDs(new Date(x.dep))+'<\/b><\/div>'+\n    '<small class=\"m\" style=\"margin-top:6px\">'+esc(x.note)+'<\/small>'+(can?'<button class=\"btn btn-gold btn-sm\" style=\"margin-top:12px\" type=\"button\" onclick=\"cabChoose(\\''+r.id+'\\','+i+')\">Выбрать<\/button>':'')+'<\/div>';\n}\nfunction cabChoose(id,i){\n  const r=req(id); if(!r||r.st!=='offers') return;\n  if(r.src!=='site'){ toast('Это пример. Выбирать можно в своей заявке','info'); return; }\n  reqPick(r,i,'Заказчик'); toast('Контакты экспедитора открыты'); renderCab(); simulate(id);\n}\nfunction cabDone(id){ const r=req(id); if(!r) return; reqDone(r); renderCab(); }\nfunction cabRate(id,n){ const r=req(id); if(!r||r.src!=='site') return; r.rate=Object.assign({f:5},r.rate,{c:n}); logReq(r,'Заказчик поставил оценку: '+n,'Заказчик'); saveReq(r); renderCab(); toast('Спасибо. Оценка попадёт в рейтинг экспедитора'); }\n\n/* ---------- анкета экспедитора ---------- */\nfunction submitPartner(e){\n  if(e&&e.preventDefault) e.preventDefault();\n  const dirs=[...document.querySelectorAll('#pDirs button.on')].map(b=>b.dataset.c);\n  if(!dirs.length){ toast('Отметьте хотя бы одно направление','warn'); return false; }\n  const n=Object.keys(LS.get('operelleSeaFw',{})).filter(k=>k.indexOf('FW-S')===0).length+1, line=$('#pLine').checked?1:0;\n  saveFw({id:'FW-S'+n,name:$('#pName').value.trim(),city:$('#pCity').value.trim(),line,since:new Date().getFullYear(),dirs,units:['c20','c40'],types:['gen','hvy'],rating:0,deals:0,resp:0,st:'review',\n    person:$('#pPerson').value.trim(),phone:$('#pPhone').value.trim(),mail:'—',agent:'',checks:{reg:0,line:0,contract:0,ins:0,ref:0},src:'site'});\n  $('#pForm').reset(); document.querySelectorAll('#pDirs button.on').forEach(b=>b.classList.remove('on'));\n  toast('Заявка отправлена. Проверим документы и свяжемся с вами'); return false;\n}\n\n/* ---------- настройки сайта из панели ---------- */\nfunction applySite(){\n  const S=getSite(), set=(sel,t)=>{const e=$(sel); if(e) e.textContent=t;};\n  set('#brandName',S.brand||SITE_DEF.brand); set('#brandSub',S.sub||''); set('#footBrand',(S.brand||SITE_DEF.brand)+(S.sub?' · '+S.sub:''));\n  set('#footContacts',[S.phone,S.mail,S.wa&&S.wa!==S.phone?'WhatsApp '+S.wa:''].filter(Boolean).join(' · '));\n  heroTitle(); const lead=$('#heroLead'); if(lead){ lead.textContent=S.lead||LEAD_DEF; if(typeof i18nApply==='function'&&lead.nodeType) i18nApply(lead); }\n  const note=$('#siteNote'), shown=!!(S.noteOn&&S.note); if(note){ note.hidden=!shown; note.textContent=S.note||''; }\n  if(document.body&&document.body.classList) document.body.classList.toggle('has-note',shown);\n  const pn=$('#pauseNote'); if(pn) pn.hidden=!S.pause;\n  SITE_SEC.forEach(x=>{ const off=S.sec[x[0]]===0, sec=document.getElementById(x[0]); if(sec&&sec.style) sec.style.display=off?'none':'';\n    document.querySelectorAll('a[href=\"#'+x[0]+'\"]').forEach(a=>{ if(a.style) a.style.display=off?'none':''; }); });\n  const far=siteGrps().reduce((a,g)=>a.concat(g[2]),[]); if(!far.includes(C.far)) C.far=far[0]; if(!siteCities().includes(C.kz)) C.kz=siteCities()[0];\n}\n\n/* ---------- запуск ---------- */\nfunction onCurChange(){ renderTick(); renderQuote(); renderDirs(); if(cab.open) renderCab(); const o=$('#trkOut'); if(o&&!o.hidden) trackFind(); }\nconst HERO_H={ru:'Груз морем из <em>Казахстана<\/em> и обратно',kk:'<em>Қазақстаннан<\/em> теңізбен жүк және кері',en:'Sea freight from <em>Kazakhstan<\/em> and back',zh:'<em>哈萨克斯坦<\/em>往返海运'};\nfunction heroTitle(){ const t=getSite().title; if(t) $('#heroH').textContent=t; else $('#heroH').innerHTML=HERO_H[LANG]||HERO_H.ru; }\nfunction onLangChange(){ applySite(); renderTick(); renderHeroMap(); renderCalc(); renderSections(); if(cab.open) renderCab(); }\n(function init(){\n  $('#brandLogo').innerHTML=seaLogo(34);\n  document.querySelectorAll('#dirTabs button').forEach(b=>b.addEventListener('click',()=>cSet('imp',+b.dataset.imp)));\n  fxRefresh(); applySite(); renderTick(); renderHeroMap(); renderCalc(); renderSections();\n  if(typeof window!=='undefined'&&window.addEventListener){\n    window.addEventListener('storage',e=>{ if(!e.key||syncPrefs(e.key)) return;\n      if(e.key==='operelleSeaSite'||e.key==='operelleSeaCfg'){ applySite(); renderTick(); renderCalc(); renderSections(); return; }\n      if(e.key.indexOf('operelleSea')===0){ reloadStore(); refreshCab(); } });\n    let big=window.innerWidth>760; window.addEventListener('resize',()=>{ const b=window.innerWidth>760; if(b!==big){ big=b; renderDirs(); } });\n    /* ссылки на разделы страницы: прокрутка без перехода, чтобы работало и во встроенном окне */\n    document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('a[href^=\"#\"]'); if(!a) return; e.preventDefault(); const id=a.getAttribute('href').slice(1), el=id&&id!=='top'?document.getElementById(id):null;\n      if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); else window.scrollTo({top:0,behavior:'smooth'}); });\n    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('#modal-root').innerHTML) closeModal(); });\n    const a=$('#cnoIn'); if(a&&a.addEventListener) a.addEventListener('keydown',e=>{ if(e.key==='Enter') trackFind(); });\n  }\n  myReqs().forEach(r=>simulate(r.id));\n})();\n\n<\/script>\n<\/body>\n<\/html>\n",dash:"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>OPERELLE SEA — панель управления морскими перевозками<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap\">\n<style>\n/* Шрифты Fira Sans и Fira Sans Condensed выбраны потому, что в них есть все казахские буквы (проверено отрисовкой).\n   Стиль «Ночной рейс»: чёрный фон, один акцент (сигнальный оранжевый; переменная по-прежнему называется --gold).\n   Заголовки: узкий заглавный шрифт (--cd), цифры: моноширинный (--mono). Цвета статусов (зелёный, жёлтый, красный, синий) оставлены как смысловые. */\n:root{\n  --bg:#08090B;\n  --panel:#0E0F12;\n  --card:#121418;\n  --card-2:#191C21;\n  --line:#2A2E36;\n  --line-soft:#20232A;\n  --txt:#F2F3F5;\n  --txt-2:#B0B6C0;\n  --txt-3:#7B828E;\n  --gold:#FF6B1A;\n  --green:#22C55E;\n  --blue:#3B82F6;\n  --amber:#F59E0B;\n  --red:#EF4444;\n  --violet:#A855F7;\n  --cyan:#06B6D4;\n  --slate:#64748B;\n  --r:10px;\n  --r-sm:8px;\n  --shadow:0 10px 30px rgba(0,0,0,.5);\n  --mono:'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,monospace;\n  --cd:'Fira Sans Condensed','Arial Narrow','Roboto Condensed',sans-serif;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  background:var(--bg);\n  color:var(--txt);\n  font-family:'Fira Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;\n  font-size:14px;line-height:1.5;\n  -webkit-font-smoothing:antialiased;\n}\nbutton,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}\nbutton{cursor:pointer;border:none;background:none}\na{color:inherit;text-decoration:none}\n::-webkit-scrollbar{width:10px;height:10px}\n::-webkit-scrollbar-track{background:transparent}\n::-webkit-scrollbar-thumb{background:#2A2E36;border-radius:8px;border:2px solid var(--bg)}\n::-webkit-scrollbar-thumb:hover{background:#3A3F49}\n\n/* ---------- layout ---------- */\n.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}\n.sidebar{\n  background:var(--panel);border-right:1px solid var(--line-soft);\n  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;\n}\n.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--line-soft)}\n.brand-mark{\n  width:36px;height:36px;border-radius:10px;flex:0 0 36px;\n  background:linear-gradient(145deg,#FF6B1A,#B8470A);\n  display:grid;place-items:center;color:#180900;font-weight:800;font-size:15px;letter-spacing:-.5px;\n}\n.brand-logo-box{flex:0 0 auto;display:grid;place-items:center;line-height:0}\n.brand-name{font-weight:800;letter-spacing:.6px;font-size:13.5px;white-space:nowrap}\n.brand-sub{font-size:10px;color:var(--txt-3);letter-spacing:2.6px;text-transform:lowercase;margin-top:1px}\n.nav{padding:10px 10px 20px;overflow-y:auto;flex:1}\n.nav-group{margin:16px 8px 6px;font:500 10px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-3)}\n.nav-item{\n  display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:9px;min-height:38px;\n  color:var(--txt-2);font-size:13.5px;text-align:left;transition:.15s;position:relative;\n}\n.nav-item:hover{background:#17191D;color:var(--txt)}\n.nav-item.active{background:rgba(255,107,26,.13);color:#FFB184;font-weight:700}\n.nav-item.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}\n.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}\n.nav-badge{margin-left:auto;background:#2C3038;color:#C9CED6;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:600}\n.nav-badge.alert{background:rgba(239,68,68,.18);color:#FCA5A5}\n.sidebar-foot{padding:12px;border-top:1px solid var(--line-soft)}\n.ai-status{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px}\n.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15)}\n\n.main{min-width:0;display:flex;flex-direction:column}\n.topbar{\n  position:sticky;top:0;z-index:40;background:rgba(8,9,11,.9);backdrop-filter:blur(10px);\n  border-bottom:1px solid var(--line-soft);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:nowrap;\n}\n.page-title{font:800 26px/1.05 var(--cd);text-transform:uppercase;letter-spacing:.01em}\n.page-sub{font-size:12px;color:var(--txt-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.title-block{flex:1 1 auto;min-width:0}\n.page-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.search{\n  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);\n  border-radius:9px;padding:7px 12px;flex:0 1 230px;min-width:150px;color:var(--txt-3)\n}\n.search input{background:none;border:none;outline:none;width:100%;color:var(--txt);font-size:13px}\n.date-chip{display:flex;flex-direction:column;line-height:1.25;padding:4px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}\n.date-chip b{font-size:13px}\n.date-chip span{font-size:11px;color:var(--txt-3)}\n.role-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}\n.role-switch button{padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--txt-2);white-space:nowrap}\n.role-switch button.on{background:var(--gold);color:#180900;font-weight:700}\n.icon-btn{width:36px;height:36px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--txt-2)}\n.icon-btn:hover{color:var(--txt);border-color:#3A3F49}\n.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}\n.user-chip{display:flex;align-items:center;gap:9px;white-space:nowrap}\n.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#3A3F49,#20232A);display:grid;place-items:center;font-weight:700;font-size:12px;color:#D5D9E0;border:1px solid var(--line);flex:0 0 34px}\n.view{padding:20px 22px 40px;flex:1}\n\n/* ---------- primitives ---------- */\n.grid{display:grid;gap:14px}\n.grid>*,.stack>*{min-width:0}\n.g-kpi{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}\n.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}\n.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}\n.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}\n.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}\n.g-main{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}\n.g-side{grid-template-columns:270px minmax(0,1fr)}\n.c2{grid-template-columns:1fr 1fr;gap:10px}\n.c3{grid-template-columns:1fr 1fr 1fr;gap:10px}\n.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;min-width:0}\n.card.compact{padding:13px}\n.compact .card-head{margin-bottom:9px}\n.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}\n.card-title{font:800 18px/1.05 var(--cd);text-transform:uppercase;letter-spacing:.02em}\n.modal-head .card-title{font-size:23px}\n.card-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.muted{color:var(--txt-3)}\n.small{font-size:12px}\n.label{font:500 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-3)}\n.kpi-val{font:600 24px/1.1 var(--mono);letter-spacing:-.05em;margin:6px 0 2px}\n.delta{font-size:11.5px;font-weight:600}\n.delta.up{color:var(--green)} .delta.down{color:var(--red)}\n.btn{\n  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;\n  background:var(--card-2);border:1px solid var(--line);color:var(--txt);transition:.15s;white-space:nowrap\n}\n.btn:hover{border-color:#4A505B;background:#20242B}\n.btn-p{background:var(--gold);border-color:var(--gold);color:#180900}\n.btn-p:hover{background:#FF8440;border-color:#FF8440}\n/* главное действие в окне или разделе: оранжевая кнопка */\n.btn-g{background:var(--gold);border-color:var(--gold);color:#180900}\n.btn-g:hover{background:#FF8440;border-color:#FF8440}\n.btn-gold{background:var(--gold);border-color:var(--gold);color:#180900}\n.btn-gold:hover{background:#FF8440}\n.btn-r{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.4);color:#FCA5A5}\n.btn-r:hover{background:rgba(239,68,68,.28);border-color:var(--red)}\n.btn-ghost{background:transparent}\n.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}\n.b-green{background:rgba(34,197,94,.15);color:#6EE7A0}\n.b-blue{background:rgba(59,130,246,.16);color:#93B8FB}\n.b-amber{background:rgba(245,158,11,.15);color:#FBD38D}\n.b-red{background:rgba(239,68,68,.15);color:#FCA5A5}\n.b-violet{background:rgba(168,85,247,.16);color:#D8B4FE}\n.b-slate{background:rgba(100,116,139,.2);color:#B4C2D6}\n.b-cyan{background:rgba(6,182,212,.16);color:#7DD8E8}\n.b-gold{background:rgba(255,107,26,.16);color:#FFB184}\ntable{width:100%;border-collapse:collapse}\nth{\n  text-align:left;font:500 10px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--txt-3);\n  padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap\n}\ntd{padding:10px 9px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}\ntbody tr:hover td{background:rgba(255,255,255,.02)}\ntbody tr:last-child td{border-bottom:none}\ntr.click{cursor:pointer}\n.tbl-wrap{overflow-x:auto;margin:0 -16px -16px;padding:0 16px 4px}\n.row{display:flex;align-items:center;gap:10px}\n.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}\n.stack{display:flex;flex-direction:column;gap:10px}\n.list-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}\n.list-row:last-child{border-bottom:none}\n.dot-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px;font-size:13px}\n.progress{height:6px;border-radius:6px;background:#20232A;overflow:hidden}\n.progress i{display:block;height:100%;border-radius:6px;background:var(--green)}\n.tabs{max-width:100%;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line-soft);padding:4px;border-radius:10px;overflow-x:auto}\n.tabs button{padding:7px 13px;border-radius:7px;font-size:12.5px;color:var(--txt-2);white-space:nowrap}\n.tabs button.on{background:var(--card-2);color:#fff;font-weight:600}\n.field{display:flex;flex-direction:column;gap:5px;min-width:0}\n.field label{font-size:11px;color:var(--txt-3);font-weight:600;letter-spacing:.4px}\n.field input,.field select,.field textarea{\n  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;font-size:13px;width:100%\n}\n.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}\n.field input[readonly]{color:var(--txt-2)}\n.field input[type=range]{padding:0;border:none;background:none;accent-color:var(--gold)}\n.seg{display:flex;gap:6px;flex-wrap:wrap}\n.seg button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--txt-2)}\n.seg button.on{border-color:var(--gold);background:rgba(255,107,26,.14);color:#FFB184;font-weight:600}\n.chk{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;font-size:13px;text-align:left;width:100%}\n.chk.on{border-color:var(--green);background:rgba(34,197,94,.08)}\n.chk .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 17px;font-size:11px;color:#04240F}\n.chk.on .box{background:var(--green);border-color:var(--green)}\n.empty{padding:34px;text-align:center;color:var(--txt-3);font-size:13px}\n.divider{height:1px;background:var(--line-soft);margin:14px 0}\n.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt-2)}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}\n\n/* ---------- modal ---------- */\n.overlay{position:fixed;inset:0;background:rgba(4,8,15,.72);backdrop-filter:blur(3px);z-index:100;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:20px;animation:fade .18s ease}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n.modal{\n  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);\n  width:min(920px,100%);max-width:100%;min-width:0;max-height:90vh;display:flex;flex-direction:column;animation:pop .2s ease\n}\n.modal.wide{width:min(1120px,100%)}\n.modal.narrow{width:min(600px,100%)}\n@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}\n.modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}\n.modal-body{padding:18px;overflow-y:auto;min-width:0}\n.modal-foot{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}\n.stepper{display:flex;gap:6px;padding:14px 18px 0}\n.step{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}\n.step i{height:3px;border-radius:3px;background:#2A2E36;display:block}\n.step.done i{background:var(--green)} .step.on i{background:var(--gold)}\n.step span{font-size:10.5px;color:var(--txt-3);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.step.on span{color:#FFB184;font-weight:600}\n.step.done span{color:#7EE8AC}\n\n/* ---------- toast ---------- */\n#toast-root{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:360px}\n.toast{\n  background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;\n  padding:12px 14px;box-shadow:var(--shadow);animation:slide .22s ease;font-size:13px\n}\n.toast.info{border-left-color:var(--blue)} .toast.warn{border-left-color:var(--amber)} .toast.err{border-left-color:var(--red)}\n@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}\n\n/* ---------- log / document ---------- */\n.log{font-family:var(--mono);font-size:11.5px;background:#060708;border:1px solid var(--line-soft);border-radius:9px;padding:11px;max-height:210px;overflow-y:auto;line-height:1.7}\n.log .t{color:var(--txt-3)}\n.log .ok{color:#6EE7A0} .log .warn{color:#FBD38D} .log .inf{color:#93B8FB} .log .err{color:#FCA5A5}\n.doc{background:#F7F7F4;color:#1a1a1a;border-radius:8px;padding:26px 28px;font-family:'Times New Roman',Georgia,serif;font-size:13px;line-height:1.6}\n.doc h3{margin:0 0 4px;font-size:16px;text-align:center;letter-spacing:.5px}\n.doc .doc-sub{text-align:center;color:#555;font-size:12px;margin-bottom:16px}\n.doc table{border-collapse:collapse;margin:10px 0;width:100%}\n.doc td,.doc th{border:1px solid #bbb;padding:5px 8px;font-size:12px;color:#1a1a1a;white-space:normal;text-transform:none;letter-spacing:0;font-weight:400;vertical-align:top}\n.doc th{background:#eceae4;font-weight:700;width:34%}\n.doc .sign{display:flex;justify-content:space-between;gap:16px;margin-top:26px;font-size:12px;flex-wrap:wrap}\n.doc .stamp{margin-top:16px;font-size:11px;color:#777;border-top:1px dashed #bbb;padding-top:8px}\n\n/* ---------- misc ---------- */\n.tile{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:12px;min-width:0}\n.tile.click{cursor:pointer;transition:.15s;text-align:left;width:100%}\n.tile.click:hover{border-color:#4A505B;transform:translateY(-1px)}\n.tile.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}\n.hbar{height:8px;border-radius:8px;background:#20232A;overflow:hidden;display:flex}\n.hbar i{display:block;height:100%}\n.mini{font-size:11.5px;color:var(--txt-3)}\n.alert-row{display:flex;gap:11px;padding:11px;border-radius:10px;background:var(--card-2);border:1px solid var(--line-soft);align-items:flex-start}\n.alert-row.crit{border-left:3px solid var(--red)}\n.alert-row.warn{border-left:3px solid var(--amber)}\n. ass=\"page-title\" id=\"page-title\">Командный центр<\/div>\n        <div class=\"page-sub\" id=\"page-sub\">Обзор морских перевозок<\/div>\n      <\/div>\n      <div class=\"search\">\n        <svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"currentColor\"><path d=\"M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z\"/><\/svg>\n        <input id=\"global-search\" placeholder=\"Заявка, контейнер, заказчик…\" autocomplete=\"off\">\n      <\/div>\n      <div class=\"date-chip\">\n        <b id=\"date-main\">—<\/b><span id=\"date-sub\">—<\/span>\n      <\/div>\n      <div class=\"fx-slot\" data-part=\"cur\" id=\"fx-cur\"><\/div>\n      <div class=\"fx-slot\" data-part=\"lang\" id=\"fx-lang\"><\/div>\n      <button class=\"icon-btn\" id=\"bell\" onclick=\"openAlerts()\" aria-label=\"Уведомления\">\n        <svg viewBox=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"currentColor\"><path d=\"M12 2a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3V8a6 6 0 0 0-6-6zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z\"/><\/svg>\n        <span class=\"dot\"><\/span>\n      <\/button>\n      <div class=\"user-chip\">\n        <div class=\"avatar\" id=\"user-initials\">АС<\/div>\n        <div style=\"line-height:1.25\">\n          <div style=\"font-size:13px;font-weight:600\" id=\"user-name\">Айдана Серикова<\/div>\n          <div style=\"font-size:11px;color:var(--txt-3)\" id=\"user-role\">Оператор<\/div>\n        <\/div>\n      <\/div>\n    <\/header>\n    <div class=\"view\" id=\"view\"><\/div>\n  <\/div>\n<\/div>\n<nav class=\"tabbar\" id=\"tabbar\" aria-label=\"Быстрые разделы\"><\/nav>\n<div id=\"modal-root\"><\/div>\n<div id=\"toast-root\"><\/div>\n<script>\n\n/* ============================================================\n   ВАЛЮТЫ (общий блок трёх программ)\n   Это не обмен валют. Все суммы считаются и хранятся в тенге, а показываются в валюте,\n   которую человек выбрал вверху страницы: крупно в валюте, ниже мелко в тенге.\n   Выбор хранится в браузере и действует сразу в головной панели, панели компании и на сайте.\n   Курсы демо: ориентир к тенге; в боевой версии загружаются раз в день с сайта Нацбанка РК,\n   головная панель OPERELLE может поправить их вручную (ключ operelleFx).\n   ============================================================ */\nconst fxLS=(k,d)=>{let v=null;try{v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return typeof d==='string'&&typeof v==='string'&&v?v:d}};\nconst fxSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};\n/* код, знак, знак перед числом, название, страны, курс к тенге за 1 единицу */\nconst FX_LIST=[\n ['KZT','₸',0,'Казахстанский тенге','Казахстан',1],\n ['USD','$',1,'Доллар США','США, международные расчёты',520],\n ['EUR','€',1,'Евро','Евросоюз',600],\n ['RUB','₽',0,'Российский рубль','Россия',6.4],\n ['CNY','¥',0,'Китайский юань','Китай',73],\n ['UZS','сўм',0,'Узбекский сум','Узбекистан',0.041],\n ['KGS','сом',0,'Кыргызский сом','Кыргызстан',5.95],\n ['TJS','смн',0,'Таджикский сомони','Таджикистан',48],\n ['TMT','TMT',0,'Туркменский манат','Туркменистан',148],\n ['AZN','₼',0,'Азербайджанский манат','Азербайджан',306],\n ['GEL','₾',0,'Грузинский лари','Грузия',190],\n ['AMD','֏',0,'Армянский драм','Армения',1.34],\n ['BYN','Br',0,'Белорусский рубль','Беларусь',160],\n ['TRY','₺',0,'Турецкая лира','Турция',12.5],\n ['MNT','₮',0,'Монгольский тугрик','Монголия',0.15],\n ['AED','AED',0,'Дирхам ОАЭ','ОАЭ',141.6],\n ['GBP','£',1,'Фунт стерлингов','Великобритания',690],\n ['PLN','zł',0,'Польский злотый','Польша, транзит в ЕС',140],\n ['KRW','₩',0,'Южнокорейская вона','Южная Корея',0.37],\n ['INR','₹',0,'Индийская рупия','Индия',6]\n];\nconst FX=code=>FX_LIST.find(x=>x[0]===code)||FX_LIST[0];\n/* знак валюты: кириллические знаки (сўм, сом, смн) на английском и китайском заменяются кодом */\nconst fxSym=c=>(typeof LANG!=='undefined'&&(LANG==='en'||LANG==='zh')&&/[а-яёў]/i.test(c[1]))?c[0]:c[1];\nconst fxRates=()=>{const o={};FX_LIST.forEach(x=>o[x[0]]=x[5]);return Object.assign(o,fxLS('operelleFx',{}))};\nlet CUR=fxLS('operelleCur','KZT'); if(!FX_LIST.some(x=>x[0]===CUR)) CUR='KZT';\nconst kzt=n=>Math.round(n).toLocaleString('ru-RU')+' ₸';\nconst FX_WORD={ru:['тыс','млн'],kk:['мың','млн'],en:['K','M'],zh:['千','百万']};\nconst fxWord=i=>(FX_WORD[typeof LANG!=='undefined'?LANG:'ru']||FX_WORD.ru)[i];\n/* число в валюте: крупные суммы без копеек, мелкие с двумя знаками, совсем мелкие с тремя */\nconst fxLoc=()=>(typeof LANG!=='undefined'&&(LANG==='en'||LANG==='zh'))?'en-US':'ru-RU';\nconst fxDec=s=>fxLoc()==='en-US'?s:s.replace('.',',');\nfunction fxNum(v){\n  const a=Math.abs(v), d=a>=100?0:a>=1?2:3;\n  return v.toLocaleString(fxLoc(),{minimumFractionDigits:0,maximumFractionDigits:d});\n}\n/* единица после суммы на языке страницы: /км, /т, /ч */\nconst FX_UNIT={kk:{'км':'км','т':'т','м³':'м³','ч':'сағ','час':'сағ','сут':'тәул','мес':'ай','рейс':'рейс','место':'орын'},\n  en:{'км':'km','т':'t','м³':'m³','ч':'h','час':'h','сут':'day','мес':'mo','рейс':'trip','место':'slot'},\n  zh:{'км':'公里','т':'吨','м³':'立方米','ч':'小时','час':'小时','сут':'天','мес':'月','рейс':'趟','место':'个'}};\nconst fxUnit=u=>{if(!u)return '';const m=FX_UNIT[typeof LANG!=='undefined'?LANG:'ru'];const k=u.slice(1);return '/'+(m&&m[k]||k)};\nfunction fxPlain(n,code){\n  const c=FX(code||CUR), v=n/(fxRates()[c[0]]||1);\n  const y=fxSym(c); return c[2]?y+fxNum(v):fxNum(v)+' '+y;\n}\n/* сумма для страницы: в тенге как раньше; в другой валюте крупно валюта, мелко тенге */\nfunction fxMoney(n,u){\n  u=fxUnit(u);\n  if(CUR==='KZT') return kzt(n)+u;\n  return '<span class=\"fx\"><b>'+fxPlain(n)+u+'<\/b><small>'+kzt(n)+u+'<\/small><\/span>';\n}\nfunction fxMln(n){\n  const tenge=(CUR==='KZT'?(n/1e6).toFixed(n>=1e7?1:2).replace('.',','):fxDec((n/1e6).toFixed(n>=1e7?1:2)))+' '+fxWord(1)+' ₸';\n  if(CUR==='KZT') return tenge;\n  const c=FX(CUR), v=n/(fxRates()[c[0]]||1), a=Math.abs(v);\n  const s=a>=1e6?fxDec((v/1e6).toFixed(a>=1e7?1:2))+' '+fxWord(1):a>=1e4?fxDec((v/1e3).toFixed(1))+' '+fxWord(0):fxNum(v);\n  const y=fxSym(c); return '<span class=\"fx\"><b>'+(c[2]?y+s:s+' '+y)+'<\/b><small>'+tenge+'<\/small><\/span>';\n}\n/* суммы внутри готового текста: «от 3 000 ₸», «29 000 ₸ в месяц», «от 170 ₸/км» (единица остаётся при обеих суммах) */\nfunction fxStr(s){\n  if(CUR==='KZT'||!s) return s;\n  return String(s).replace(/(\\d+(?:[   ]\\d{3})*(?:,\\d+)?)[  ]?(млн[  ])?₸(\\/(?:км|т|м³|ч|час|сут|мес|рейс|место))?/g,(m,a,ml,u)=>{\n    const n=parseFloat(a.replace(/[   ]/g,'').replace(',','.'))*(ml?1e6:1);\n    return isFinite(n)?fxMoney(n,u):m});\n}\n/* та же сумма одной строкой, где разметка не допускается: всплывающие подсказки, поля, обычный текст */\nconst fxText=s=>String(s).replace(/<span class=\"fx\"><b>([^<]*)<\\/b><small>([^<]*)<\\/small><\\/span>/g,'$1 ($2)').replace(/<[^>]+>/g,'');\nfunction setCur(code){\n  if(!FX_LIST.some(x=>x[0]===code)) return;\n  CUR=code; fxSet('operelleCur',code);\n  if(typeof onCurChange==='function') onCurChange();\n  fxRefresh();\n}\n/* переключатели валюты и языка для верхней панели: кнопка с кодом и раскрывающийся список; part: 'cur', 'lang' или оба */\nfunction fxSelHTML(langs,part){\n  const L=langs||['ru','kk','en','zh'], lg=typeof LANG!=='undefined'?LANG:'ru';\n  const cur='<div class=\"fxs fxs-cur\"><button type=\"button\" class=\"fxs-btn\" onclick=\"fxToggle(this)\" aria-haspopup=\"listbox\" aria-label=\"Валюта\" title=\"Суммы показываются в этой валюте, ниже мелко в тенге\"><span class=\"fxs-ic\">'+FX(CUR)[1]+'<\/span>'+CUR+'<\/button>'+\n    '<div class=\"fxs-menu\" role=\"listbox\">'+FX_LIST.map(x=>'<button type=\"button\" role=\"option\" class=\"'+(x[0]===CUR?'on':'')+'\" onclick=\"setCur(\\''+x[0]+'\\')\"><b>'+x[0]+'<\/b><span>'+x[3]+'<\/span><i>'+x[1]+'<\/i><\/button>').join('')+'<\/div><\/div>';\n  const lang='<div class=\"fxs fxs-lang\"><button type=\"button\" class=\"fxs-btn\" onclick=\"fxToggle(this)\" aria-haspopup=\"listbox\" aria-label=\"Язык\">'+LANG_NAMES[L.includes(lg)?lg:L[0]][0]+'<\/button>'+\n    '<div class=\"fxs-menu\" role=\"listbox\">'+L.map(k=>'<button type=\"button\" role=\"option\" class=\"'+(k===lg?'on':'')+'\" onclick=\"setLang(\\''+k+'\\')\"><b>'+LANG_NAMES[k][0]+'<\/b><span>'+LANG_NAMES[k][1]+'<\/span><\/button>').join('')+'<\/div><\/div>';\n  return '<div class=\"fxsel\" data-noi18n>'+(part!=='lang'?cur:'')+(part!=='cur'?lang:'')+'<\/div>';\n}\n/* места для переключателей: <div class=\"fx-slot\" data-part=\"cur\" data-langs=\"ru,kk,en\"><\/div> */\nfunction fxRefresh(){if(typeof document==='undefined'||!document.querySelectorAll)return;document.querySelectorAll('.fx-slot').forEach(el=>{el.innerHTML=fxSelHTML(el.dataset.langs?el.dataset.langs.split(','):null,el.dataset.part)})}\nfunction fxToggle(b){const w=b.parentNode,o=w.classList.contains('open');document.querySelectorAll('.fxs.open').forEach(x=>x.classList.remove('open'));if(!o)w.classList.add('open')}\nif(typeof document!=='undefined'&&document.addEventListener) document.addEventListener('click',e=>{if(!(e.target.closest&&e.target.closest('.fxs')))document.querySelectorAll('.fxs.open').forEach(x=>x.classList.remove('open'))});\nconst LANG_NAMES={ru:['RU','Русский'],kk:['KZ','Қазақша'],en:['EN','English'],zh:['ZH','中文']};\nconst FX_CSS='.fx{display:inline-flex;flex-direction:column;line-height:1.1;vertical-align:middle;max-width:100%}.fx b{font-weight:inherit;white-space:nowrap}'+\n  '.fx small{display:block;font-size:.64em;font-weight:500;opacity:.62;letter-spacing:0;white-space:nowrap;font-family:inherit}'+\n  '.tick .fx,p .fx,li .fx,.mini .fx,.toast .fx,.hint .fx,.why .fx,.lead2 .fx,.note-row .fx,.notice .fx,.sub .fx,.ins-sum .fx,.src-tag .fx,.log .fx{display:inline;line-height:inherit}'+\n  '.tick .fx small,p .fx small,li .fx small,.mini .fx small,.toast .fx small,.hint .fx small,.why .fx small,.lead2 .fx small,.note-row .fx small,.notice .fx small,.sub .fx small,.ins-sum .fx small,.src-tag .fx small,.log .fx small{display:inline;fon rid;place-items:center;color:var(--gold);padding:8px 0\">'+unArt('c40',44)+'<\/div>'};\nconst seaOf=o=>o.legs.find(l=>l.m==='sea'||l.m==='ferry');\n\n/* ---------- отходы судов на ближайшие дни (демо) ---------- */\nconst DAYS={1:[2],2:[2,6],3:[1,3,5],4:[1,3,5,0],5:[1,2,3,4,5],7:[0,1,2,3,4,5,6]};\nfunction board(){\n  const out=[];\n  Object.keys(SEA).forEach(k=>{ const ab=k.split('-'), S=SEA[k], pw=S[3]>=7?7:S[3];\n    for(let d=-3;d<6;d++){ const day=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+d);\n      if(!(DAYS[pw]||DAYS[3]).includes(day.getDay())) continue;\n      [[ab[0],ab[1]],[ab[1],ab[0]]].forEach((p,di)=>{\n        const h=hash(k+d+di), t=new Date(day.getTime()+(2+Math.floor(h*20))*36e5), arr=new Date(t.getTime()+S[1]*864e5), dt=(t-NOW)/36e5;\n        if(dt<-Math.min(S[1]*24,60)-6||dt>110) return;\n        const ship=S[4], who=k==='KRK-BAK'&&h>.7?'MSCM':S[2], delay=(ship==='feeder'||ship==='ferry')&&h>.84;\n        out.push({no:(LN[who]?who.slice(0,3):'OCN')+' '+(100+Math.floor(hash(k+di)*800)+((d+9)%7)),who,from:p[0],to:p[1],dep:t,arr,ship,\n          name:who==='KMTF'&&ship==='feeder'?'«'+KMTF_SHIPS[Math.floor(h*3)%3]+'»':SHIP[ship][0],\n          free:ship==='ferry'?4+Math.floor(hash(k+d+'f')*36):ship==='ocean'?200+Math.floor(hash(k+d+'f')*18)*100:20+Math.floor(hash(k+d+'f')*16)*10,\n          delay,st:NOW>arr?'Прибыл':NOW>t?'В море':delay?'Задержка: погода':'По расписанию'});\n      });\n    }});\n  return out.sort((a,b)=>a.dep-b.dep);\n}\nconst shipBadge=f=>'<span class=\"badge '+(f.ship==='ferry'?'b-blue':f.ship==='ocean'?'b-slate':'b-gold')+'\">'+SHIP[f.ship][0]+'<\/span>';\nconst slStatus=f=>'<span class=\"badge '+(f.st==='Прибыл'?'b-green':f.st==='В море'?'b-amber':f.delay?'b-red':'b-slate')+'\">'+f.st+'<\/span>';\nconst freeTxt=f=>f.ship==='ferry'?'мест для фур: '+f.free:f.ship==='dry'?'по заявке':f.free+' TEU';\nconst seaZone=f=>['SCO','KRK'].includes(f.from)||['SCO','KRK'].includes(f.to)?'cas':f.ship==='ocean'?'oc':'bs';\n\n/* ---------- что требует внимания ---------- */\nfunction attention(){\n  const a=[], now=NOW.getTime();\n  R().filter(r=>r.st==='new').forEach(r=>a.push({sev:'warn',t:'Новая заявка '+r.id,d:ptn(r.from)+' → '+ptn(r.to)+' · '+cargoQty(r.cargo),act:\"openReq('\"+r.id+\"')\",b:'Открыть'}));\n  R().filter(r=>r.st==='rfq'&&now-new Date(r.at).getTime()>2*36e5).forEach(r=>a.push({sev:'crit',t:'Нет цен дольше двух часов',d:r.id+' · запрос у экспедиторов: '+r.sent.length,act:\"openReq('\"+r.id+\"')\",b:'Открыть'}));\n  R().filter(r=>r.st==='arrived').forEach(r=>a.push({sev:'info',t:'Груз прибыл, ждёт выдачи',d:r.id+' · '+ptn(r.to)+' · '+r.cno,act:\"openReq('\"+r.id+\"','track')\",b:'Открыть'}));\n  getFw().filter(f=>f.st==='review').forEach(f=>a.push({sev:'warn',t:'Экспедитор ждёт проверки',d:f.name+' · '+f.city,act:\"openFw('\"+f.id+\"')\",b:'Проверить'}));\n  return a;\n}\nfunction openAlerts(){\n  const a=attention();\n  openModal(mhead('Требует внимания',a.length?'Записей: '+a.length:'')+'<div class=\"modal-body\"><div class=\"stack\">'+(a.length?a.map(x=>'<div class=\"alert-row '+x.sev+'\"><div style=\"flex:1;min-width:0\"><b>'+esc(x.t)+'<\/b><div class=\"mini\">'+esc(x.d)+'<\/div><\/div><button class=\"btn btn-sm\" onclick=\"'+x.act+'\">'+x.b+'<\/button><\/div>').join(''):'<div class=\"empty\">Всё спокойно<\/div>')+'<\/div><\/div>','narrow');\n}\n\n/* ============================================================\n   РАЗДЕЛЫ\n   ============================================================ */\nconst VIEWS={};\nconst wayList=()=>R().filter(r=>r.st==='transit'||r.st==='booked'||r.st==='arrived');\n/* морские линии на карте: все участки из справочника, тонко */\nfunction laneRoutes(fly){\n  return Object.keys(SEA).map(k=>{const ab=k.split('-'),S=SEA[k];return {pts:S[0],m:S[4]==='ferry'?'ferry':'sea',a:ab[0],b:ab[1],fly:fly&&S[4]!=='ocean',dur:18+hash(k)*30,delay:hash(k+'d')*20}});\n}\nfunction mapData(sel){\n  const routes=laneRoutes(0), ships=[];\n  R().filter(r=>r.st==='transit').forEach(r=>{const t=genTrack(r),o=reqOffer(r); if(!t.leg||!o) return;\n    optRoutes(o).forEach(x=>routes.push(x));\n    ships.push({pts:t.leg.pts,t:t.leg.t,m:t.leg.m,ground:t.leg.ground,label:r.id.slice(4),id:\"openReq('\"+r.id+\"','track')\",sel:sel===r.id})});\n  return {routes,ships};\n}\nVIEWS.center=function(){\n  const m=mapData(), w=wide(), fee=R().reduce((s,r)=>s+(stageIdx(r.st)>=3?reqFee(r):0),0), at=attention();\n  const kp=[['Новые заявки',cnt('new')],['Ждут цены',cnt('rfq')],['Выбирают',cnt('offers')],['В пути',cnt('transit')],['Ждут выдачи',cnt('arrived')]];\n  const sl=board().filter(f=>f.dep>NOW&&(isKZ(f.from)||f.from==='BAK'||f.from==='SHA'||f.from==='POT')).slice(0,7);\n  return '<div class=\"gl cr-strip\">'+kp.map(k=>'<div class=\"cr-kp\">'+k[0]+' <b>'+k[1]+'<\/b><\/div>').join('')+'<div class=\"cr-kp\">Комиссия <b>'+mln(fee)+'<\/b><\/div>'+\n    '<div class=\"cr-acts\"><button class=\"btn btn-g\" onclick=\"openNew()\">Новая заявка<\/button><button class=\"btn\" onclick=\"go(\\'sail\\')\">Расписание судов<\/button><\/div><\/div>'+\n   '<div class=\"cr\"><div class=\"map-wrap\">'+seaMap(Object.assign({id:'c',box:w?[EUR[0]-420,30,EUR[2]+420,MH-60]:EUR,labels:['BAK','POT','CND','IST','DUI','RTM','SHA','SIN','PUS','NSA','DXB','BND','NVS','GOA','VVO']},m))+'<\/div>'+\n    '<div class=\"gl cr-left\"><div class=\"card-head\"><div class=\"card-title\">Грузы в пути<\/div><div class=\"card-actions\"><span class=\"badge b-gold\">'+wayList().length+'<\/span><\/div><\/div><div class=\"trip-list\">'+\n     (wayList().map(r=>{const o=reqOffer(r),t=genTrack(r),s=seaOf(o);return '<button class=\"cr-trip\" onclick=\"openReq(\\''+r.id+'\\',\\'track\\')\"><span class=\"row-between\"><span class=\"cr-no\">'+r.id+' · '+r.cno+'<\/span>'+badge(r.st)+'<\/span>'+\n       '<b>'+esc(ptn(r.from))+'<u>→<\/u>'+esc(ptn(r.to))+'<\/b><span class=\"mini\">'+esc(o.name)+' · '+cargoQty(r.cargo)+(t.eta?' · прибытие '+fDs(t.eta):'')+'<\/span><\/button>'}).join('')||'<div class=\"empty\">Нет грузов в пути<\/div>')+'<\/div><\/div>'+\n    '<div class=\"gl cr-legend legend\"><span><i style=\"background:#fff\"><\/i>судно в море<\/span><span><i style=\"background:#C9CED6\"><\/i>поезд<\/span><span><i style=\"background:var(--amber)\"><\/i>ждёт в порту<\/span><span><i style=\"background:var(--gold)\"><\/i>порты<\/span><\/div><\/div>'+\n   '<div class=\"section-label\">Требует внимания<\/div><div class=\"priority-grid\">'+(at.slice(0,4).map(x=>'<div class=\"priority-card '+x.sev+'\"><div class=\"priority-title\">'+esc(x.t)+'<\/div><div class=\"priority-desc\">'+esc(x.d)+'<\/div><button class=\"btn btn-sm\" onclick=\"'+x.act+'\">'+x.b+'<\/button><\/div>').join('')||'<div class=\"priority-card ok\"><div class=\"priority-title\">Всё спокойно<\/div><div class=\"priority-desc\">Нет заявок без движения<\/div><\/div>')+'<\/div>'+\n   '<div class=\"grid g-main\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Ближайшие отходы судов<\/div><div class=\"card-actions\"><button class=\"btn btn-sm\" onclick=\"go(\\'sail\\')\">Всё расписание<\/button><\/div><\/div><div class=\"tbl-wrap\"><table><thead><tr><th>Отход<\/th><th>Рейс<\/th><th>Маршрут<\/th><th>Судно<\/th><th>Свободно<\/th><\/tr><\/thead><tbody>'+\n     sl.map(f=>'<tr><td class=\"nowrap\">'+fDT(f.dep)+'<\/td><td class=\"nowrap\"><b data-noi18n>'+f.no+'<\/b><div class=\"mini\" data-noi18n>'+esc(whoName(f.who))+'<\/div><\/td><td><span class=\"route\">'+esc(ptn(f.from))+'<i>→<\/i>'+esc(ptn(f.to))+'<\/span><\/td><td>'+f.name+'<div>'+shipBadge(f)+'<\/div><\/td><td class=\"nowrap\">'+freeTxt(f)+'<\/td><\/tr>').join('')+\n    '<\/tbody><\/table><\/div><\/div>'+\n    '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Агенты сегодня<\/div><div class=\"card-actions\"><button class=\"btn btn-sm\" onclick=\"go(\\'agents\\')\">Настроить<\/button><\/div><\/div><div class=\"log\">'+agentLog().slice(0,9).map(l=>'<div><span class=\"t\">'+l.t+'<\/span> <span class=\"'+l.c+'\">'+esc(l.who)+'<\/span> '+esc(l.text)+'<\/div>').join('')+'<\/div><\/div><\/div>';\n};\nfunction agentLog(){\n  const out=[]; R().forEach(r=>(r.log||[]).forEach(l=>out.push({at:new Date(l.at),t:fT(new Date(l.at)),who:l.who,text:r.id+': '+l.text,c:'inf'})));\n  R().slice(0,10).forEach((r,i)=>{const d=hoursAdd(-(i*.7+.2));\n    out.push({at:d,t:fT(d),who:'Агент «Разбор заявки»',text:r.id+': '+cargoQty(r.cargo)+', вес '+wt(cargoKg(r.cargo)),c:'ok'});\n    if(stageIdx(r.st)>=1) out.push({at:new Date(d.getTime()-6e5),t:fT(new Date(d.getTime()-6e5)),who:'Агент «Маршрут»',text:r.id+': найдено путей: '+seaOptions(r.from,r.to,r.cargo).filter(o=>o.ok).length,c:'inf'});\n    if(r.st==='transit') out.push({at:new Date(d.getTime()-3e5),t:fT(new Date(d.getTime()-3e5)),who:'Агент «Слежение»',text:r.id+': статус обновлён по номеру '+r.cno,c:'warn'})});\n  return out.sort((a,b)=>b.at-a.at);\n}\n\nVIEWS.reqs=function(){\n  const tab=state.sub.tab||'all', q=(state.q||'').toLowerCase();\n  const G={all:()=>true,new:r=>r.st==='new',price:r=>r.st==='rfq'||r.st==='offers',deal:r=>r.st==='agreed'||r.st==='booked',way:r=>r.st==='transit'||r.st==='arrived',done:r=>r.st==='done'};\n  const T=[['all','Все'],['new','Новые'],['price','Подбор цен'],['deal','Согласование'],['way','В пути'],['done','Завершены']];\n  const list=R().filter(G[tab]).filter(r=>!q||(r.id+' '+(r.cno||'')+' '+r.client.name+' '+r.client.company+' '+r.cargo.name).toLowerCase().includes(q));\n  return '<div class=\"row-between\" style=\"margin-bottom:12px;flex-wrap:wrap\"><div class=\"tabs\">'+T.map(t=>'<button class=\"'+(tab===t[0]?'on':'')+'\" onclick=\"go(\\'reqs\\',{tab:\\''+t[0]+'\\'})\">'+t[1]+' <span class=\"muted\">'+R().filter(G[t[0]]).length+'<\/span><\/button>').join('')+'<\/div>'+\n    '<button class=\"btn btn-g\" onclick=\"openNew()\">Новая заявка<\/button><\/div>'+\n   '<div class=\"card\"><div class=\"tbl-wrap\"><table><thead><tr><th>Заявка<\/th><th>Маршрут<\/th><th>Груз<\/th><th>Отправка<\/th><th>Заказчик<\/th><th>Статус<\/th><th>Цена<\/th><\/tr><\/thead><tbody>'+\n   (list.map(r=>{const o=reqOffer(r),best=r.offers[0],q0=o||best?null:reqQuote(r), imp=isKZ(r.to);\n     return '<tr class=\"click\" onclick=\"openReq(\\''+r.id+'\\')\"><td class=\"nowrap\"><b>'+r.id+'<\/b><div class=\"mini\">'+fDT(new Date(r.at))+(r.src==='site'?' · с сайта':'')+'<\/div><\/td><td>'+route(r)+'<div class=\"mini\">'+grpName(grpOf(imp?r.from:r.to))+' · '+(imp?'в Казахстан':'из Казахстана')+'<\/div><\/td>'+\n      '<td><div class=\"row\" style=\"gap:8px\"><span class=\"ct-ico\">'+ctArt(r.cargo.type,26)+'<\/span><div style=\"min-width:0\"><div>'+esc(r.cargo.name)+'<\/div><div class=\"mini\">'+ct(r.cargo.type)[1]+'<\/div><\/div><\/div><\/td>'+\n      '<td class=\"nowrap\"><b>'+cargoQty(r.cargo)+'<\/b><div class=\"mini\">'+wt(cargoKg(r.cargo))+'<\/div><\/td><td>'+esc(r.client.company)+'<div class=\"mini\">'+esc(r.client.name)+'<\/div><\/td><td>'+badge(r.st)+'<\/td>'+\n      '<td class=\"nowrap\">'+(o?'<b>'+money(o.total)+'<\/b>':best?'<span>от<\/span> '+money(best.total):q0?'<span class=\"muted\">ориентир<\/span> '+money(q0.total):'—')+'<\/td><\/tr>'}).join('')||'<tr><td colspan=\"7\"><div class=\"empty\">Заявок нет<\/div><\/td><\/tr>')+\n   '<\/tbody><\/table><\/div><\/div>';\n};\n\n/* ---------- новая заявка ---------- */\nfunction openNew(){\n  state.nf=state.nf||{imp:0,far:'POT',kz:'ALA',name:'',unit:'c40',type:'gen',n:1,kg:18000,m3:10,cn:'',cc:'',cp:''};\n  renderNew();\n}\nfunction nfSet(k,v){ state.nf[k]=(['n','kg','m3','imp'].includes(k)?+v:v); renderNew(); }\nfunction renderNew(){\n  const f=state.nf, from=f.imp?f.far:f.kz, to=f.imp?f.kz:f.far, opts=seaOptions(from,to,f), ok=opts.filter(o=>o.ok), q=ok[0];\n  const far='<select onchange=\"nfSet(\\'far\\',this.value)\">'+GRP.map(g=>'<optgroup label=\"'+g[1]+'\">'+g[2].map(x=>'<option value=\"'+x+'\"'+(f.far===x?' selected':'')+'>'+esc(ptn(x))+', '+COUNTRY[PT[x][1]]+'<\/option>').join('')+'<\/optgroup>').join('')+'<\/select>';\n  const kz='<select onchange=\"nfSet(\\'kz\\',this.value)\">'+KZ_PT.map(x=>'<option value=\"'+x+'\"'+(f.kz===x?' selected':'')+'>'+esc(ptn(x))+'<\/option>').join('')+'<\/select>';\n  const inp=(k,lab,type)=>'<div class=\"field\"><label>'+lab+'<\/label><input '+(type==='n'?'type=\"number\" min=\"0\" inputmode=\"decimal\"':'type=\"text\"')+' id=\"nf-'+k+'\" value=\"'+esc(f[k])+'\" onchange=\"nfSet(\\''+k+'\\',this.value)\"><\/div>';\n  const lcl=f.unit==='lcl';\n  openModal(mhead('Новая заявка','Заказчик позвонил или написал: заявку заводит оператор')+'<div class=\"modal-body\"><div class=\"stack\">'+\n   '<div class=\"seg\"><button class=\"'+(f.imp?'':'on')+'\" onclick=\"nfSet(\\'imp\\',0)\">Из Казахстана<\/button><button class=\"'+(f.imp?'on':'')+'\" onclick=\"nfSet(\\'imp\\',1)\">В Казахстан<\/button><\/div>'+\n   '<div class=\"grid c2\"><div class=\"field\"><label>'+(f.imp?'Куда':'Откуда')+'<\/label>'+kz+'<\/div><div class=\"field\"><label>'+(f.imp?'Откуда':'Куда')+'<\/label>'+far+'<\/div><\/div>'+\n   '<div class=\"grid c2\">'+inp('name','Что везём')+'<div class=\"field\"><label>Вид груза<\/label><select onchange=\"nfSet(\\'type\\',this.value)\">'+CT.map(c=>'<option value=\"'+c[0]+'\"'+(f.type===c[0]?' selected':'')+'>'+c[1]+'<\/option>').join('')+'<\/select><\/div><\/div>'+\n   '<div class=\"grid c3\"><div class=\"field\"><label>Как везём<\/label><select onchange=\"nfSet(\\'unit\\',this.value)\">'+UNITS.map(u=>'<option value=\"'+u[0]+'\"'+(f.unit===u[0]?' selected':'')+'>'+u[1]+'<\/option>').join('')+'<\/select><\/div>'+(lcl?inp('m3','Объём, м³','n'):inp('n','Сколько','n'))+inp('kg',lcl?'Вес всего, кг':'Вес в одном, кг','n')+'<\/div>'+\n   '<div class=\"tile\"><div class=\"row-between\"><div style=\"min-width:0\"><div class=\"label\">Ориентир цены<\/div>'+(q?'<div class=\"kpi-val\">'+money(q.total)+'<\/div><div class=\"mini\">'+q.name+' · '+daysTxt(q)+' · <span>путей: '+ok.length+'<\/span><\/div><div style=\"margin-top:6px\">'+basisBadges(q)+'<\/div>':'<div class=\"why-no\">'+esc(opts[0]?opts[0].why[0]:'По этому направлению пути нет')+'<\/div>')+'<\/div>'+(q?'<div class=\"art-box\">'+optArt(q)+'<\/div>':'')+'<\/div><\/div>'+\n   '<div class=\"grid c3\">'+inp('cn','Заказчик: имя')+inp('cc','Компания')+inp('cp','Телефон')+'<\/div>'+\n   '<\/div><\/div><div class=\"modal-foot\"><button class=\"btn\" onclick=\"closeModal()\">Отмена<\/button><button class=\"btn btn-g\" onclick=\"saveNew()\">Создать заявку<\/button><\/div>','');\n}\nfunction saveNew(){\n  const f=state.nf; if(!f.name||!String(f.name).trim()){ toast('Напишите, что везём','warn'); return; }\n  const r={id:newReqId(),from:f.imp?f.far:f.kz,to:f.imp?f.kz:f.far,cargo:{name:String(f.name).trim(),unit:f.unit,n:f.n,type:f.type,kg:f.kg,m3:f.m3},\n    client:{name:f.cn||'Заказчик',company:f.cc||'Без компании',phone:f.cp||'—'},st:'new',at:new Date().toISOString(),src:'panel',sent:[],offers:[],log:[]};\n  logReq(r,'Заявку завёл оператор','Оператор'); saveReq(r); state.nf=null; closeModal(); toast('Заявка '+r.id+' создана'); render(); openReq(r.id);\n}\n\n/* ---------- пульт заявки ---------- */\nfunction openReq(id,tab){\n  const r=req(id); if(!r) return;\n  const si=stageIdx(r.st); tab=tab||(si===0?'req':si<=2?'fw':si<=4?'deal':'track'); state.rq={id,tab};\n  const T=[['req','Заявка'],['way','Путь'],['fw','Экспедиторы и цены'],['deal','Сделка'],['track','Отслеживание'],['log','История']];\n  const next={new:['reqAct(\\''+id+'\\',\\'send\\')','Запросить цены у экспедиторов'],rfq:['reqAct(\\''+id+'\\',\\'offers\\')','Получить предложения'],agreed:['reqAct(\\''+id+'\\',\\'book\\')','Экспедитор забронировал место'],\n    booked:['reqAct(\\''+id+'\\',\\'dep\\')','Груз отправлен'],transit:['reqAct(\\''+id+'\\',\\'arr\\')','Груз прибыл'],arrived:['reqAct(\\''+id+'\\',\\'done\\')','Груз выдан']}[r.st];\n  openModal('<div class=\"modal-head\"><div style=\"flex:1;min-width:0\"><div class=\"row\" style=\"flex-wrap:wrap;gap:8px\"><div class=\"card-title\">'+r.id+' · '+esc(ptn(r.from))+' → '+esc(ptn(r.to))+'<  порт за морем<\/div><div class=\"card\"><div class=\"tbl-wrap\"><table>'+th+'<tbody>'+\n    W.map(w=>{const t=TMTM_W[w[0]];return '<tr><td><b>'+w[1]+'<\/b><div class=\"mini\">через Актау и Баку<\/div><\/td><td class=\"nowrap\">'+dol(t[0])+'<\/td><td class=\"nowrap\">'+dol(t[1])+'<\/td><td class=\"nowrap\"><b>'+dol(t[2])+'<\/b><\/td><td>'+t[3]+'<\/td><td class=\"nowrap\">'+num(t[4])+'<\/td><\/tr>'}).join('')+\n    '<\/tbody><\/table><\/div><div class=\"mini\" style=\"margin-top:8px\">Без железной дороги по Казахстану: её считают по прейскуранту КТЖ. Тяжёлый контейнер — больше 20 т<\/div><\/div>'+\n   '<div class=\"section-label\">Тариф ТМТМ: Поти, Батуми → Констанца → Европа<\/div><div class=\"card\"><div class=\"tbl-wrap\"><table><thead><tr><th>Куда<\/th><th>20 футов<\/th><th>40 футов<\/th><th>Суток<\/th><th>Км<\/th><\/tr><\/thead><tbody>'+\n    E.map(w=>{const t=TMTM_BS[w[0]];return '<tr><td><b>'+w[1]+'<\/b><\/td><td class=\"nowrap\">'+dol(t[0])+'<\/td><td class=\"nowrap\"><b>'+dol(t[1])+'<\/b><\/td><td>'+t[2]+'<\/td><td class=\"nowrap\">'+num(t[3])+'<\/td><\/tr>'}).join('')+\n    '<\/tbody><\/table><\/div><div class=\"mini\" style=\"margin-top:8px\">Море по Чёрному морю и железная дорога. Ставка действует только на кругорейс<\/div><\/div>'+\n   '<div class=\"grid g2\" style=\"margin-top:14px\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Каспий и паром<\/div><div class=\"card-actions\"><span class=\"badge b-green\">настоящие ставки<\/span><\/div><\/div>'+\n    '<div class=\"kv\"><span>Паром Алят – Курык, за метр длины машины<\/span><b>'+money(usd(FERRY_M))+'<\/b><\/div><div class=\"kv\"><span>Фрахт тяжёлого контейнера 20 футов на экспорт<\/span><b>'+dol(299)+'<\/b><\/div>'+\n    '<div class=\"kv\"><span>Портовый сбор Баку и Курыка, 20 футов<\/span><b>'+dol(40)+'<\/b><\/div><div class=\"kv\"><span>Портовый сбор Баку и Курыка, 40 футов<\/span><b>'+dol(75)+'<\/b><\/div><div class=\"kv\"><span>Сбор за транзитную декларацию, 6 МРП<\/span><b>'
