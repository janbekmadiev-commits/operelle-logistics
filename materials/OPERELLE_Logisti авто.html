<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPERELLE LOGISTICS: головная панель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Шрифты Fira Sans и Fira Sans Condensed выбраны потому, что в них есть все казахские буквы (проверено отрисовкой).
   Стиль «Ночной рейс»: чёрный фон, один акцент (сигнальный оранжевый; переменная по-прежнему называется --gold).
   Заголовки: узкий заглавный шрифт (--cd), цифры: моноширинный (--mono). Цвета статусов (зелёный, жёлтый, красный, синий) оставлены как смысловые. */
:root{
  --bg:#08090B;
  --panel:#0E0F12;
  --card:#121418;
  --card-2:#191C21;
  --line:#2A2E36;
  --line-soft:#20232A;
  --txt:#F2F3F5;
  --txt-2:#B0B6C0;
  --txt-3:#7B828E;
  --gold:#E3B341;
  --green:#22C55E;
  --blue:#3B82F6;
  --amber:#F59E0B;
  --red:#EF4444;
  --violet:#A855F7;
  --cyan:#06B6D4;
  --slate:#64748B;
  --r:10px;
  --r-sm:8px;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --mono:'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Mono','Roboto Mono',Menlo,monospace;
  --cd:'Fira Sans Condensed','Arial Narrow','Roboto Condensed',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Fira Sans','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A2E36;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#3A3F49}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{
  background:var(--panel);border-right:1px solid var(--line-soft);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid var(--line-soft)}
.brand-mark{
  width:36px;height:36px;border-radius:10px;flex:0 0 36px;
  background:linear-gradient(145deg,#E3B341,#8C6A1E);
  display:grid;place-items:center;color:#1A1405;font-weight:800;font-size:15px;letter-spacing:-.5px;
}
.brand-logo-box{flex:0 0 auto;display:grid;place-items:center;line-height:0}
.brand-name{font-weight:800;letter-spacing:.6px;font-size:13.5px;white-space:nowrap}
.brand-sub{font-size:10px;color:var(--txt-3);letter-spacing:2.6px;text-transform:lowercase;margin-top:1px}
.nav{padding:10px 10px 20px;overflow-y:auto;flex:1}
.nav-group{margin:16px 8px 6px;font:500 10px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-3)}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:9px;min-height:38px;
  color:var(--txt-2);font-size:13.5px;text-align:left;transition:.15s;position:relative;
}
.nav-item:hover{background:#17191D;color:var(--txt)}
.nav-item.active{background:rgba(227,179,65,.13);color:#F3D27A;font-weight:700}
.nav-item.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav-badge{margin-left:auto;background:#2C3038;color:#C9CED6;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:600}
.nav-badge.alert{background:rgba(239,68,68,.18);color:#FCA5A5}
.sidebar-foot{padding:12px;border-top:1px solid var(--line-soft)}
.ai-status{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px}
.ai-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(8,9,11,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:nowrap;
}
.page-title{font:800 26px/1.05 var(--cd);text-transform:uppercase;letter-spacing:.01em}
.page-sub{font-size:12px;color:var(--txt-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-block{flex:1 1 auto;min-width:0}
.page-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{
  display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;flex:0 1 230px;min-width:150px;color:var(--txt-3)
}
.search input{background:none;border:none;outline:none;width:100%;color:var(--txt);font-size:13px}
.date-chip{display:flex;flex-direction:column;line-height:1.25;padding:4px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.date-chip b{font-size:13px}
.date-chip span{font-size:11px;color:var(--txt-3)}
.role-switch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.role-switch button{padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--txt-2);white-space:nowrap}
.role-switch button.on{background:var(--gold);color:#1A1405;font-weight:700}
.icon-btn{width:36px;height:36px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--txt-2)}
.icon-btn:hover{color:var(--txt);border-color:#3A3F49}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.user-chip{display:flex;align-items:center;gap:9px;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(145deg,#3A3F49,#20232A);display:grid;place-items:center;font-weight:700;font-size:12px;color:#D5D9E0;border:1px solid var(--line);flex:0 0 34px}
.view{padding:20px 22px 40px;flex:1}

/* ---------- primitives ---------- */
.grid{display:grid;gap:14px}
.grid>*,.stack>*{min-width:0}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g-main{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.g-side{grid-template-columns:270px minmax(0,1fr)}
.c2{grid-template-columns:1fr 1fr;gap:10px}
.c3{grid-template-columns:1fr 1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;min-width:0}
.card.compact{padding:13px}
.compact .card-head{margin-bottom:9px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-title{font:800 18px/1.05 var(--cd);text-transform:uppercase;letter-spacing:.02em}
.modal-head .card-title{font-size:23px}
.card-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--txt-3)}
.small{font-size:12px}
.label{font:500 10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-3)}
.kpi-val{font:600 24px/1.1 var(--mono);letter-spacing:-.05em;margin:6px 0 2px}
.delta{font-size:11.5px;font-weight:600}
.delta.up{color:var(--green)} .delta.down{color:var(--red)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;
  background:var(--card-2);border:1px solid var(--line);color:var(--txt);transition:.15s;white-space:nowrap
}
.btn:hover{border-color:#4A505B;background:#20242B}
.btn-p{background:var(--gold);border-color:var(--gold);color:#1A1405}
.btn-p:hover{background:#F0C35A;border-color:#F0C35A}
/* главное действие в окне или разделе: оранжевая кнопка */
.btn-g{background:var(--gold);border-color:var(--gold);color:#1A1405}
.btn-g:hover{background:#F0C35A;border-color:#F0C35A}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1A1405}
.btn-gold:hover{background:#F0C35A}
.btn-r{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.4);color:#FCA5A5}
.btn-r:hover{background:rgba(239,68,68,.28);border-color:var(--red)}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-green{background:rgba(34,197,94,.15);color:#6EE7A0}
.b-blue{background:rgba(59,130,246,.16);color:#93B8FB}
.b-amber{background:rgba(245,158,11,.15);color:#FBD38D}
.b-red{background:rgba(239,68,68,.15);color:#FCA5A5}
.b-violet{background:rgba(168,85,247,.16);color:#D8B4FE}
.b-slate{background:rgba(100,116,139,.2);color:#B4C2D6}
.b-cyan{background:rgba(6,182,212,.16);color:#7DD8E8}
.b-gold{background:rgba(227,179,65,.16);color:#F3D27A}
table{width:100%;border-collapse:collapse}
th{
  text-align:left;font:500 10px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--txt-3);
  padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap
}
td{padding:10px 9px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tbody tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
.tbl-wrap{overflow-x:auto;margin:0 -16px -16px;padding:0 16px 4px}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.list-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.list-row:last-child{border-bottom:none}
.dot-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 30px;font-size:13px}
.progress{height:6px;border-radius:6px;background:#20232A;overflow:hidden}
.progress i{display:block;height:100%;border-radius:6px;background:var(--green)}
.tabs{max-width:100%;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line-soft);padding:4px;border-radius:10px;overflow-x:auto}
.tabs button{padding:7px 13px;border-radius:7px;font-size:12.5px;color:var(--txt-2);white-space:nowrap}
.tabs button.on{background:var(--card-2);color:#fff;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;color:var(--txt-3);font-weight:600;letter-spacing:.4px}
.field input,.field select,.field textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;font-size:13px;width:100%
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field input[readonly]{color:var(--txt-2)}
.field input[type=range]{padding:0;border:none;background:none;accent-color:var(--gold)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--txt-2)}
.seg button.on{border-color:var(--gold);background:rgba(227,179,65,.14);color:#F3D27A;font-weight:600}
.chk{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer;font-size:13px;text-align:left;width:100%}
.chk.on{border-color:var(--green);background:rgba(34,197,94,.08)}
.chk .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 17px;font-size:11px;color:#04240F}
.chk.on .box{background:var(--green);border-color:var(--green)}
.empty{padding:34px;text-align:center;color:var(--txt-3);font-size:13px}
.divider{height:1px;background:var(--line-soft);margin:14px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(4,8,15,.72);backdrop-filter:blur(3px);z-index:100;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:20px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  width:min(920px,100%);max-width:100%;min-width:0;max-height:90vh;display:flex;flex-direction:column;animation:pop .2s ease
}
.modal.wide{width:min(1120px,100%)}
.modal.narrow{width:min(600px,100%)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.modal-body{padding:18px;overflow-y:auto;min-width:0}
.modal-foot{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.stepper{display:flex;gap:6px;padding:14px 18px 0}
.step{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.step i{height:3px;border-radius:3px;background:#2A2E36;display:block}
.step.done i{background:var(--green)} .step.on i{background:var(--gold)}
.step span{font-size:10.5px;color:var(--txt-3);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.on span{color:#F3D27A;font-weight:600}
.step.done span{color:#7EE8AC}

/* ---------- toast ---------- */
#toast-root{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:360px}
.toast{
  background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;
  padding:12px 14px;box-shadow:var(--shadow);animation:slide .22s ease;font-size:13px
}
.toast.info{border-left-color:var(--blue)} .toast.warn{border-left-color:var(--amber)} .toast.err{border-left-color:var(--red)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

/* ---------- log / document ---------- */
.log{font-family:var(--mono);font-size:11.5px;background:#060708;border:1px solid var(--line-soft);border-radius:9px;padding:11px;max-height:210px;overflow-y:auto;line-height:1.7}
.log .t{color:var(--txt-3)}
.log .ok{color:#6EE7A0} .log .warn{color:#FBD38D} .log .inf{color:#93B8FB} .log .err{color:#FCA5A5}
.doc{background:#F7F7F4;color:#1a1a1a;border-radius:8px;padding:26px 28px;font-family:'Times New Roman',Georgia,serif;font-size:13px;line-height:1.6}
.doc h3{margin:0 0 4px;font-size:16px;text-align:center;letter-spacing:.5px}
.doc .doc-sub{text-align:center;color:#555;font-size:12px;margin-bottom:16px}
.doc table{border-collapse:collapse;margin:10px 0;width:100%}
.doc td,.doc th{border:1px solid #bbb;padding:5px 8px;font-size:12px;color:#1a1a1a;white-space:normal;text-transform:none;letter-spacing:0;font-weight:400;vertical-align:top}
.doc th{background:#eceae4;font-weight:700;width:34%}
.doc .sign{display:flex;justify-content:space-between;gap:16px;margin-top:26px;font-size:12px;flex-wrap:wrap}
.doc .stamp{margin-top:16px;font-size:11px;color:#777;border-top:1px dashed #bbb;padding-top:8px}

/* ---------- misc ---------- */
.tile{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:12px;min-width:0}
.tile.click{cursor:pointer;transition:.15s;text-align:left;width:100%}
.tile.click:hover{border-color:#4A505B;transform:translateY(-1px)}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.hbar{height:8px;border-radius:8px;background:#20232A;overflow:hidden;display:flex}
.hbar i{display:block;height:100%}
.mini{font-size:11.5px;color:var(--txt-3)}
.alert-row{display:flex;gap:11px;padding:11px;border-radius:10px;background:var(--card-2);border:1px solid var(--line-soft);align-items:flex-start}
.alert-row.crit{border-left:3px solid var(--red)}
.alert-row.warn{border-left:3px solid var(--amber)}
.alert-row.info{border-left:3px solid var(--blue)}
.alert-row.ok{border-left:3px solid var(--green)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:600;text-align:right}
.kv span{color:var(--txt-2)}
.nowrap{white-space:nowrap}
.burger{display:none}

/* ---------- command center ---------- */
.command-hero{background:linear-gradient(135deg,#131f35,#172944 55%,#213b5e);border:1px solid #2a4268;border-radius:16px;padding:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px;box-shadow:0 14px 34px rgba(0,0,0,.22)}
.command-hero h2{margin:5px 0 4px;font-size:24px;letter-spacing:-.4px}
.command-hero p{margin:0;color:var(--txt-2);max-width:720px}
.command-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.priority-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.priority-card{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:13px;min-height:118px;display:flex;flex-direction:column;gap:7px}
.priority-card.crit{border-left:3px solid var(--red)}
.priority-card.warn{border-left:3px solid var(--amber)}
.priority-card.info{border-left:3px solid var(--blue)}
.priority-card.ok{border-left:3px solid var(--green)}
.priority-title{font-size:12px;font-weight:700}
.priority-value{font:600 22px/1 var(--mono);letter-spacing:-.05em}
.priority-desc{font-size:11.5px;color:var(--txt-3);flex:1}
.priority-card .btn{align-self:flex-start}
.ops-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-bottom:14px}
.ops-chip{background:var(--card);border:1px solid var(--line-soft);border-radius:11px;padding:11px 12px;min-width:0}
.ops-chip .label{margin-bottom:5px}
.ops-chip b{font:600 17px var(--mono);letter-spacing:-.04em}
.section-label{display:flex;align-items:center;gap:9px;margin:18px 0 9px;font:500 10.5px var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--txt-3)}
.section-label:after{content:'';height:1px;background:var(--line-soft);flex:1}
.action-list{display:grid;gap:7px}
.action-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line-soft);border-radius:9px;background:var(--panel)}
.role-context{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;background:rgba(227,179,65,.12);color:#F3D27A;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase}

/* ---------- логистика: карта, скоринг, трекинг ---------- */
.map-wrap{background:#0A0B0D;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;position:relative}
.map-svg{cursor:grab;user-select:none;-webkit-user-select:none}
.map-svg:active{cursor:grabbing}
.map-ctl{position:absolute;left:10px;top:10px;z-index:3;display:flex;gap:3px;background:rgba(8,9,11,.8);border:1px solid var(--line);border-radius:9px;padding:3px;backdrop-filter:blur(6px)}
.map-ctl button{padding:5px 9px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--txt-2)}
.map-ctl button:hover{background:var(--card-2);color:#fff}
.map-wrap .stp{cursor:pointer}
.vt-art{display:block;width:100%;height:auto}
.vt-tile .vt-art{margin:-2px 0 7px;background:#0E1013;border-radius:8px}
.art-box{width:132px;flex:0 0 132px;background:#0E1013;border:1px solid var(--line-soft);border-radius:9px;padding:4px 6px}
.art-box.sm{width:76px;flex:0 0 76px;padding:2px 4px}
.art-box.wide{width:100%;flex:none;max-width:330px}
.svc-ic{flex:0 0 auto;vertical-align:-3px}
.pill.on{background:var(--gold);border-color:var(--gold);color:#1A1405;font-weight:700}
.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:10px 12px;font:inherit;font-size:13px;line-height:1.5;resize:vertical}
/* фото машины от перевозчика и сканы документов */
.shots-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.shot-th{position:relative;width:64px;height:46px;flex:0 0 64px;border-radius:7px;border:1px solid var(--line-soft);background:#0E1013;overflow:hidden;cursor:pointer;padding:0;display:block}
.shot-th:hover{border-color:#4A505B}
.shot-th img{width:100%;height:100%;object-fit:cover;display:block}
.shot-th .vt-art{position:absolute;inset:2px 3px 10px;width:auto;height:auto;aspect-ratio:auto}
.shot-th span{position:absolute;left:0;right:0;bottom:0;font-size:9px;line-height:1.25;padding:1px 2px;background:rgba(8,12,20,.78);color:#C9D1DD;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-view{display:grid;place-items:center;background:#0C0D10;border-radius:10px;padding:10px;min-height:240px}
.file-view img{max-width:100%;max-height:62vh;border-radius:8px}
.req-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line-soft)}
.req-row:last-child{border-bottom:none}
/* фото техники без фона: машина стоит на тёмной подложке карточки */
.vt-photo{aspect-ratio:2/1}
.art-box:has(.vt-photo),.vt-tile .vt-photo{background-color:#0E1013}
.art-box:has(.vt-photo){background-image:radial-gradient(85% 85% at 50% 92%,rgba(227,179,65,.16),#0E1013 72%)}
.modal.xl{width:min(1320px,100%)}
.trip-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
.trip-side{min-width:0}
.stop-row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;border:1px solid var(--line-soft);border-radius:10px;background:var(--card-2);margin-bottom:7px;font-size:12.5px}
.stop-row:hover{border-color:#4A505B}
.stop-row.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.stop-n{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;color:#fff;font-size:11px;font-weight:800;flex:0 0 22px}
.stop-addr{color:var(--txt);margin:3px 0 2px}
.chat-scroll{max-height:320px;overflow-y:auto}
.pill{padding:5px 11px;border-radius:20px;border:1px solid var(--line);font-size:12px;color:var(--txt-2);background:var(--panel)}
.pill:hover{border-color:#4A505B;color:#fff}
.trip-row{padding:11px 12px}
.trip-list{max-height:470px;overflow-y:auto;padding-right:2px}
.fleet-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line-soft)}
.fleet-row:last-child{border-bottom:none}
.veh-form{background:var(--panel)}
.place-new{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) 74px auto;gap:8px;margin-top:8px}
.place-new input,.place-new select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;font-size:13px;width:100%;min-width:0}
.role-me{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;color:var(--txt);max-width:170px;margin-left:4px;outline:none}
.doc.scan{position:relative;overflow:hidden}
.doc.scan::after{content:'КОПИЯ · BEKZHAN LOGISTIC';position:absolute;right:-20px;top:46%;transform:rotate(-22deg);font:700 28px/1 Arial,sans-serif;color:rgba(160,30,30,.1);letter-spacing:4px;pointer-events:none}
.map-wrap svg{display:block;width:100%;height:auto}
.map-wrap .trk{cursor:pointer}
.map-wrap .trk:hover circle{stroke-width:3.5}
.tier{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font-size:11px;font-weight:800}
.tier-A{background:rgba(34,197,94,.2);color:#7EE8AC}
.tier-B{background:rgba(59,130,246,.2);color:#9CC0FC}
.tier-C{background:rgba(245,158,11,.2);color:#FBD38D}
.tier-D{background:rgba(239,68,68,.2);color:#FCA5A5}
.score{display:flex;align-items:center;gap:7px;min-width:84px}
.score .progress{width:50px;flex:0 0 50px}
.stars{color:#F5C542;font-weight:700;white-space:nowrap}
.route{font-weight:650}
td .route{white-space:nowrap}
.route i{font-style:normal;color:var(--txt-3);margin:0 5px}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line-soft);font-size:13px}
.check-row:last-child{border-bottom:none}
.ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 20px;margin-top:1px}
.ck.ok{background:rgba(34,197,94,.2);color:#7EE8AC}
.ck.bad{background:rgba(239,68,68,.2);color:#FCA5A5}
.ck.warn{background:rgba(245,158,11,.2);color:#FBD38D}
.ck.wait{background:rgba(100,116,139,.25);color:#B4C2D6}
.tline{display:flex;flex-direction:column}
.tline .ev{position:relative;padding:0 0 12px 18px;border-left:2px solid var(--line);margin-left:5px;font-size:12.5px}
.tline .ev:last-child{border-left-color:transparent;padding-bottom:0}
.tline .ev::before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--panel)}
.tline .ev.warn::before{background:var(--amber)} .tline .ev.ok::before{background:var(--green)} .tline .ev.err::before{background:var(--red)}
.chat{display:flex;flex-direction:column;gap:7px;background:#0C0D10;border:1px solid var(--line-soft);border-radius:10px;padding:12px}
.bub{max-width:84%;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.45}
.bub.out{align-self:flex-end;background:rgba(227,179,65,.2);color:#FFF1CC;border-bottom-right-radius:4px}
.bub.in{align-self:flex-start;background:var(--card-2);border-bottom-left-radius:4px}
.bub small{display:block;font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:176px;height:176px;background:#fff;padding:9px;border-radius:10px;flex:0 0 176px}
.qr i{display:block}
.qr i.b{background:#10151c}
.vt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:9px}
.stage{display:flex;gap:4px;margin:4px 0 2px}
.stage div{flex:1;min-width:0}
.stage i{display:block;height:4px;border-radius:4px;background:#2A2E36}
.stage .d i{background:var(--green)} .stage .c i{background:var(--gold)}
.stage span{display:block;font-size:10px;color:var(--txt-3);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .c span{color:#F3D27A;font-weight:700} .stage .d span{color:#7EE8AC}
.src-tag{font-family:var(--mono);font-size:11px;color:var(--txt-2);background:#0C0D10;border:1px solid var(--line-soft);border-radius:7px;padding:7px 9px;line-height:1.5}
.switch{width:36px;height:20px;border-radius:20px;background:#2C3038;position:relative;flex:0 0 36px;transition:.15s}
.switch::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#D5D9E0;transition:.15s}
.switch.on{background:var(--green)}
.switch.on::after{left:18px;background:#fff}

/* ---------- диспетчерская: карта во всю ширину, список рейсов поверх неё ---------- */
.gl{background:rgba(15,17,20,.88);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.cr-strip{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:10px;flex-wrap:wrap}
.cr-kp{display:flex;align-items:baseline;gap:8px;padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.05);white-space:nowrap;font-size:12.5px;color:var(--txt-3)}
.cr-kp b{font:600 17px var(--mono);color:#fff;letter-spacing:-.04em}
.cr-kp:first-child b{color:var(--gold)}
.cr-acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cr{position:relative;margin-bottom:10px}
.cr .map-wrap{border-radius:10px;border-color:var(--line)}
.cr .map-ctl{left:auto;right:10px}
.cr-legend{position:absolute;right:10px;bottom:10px;z-index:3;padding:7px 11px}
.cr-left{position:absolute;left:10px;top:10px;bottom:10px;width:320px;z-index:4;display:flex;flex-direction:column;overflow:hidden}
.cr-left .card-head{padding:13px 14px 11px;margin:0}
.cr-left .trip-list{max-height:none;flex:1;overflow-y:auto;gap:0;padding:0}
.cr-trip{display:block;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--line-soft)}
.cr-trip:hover{background:rgba(255,255,255,.045)}
.cr-trip b{display:block;font-size:14.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-trip b u{text-decoration:none;color:var(--gold);padding:0 3px}
.cr-no{font:500 11.5px var(--mono);color:var(--txt-3)}
.tabbar{display:none}

@media (max-width:1500px){.user-chip>div:last-child{display:none}}
@media (max-width:1180px){
  .g-main,.g-side,.trip-grid{grid-template-columns:minmax(0,1fr)}
  .priority-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .date-chip,.topbar .search{display:none}
  .cr-left{position:static;width:auto;margin-top:10px;max-height:440px}
  .cr-legend{position:static;margin-top:8px;display:inline-block}
  .ops-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:250px;z-index:90;transform:translateX(-100%);transition:.25s}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .burger{display:grid !important}
  .topbar{padding:10px 14px;flex-wrap:wrap}
  .view{padding:14px}
  .search{display:none}
  /* нижняя панель разделов на телефоне */
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(14,15,18,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{display:grid;justify-items:center;gap:3px;padding:8px 2px 9px;font-size:10.5px;font-weight:600;color:var(--txt-3)}
  .tabbar button.on{color:var(--gold)}
  .view{padding-bottom:86px}
  #toast-root{bottom:78px;left:12px;right:12px;max-width:none}
  .topbar .page-title{font-size:22px}
  .cr-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .cr-kp{justify-content:space-between;min-width:0;white-space:normal;flex-wrap:wrap;gap:2px 8px;font-size:12px}
  .cr-kp b{white-space:nowrap}
  /* шапка на телефоне: название раздела и уведомления, ниже переключатель роли */
  .topbar{gap:8px}
  .page-sub,.date-chip,.user-chip{display:none}
  .role-switch{order:5;flex:1 1 0}
  #fx-lang{order:6}
  .topbar .icon-btn[aria-label="Уведомления"]{order:3}
  #fx-cur{order:2;margin-left:auto}
  .title-block{order:1}
  .topbar .burger{order:0}
  .role-switch button{flex:1}
  .role-me{flex:1;max-width:none}
  .cr-acts{margin-left:0;grid-column:1/-1}
  .cr-acts .btn{flex:1 1 auto;justify-content:center}
  .role-switch button{padding:6px 9px;font-size:11.5px}
  .c3{grid-template-columns:1fr 1fr}
}
@media(max-width:700px){
  .priority-grid,.ops-strip{grid-template-columns:minmax(0,1fr)}
  .g2,.g3,.g4,.g-kpi{grid-template-columns:minmax(0,1fr)}
  .seg button,.tabs button{padding:7px 10px}
  .command-hero{align-items:flex-start;flex-direction:column}
  .command-actions{justify-content:flex-start}
  .c2,.c3{grid-template-columns:1fr}
  .stepper .step span{display:none}
  /* окна на телефоне: почти во весь экран, кнопки и вкладки переносятся */
  input,select,textarea,.field input,.field select,.field textarea{font-size:16px !important}
  .overlay{padding:8px}
  .modal{max-height:94vh;border-radius:14px}
  .modal-head{padding:13px 14px}
  .modal-body{padding:14px}
  .modal-foot{padding:12px 14px;gap:8px}
  .modal-foot .btn{flex:1 1 auto}
  .tabs{flex-wrap:wrap}
  .kv{gap:10px}
  .kv b{min-width:0;overflow-wrap:anywhere}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

символов":["Құпиясөз, {n} таңбадан бастап","Password, {n}+ characters","密码，至少 {n} 个字符"],"Пароль ещё раз":["Құпиясөзді қайталаңыз","Repeat password","再次输入密码"],"Согласен на обработку данных и с":["Деректерді өңдеуге келісемін және","I agree to data processing and to the","我同意数据处理并接受"],"правилами площадки":["алаң ережелерімен таныстым","platform rules","平台规则"],": она соединяет грузовладельца и перевозчика и не отвечает за перевозку. Перевозчики после регистрации заполняют анкету с фото каждой машины.":[": ол жүк иесі мен тасымалдаушыны байланыстырады және тасымалға жауап бермейді. Тасымалдаушылар тіркелгеннен кейін әр көліктің фотосы бар анкетаны толтырады.",": it connects shippers and carriers and is not responsible for the shipment. After registration, carriers fill out a form with photos of each vehicle.","：平台连接货主与承运人，不对运输负责。注册后，承运人需填写申请表并上传每辆车的照片。"],"Создать аккаунт":["Аккаунт жасау","Create account","创建账号"],"У меня уже есть аккаунт":["Менде аккаунт бар","I already have an account","我已有账号"],"Что нужно":["Не қажет","What you need","您的需求"],"коротко: что, где, когда":["қысқаша: не, қайда, қашан","briefly: what, where, when","简要说明：什么货、在哪、何时"],"Площадка соединяет стороны":["Алаң тараптарды байланыстырады","The platform connects the parties","平台连接双方"],"Мы даём грузовладельцу и перевозчику инструменты, чтобы найти друг друга и доверять друг другу: проверку документов, расчёт цены, образцы договоров, карту рейса и чат. Договор перевозки они заключают между собой.":["Біз жүк иесі мен тасымалдаушыға бір-бірін табуға және бір-біріне сенуге арналған құралдар береміз: құжаттарды тексеру, бағаны есептеу, шарт үлгілері, рейс картасы және чат. Тасымал шартын олар өзара жасасады.","We give shippers and carriers the tools to find each other and build trust: document verification, price calculation, contract templates, a trip map and chat. They sign the transportation contract between themselves.","我们为货主和承运人提供互相找到并彼此信任的工具：证件审核、运价计算、合同范本、行程地图和聊天。运输合同由双方自行签订。"],"Мы не перевозчик и не экспедитор":["Біз тасымалдаушы да, экспедитор да емеспіз","We are not a carrier or a freight forwarder","我们不是承运人，也不是货运代理"],"Площадка не принимает груз, не везёт его и не организует перевозку от своего имени. За груз, машину, водителя, сроки и расчёты отвечают стороны договора.":["Алаң жүкті қабылдамайды, тасымалдамайды және өз атынан тасымалды ұйымдастырмайды. Жүк, көлік, жүргізуші, мерзімдер және есеп айырысу үшін шарт тараптары жауап береді.","The platform does not accept cargo, transport it, or organize shipments in its own name. The parties to the contract are responsible for the cargo, vehicle, driver, deadlines and payments.","平台不接收货物，不承运，也不以自己的名义组织运输。货物、车辆、司机、时限和结算由合同双方负责。"],"Цену согласуют стороны":["Бағаны тараптар келіседі","The parties agree on the price","价格由双方协商"],"Контакты открываются после согласования":["Байланыстар келіскеннен кейін ашылады","Contacts are revealed after agreement","达成一致后开放联系方式"],"До согласования цены стороны не видят контактов друг друга. После согласования площадка открывает им контакты и чат.":["Баға келісілгенге дейін тараптар бір-бірінің байланыстарын көрмейді. Келіскеннен кейін алаң оларға байланыстар мен чатты ашады.","Until the price is agreed, the parties cannot see each other's contacts. After agreement, the platform opens contacts and chat for them.","价格达成一致前，双方看不到彼此的联系方式。达成一致后，平台为双方开放联系方式和聊天。"],"За сведение сторон площадка получает комиссию с согласованной перевозки. Комиссию платит перевозчик; подписка оплачивается отдельно. Деньги за перевозку заказчик платит перевозчику напрямую, площадка их не принимает.":["Тараптарды байланыстырғаны үшін алаң келісілген тасымалдан комиссия алады. Комиссияны тасымалдаушы төлейді; жазылым жеке төленеді. Тасымал ақысын тапсырыс беруші тасымалдаушыға тікелей төлейді, алаң оны қабылдамайды.","For connecting the parties, the platform earns a commission on the agreed shipment. The carrier pays the commission; the subscription is paid separately. The customer pays the carrier for the transportation directly; the platform does not accept that money.","平台因撮合双方而对已达成的运输收取佣金。佣金由承运人支付；订阅费另行支付。运费由客户直接支付给承运人，平台不代收。"],"Площадка готовит образцы документов, уже заполненные данными сторон. Стороны сами проверяют их и подписывают. Площадка документы за стороны не подписывает и в госорганы не подаёт.":["Алаң тараптардың деректерімен толтырылған құжат үлгілерін дайындайды. Тараптар оларды өздері тексеріп, қол қояды. Алаң тараптардың орнына құжаттарға қол қоймайды және мемлекеттік органдарға тапсырмайды.","The platform prepares document templates already filled in with the parties' details. The parties review and sign them themselves. The platform does not sign documents on behalf of the parties or file them with government agencies.","平台准备已填入双方信息的文件范本。双方自行核对并签署。平台不代签文件，也不向政府机关提交。"],"Переписка внутри площадки":["Алаң ішіндегі хат алмасу","Messaging within the platform","平台内沟通"],"Стороны общаются во внутреннем чате. Переписка, маршрут и документы сохраняются и по запросу выдаются обеим сторонам.":["Тараптар ішкі чатта сөйлеседі. Хат алмасу, маршрут және құжаттар сақталады және сұрау бойынша екі тарапқа беріледі.","The parties communicate in the internal chat. Messages, route and documents are saved and provided to both parties on request.","双方在内部聊天中沟通。聊天记录、路线和文件会被保存，并可应要求提供给双方。"],"Споры":["Даулар","Disputes","争议"],"Споры по перевозке стороны решают между собой. Площадка не решает, кто прав, и никого не штрафует: она выдаёт историю заказа и учитывает опоздания в рейтинге.":["Тасымал бойынша дауларды тараптар өзара шешеді. Алаң кім дұрыс екенін шешпейді және ешкімге айыппұл салмайды: ол тапсырыс тарихын береді және кешігуді рейтингте ескереді.","The parties resolve transportation disputes between themselves. The platform does not decide who is right and does not fine anyone: it provides the order history and factors delays into ratings.","运输争议由双方自行解决。平台不裁定谁对谁错，也不处罚任何一方：平台提供订单记录，并将延误计入评分。"],"Проверка не является гарантией":["Тексеру кепілдік емес","Verification is not a guarantee","审核不构成担保"],"Мы проверяем документы и открытые реестры, чтобы снизить риск. Это не гарантия добросовестности и платёжеспособности участника.":["Біз тәуекелді азайту үшін құжаттар мен ашық тізілімдерді тексереміз. Бұл қатысушының адалдығына және төлем қабілеттілігіне кепілдік емес.","We check documents and public registries to reduce risk. This is not a guarantee of a participant's integrity or solvency.","我们会核查文件和公开登记信息以降低风险，但这并不保证参与方诚信可靠或具备偿付能力。"],"Услуги оказывают партнёры":["Қызметтерді серіктестер көрсетеді","Services are provided by partners","服务由合作伙伴提供"],"Данные":["Деректер","Data","数据"],"Документы и личные данные хранятся для проверки участников. Второй стороне и партнёрам передаётся только то, что нужно для сделки, и только с согласия участника.":["Құжаттар мен жеке деректер қатысушыларды тексеру үшін сақталады. Екінші тарапқа және серіктестерге мәміле үшін қажеттісі ғана және қатысушының келісімімен ғана беріледі.","Documents and personal data are stored to verify participants. Only what is needed for the deal is shared with the other party and partners, and only with the participant's consent.","文件和个人信息仅用于审核参与方。仅在参与方同意的情况下，才会向交易对方和合作伙伴提供交易所需的信息。"],"Площадка работает на программе OPERELLE, программа для компании бесплатна. OPERELLE отвечает только за работу программы, в сделках не участвует и личных данных участников не получает. За действия площадки отвечает компания, которая ею владеет. Страхование и часть сервисов оказывают партнёры OPERELLE по своим договорам.":["Алаң OPERELLE бағдарламасында жұмыс істейді, бағдарлама компания үшін тегін. OPERELLE бағдарламаның жұмысына ғана жауап береді, мәмілелерге қатыспайды және қатысушылардың жеке деректерін алмайды. Алаңның әрекеттеріне оған иелік ететін компания жауап береді. Сақтандыруды және кейбір сервистерді OPERELLE серіктестері өз шарттары бойынша көрсетеді.","The platform runs on OPERELLE software, which is free for the company. OPERELLE is responsible only for the software's operation, does not take part in deals and does not receive participants' personal data. The company that owns the platform is responsible for its actions. Insurance and some services are provided by OPERELLE partners under their own contracts.","平台基于 OPERELLE 程序运行，该程序对公司免费。OPERELLE 仅对程序的运行负责，不参与交易，也不获取参与方的个人信息。平台的行为由其所属公司负责。保险及部分服务由 OPERELLE 合作伙伴依据各自合同提供。"],"Тариф":["Тариф","Plan","套餐"],"Настройки":["Баптаулар","Settings","设置"],"Зарегистрироваться":["Тіркелу","Sign up","注册"],"Полис на один рейс от страховой компании. Оказывает: страховая компания.":["Сақтандыру компаниясынан бір рейске полис. Көрсетеді: сақтандыру компаниясы.","Single-trip policy from an insurance company. Provided by: the insurance company.","保险公司出具的单次行程保单。服务提供方：保险公司。"],"Согласен передать эти данные партнёру. Услугу оказывает партнёр по своему договору и лицензии. Площадка только передаёт заявку: не принимает деньги за услугу и не отвечает за её результат.":["Осы деректерді серіктеске беруге келісемін. Қызметті серіктес өз шарты мен лицензиясы бойынша көрсетеді. Алаң тек өтінімді жібереді: қызмет үшін ақша қабылдамайды және оның нәтижесіне жауап бермейді.","I agree to share this data with the partner. The service is provided by the partner under its own contract and license. The platform only forwards the request: it does not accept payment for the service and is not responsible for its outcome.","我同意将这些信息提供给合作伙伴。服务由合作伙伴依据其自有合同和许可证提供。平台仅转交申请：不代收服务费用，也不对服务结果负责。"],"Баланс":["Баланс","Balance","余额"],"Расчёт цены и подбор машины: подсказки. Сделка считается согласованной, когда цену приняли и заказчик, и перевозчик.":["Бағаны есептеу және көлік таңдау: кеңестер. Баға тапсырыс беруші де, тасымалдаушы да қабылдағанда мәміле келісілді деп саналады.","Price calculation and vehicle selection are suggestions. A deal is considered agreed when both the customer and the carrier accept the price.","运价计算和车辆匹配仅为提示。当客户和承运人都接受价格时，交易即视为达成一致。"],"Документы: образцы":["Құжаттар: үлгілер","Documents: templates","文件：范本"],"Заказчик подтверждает получение груза, перевозчик: расчёт. Стороны оценивают друг друга, оценки влияют на рейтинг.":["Тапсырыс беруші жүктің алынғанын растайды, тасымалдаушы есеп айырысуды растайды. Тараптар бір-бірін бағалайды, бағалар рейтингке әсер етеді.","The customer confirms receipt of the cargo, the carrier confirms payment. The parties rate each other, and the ratings affect their overall rating.","客户确认收货，承运人确认收款。双方互相评价，评价会影响评分。"],"{n} км, погрузка {n}":["{n} км, тиеу {n}","{n} km, loading {n}","{n} 公里，装货 {n}"],"Вы вышли из кабинета.":["Сіз жеке кабинеттен шықтыңыз.","You have signed out of your account.","您已退出个人中心。"],"На сайт":["Сайтқа","To website","返回网站"],"Выйти":["Шығу","Sign out","退出"],"Разделы кабинета":["Жеке кабинет бөлімдері","Account sections","个人中心栏目"],"Обзор":["Шолу","Overview","概览"],"Приглашён, пароль не задан":["Шақырылған, құпиясөз орнатылмаған","Invited, password not set","已邀请，未设置密码"],"Склад и перевалка":["Қойма және қайта тиеу","Warehouse and transshipment","仓储与转运"],"Сумма, ₸":["Сомасы, ₸","Amount, ₸","金额，₸"],"Маленький грузовик с тентом. Проедет во двор и в центр города.":["Тентті шағын жүк көлігі. Аулаға да, қала орталығына да кіре алады.","Small curtain-sided truck. Fits into courtyards and the city center.","带篷布的小型货车。可开进院子和市中心。"],"Мягкий съёмный верх. Грузят сзади, сбоку и сверху.":["Жұмсақ алынбалы үсті. Артынан, бүйірінен және үстінен тиейді.","Soft removable top. Loads from the rear, side and top.","柔性可拆卸顶篷。可从后部、侧面和顶部装货。"],"Жёсткий закрытый кузов. Защита от дождя и кражи, погрузка только сзади.":["Қатты жабық кузов. Жаңбырдан және ұрлықтан қорғайды, тек артынан тиейді.","Rigid enclosed body. Protects from rain and theft, loads from the rear only.","硬质封闭车厢。防雨防盗，仅可从后部装货。"],"Открытая платформа с бортами. Грузят краном или вручную сверху.":["Борттары бар ашық платформа. Кранмен немесе қолмен жоғарыдан тиейді.","Open platform with side boards. Loaded from above by crane or by hand.","带栏板的敞开式平台。可用吊机或人工从上方装货。"],"Газель и прицеп под тентом. Вдвое больше объёма ль»","«Груз Контроль» 货物检验"],"Аккредитация эксперта проверена":["Сарапшының аккредитациясы тексерілген","Expert accreditation verified","专家资质认证已核实"],"Агент «Silk Gate»":["«Silk Gate» агенті","Agent «Silk Gate»","«Silk Gate» 代理"],"демо-партнёр · Урумчи · с {n} г.":["демо-серіктес · Үрімжі · {n} ж. бастап","demo partner · Urumqi · since {n}","演示合作伙伴 · 乌鲁木齐 · 自 {n} 年"],"Топливная компания «Дала Ойл»":["«Дала Ойл» жанармай компаниясы","Fuel company «Дала Ойл»","«Дала Ойл» 燃油公司"],"Медицинская лицензия":["Медициналық лицензия","Medical license","医疗执照"],"{n} ₸ за заявку":["Өтінім үшін {n} ₸","{n} ₸ per request","每次申请 {n} ₸"],"Сервис «Адал Чек»":["«Адал Чек» сервисі","Service «Адал Чек»","«Адал Чек» 服务"],"Бухгалтерия «ИП Баланс»":["«ИП Баланс» бухгалтериясы","Accounting «ИП Баланс»","«ИП Баланс» 会计服务"],"Расчёт цены и подбор машины — подсказки. Сделка считается согласованной, когда цену приняли и заказчик, и перевозчик.":["Бағаны есептеу және көлік таңдау — кеңестер. Мәміле баға тапсырыс беруші де, тасымалдаушы да қабылдағанда келісілген болып саналады.","Price calculation and truck matching are suggestions. A deal is considered agreed when both the customer and the carrier accept the price.","价格测算与车辆匹配仅作参考。当客户和承运人均接受价格时，交易视为达成。"],"Документы — образцы":["Құжаттар — үлгілер","Documents are templates","文档为范本"],"Заказчик подтверждает получение груза, перевозчик — расчёт. Стороны оценивают друг друга, оценки влияют на рейтинг.":["Тапсырыс беруші жүктің алынғанын, тасымалдаушы есеп айырысуды растайды. Тараптар бір-бірін бағалайды, бағалар рейтингке әсер етеді.","The customer confirms receipt of the cargo, the carrier confirms settlement. The parties rate each other, and the scores affect the rating.","客户确认收货，承运人确认结算。双方互相评价，评价会影响评分。"],"Как оформить юридически":["Заңды түрде қалай рәсімдеу","How to set it up legally","法律上如何办理"],"задание юристу":["заңгерге тапсырма","task for the lawyer","律师任务单"],"Оператор информационной площадки. Договор транспортной экспедиции площадка ни с кем не заключает и экспедитором себя не называет.":["Ақпараттық алаң операторы. Алаң ешкіммен көлік экспедициясы шартын жасаспайды және өзін экспедитор деп атамайды.","Operator of an information platform. The platform does not conclude freight forwarding contracts with anyone and does not call itself a forwarder.","信息平台运营方。平台不与任何人签订货运代理合同，也不自称货运代理。"],"Договор с участниками":["Қатысушылармен шарт","Agreement with participants","与参与方的协议"],"Публичная оферта: пользовательское соглашение на информационные услуги. Доступ к сервису, подбор, образцы документов, карта рейса, чат.":["Жария оферта: ақпараттық қызметтерге пайдаланушы келісімі. Сервиске қолжетімділік, іріктеу, құжат үлгілері, рейс картасы, чат.","Public offer: a user agreement for information services. Access to the service, matching, document templates, trip map, chat.","公开要约：信息服务用户协议。包括服务访问、匹配、文档范本、行程地图、聊天。"],"Плата за сведение сторон. Возникает, когда обе стороны согласовали цену. На комиссию площадка выставляет свой счёт и акт.":["Тараптарды біріктіргені үшін төлем. Екі тарап та бағаны келіскенде туындайды. Комиссияға алаң өз шотын және актісін ұсынады.","A fee for bringing the parties together. It arises when both parties agree on the price. The platform issues its own invoice and completion certificate for the commission.","撮合双方的费用。双方就价格达成一致时产生。平台就佣金单独开具账单和服务验收单。"],"Договор перевозки":["Тасымалдау шарты","Carriage contract","运输合同"],"Заключают заказчик и перевозчик. Площадка готовит образец с их данными и не подписывает его.":["Тапсырыс беруші мен тасымалдаушы жасасады. Алаң олардың деректерімен үлгі дайындайды және оған қол қоймайды.","Concluded by the customer and the carrier. The platform prepares a template with their details and does not sign it.","由客户与承运人签订。平台根据双方信息生成范本，但不签署。"],"Деньги за перевозку":["Тасымал үшін ақша","Money for carriage","运费"],"Идут напрямую от заказчика перевозчику. Площадка их не принимает и не хранит.":["Тапсырыс берушіден тасымалдаушыға тікелей барады. Алаң оларды қабылдамайды және сақтамайды.","Paid directly from the customer to the carrier. The platform does not receive or hold it.","由客户直接支付给承运人。平台不接收也不保管。"],"Ограничение ответственности":["Жауапкершілікті шектеу","Limitation of liability","责任限制"],"Площадка отвечает за работу сервиса, а не за груз, машину, водителя и сроки. Предел ответственности: сумма полученной комиссии.":["Алаң сервистің жұмысы үшін жауап береді, ал жүк, көлік, жүргізуші және мерзімдер үшін емес. Жауапкершілік шегі: алынған комиссия сомасы.","The platform is responsible for the service itself, not for the cargo, truck, driver or deadlines. Liability cap: the amount of commission received.","平台仅对服务运行负责，不对货物、车辆、司机和时效负责。责任上限：已收取的佣金金额。"],"Переписка и история":["Хат алмасу және тарих","Correspondence and history","沟通记录与历史"],"Условие о хранении чата, маршрута и документов и о выдаче их сторонам, суду и госорганам по запросу.":["Чатты, маршрутты және құжаттарды сақтау және оларды тараптарға, сотқа және мемлекеттік органдарға сұрау бойынша беру туралы шарт.","A clause on storing the chat, route and documents and providing them to the parties, the court and government bodies on request.","关于保存聊天、路线和文档，并应要求向双方、法院和政府机关提供的条款。"],"Личные данные":["Жеке деректер","Personal data","个人数据"],"Согласие на сбор и передачу второй стороне после согласования сделки, политика конфиденциальности, хранение данных в Казахстане.":["Мәміле келісілгеннен кейін екінші тарапқа жинауға және беруге келісім, құпиялылық саясаты, деректерді Қазақстанда сақтау.","Consent to collect and share with the other party after the deal is agreed, privacy policy, data storage in Kazakhstan.","同意在交易达成后收集并向另一方提供数据、隐私政策、数据存储于哈萨克斯坦境内。"],"Партнёры":["Серіктестер","Partners","合作伙伴"],"Отдельный договор с каждым партнёром: кто оказывает услугу, размер вознаграждения, кто отвечает перед клиентом.":["Әр серіктеспен жеке шарт: қызметті кім көрсетеді, сыйақы мөлшері, клиент алдында кім жауап береді.","A separate contract with each partner: who provides the service, the fee amount, who is liable to the customer.","与每个合作伙伴单独签订合同：谁提供服务、报酬金额、谁对客户负责。"],"Договор с OPERELLE":["OPERELLE-мен шарт","Agreement with OPERELLE","与 OPERELLE 的协议"],"Чего площадка не делает":["Алаң нені істемейді","What the platform does not do","平台不做的事"],"иначе её признают экспедитором":["әйтпесе оны экспедитор деп таниды","otherwise it would be deemed a forwarder","否则会被认定为货运代理"],"Не принимает деньги за перевозку":["Тасымал үшін ақша қабылдамайды","Does not accept payment for carriage","不接收运费"],"Ни на счёт, ни на баланс. Баланс участника: только подписка и комиссия.":["Шотқа да, балансқа да емес. Қатысушының балансы: тек жазылым мен комиссия.","Neither to an account nor to a balance. A participant's balance: only subscription and commission.","既不进账户，也不进余额。参与方余额：仅限订阅费和佣金。"],"Не подписывает договор перевозки":["Тасымалдау шартына қол қоймайды","Does not sign the carriage contract","不签署运输合同"],"И не выписывает от себя акт и счёт-фактуру на перевозку.":["Сондай-ақ тасымалға өз атынан акт пен шот-фактура жазып бермейді.","And does not issue its own completion certificate or invoice for the shipment.","也不以自己的名义开具运输验收单和发票。"],"Не называет себя экспедитором":["Өзін экспедитор деп атамайды","Does not call itself a freight forwarder","不自称货运代理人"],"Ни в документах, ни на сайте, ни в рекламе. По закону экспедитор сам отвечает за груз.":["Құжаттарда да, сайтта да, жарнамада да. Заң бойынша экспедитор жүк үшін өзі жауап береді.","Not in documents, on the site, or in ads. By law, a freight forwarder is itself liable for the cargo.","无论在文件、网站还是广告中。依法，货运代理人自行对货物负责。"],"Не обещает сохранность и сроки":["Жүктің сақталуына және мерзімге уәде бермейді","Does not promise cargo safety or deadlines","不承诺货物安全和时效"],"Только инструменты: проверка, карта рейса, чат, образцы документов.":["Тек құралдар: тексеру, рейс картасы, чат, құжат үлгілері.","Tools only: verification, trip map, chat, document templates.","仅提供工具：审核、行程地图、聊天、文件模板。"],"Не назначает цену и перевозчика за стороны":["Тараптардың орнына баға мен тасымалдаушыны тағайындамайды","Does not set the price or choose the carrier for the parties","不替双方定价或指定承运人"],"Предлагает варианты. Сделка возникает, когда обе стороны согласились.":["Нұсқалар ұсынады. Мәміле екі тарап келіскенде пайда болады.","Offers options. A deal is made when both sides agree.","提供备选方案。双方同意后交易即成立。"],"Не штрафует":["Айыппұл салмайды","Does not fine","不罚款"],"Неустойка записана в договоре сторон, применяют её сами стороны. Площадка меняет только рейтинг и очередь предложений.":["Тұрақсыздық айыбы тараптар шартында жазылған, оны тараптардың өздері қолданады. Алаң тек рейтингті және ұсыныстар кезегін өзгертеді.","The penalty is written into the parties' contract and applied by the parties themselves. The platform only changes the rating and the offer queue.","违约金写在双方合同中，由双方自行执行。平台只调整评分和报价顺序。"],"Не решает споры":["Дауларды шешпейді","Does not resolve disputes","不裁决争议"],"Выдаёт обеим сторонам историю заказа: переписку, маршрут, документы.":["Екі тарапқа да тапсырыс тарихын береді: хат алмасуды, бағытты, құжаттарды.","Gives both sides the order history: messages, route, documents.","向双方提供订单记录：聊天记录、路线、文件。"],"Не оказывает услуги партнёров":["Серіктестердің қызметтерін көрсетпейді","Does not provide partner services","不提供合作伙伴的服务"],"Страхование, таможня, юрист, электронная подпись: только через партнёров с лицензией.":["Сақтандыру, кеден, заңгер, электрондық қол қою: тек лицензиясы бар серіктестер арқылы.","Insurance, customs, legal, e-signature: only through licensed partners.","保险、报关、律师、电子签名：仅通过持牌合作伙伴办理。"],"Это проект правил":["Бұл ережелер жобасы","This is a draft of the rules","这是规则草案"],"GPS и телематика":["GPS және телематика","GPS and telematics","GPS 和车联网"],"Маркетинг":["Маркетинг","Marketing","营销"],"Документы и ЭЦП":["Құжаттар және ЭЦҚ","Documents and e-signature","文件与电子签名"],"Трекинг":["Трекинг","Tracking","追踪"],"Сообщения":["Хабарламалар","Messages","消息"],"Открыть студию":["Студияны ашу","Open studio","打开工作室"],"Ролик о компании":["Компания туралы б 和文件的控制台。可用鼠标拖动地图，双击放大。城市旁的绿色标记：空闲的已验证车辆。"],"Скоринг до {n} баллов: близость к погрузке {n}, пунктуальность {n}, рейтинг {n}, геолокация {n}, цена {n}. Цена у каждого своя: по направлению, за км или с поправкой на возраст машины.":["Скоринг {n} балға дейін: тиеу орнына жақындық {n}, уақтылылық {n}, рейтинг {n}, геолокация {n}, баға {n}. Әркімнің бағасы өзінше: бағыт бойынша, км үшін немесе көлік жасына түзетумен.","Scoring up to {n} points: proximity to loading {n}, punctuality {n}, rating {n}, geolocation {n}, price {n}. Each carrier has their own price: by route, per km or adjusted for vehicle age.","评分最高 {n} 分：距装货点 {n}，准时性 {n}，评级 {n}，定位 {n}，价格 {n}。每家价格不同：按线路、按公里或按车龄调整。"],"Карта СНГ: двигайте мышью, приближайте кнопками или двойным щелчком. Нажмите на машину — откроется пульт рейса со стоянками, чатом и документами.":["ТМД картасы: тінтуірмен жылжытыңыз, түймелермен немесе қос шертумен үлкейтіңіз. Көлікті басыңыз: тұрақтар, чат және құжаттар бар рейс пульті ашылады.","CIS map: drag with the mouse, zoom with the buttons or a double-click. Click a truck to open the trip console with stops, chat and documents.","独联体地图：用鼠标拖动，用按钮或双击缩放。点击车辆，打开含停靠点、聊天和文件的行程控制台。"],"стоянок {n}":["тұрақ {n}","stops {n}","停靠 {n} 次"],"всего {n} ч":["барлығы {n} сағ","total {n} h","共 {n} 小时"],"прибытие {n} {n}:{n}":["келуі {n} {n}:{n}","arrival {n} {n}:{n}","到达 {n} {n}:{n}"],"Больше {n} км от коридора — сигнал диспетчеру":["Дәлізден {n} км-ден астам: диспетчерге белгі","More than {n} km off the corridor: alert to dispatcher","偏离路线走廊超过 {n} 公里：提醒调度员"],"Лента Про:":["Про лентасы:","Pro feed:","专业版信息流："],"OPERELLE собирает объявления по API бирж и с разрешения владельцев каналов и передаёт их как есть: за груз и цену отвечает автор объявления. Тариф можно сменить в любой момент.":["OPERELLE хабарландыруларды биржалардың API арқылы және арна иелерінің рұқсатымен жинап, сол күйінде береді: жүк пен баға үшін хабарландыру авторы жауап береді. Тарифті кез келген уақытта ауыстыруға болады.","OPERELLE collects listings via exchange APIs and with channel owners' permission and passes them on as is: the author of the listing is responsible for the cargo and price. You can change the plan at any time.","OPERELLE 通过货运交易平台 API 并经频道所有者许可收集信息，原样转交：货物和价格由信息发布者负责。可随时更换套餐。"],"Агент собирает объявления с бирж, из чатов и с сайта, распознаёт маршрут, тип машины, вес и ставку, отсеивает дубликаты и сразу показывает, есть ли рядом свободная машина.":["Агент хабарландыруларды биржалардан, чаттардан және сайттан жинайды, маршрутты, көлік түрін, салмақ пен мөлшерлемені таниды, қайталанғандарын алып тастайды және жақын жерде бос көлік бар-жоғын бірден көрсетеді.","The agent collects listings from exchanges, chats and the website, recognizes the route, truck type, weight and rate, filters out duplicates and shows right away whether a free truck is nearby.","智能体从交易平台、聊天群和网站收集信息，识别线路、车型、重量和运价，剔除重复，并立即显示附近是否有空闲车辆。"],"расчётная":["есептік","estimated","估算"],"Собираются только открытые объявления и данные по официальным API и договорам с площадками. Перед запуском каждого источника проверяется пользовательское соглашение. Контакты отправителей не публикуются.":["Тек ашық хабарландырулар мен ресми API және алаңдармен жасалған шарттар бойынша деректер жиналады. Әр дереккөзді іске қоспас бұрын пайдаланушы келісімі тексеріледі. Жөнелтушілердің байланыстары жарияланбайды.","Only public listings and data under official APIs and agreements with platforms are collected. Each source's user agreement is checked before it is launched. Senders' contacts are not published.","仅收集公开信息以及通过官方 API 和平台协议获得的数据。每个来源启用前都会核查其用户协议。不公开发货人联系方式。"],"налоги:":["салықтар:","taxes:","税费："],"Гостевой просмотр завершён":["Қонақ ретінде қарау аяқталды","Guest preview ended","访客浏览已结束"],"Услугу оказывает партнёр по своему договору и лицензии. Площадка только передаёт заявку: не принимает деньги за услугу и не отвечает за её результат. Доход площадки здесь: комиссия или подписка от партнёра.":["Қызметті серіктес өз шарты мен лицензиясы бойынша көрсетеді. Алаң тек өтінімді береді: қызмет үшін ақша қабылдамайды және оның нәтижесіне жауап бермейді. Мұндағы алаң табысы: серіктестен комиссия немесе жазылым.","The service is provided by a partner under its own contract and license. The platform only forwards the request: it does not accept payment for the service and is not responsible for the result. The platform's income here: a commission or subscription from the partner.","服务由合作方依据其自身合同和许可提供。平台仅转交申请：不收取服务费用，也不对结果负责。平台在此的收入：合作方支付的佣金或订阅费。"],"Помощь на трассе":["Жолдағы көмек","Roadside assistance","道路救援"],"Медцентр «Рейс Мед» ·":["«Рейс Мед» медорталығы ·","Reis Med medical center ·","Reis Med 医疗中心 ·"],"за заявку":["өтінім үшін","per request","每次申请"],"Бухгалтерия «ИП Баланс» ·":["«ИП Баланс» бухгалтериясы ·","IP Balans accounting ·","IP Balans 会计服务 ·"],"Юридическая фирма «Жол Құқық» ·":["«Жол Құқық» заң фирмасы ·","Zhol Kukyk law firm ·","Zhol Kukyk 律师事务所 ·"],"Даёт программу бесплатно: панель управления и сайт. Отвечает за то, чтобы программа работала. Зарабатывает на услугах: лента заказов, агенты, страхование, интеграции. В перевозках, договорах и расчётах компании не участвует и личных данных не получает.":["Бағдарламаны тегін береді: басқару панелі мен сайт. Бағдарламаның жұмыс істеуіне жауап береді. Қызметтерден табыс табады: тапсырыс лентасы, агенттер, сақтандыру, интеграциялар. Компанияның тасымалдарына, шарттары мен есеп айырысуларына қатыспайды және жеке деректерді алмайды.","Provides the software for free: the dashboard and the website. Is responsible for keeping the software running. Earns from services: order feed, agents, insurance, integrations. Takes no part in the company's shipments, contracts or payments and receives no personal data.","免费提供软件：管理面板和网站。负责软件正常运行。通过服务盈利：订单信息流、智能体、保险、集成。不参与公司的运输、合同和结算，也不获取个人数据。"],"Панель и сайт OPERELLE даёт бесплатно. Платные только услуги, которые вы включаете сами: лента заказов, токены агентов, страховка, интеграции. Заказы, клиенты, переписка и документы остаются у компании: OPERELLE получает только обезличенную сводку.":["Панель мен сайтты OPERELLE тегін береді. Тек өзіңіз қосатын қызметтер ақылы: тапсырыс лентасы, агент токендері, сақтандыру, интеграциялар. Тапсырыстар, клиенттер, хат алмасу мен құжаттар компанияда қалады: OPERELLE тек иесіздендірілген жиынтықты алады.","OPERELLE provides the dashboard and website for free. Only the services you turn on yourself are paid: order feed, agent tokens, insurance, integrations. Orders, clients, messages and documents stay with the company: OPERELLE receives only an anonymized summary.","OPERELLE 免费提供面板和网站。只有您自行开启的服务收费：订单信息流、智能体代币、保险、集成。订单、客户、通信和文件归公司所有：OPERELLE 只获得匿名汇总。"],"Подключение к DURUS AI Marketing Studio бесплатно. Страхование идёт по договору OPERELLE со страховой компанией. Каждый сервис оказывает свою услугу сам и отвечает за неё сам; цены предварительные.":["DURUS AI Marketing Studio-ға қосылу тегін. Сақтандыру OPERELLE-дің сақтандыру компаниясымен жасасқан шарты бойынша жүреді. Әр сервис өз қызметін өзі көрсетеді және оған өзі жауап береді; бағалар алдын ала.","Connecting to DURUS AI Marketing Studio is free. Insurance runs under OPERELLE's contract with an insurance company. Each service provides its own service and is responsible for it; prices are preliminary.","接入 DURUS AI Marketing Studio 免费。保险依据 OPERELLE 与保险公司的合同办理。各服务商自行提供服务并自行负责；价格为初步报价。"],"в месяц за машину":["бір көлікке айына","per vehicle per month","每车每月"],"Коннектор":["Коннектор","Connector","连接器"],"Демо: отправка из панели имитируется. Кнопка «Скопировать и открыть студию» работает уже сейчас. Прямая отправка заработает после подключения ключа API студии.":["Демо: панельден жіберу имитацияланады. «Көшіріп, студияны ашу» түймесі қазірдің өзінде жұмыс істейді. Тікелей жіберу студияның API кілті қосылғаннан кейін іске қосылады.","Demo: sending from the dashboard is simulated. The «Copy and open the studio» button already works. Direct sending will work once the studio API key is connected.","演示：从面板发送为模拟。「复制并打开工作室」按钮现已可用。接入工作室 API 密钥后即可直接发送。"],"Студия работает на своём сайте и берёт плату токенами по своему тарифу. Панель готовит задачу из данных компании: маршрутов, свободных машин, названия и сайта. Ролики и публикации делает студия и отвечает за них сама. Встроить окно студии в панель нельзя: её сайт открывается только в отдельной вкладке.":["Студия өз сайтында жұмыс істейді және өз тарифі бойынша токенмен ақы алады. Панель тапсырманы компания деректерінен дайындайды: маршруттар, бос көліктер, атауы мен сайты. Роликтер мен жарияланымдарды студия жасайды және оларға өзі жауап береді. Студия терезесін панельге енгізу мүмкін емес: оның сайты тек жеке қойындыда ашылады.","The studio runs on its own website and charges in tokens under its own pricing. The dashboard prepares a brief from company data: routes, free trucks, name and website. The studio makes the videos and posts and is responsible for them. The studio window can't be embedded in the dashboard: its site opens only in a separate tab.","工作室在其自有网站运行，按自身价格以代币收费。面板根据公司数据准备任务：线路、空闲车辆、名称和网站。视频和发布内容由工作室制作并自行负责。工作室窗口无法嵌入面板：其网站只能在单独的标签页中打开。"],"Сканы и оригиналы привязаны к заказу, водителю и машине. Доступ — по ролям, каждое открытие записывается в журнал. Наружу документы не пересылаются.":["Скандар мен түпнұсқалар тапсырысқа, жүргізушіге және көлікке байланған. Қолжетімділік рөлдер бойынша, әр ашылу журналға жазылады. Құжаттар сыртқа жіберілмейді.","Scans and originals are linked to the order, driver and truck. Access is role-based; every opening is logged. Documents are not sent outside.","扫描件和原件与订单、司机和车辆关联。按角色授权访问，每次打开都会记录日志。文件不对外发送。"],"Закрытие трассы из-за погоды":["Ауа райына байланысты жолдың жабылуы","Road closure due to weather","因天气封路"],"Закрытие трассы, погода":["Жолдың жабылуы, ауа райы","Road closure, weather","封路，天气原因"],"Рейс LG-{n} опаздывает":["LG-{n} рейсі кешігіп жатыр","Trip LG-{n} is running late","行程 LG-{n} 延误"],"LG-{n}, участок Кызылорда — Актобе. Вероятно, зона без покрытия. Агент связи запросил геолокацию в мессенджере.":["LG-{n}, Қызылорда — Ақтөбе учаскесі. Байланыс жоқ аймақ болуы мүмкін. Байланыс агенті мессенджерде геолокацияны сұрады.","LG-{n}, Kyzylorda — Aktobe section. Probably a no-coverage zone. The communication agent requested geolocation in the messenger.","LG-{n}，克孜勒奥尔达 — 阿克托别路段。可能是无信号区。通讯智能体已通过即时通讯请求定位。"],"в том числе НДС {n}%:":["оның ішінде ҚҚС {n}%:","incl. VAT {n}%:","含增值税 {n}%："],". Коэффициенты: международный ×{n} · плечо по КНР ×{n} · ДОПОГ ×{n} · негабарит ×{n} · срочно ×{n} · экипаж ×{n} · попутно ×{n}. Ставки демонстрационные — настройте под свой рынок.":[". Коэффициенттер: халықаралық ×{n} · ҚХР бойынша иық ×{n} · ДОПОГ ×{n} · габаритсіз ×{n} · шұғыл ×{n} · экипаж ×{n} · жолай ×{n}. Мөлшерлемелер демонстрациялық, өз нарығыңызға баптаңыз.",". Multipliers: international ×{n} · China leg ×{n} · ADR ×{n} · oversized ×{n} · urgent ×{n} · two-driver crew ×{n} · backhaul ×{n}. Rates are for demo: adjust them to your market.","。系数：国际 ×{n} · 中国段 ×{n} · 危险品 ADR ×{n} · 超限 ×{n} · 加急 ×{n} · 双司机 ×{n} · 顺路 ×{n}。运价为演示数据，请按您的市场调整。"],"Заказчик платит перевозчику напрямую по их договору. Площадка получает комиссию за сведение сторон, подписку и вознаграждение от партнёров. Оборот сделок показан для статистики.":["Тапсырыс беруші тасымалдаушыға олардың шарты бойынша тікелей төлейді. Алаң тараптарды табыстырғаны үшін комиссия, жазылым және серіктестерден сыйақы алады. Мәмілелер айналымы статистика үшін көрсетілген.","The customer pays the carrier directly under their contract. The platform earns a commission for matching the parties, a subscription and partner fees. Deal turnover is shown for statistics.","客户依据双方合同直接向承运人付款。平台收取撮合佣金、订阅费和合作方报酬。交易额仅用于统计展示。"],"по данным сторон, просрочено":["тараптардың деректері бойынша, мерзімі өткен","per the parties' data, overdue","据双方数据，已逾期"],"Его начисляет перевозчик на свою услугу. Оборот сделок по РК в текущих заказах":["Оны тасымалдаушы өз қызметіне есептейді. Ағымдағы тапсырыстардағы ҚР бойынша мәмілелер айналымы","The carrier charges it on its own service. Deal turnover in Kazakhstan in current orders","由承运人对其服务计收。当前订单中哈萨克斯坦境内的交易额"],", в том числе НДС":[", оның ішінде ҚҚС",", incl. VAT","，其中增值税"],". Счёт-фактуру выписывает перевозчик, площадка готовит образец.":[". Шот-фактураны тасымалдаушы жазады, алаң үлгісін дайындайды.",". The carrier issues the VAT invoice; the platform prepares a template.","。增值税发票由承运人开具，平台准备样本。"],"Площадка платит налоги только со своего дохода: комиссии, подписок и вознаграждения партнёров. На комиссию она выписывает свой счёт перевозчику.":["Алаң салықты тек өз табысынан төлейді: комиссия, жазылым және серіктестер сыйақысы. Комиссияға ол тасымалдаушыға өз шотын жазады.","The platform pays taxes only on its own income: commissions, subscriptions and partner fees. It issues its own invoice to the carrier for the commission.","平台仅就自身收入纳税：佣金、订阅费和合作方报酬。佣金由平台向承运人开具自己的账单。"],"Для заказчиков на общем режиме система в первую очередь предлагает перевозчиков с НДС. Ставку и режим проверяйте по действующему Налоговому кодексу.":["Жалпы режимдегі тапсырыс берушілерге жүйе алдымен ҚҚС төлеуші тасымалдаушыларды ұсынады. Мөлшерлеме мен режимді қолданыстағы Салық кодексі бойынша тексеріңіз.","For customers on the general tax regime, the system first suggests VAT-registered carriers. Check the rate and regime against the current Tax Code.","对于一般纳税制度的客户，系统优先推荐增值税纳税承运人。税率和制度请以现行《税法典》为准。"],"комиссия":["комиссия","commission","佣金"],"+ допуслуги":["+ қосымша қызметтер","+ extra services","+ 附加服务"],"после расходов":["шығыстардан кейін","after expenses","扣除支出后"],"вложения":["салым","investment","投入"],"{n} рейсов ·":["{n} рейс ·","{n} trips ·","{n} 趟 ·"],"дохода":["табыстың","of income","收入"],"Модель упрощённая: доход = рейсы × средняя ставка × комиссия, плюс {n}% допуслуг (страхование, таможня, простой). Один диспетчер вручную ведёт около {n} рейсов в месяц, с автоподбором и автодокументами — около {n}.":["Модель жеңілдетілген: табыс = рейстер × орташа мөлшерлеме × комиссия, плюс {n}% қосымша қызметтер (сақтандыру, кеден, тұрып қалу). Бір диспетчер қолмен айына шамамен {n} рейс жүргізеді, автоіріктеу мен автоқұжаттармен шамамен {n}.","Simplified model: income = trips × average rate × commission, plus {n}% extra services (insurance, customs, downtime). One dispatcher handles about {n} trips a month manually, about {n} with auto-matching and auto-documents.","简化模型：收入 = 行程数 × 平均运价 × 佣金，另加 {n}% 附加服务（保险、清关、等待）。一名调度员手动每月处理约 {n} 趟，借助自动匹配和自动单据约 {n} 趟。"],"{n} токенов за":["{n} токен бағасы","{n} tokens for","{n} 代币，价格"],"Диспетчер получает ссылку и код, открывает панель в браузере и ставит её как приложение на компьютер или телефон. Вход по своему коду, сессию можно отозвать в один щелчок.":["Диспетчер сілтеме мен код алады, панельді браузерде ашып, оны компьютерге немесе телефонға қосымша ретінде орнатады. Кіру өз коды бойынша, сессияны бір шертумен қайтарып алуға болады.","The dispatcher gets a link and a code, opens the dashboard in a browser and installs it as an app on a computer or phone. Sign-in with their own code; the session can be revoked in one click.","调度员收到链接和代码，在浏览器中打开面板，并将其作为应用安装到电脑或手机。使用个人代码登录，一键即可撤销会话。"],"База компаний Казахстана":["Қазақстан компанияларының базасы","Kazakhstan company database","哈萨克斯坦公司数据库"],"Валюты и курсы":["Валюталар мен бағамдар","Currencies and rates","货币与汇率"],"прибыль":["пайда","profit","利润"],"Около":["Шамамен","About","约"],"за документ оператору":["операторға құжат үшін","per document to the operator","每份文件付给运营商"],"за установленный трекер и {n}% абонплаты":["орнатылған трекер үшін және абоненттік төлемнің {n}%-ы","per installed tracker and {n}% of the subscription fee","每台已安装追踪器，另加 {n}% 月费"],"с диалога":["диалогтан","per dialogue","每次对话"],"за диалог официальному провайдеру":["ресми провайдерге диалог үшін","per dialogue to the official provider","每次对话付给官方服务商"],"с SMS":["SMS-тан","per SMS","每条短信"],"за SMS шлюзу":["шлюзге SMS үшін","per SMS to the gateway","每条短信付给网关"]
