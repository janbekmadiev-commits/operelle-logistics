r car tires, {n} pcs","轿车轮胎，{n} 条"],"Это большая партия: закажите отдельную машину.":["Бұл үлкен партия: бөлек көлікке тапсырыс беріңіз.","This is a large shipment: order a dedicated truck.","这批货量较大：请预订专车。"],"Я в {c}, найди груз до Астаны, тент {n} тонн":["Мен {c} қаласындамын, Астанаға дейін жүк тап, тент {n} тонна","I'm in {c}, find me a load to Astana, curtainsider {n} tons","我在{c}，帮我找去阿斯塔纳的货，篷布车 {n} 吨"],"ядовитые и радиоактивные вещества без спецразрешения":["арнайы рұқсатсыз улы және радиоактивті заттар","toxic and radioactive substances without a special permit","无特别许可的有毒和放射性物质"],"✓ все заявки без задержки":["✓ барлық өтінімдер кідіріссіз","✓ all requests, no delay","✓ 所有运输需求，无延迟"],"{n} машины завтра разгрузятся в Астане. В ленте OPERELLE {n} грузов в сторону {c} — попутная ставка даст +{n}% к марже.":["{n} көлік ертең Астанада жүк түсіреді. OPERELLE легінде {n} жүк {c} бағытына барады — жолай мөлшерлеме маржаға +{n}% қосады.","{n} trucks will unload in Astana tomorrow. The OPERELLE feed has {n} loads heading toward {c} — a backhaul rate adds +{n}% to margin.","{n} 辆车明天在阿斯塔纳卸货。OPERELLE 需求流中有 {n} 批发往{c}方向的货物，顺路运价可使利润率 +{n}%。"],"Анкету заполнил AI-регистратор по фото документов: снимки читаются, данные сверены между собой. Кабинет уже открыт, первые три рейса под усиленным контролем. Заявка с сайта. Фото машин: {n}. Документы ещё не загружены — запросите их кнопкой «Запросить документы».":["Анкетаны AI-тіркеуші құжаттардың фотосы бойынша толтырды: суреттер оқылады, деректер өзара салыстырылды. Жеке кабинет ашылған, алғашқы үш рейс күшейтілген бақылауда. Сайттан өтінім. Көлік фотолары: {n}. Құжаттар әлі жүктелмеген — оларды «Құжаттарды сұрау» түймесімен сұраңыз.","The AI registrar filled in the form from document photos: the images are readable and the data has been cross-checked. The account is already open; the first three trips are under enhanced control. Request from the website. Truck photos: {n}. Documents are not uploaded yet — request them with the «Request documents» button.","申请表由AI登记员根据文件照片填写：照片清晰可读，数据已相互核对。个人中心已开通，前三趟行程加强监控。网站申请。车辆照片：{n}。文件尚未上传，请点击«索取文件»按钮索取。"],"Водитель пишет или говорит, куда едет: агент находит грузы под его машину и допуски":["Жүргізуші қайда бара жатқанын жазады немесе айтады: агент оның көлігі мен рұқсаттарына сай жүктерді табады","The driver types or says where they're headed: the agent finds cargo that fits their truck and permits","司机写下或说出目的地：智能体按其车辆和许可找货"],"Выберите направления и машину. Покажем только те грузы, которые вы можете взять.":["Бағыттар мен көлікті таңдаңыз. Тек сіз ала алатын жүктерді көрсетеміз.","Choose your routes and truck. We'll show only the cargo you can take.","请选择线路和车辆。我们只显示您能承运的货物。"],"Грузовладельцам: бесплатно, без подписки и комиссии. Попутный груз: от {n} ₸, цена зависит от веса и расстояния. Комиссию перевозчик платит только с согласованного рейса.":["Жүк иелеріне: тегін, жазылымсыз және комиссиясыз. Жолай жүк: {n} ₸ бастап, баға салмақ пен қашықтыққа байланысты. Тасымалдаушы комиссияны тек келісілген рейстен төлейді.","For shippers: free, with no subscription or commission. Partial load: from {n} ₸; the price depends on weight and distance. The carrier pays a commission only on an agreed trip.","货主：免费，无订阅费和佣金。顺路货：{n} ₸ 起，价格取决于重量和距离。承运人仅就已达成的行程支付佣金。"],"Грузы берут перевозчики. Вам я помогу рассчитать цену и оформить заявку.":["Жүктерді тасымалдаушылар алады. Сізге бағаны есептеуге және өтінімді рәсімдеуге көмектесемін.","Cargo is taken by carriers. I can help you calculate the price and submit a request.","货物由承运人承接。我可以帮您计算价格并提交运输需求。"],"Грузы по разрешению: опасные по ДОПОГ, лекарства, алкоголь и табак, оружие. Их отмечают в заявке и указывают номер разрешения. Такой груз увидят только перевозчики с допуском.":["Рұқсат құжаты қажет жүктер: ДОПОГ (ADR) бойынша қауіпті жүктер, дәрілер, алкоголь мен темекі, қару. Оларды өтінімде белгілеп, рұқсат құжатының нөмірін көрсетеді. Мұндай жүкті тек рұқсаты бар тасымалдаушылар көреді.","Cargo requiring authorization: ADR dangerous goods, medicines, alcohol and tobacco, weapons. Mark it in the request and enter the authorization number. Only carriers with a permit will see such cargo.","需批文的货物：ADR危险品、药品、酒类和烟草、武器。须在运输需求中注明并填写批文编号。此类货物仅对持有许可的承运人可见。"],"Демо: текст с настоящих фото не распознаётся, заполните поля ниже. В рабочей версии их заполняет агент.":["Демо: нақты фотолардағы мәтін танылмайды, төмендегі өрістерді толтырыңыз. Жұмыс нұсқасында оларды агент толтырады.","Demo: text from real photos is not recognized, so fill in the fields below. In the live version the agent fills them in.","演示：无法识别真实照片中的文字，请填写下方字段。正式版中由智能体填写。"],"Для ваших машин подобрано грузов: {n}. Показаны только те, которые машина может взять.":["Көліктеріңізге іріктелген жүктер: {n}. Тек көлік ала алатындары көрсетілген.","Loads matched to your trucks: {n}. Only those a truck can take are shown.","为您的车辆匹配的货物：{n}。仅显示车辆可承运的货物。"],"ДОПОГ, класс {n}. Легковоспламеняющиеся жидкости: бензин, краски, растворители":["ДОПОГ (ADR), {n}-сынып. Тез тұтанатын сұйықтықтар: бензин, бояулар, еріткіштер","ADR class {n}. Flammable liquids: gasoline, paints, solvents","ADR危险品第 {n} 类。易燃液体：汽油、油漆、溶剂"],"Если возите опасные грузы, добавьте свидетельство ДОПОГ. Присылайте всё сразу или по одному: я разложу сам и скажу, чего не хватает.":["Қауіпті жүк тасысаңыз, ДОПОГ (ADR) куәлігін қосыңыз. Бәрін бірден немесе бір-бірден жіберіңіз: өзім реттеп, не жетіспейтінін айтамын.","If you haul dangerous goods, add your ADR certificate. Send everything at once or one by one: I'll sort it myself and tell you what's missing.","如果您运输危险品，请添加 ADR危险品证书。可一次全部发送或逐张发送：我会自行整理并告诉您还缺什么。"],"Если машина опломбирована, попутный груз брать нельзя: пломбу не вскрывают до выгрузки. Выберите рейс, который ещё не загружен.":["Көлік пломбаланған болса, жолай жүк алуға болмайды: пломба түсіргенге дейін ашылмайды. Әлі тиелмеген рейсті таңдаңыз.","If the truck is sealed, it can't take a partial load: the seal is not broken until unloading. Choose a trip that hasn't been loaded yet.","车辆已铅封时不能接顺路货：卸货前不得拆封。请选择尚未装货的行程。"],"Если машина опломбирована, попутный груз брать нельзя: пломбу не вскрывают до выгрузки. Опасные и лицензируемые грузы попутно не возят. Мелкие партии от {n} кг или {n} м³ размещают отправители на сайте и присылает OPERELLE.":["Көлік пломбаланған болса, жолай жүк алуға болмайды: пломба түсіргенге дейін ашылмайды. Қауіпті және лицензияланатын жүктер жолай тасымалданбайды. {n} кг немесе {n} м³ бастап шағын партияларды жөнелтушілер сайтта орналастырады және OPERELLE жібереді.","If the truck is sealed, it can't take a partial load: the seal is not broken until unloading. Dangerous and licensed cargo is not carried as a partial load. Small shipments from {n} kg or {n} m³ are posted by senders on the website and sent by OPERELLE.","车辆已铅封时不能接顺路货：卸货前不得拆封。危险品和需许可证的货物不作顺路货运输。{n} 公斤或 {n} m³ 起的小批量货物由发货人在网站发布，并由 OPERELLE 推送。"],"Жду фото документов. Нажмите «Прислать фото» или посмотрите на демо-документах.":["Құжаттардың фотосын күтемін. «Фото жіберу» түймесін басыңыз немесе демо-құжаттардан көріңіз.","Waiting for photos of your documents. Tap «Send photos» or try it with demo documents.","等待文件照片。请点击«发送照片»，或用演示文件查看效果。"],"Заявка на попутный груз отправлена. Контакты отправителя откроются после его согласия.":["Жолай жүкке өтінім жіберілді. Жөнелтушінің байланыс деректері ол келіскеннен кейін ашылады.","Partial load request sent. The sender's contacts will open once they agree.","顺路货申请已发送。发货人同意后将显示其联系方式。"],"Заявки присылает OPERELLE. Контакт отправителя открывается, когда вы берёте заявку в работу. OPERELLE в сделке не участвует: о цене и условиях вы договариваетесь с отправителем сами.":["Өтінімдерді OPERELLE жібереді. Жөнелтушінің байланысы өтінімді жұмысқа алған кезде ашылады. OPERELLE мәмілеге қатыспайды: баға мен шарттар туралы жөнелтушімен өзіңіз келісесіз.","Requests are sent by OPERELLE. The sender's contact opens when you take a request on. OPERELLE is not a party to the deal: you agree on price and terms with the sender yourself.","运输需求由 OPERELLE 推送。您接手某条需求后，即可查看发货人联系方式。OPERELLE 不参与交易：价格和条件由您与发货人自行商定。"],"Изменён {n}.{n}. Хранится в зашифрованном виде, его не видит никто.":["{n}.{n} күні өзгертілген. Шифрланған түрде сақталады, оны ешкім көрмейді.","Changed {n}.{n}. Stored encrypted; no one can see it.","修改于 {n}.{n}。加密存储，任何人都看不到。"],"Какая у вас машина? Напишите, например: «тент {n} тонн», «рефрижератор», «Газель». Я покажу только те грузы, которые она может взять.":["Көлігіңіз қандай? Мысалы, былай жазыңыз: «тент {n} тонна», «рефрижератор», «Газель». Тек сол көлік ала алатын жүктерді көрсетемін.","What truck do you have? Type, for example: «curtainsider {n} tons», «reefer», «GAZelle». I'll show only the cargo it can take.","您开什么车？例如可以写：«篷布车 {n} 吨»、«冷藏车»、«嘎斯轻卡»。我只显示它能承运的货物。"],"легковоспламеняющиеся жидкости, газ и кислоты без оформления по ДОПОГ":["ДОПОГ (ADR) бойынша рәсімделмеген тез тұтанатын сұйықтықтар, газ және қышқылдар","flammable liquids, gas and acids without ADR paperwork","未按 ADR危险品规定办理手续的易燃液体、气体和酸类"],"Маршрут, машина, вес и ставка распознаны. Заявки разложены по компаниям: под машины и направления каждой.":["Маршрут, көлік, салмақ және мөлшерлеме танылды. Өтінімдер компаниялар бойынша бөлінді: әрқайсысының көліктері мен бағыттарына сай.","Route, truck, weight and rate recognized. Requests are sorted by company: matched to each one's trucks and routes.","已识别路线、车辆、重量和运价。运输需求已按公司分配：匹配各公司的车辆和线路。"],"Можно выбрать несколько направлений. Иностранным перевозчикам: отметьте «Еду домой», и мы покажем грузы в вашу страну.":["Бірнеше бағытты таңдауға болады. Шетелдік тасымалдаушыларға: «Үйге қайтамын» дегенді белгілеңіз, сонда еліңізге баратын жүктерді көрсетеміз.","You can choose several routes. Foreign carriers: check «Heading home» and we'll show cargo going to your country.","可选择多条线路。外国承运人：勾选«回家»，我们将显示发往您所在国家的货物。"],"Напишите или скажите, что нужно. Диспетчер знает вашу машину и допуски и ищет грузы сам.":["Не қажет екенін жазыңыз немесе айтыңыз. Диспетчер көлігіңіз бен рұқсаттарыңызды біледі және жүктерді өзі іздейді.","Type or say what you need. The dispatcher knows your truck and permits and finds cargo on its own.","写下或说出您的需求。调度员了解您的车辆和许可，会自行找货。"],"Напишите, куда едете: попутные грузы подбираются по пути. Например: «попутный груз {c} {c}».":["Қайда бара жатқаныңызды жазыңыз: жолай жүктер жол бойынан іріктеледі. Мысалы: «жолай жүк {c} {c}».","Tell me where you're headed: partial loads are matched along the way. For example: «partial load {c} {c}».","请写下您的目的地：顺路货按途经路线匹配。例如：«顺路货 {c} {c}»。"],"Не показаны: другой кузов {n}, вес или размер {n}, нужен допуск {n}, мелкая партия {n}.":["Көрсетілмеген: басқа шанақ {n}, салмағы немесе өлшемі {n}, рұқсат қажет {n}, шағын партия {n}.","Not shown: different body {n}, weight or size {n}, permit required {n}, small shipment {n}.","未显示：车厢不符 {n}，重量或尺寸不符 {n}，需要许可 {n}，小批量 {n}。"],"Небольшой груз заберёт машина, которая едет по вашему направлению и у которой есть место. Дешевле отдельной машины.":["Шағын жүкті сіздің бағытыңызбен келе жатқан, бос орны бар көлік алып кетеді. Бөлек көліктен арзанырақ.","A small load is picked up by a truck already heading your way with space to spare. Cheaper than a dedicated truck.","小件货物由顺您线路行驶且有空位的车辆捎带。比专车便宜。"],"Объявление увидят перевозчики, которые едут по этому направлению и у которых есть место. Срок зависит от попутного рейса. Если машина опломбирована, попутный груз брать нельзя: пломбу не вскрывают до выгрузки.":["Хабарландыруды осы бағытпен жүретін және бос орны бар тасымалдаушылар көреді. Мерзім жолай рейске байланысты. Көлік пломбаланған болса, жолай жүк алуға болмайды: пломба түсіргенге дейін ашылмайды.","The listing will be seen by carriers heading this way with space available. Timing depends on the matching trip. If the truck is sealed, it can't take a partial load: the seal is not broken until unloading.","走这条线路且有空位的承运人会看到此信息。时效取决于顺路行程。车辆已铅封时不能接顺路货：卸货前不得拆封。"],"Отметьте допуски, которые есть у водителя и машины. Грузы по разрешению, например кислоты или топливо, видят только перевозчики с допуском. Диспетчер попросит подтверждающий документ.":["Жүргізуші мен көлікте бар рұқсаттарды белгілеңіз. Рұқсат құжаты қажет жүктерді, мысалы қышқылдарды немесе отынды, тек рұқсаты бар тасымалдаушылар көреді. Диспетчер растайтын құжатты сұрайды.","Check the permits the driver and truck have. Cargo requiring authorization, such as acids or fuel, is visible only to carriers with a permit. The dispatcher will ask for a supporting document.","请勾选司机和车辆具备的许可。需批文的货物（如酸类或燃料）仅对持有许可的承运人可见。调度员会要求提供证明文件。"],"Перевозчики регистрируются по коду приглашения от диспетчера. Напишите код.":["Тасымалдаушылар диспетчер берген шақыру коды бойынша тіркеледі. Кодты жазыңыз.","Carriers register with an invitation code from the dispatcher. Enter the code.","承运人凭调度员提供的邀请码注册。请输入邀请码。"],"Платит только перевозчик и только за результат. Грузовладельцам площадка бесплатна.":["Тек тасымалдаушы және тек нәтиже үшін төлейді. Жүк иелеріне алаң тегін.","Only the carrier pays, and only for results. The platform is free for shippers.","只有承运人付费，且仅按结果付费。平台对货主免费。"],"По пути этого рейса попутных грузов на свободное место сейчас нет":["Бұл рейстің жолында бос орынға жолай жүктер қазір жоқ","No partial loads for the free space along this trip right now","此行程沿途目前没有可装入空位的顺路货"],"Показаны грузы, ради которых крюк не больше {n}% пути и {n} км. Опасные и лицензируемые грузы попутно не возят.":["Жолдан ауытқуы жолдың {n}% және {n} км шегінен аспайтын жүктер көрсетілген. Қауіпті және лицензияланатын жүктер жолай тасымалданбайды.","Showing cargo that requires a detour of no more than {n}% of the route and {n} km. Dangerous and licensed cargo is not carried as a partial load.","显示绕路不超过路程 {n}% 且不超过 {n} 公里的货物。危险品和需许可证的货物不作顺路货运输。"],"Показывает заявки OPERELLE, которые могут выполнить ваши машины, без дубликатов":["Көліктеріңіз орындай алатын OPERELLE өтінімдерін қайталанбасыз көрсетеді","Shows OPERELLE requests your trucks can fulfill, without duplicates","显示您的车辆可承接的 OPERELLE 运输需求，无重复"],"Принимает фото документов, заполняет анкету, сверяет данные и регистрирует перевозчика":["Құжаттардың фотосын қабылдайды, анкетаны толтырады, деректерді салыстырады және тасымалдаушыны тіркейді","Accepts document photos, fills in the form, cross-checks the data and registers the carrier","接收文件照片、填写申请表、核对数据并注册承运人"],"Рейс LG-{n} идёт под пломбой KZ{n}: попутный груз добавить нельзя.":["LG-{n} рейсі KZ{n} пломбасымен келе жатыр: жолай жүк қосуға болмайды.","Trip LG-{n} is running under seal KZ{n}: a partial load can't be added.","行程 LG-{n} 已加铅封 KZ{n}：无法添加顺路货。"],"Свободно в машине: {n} т. Показаны грузы, ради которых крюк не больше {n}% пути и {n} км.":["Көліктегі бос орын: {n} т. Жолдан ауытқуы жолдың {n}% және {n} км шегінен аспайтын жүктер көрсетілген.","Free capacity in the truck: {n} t. Showing cargo that requires a detour of no more than {n}% of the route and {n} km.","车辆剩余载重：{n} 吨。显示绕路不超过路程 {n}% 且不超过 {n} 公里的货物。"],"Скрыто заявок: {n}. В парке нет машины, которая может их выполнить. Они видны на вкладке «Все заявки».":["Жасырылған өтінімдер: {n}. Паркте оларды орындай алатын көлік жоқ. Олар «Барлық өтінімдер» қойындысында көрінеді.","Hidden requests: {n}. No truck in the fleet can fulfill them. They are visible on the «All requests» tab.","已隐藏运输需求：{n}。车队中没有能承接的车辆。可在«全部运输需求»标签页查看。"],"Тариф «Бизнес» выбирается в кабинете после регистрации. Начните с анкеты или AI-регистратора.":["«Бизнес» тарифі тіркелгеннен кейін жеке кабинетте таңдалады. Анкетадан немесе AI-тіркеушіден бастаңыз.","The «Business» plan is selected in your account after registration. Start with the form or the AI registrar.","«商务版»套餐在注册后于个人中心选择。请从申请表或AI登记员开始。"],"Тариф «Стандарт» выбирается в кабинете после регистрации. Начните с анкеты или AI-регистратора.":["«Стандарт» тарифі тіркелгеннен кейін жеке кабинетте таңдалады. Анкетадан немесе AI-тіркеушіден бастаңыз.","The «Standard» plan is selected in your account after registration. Start with the form or the AI registrar.","«标准版»套餐在注册后于个人中心选择。请从申请表或AI登记员开始。"],  the dispatcher again. How can I help?","我又是调度员了。有什么可以帮您？"],"Ячмень":["Арпа","Barley","大麦"],"OPERELLE присылает готовые заявки на перевозку и отсеивает дубликаты. За груз и цену отвечает автор заявки. Тариф можно сменить в любой момент.":["OPERELLE тасымалдауға дайын өтінімдерді жібереді және телнұсқаларды сүзіп тастайды. Жүк пен бағаға өтінім авторы жауап береді. Тарифті кез келген уақытта ауыстыруға болады.","OPERELLE sends ready transport requests and filters out duplicates. The request author is responsible for the cargo and the price. You can change your plan at any time.","OPERELLE 推送现成的运输需求并剔除重复项。货物和价格由需求发布者负责。套餐可随时更换。"],"Автосбор каждые {n} минуты. «Собрать сейчас» запускает его вручную.":["Автожинау әр {n} минут сайын. «Қазір жинау» оны қолмен іске қосады.","Auto-collection every {n} minutes. «Collect now» starts it manually.","每 {n} 分钟自动采集一次。«立即采集»可手动启动。"],"В панели логистической компании нет ни источников, ни сканирования, ни исходного текста объявления. Компания получает готовую заявку: маршрут, груз, машина, ставка. Откуда заявка пришла, знает только OPERELLE.":["Логистикалық компанияның панелінде дереккөздер де, сканерлеу де, хабарландырудың бастапқы мәтіні де жоқ. Компания дайын өтінімді алады: маршрут, жүк, көлік, мөлшерлеме. Өтінімнің қайдан келгенін тек OPERELLE біледі.","The logistics company's panel has no sources, no scanning and no original listing text. The company gets a ready request: route, cargo, truck, rate. Only OPERELLE knows where the request came from.","物流公司面板中没有来源、没有扫描，也没有信息原文。公司收到的是现成的需求：路线、货物、车辆、运价。需求来自何处，只有 OPERELLE 知道。"],"Входить можно по телефону или личному номеру. Код можно оставить или сменить на свой: напишите новый код, от {n} символов.":["Телефон немесе жеке нөмір арқылы кіруге болады. Кодты қалдыруға немесе өзіңіздікіне ауыстыруға болады: жаңа кодты жазыңыз, {n} таңбадан бастап.","You can sign in with your phone or personal number. Keep the code or change it to your own: type a new code, at least {n} characters.","可通过手机号或个人编号登录。代码可以保留，也可以改成自己的：请输入新代码，至少 {n} 个字符。"],"Груз требует разрешения: опасный (ДОПОГ), лекарства, алкоголь и табак, оружие":["Жүкке рұқсат қажет: қауіпті (ДОПОГ, ADR), дәрі-дәрмек, алкоголь және темекі, қару","Cargo requires a permit: hazardous (ADR), medicines, alcohol and tobacco, weapons","货物需要许可：危险品 (ADR)、药品、酒类和烟草、武器"],"Грузы берут зарегистрированные перевозчики. Регистрация займёт пару минут: пришлите фото документов, анкету я заполню сам.":["Жүктерді тіркелген тасымалдаушылар алады. Тіркелу бірнеше минут алады: құжаттардың фотосын жіберіңіз, анкетаны өзім толтырамын.","Loads go to registered carriers. Registration takes a couple of minutes: send photos of your documents and I'll fill out the form myself.","货物由已注册的承运人承接。注册只需几分钟：发送证件照片，申请表由我来填写。"],"Грузы берут проверенные перевозчики. Заполните анкету или откройте AI-регистратора: он заполнит её по фото документов.":["Жүктерді тексерілген тасымалдаушылар алады. Анкетаны толтырыңыз немесе AI-тіркеушіні ашыңыз: ол оны құжаттардың фотосы бойынша толтырады.","Loads go to verified carriers. Fill out the form or open the AI registrar: it will fill it out from photos of your documents.","货物由已审核的承运人承接。请填写申请表，或打开 AI登记员：它会根据证件照片自动填写。"],"Демо-данные загружены: {n} водителей, {n} заказов, с сайта: {n}. Нажмите на машину на карте — откроется пульт рейса.":["Демо-деректер жүктелді: {n} жүргізуші, {n} тапсырыс, сайттан: {n}. Картадағы көлікті басыңыз — рейс пульті ашылады.","Demo data loaded: {n} drivers, {n} orders, from the site: {n}. Click a truck on the map — the trip console will open.","演示数据已加载：{n} 名司机，{n} 个订单，来自网站：{n}。点击地图上的车辆 — 将打开行程控制台。"],"Для вашей машины подобрано грузов: {n}. Показаны только те, которые машина может взять.":["Көлігіңізге іріктелген жүктер: {n}. Тек көлік ала алатындары көрсетілген.","Loads matched to your truck: {n}. Only those the truck can take are shown.","已为您的车辆匹配货物：{n}。仅显示该车辆可承运的货物。"],"Документы не нужны. Напишите одним сообщением имя или название компании и телефон. Например: «ТОО Алатау Продукт, +{n} {n} {n}».":["Құжаттар қажет емес. Атыңызды немесе компания атауын және телефонды бір хабарламамен жазыңыз. Мысалы: «Алатау Продукт ЖШС, +{n} {n} {n}».","No documents needed. Send your name or company name and phone number in one message. For example: «Alatau Product LLP, +{n} {n} {n}».","无需文件。请在一条消息中写明姓名或公司名称及电话。例如：«Alatau Product 有限责任合伙企业，+{n} {n} {n}»。"],"Его начисляет перевозчик на свою услугу. Оборот сделок по РК в текущих заказах {n} ₸, в том числе НДС {n} ₸. Счёт-фактуру выписывает перевозчик, площадка готовит образец.":["Оны тасымалдаушы өз қызметіне есептейді. Ағымдағы тапсырыстардағы ҚР бойынша мәмілелер айналымы {n} ₸, оның ішінде ҚҚС {n} ₸. Шот-фактураны тасымалдаушы жазады, алаң үлгісін дайындайды.","The carrier charges it on its own service. Deal turnover within Kazakhstan in current orders is {n} ₸, including VAT of {n} ₸. The carrier issues the VAT invoice; the platform prepares a template.","由承运人对其服务计收。当前订单中哈萨克斯坦境内交易额为 {n} ₸，其中增值税 {n} ₸。增值税发票由承运人开具，平台准备样本。"],"Если машина опломбирована, попутный груз брать нельзя: пломбу не вскрывают до выгрузки.":["Көлік пломбаланған болса, жолай жүк алуға болмайды: пломба түсіруге дейін ашылмайды.","If the truck is sealed, you can't take a partial load: the seal stays intact until unloading.","如果车辆已加铅封，则不能接顺路货：卸货前不得拆封。"],"Если машина опломбирована, попутный груз брать нельзя: пломбу не вскрывают до выгрузки. Опасные и лицензируемые грузы попутно не возят.":["Көлік пломбаланған болса, жолай жүк алуға болмайды: пломба түсіруге дейін ашылмайды. Қауіпті және лицензияланатын жүктер жолай тасымалданбайды.","If the truck is sealed, you can't take a partial load: the seal stays intact until unloading. Hazardous and licensed cargo is not carried as partial loads.","如果车辆已加铅封，则不能接顺路货：卸货前不得拆封。危险品和需许可证的货物不作顺路货运输。"],"Если машина опломбирована, попутный груз брать нельзя: пломбу не вскрывают до выгрузки. Снимите отметку, когда машина будет без пломбы.":["Көлік пломбаланған болса, жолай жүк алуға болмайды: пломба түсіруге дейін ашылмайды. Көлік пломбасыз болғанда белгіні алып тастаңыз.","If the truck is sealed, you can't take a partial load: the seal stays intact until unloading. Clear the checkbox once the truck is no longer sealed.","如果车辆已加铅封，则不能接顺路货：卸货前不得拆封。车辆不再带铅封时请取消勾选。"],"Заявка PR-{n} (Газель {c} — {c}) — {n} ₸ при расчётной {n} ₸. Перевозчики, скорее всего, откажутся.":["PR-{n} өтінімі (Газель {c} — {c}) — {n} ₸, есептік мөлшерлеме {n} ₸. Тасымалдаушылар көбіне бас тартады.","Request PR-{n} (GAZelle {c} — {c}) — {n} ₸ against an estimated {n} ₸. Carriers will most likely decline.","需求 PR-{n} (嘎斯轻卡 {c} — {c}) — {n} ₸，测算运价为 {n} ₸。承运人很可能会拒绝。"],"Заявка уходит компании, если её машины могут выполнить груз: кузов, вес, объём и допуски. Мелкие партии идут в попутные грузы.":["Өтінім компанияға оның көліктері жүкті тасымалдай алса жіберіледі: шанақ, салмақ, көлем және рұқсаттар. Шағын партиялар жолай жүктерге өтеді.","A request goes to a company if its trucks can carry the cargo: body, weight, volume and permits. Small shipments go to partial loads.","只有公司的车辆能够承运该货物时，需求才会发给它：车厢、重量、体积和许可。小批量货物归入顺路货。"],"Здравствуйте! Я AI-диспетчер. Напишите или скажите, что нужно: я разберу сам.":["Сәлеметсіз бе! Мен AI-диспетчермін. Не қажет екенін жазыңыз немесе айтыңыз: өзім түсініп аламын.","Hello! I'm the AI dispatcher. Type or say what you need: I'll figure it out myself.","您好！我是 AI调度员。请输入或说出您的需求：我会自行处理。"],"Источники заявок видны только здесь: компании получают готовые заявки":["Өтінімдердің дереккөздері тек осында көрінеді: компаниялар дайын өтінімдерді алады","Request sources are visible only here: companies receive ready requests","需求来源仅在此处可见：各公司收到的是现成的需求"],"Код входа изменён. Запомните его: он хранится в зашифрованном виде, его не видит никто.":["Кіру коды өзгертілді. Оны есте сақтаңыз: ол шифрланған күйде сақталады, оны ешкім көрмейді.","Sign-in code changed. Remember it: it is stored encrypted and no one can see it.","登录代码已更改。请记住它：它以加密形式存储，任何人都无法查看。"],"Лента показывает только те заявки, которые может выполнить ваш парк: кузов, вес, объём, габариты и допуски водителя. Мелкие партии вынесены отдельно, в попутные грузы.":["Лента тек сіздің паркіңіз орындай алатын өтінімдерді көрсетеді: шанақ, салмақ, көлем, габариттер және жүргізушінің рұқсаттары. Шағын партиялар бөлек, жолай жүктерге шығарылған.","The feed shows only the requests your fleet can handle: body, weight, volume, dimensions and driver permits. Small shipments are listed separately, under partial loads.","需求流只显示您的车队能够承运的需求：车厢、重量、体积、尺寸和司机许可。小批量货物单独列在顺路货中。"],"Мелкие партии от {n} кг или {n} м³ на свободное место. Отдельная категория: в общей ленте их нет.":["Бос орынға арналған {n} кг-нан немесе {n} м³-ден басталатын шағын партиялар. Бөлек санат: жалпы лентада олар жоқ.","Small shipments from {n} kg or {n} m³ for free space. A separate category: they are not in the main feed.","{n} 公斤或 {n} 立方米起的小批量货物，利用空余空间。单独类别：不在总需求流中。"],"Напишите города: откуда и куда, и вес. Например: «{c} {c} {n} кг» или «{c} {c} {n} тонн».":["Қалаларды жазыңыз: қайдан және қайда, және салмағын. Мысалы: «{c} {c} {n} кг» немесе «{c} {c} {n} тонна».","Type the cities: from and to, plus the weight. For example: «{c} {c} {n} kg» or «{c} {c} {n} tons».","请写明城市：从哪里到哪里，以及重量。例如：«{c} {c} {n} 公斤»或«{c} {c} {n} 吨»。"],"Напишите первое сообщение. Переписка сохраняется: её видят вторая сторона и диспетчер площадки.":["Алғашқы хабарламаны жазыңыз. Хат алмасу сақталады: оны екінші тарап пен алаң диспетчері көреді.","Write the first message. The conversation is saved: the other party and the platform dispatcher can see it.","请发送第一条消息。聊天记录会保存：对方和平台调度员均可查看。"],"Не показал объявления, которые машине не подходят: другой кузов {n}, вес или размер {n}, нужен допуск {n}, мелкая партия {n}.":["Көлікке сәйкес келмейтін хабарландыруларды көрсетпедім: басқа шанақ {n}, салмағы немесе өлшемі {n}, рұқсат қажет {n}, шағын партия {n}.","Hid listings that don't fit the truck: different body {n}, weight or size {n}, permit required {n}, small shipment {n}.","未显示不适合该车辆的信息：车厢不符 {n}，重量或尺寸 {n}，需要许可 {n}，小批量 {n}。"],"Не разобрал. Напишите имя или компанию и телефон, например: «Айгерим, +{n} {n} {n}».":["Түсінбедім. Атыңызды немесе компанияны және телефонды жазыңыз, мысалы: «Айгерім, +{n} {n} {n}».","Didn't catch that. Send your name or company and phone number, for example: «Aigerim, +{n} {n} {n}».","没看懂。请写明姓名或公司及电话，例如：«Aigerim，+{n} {n} {n}»。"],"Объявление размещено: {c} → {c}, {n} кг. Его увидят перевозчики, которые едут по пути.":["Хабарландыру орналастырылды: {c} → {c}, {n} кг. Оны жолай бара жатқан тасымалдаушылар көреді.","Listing posted: {c} → {c}, {n} kg. Carriers heading that way will see it.","信息已发布：{c} → {c}，{n} 公斤。顺路的承运人将会看到。"],"Опасные и лицензируемые грузы попутно не возят: для них нужна отдельная машина с допуском.":["Қауіпті және лицензияланатын жүктер жолай тасымалданбайды: оларға рұқсаты бар бөлек көлік қажет.","Hazardous and licensed cargo is not carried as partial loads: it needs a dedicated truck with a permit.","危险品和需许可证的货物不作顺路货运输：需要有许可的专车。"],"Первые три рейса идут под усиленным контролем: геолокация и фото на погрузке и выгрузке.":["Алғашқы үш рейс күшейтілген бақылаумен өтеді: геолокация және тиеу мен түсіру кезіндегі фото.","The first three trips run under enhanced monitoring: geolocation and photos at loading and unloading.","前三趟行程实行加强监控：定位以及装货和卸货时的照片。"],"Перевозчику: «Я в {c}, найди груз до Астаны», «обратный груз», «попутный груз {c} {c}, свободно {n} кг».":["Тасымалдаушыға: «Мен {c} қаласындамын, Астанаға дейін жүк тап», «кері жүк», «жолай жүк {c} {c}, {n} кг бос».","For carriers: «I'm in {c}, find me a load to Astana», «return load», «partial load {c} {c}, {n} kg free».","承运人：«我在 {c}，帮我找去阿斯塔纳的货»、«回程货»、«顺路货 {c} {c}，空余 {n} 公斤»。"],"По пути {c} → {c} попутных грузов сейчас нет. Напишу, когда появятся.":["{c} → {c} жолында қазір жолай жүктер жоқ. Пайда болғанда жазамын.","No partial loads along {c} → {c} right now. I'll message you when some come up.","{c} → {c} 沿途目前没有顺路货。有货时我会通知您。"],"По этим направлениям для такой машины сейчас нет грузов. Добавьте соседнее направление или оставьте заявку: мы напишем, когда груз появится.":["Бұл бағыттар бойынша мұндай көлікке қазір жүк жоқ. Көрші бағытты қосыңыз немесе өтінім қалдырыңыз: жүк пайда болғанда жазамыз.","No loads for this kind of truck on these routes right now. Add a nearby route or leave a request: we'll message you when a load comes up.","这些线路目前没有适合此类车辆的货物。请添加相邻线路或留下需求：有货时我们会通知您。"],"Показаны только объявления, которые эта машина может выполнить: кузов, вес, объём, габариты и допуски.":["Тек осы көлік орындай алатын хабарландырулар көрсетілген: шанақ, салмақ, көлем, габариттер және рұқсаттар.","Only listings this truck can handle are shown: body, weight, volume, dimensions and permits.","仅显示这辆车能够承运的信息：车厢、重量、体积、尺寸和许可。"],"Принимает фото документов в чате, заполняет анкету, сверяет данные и регистрирует":["Чатта құжаттардың фотосын қабылдайды, анкетаны толтырады, деректерді салыстырады және тіркейді","Accepts document photos in chat, fills out the form, cross-checks the data and registers","在聊天中接收证件照片，填写申请表，核对数据并完成注册"],"Рейс LG-{n} {c} → {c} идёт под пломбой: в этот рейс попутный груз брать нельзя. Ниже грузы на обратный путь.":["LG-{n} {c} → {c} рейсі пломбамен келе жатыр: бұл рейске жолай жүк алуға болмайды. Төменде кері жолға арналған жүктер.","Trip LG-{n} {c} → {c} is running under seal: no partial load can be added to this trip. Below are loads for the return leg.","行程 LG-{n} {c} → {c} 带铅封运输：此行程不能接顺路货。以下是回程货物。"],"Сбор завершён. Компании получили только готовые заявки, без источника.":["Жинау аяқталды. Компаниялар тек дайын өтінімдерді алды, дереккөзсіз.","Collection complete. Companies received only ready requests, without the source.","采集已完成。各公司只收到现成的需求，不含来源。"],"Сейчас без подписки. Подписка считается за каждую машину, у вас машин: {n}. Оплата списывается с баланса.":["Қазір жазылымсыз. Жазылым әр көлік үшін есептеледі, сіздегі көліктер: {n}. Төлем баланстан алынады.","No subscription right now. The subscription is charged per vehicle; your vehicles: {n}. Payment is deducted from your balance.","目前未订阅。订阅按每辆车计费，您的车辆数：{n}。费用从余额中扣除。"],"Такой груз увидят только перевозчики с нужным допуском. Без номера разрешения заявка не отправится.":["Мұндай жүкті тек қажетті рұқсаты бар тасымалдаушылар көреді. Рұқсат нөмірінсіз өтінім жіберілмейді.","Only carriers with the required permit will see this cargo. The request won't be sent without a permit number.","只有具备相应许可的承运人才能看到此类货物。没有许可编号，需求将无法提交。"],"Тариф «Профи» выбирается в кабинете после регистрации. Начните с анкеты или AI-регистратора.":["«Профи» тарифі тіркелгеннен кейін жеке кабинетте таңдалады. Анкетадан немесе AI-тіркеушіден бастаңыз.","The «Pro» plan is selected in your account after registration. Start with the form or the AI registrar.","«专业版»套餐在注册后于个人中心选择。请先填写申请表或使用 AI登记员。"],"Тот же регистратор принимает фото в WhatsApp и Telegram компании:":["Сол тіркеуші компанияның WhatsApp пен Telegram-ында да фото қабылдайды:","The same registrar accepts photos in the company's WhatsApp and Telegram:","同一登记员也在公司的 WhatsApp 和 Telegram 中接收照片："],"Этот телефон уже зарегистрирован. Войдите в кабинет или напишите диспетчеру, чтобы восстановить доступ.":["Бұл телефон тіркеліп қойған. Жеке кабинетке кіріңіз немесе қолжетімділікті қалпына келтіру үшін диспетчерге жазыңыз.","This phone number is already registered. Sign in to your account or message the dispatcher to restore access.","该手机号已注册。请登录个人中心，或联系调度员恢复访问权限。"],"Демо-данные загружены: {n} водителей, {n} заказов, новых заявок: {n}. Нажмите на машину на карте — откроется пульт рейса.":["Демо-деректер жүктелді: {n} жүргізуші, {n} тапсырыс, жаңа өтінімдер: {n}. Картадағы көлікті басыңыз: рейс пульті ашылады.","Demo data loaded: {n} drivers, {n} orders, new requests: {n}. Click a truck on the map to open the trip console.","演示数据已加载：{n} 名司机，{n} 个订单，新需求 {n} 条。点击地图上的车辆即可打开行程控制台。"],"отвечает":["жауапты","responsible","负责人"],"владелец":["иесі","owner","车主"],"Новые заявки от OPERELLE":["OPERELLE-ден ж /* Алгоритм: по классу груза, весу и объёму определяет подходящий тип ТС и объясняет выбор */
function recommendVT(cls,w,v){
  const fixed={temp:'ref',frozen:'ref',pharma:'izoterm',fuel:'cistern',gas:'gas',foodliq:'foodcist',grain:'zernovoz',bulk:'samosval',
    cement:'cement',container:'container',live:'skot',timber:'les',long:'truba'};
  w=+w||0;v=+v||0;
  if(cls==='oversize') return w>40?['tralh','Вес свыше 40 т — нужен модульный трал, спецразрешение и сопровождение']:['tral','Негабарит / спецтехника — низкорамный трал, спецразрешение на маршрут'];
  if(cls==='cars') return w<=3.6?['avto1','Одна-две машины — малый автовоз на шасси Газели']:w<=6.5?['avto3','Две-три машины — малый автовоз с прицепом']:['autovoz','Партия автомобилей — большой автовоз на 6–8 мест'];
  if(fixed[cls]){
    const why={temp:'Температурный режим — нужен рефрижератор с термописцем',frozen:'Заморозка — рефрижератор, режим −18 °C, сертификат СПС',
      pharma:'Фарма без активного холода — изотермический фургон, термологгер',fuel:'Опасный груз класса 3 — цистерна и водитель с допуском ДОПОГ',
      gas:'Опасный груз класса 2 — газовоз, ДОПОГ',foodliq:'Пищевой налив — цистерна с санитарной обработкой',grain:'Насыпной груз — зерновоз',
      bulk:'Навалочный груз — самосвал',cement:'Пылевидный груз — цементовоз с пневморазгрузкой',
      container:'Контейнер — контейнеровоз с твистлоками',live:'Живой груз — скотовоз, ветеринарное свидетельство',timber:'Лес — сортиментовоз с кониками',
      long:'Длина свыше 13,6 м — раздвижной полуприцеп, спецразрешение'}[cls];
    return [fixed[cls],why];
  }
  if(cls==='build') return w<=1.5?['gazel_bort','До 1,5 т стройматериалов — бортовая Газель, грузят сверху']:w<=10?['manip','До 10 т стройматериалов — манипулятор с самопогрузкой']:['bort','Тяжёлый штучный груз — бортовой полуприцеп, верхняя и боковая загрузка'];
  if(cls==='move'&&w<=1.5&&v<=14) return ['gazel_van','Мебель и вещи — закрытый фургон защитит от дождя и пыли'];
  if(cls==='light'||v>92) return w<=20?['jumbo','Объём больше 92 м³ при малом весе — Jumbo / мега']:['scepka','Большой объём и вес — автосцепка 120 м³'];
  if(w<=1&&v<=6) return ['porter','До 1 т и 6 м³ — достаточно портера'];
  if(w<=1.5&&v<=16) return ['gazel','До 1,5 т и 16 м³ — Газель с тентом'];
  if(w<=3&&v<=22) return ['t3','До 3 т — трёхтонник'];
  if(w<=3&&v<=30) return ['gazel_tr','До 3 т при большом объёме — Газель с прицепом'];
  if(w<=5&&v<=36) return ['t5','До 5 т и 36 м³ — пятитонник'];
  if(w<=10&&v<=50) return ['t10','До 10 т и 50 м³ — десятитонник'];
  if(w>22) return ['platform','Вес больше 22 т — площадка либо разделить на две машины'];
  return ['tent','До 22 т и 92 м³ — стандартная еврофура с тентом'];
}

  if(a===b) return _rc[key]={km:0,path:[a],borders:[],intl:false,countries:[CITY[a][3]]};
  const dist={},prev={},Q=new Set(Object.keys(CITY));
  Q.forEach(k=>dist[k]=Infinity); dist[a]=0;
  while(Q.size){
    let u=null; Q.forEach(k=>{if(u===null||dist[k]<dist[u])u=k});
    Q.delete(u); if(u===b||dist[u]===Infinity) break;
    (ADJ[u]||[]).forEach(([v,k])=>{if(dist[u]+k<dist[v]){dist[v]=dist[u]+k;prev[v]=u}});
  }
  const path=[];let c=b;while(c){path.unshift(c);c=prev[c]}
  const borders=[];for(let i=1;i<path.length;i++){const br=borderOf(path[i-1],path[i]);if(br)borders.push(br)}
  const countries=[...new Set(path.map(k=>CITY[k][3]))];
  return _rc[key]={km:dist[b],path,borders,intl:CITY[a][3]!==CITY[b][3],countries};
}

/* ============================================================
   АККАУНТЫ, ТАРИФЫ САЙТА, ОБРАТНЫЕ ГРУЗЫ (общий блок сайта и панели)
   Демо-хранилище — память браузера. В боевой версии это сервер и база данных:
   пароли там хранятся только в виде хеша, как и здесь, и никому не показываются.
   ============================================================ */
function sha256(str){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a)), maxWord=Math.pow(2,32), words=[];
  let ascii=unescape(encodeURIComponent(String(str))), i, j, result='';
  const bitLen=ascii.length*8;
  let hash=sha256.h=sha256.h||[]; const k=sha256.k=sha256.k||[];
  let pc=k.length; const comp={};
  for(let c=2;pc<64;c++){ if(!comp[c]){ for(i=0;i<313;i+=c)comp[i]=c; hash[pc]=(Math.pow(c,.5)*maxWord)|0; k[pc++]=(Math.pow(c,1/3)*maxWord)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=(bitLen/maxWord)|0; words[words.length]=bitLen;
  for(j=0;j<words.length;){
    const w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ const b=(hash[i]>>(j*8))&255; result+=(b<16?'0':'')+b.toString(16); }
  return result;
}

/* pool: [{id,from,to,vt,date,price,...}]; возвращает грузы не дальше 350 км от точки выгрузки, с погрузкой в день прибытия или два следующих */
function backloads(city,date,vtype,home,pool){
  if(!CITY[city]) return [];
  const d0=new Date(date.getFullYear(),date.getMonth(),date.getDate()).getTime();
  const fits=typeof vtype==='string'?l=>vtFits(vtype,l.vt):l=>loadFit(l,vtype).ok;
  return pool.filter(l=>CITY[l.from]&&CITY[l.to]&&fits(l)).map(l=>{
    const day=Math.round((new Date(l.date.getFullYear(),l.date.getMonth(),l.date.getDate()).getTime()-d0)/86400e3);
    return Object.assign({},l,{day,empty:route(city,l.from).km,toHome:CITY[home]?route(l.to,home).km:0});
  }).filter(l=>l.empty<=350&&l.day>=0&&l.day<=2).sort((a,b)=>a.toHome-b.toHome||a.empty-b.empty);
}

const STOP={rest:['Отдых, ночёвка','#A855F7'],food:['Обед','#06B6D4'],fuel:['Заправка','#3B82F6'],border:['Граница','#C9A227'],weigh:['Весовой контроль','#64748B'],

const PLACES={rest:['стоянка для грузовиков «Керуен»','кемпинг «Жолаушы»','мотель «Дала»','стоянка «Сарыарка»','гостевой двор «Тулпар»'],

const BORDER_AT={'khorgos|urumqi':.01,'dostyk|urumqi':.03,'almaty|bishkek':.9,'bishkek|taraz':.5,'shymkent|tashkent':.85,'beyneu|nukus':.2,'uralsk|samara':.2,'aktobe|orenburg':.5,
  'kostanay|chelyabinsk':.55,'petropavl|omsk':.3,'pavlodar|omsk':.6,'semey|novosib':.2,'atyrau|astrakhan':.75,'makhachkala|baku':.5,'samarkand|dushanbe':.2,
  'khorgos|yining':.02,'dostyk|alashankou':.5,'naryn|kashgar':.5,'osh|andijan':.2,'tashkent|khujand':.6,'bukhara|turkmenabat':.8,'ganja|tbilisi':.75,'tbilisi|yerevan':.25,'tbilisi|istanbul':.2,
  'rostov|tbilisi':.85,'baku|tehran':.4,'ashgabat|tehran':.05,'termez|mazar':.1,'kurgan|petropavl':.6,'barnaul|semey':.75};
const fmtDur=m=>{m=Math.round(m);const h=Math.floor(m/60);return (h?h+' ч ':'')+(m%60||!h?(m%60)+' мин':'')};
function genStops(o){
  if(o.stops) return o.stops;
  let h=0;for(const c of o.id)h=(h*31+c.charCodeAt(0))>>>0;
  const rn=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296}, pk=a=>a[Math.floor(rn()*a.length)];
  const done=o.progress*o.km, raw=[];
  /* границы на пройденной части маршрута */
  let acc=0;
  for(let i=1;i<o.path.length;i++){
    const a=o.path[i-1],b=o.path[i],k=EK[a+'|'+b],br=borderOf(a,b);
    if(br){const f=BORDER_AT[a+'|'+b]!=null?BORDER_AT[a+'|'+b]:BORDER_AT[b+'|'+a]!=null?1-BORDER_AT[b+'|'+a]:.5, at=acc+k*f;
      if(at<done-3) raw.push({km:at,kind:'border',min:br[2]*60*(.6+rn()*.5),name:br[0]})}
    acc+=k;
  }
  /* остановки по режиму труда и отдыха: короткие каждые 250–350 км, ночёвка через одну */
  let pos=0,i=0;
  for(;;){
    pos+=o.second?280+rn()*90:250+rn()*70; if(pos>=done-25) break; i++;
    if(!o.second&&i%2===0) raw.push({km:pos,kind:'rest',min:540+rn()*130});
    else if(o.second&&i%3===0) raw.push({km:pos,kind:'rest',min:110+rn()*70});
    else raw.push({km:pos,kind:rn()<.5?'fuel':'food',min:20+rn()*35});
  }
  if(done>600&&rn()<.6) raw.push({km:done*(.35+rn()*.2),kind:'weigh',min:12+rn()*20});
  /* текущая стоянка */
  if(o.status==='loading') raw.push({km:0,kind:'load',min:150+rn()*90,ongoing:true});
  if(o.status==='unloading') raw.push({km:done,kind:'unload',min:70+rn()*60,ongoing:true});
  if(o.status==='border') raw.push({km:done,kind:'border',min:300+rn()*120,ongoing:true,name:(o.borders[0]||['границу'])[0]});
  if(o.flagStop&&o.status==='transit') raw.push({km:done,kind:'road',min:190,ongoing:true});
  raw.sort((a,b)=>a.km-b.km);
  const list=raw.filter((s,j)=>j===0||s.ongoing||s.km-raw[j-1].km>18||s.kind==='border');
  /* время считаем назад от текущего момента: движение со средней скоростью 62 км/ч */
  let t=NOW.getTime(), next=done;
  for(let j=list.length-1;j>=0;j--){
    const s=list[j], p=posAtKm(o,s.km), city=p.on<=22?p.a:p.k-p.on<=22?p.b:null, road=roadOf(p.a,p.b), ll=unxy(p.xy);
    if(!s.ongoing) t-=(next-s.km)/62*3600e3;
    s.to=s.ongoing?null:new Date(t); t-=s.min*60e3; s.from=new Date(t); next=s.km;
    s.xy=p.xy; s.ll=ll[0].toFixed(4)+'° с. ш., '+ll[1].toFixed(4)+'° в. д.';
    const where=city?'г. '+cn(city)+', '+pk(STREETS)+', '+(2+Math.floor(rn()*170)):road+', '+p.on+' км от г. '+cn(p.a)+' в сторону г. '+cn(p.b);
    s.addr=s.kind==='border'?'пункт пропуска «'+s.name+'», '+road:s.kind==='road'?'обочина вне оборудованной стоянки, '+road+', '+p.on+' км от г. '+cn(p.a):pk(PLACES[s.kind])+', '+where;
    s.flag=s.kind==='road'?'Стоянка вне оборудованного места, причина не указана':(s.kind==='fuel'||s.kind==='food')&&s.min>50?'Дольше обычного':s.kind==='rest'&&s.min>660?'Отдых дольше 11 часов':'';
  }
  o.started=new Date(t-(list.length?list[0].km:done)/62*3600e3);
  return o.stops=list;
}

  '<div class="modal-body"><div class="stack">'+open.map(a=>
    '<div class="alert-row '+a.sev+'"><div style="flex:1"><div class="row-between"><b style="font-size:13px">'+a.title+'</b><span class="mini">'+a.time+'</span></div>'+

  '</div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Закрыть</button>'+
  '<button class="btn btn-p" onclick="closeModal();go(\'chimera\')">Открыть CHIMERA</button></div>','narrow');
}

function flowMap(dirs){
  const agg={}; dirs.forEach(([a,b,n])=>{if(!CITY[a]||!CITY[b])return;const k=a+'|'+b;agg[k]=(agg[k]||0)+n});
  const keys=Object.keys(agg), max=Math.max(1,...keys.map(k=>agg[k])), cities={};
  let s='<svg viewBox="140 64 840 440" class="flow-map" role="img" aria-label="Карта направлений сети: число заказов между городами">';
  s+='<rect x="0" y="0" width="'+MW+'" height="'+MH+'" fill="#0A0B0D"/>';
  SEAS.forEach(a=>{s+='<polygon points="'+poly(a)+'" fill="#0C1320"/>'});
  LANDS.forEach(a=>{s+='<polygon points="'+poly(a)+'" fill="#0F1114" stroke="#262A31" stroke-width="1"/>'});
  s+='<polygon points="'+poly(KZ_SHAPE)+'" fill="#16140F" stroke="#8C6A1E" stroke-width="1.4" stroke-linejoin="round"/>';
  keys.sort((x,y)=>agg[x]-agg[y]).forEach(k=>{const [a,b]=k.split('|'),p=xy(a),q=xy(b),n=agg[k],w=1.2+n/max*7;cities[a]=1;cities[b]=1;
    const mx=(p[0]+q[0])/2-(q[1]-p[1])*.15, my=(p[1]+q[1])/2+(q[0]-p[0])*.15, d='M'+p[0].toFixed(1)+' '+p[1].toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+q[0].toFixed(1)+' '+q[1].toFixed(1);
    s+='<path d="'+d+'" fill="none" stroke="#E3B341" stroke-opacity="'+(.25+n/max*.5).toFixed(2)+'" stroke-width="'+w.toFixed(1)+'" stroke-linecap="round"><title>'+cn(a)+' → '+cn(b)+': '+n+' заказов в месяц</title></path>'+
       '<path d="'+d+'" class="fl" fill="none" stroke="#FFE7A8" stroke-width="1.6" stroke-linecap="round"/>'});
  Object.keys(cities).forEach(k=>{const p=xy(k);s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.6" fill="#F2F3F5" stroke="#0A0B0D" stroke-width="1.4"/>'+
    '<text x="'+(p[0]+7).toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" fill="#B0B6C0" font-size="11" font-weight="600" paint-order="stroke" stroke="#0A0B0D" stroke-width="3">'+cn(k)+'</text>'});
  return s+'</svg>';
}

/* простой столбчатый график */
function barsChart(vals,labels,fmt){
  const w=560,h=190,p=28,max=Math.max(...vals)*1.15||1,bw=(w-p*2)/vals.length;
  let s='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto">';
  for(let i=0;i<4;i++){const gy=16+i*((h-44)/3);s+='<line x1="'+p+'" y1="'+gy+'" x2="'+(w-p)+'" y2="'+gy+'" stroke="#20232A"/>'}
  vals.forEach((v,i)=>{const x=p+i*bw+bw*.2,hh=v/max*(h-44),last=i===vals.length-1;
    s+='<rect x="'+x.toFixed(1)+'" y="'+(h-28-hh).toFixed(1)+'" width="'+(bw*.6).toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="3" fill="'+(last?'#E3B341':'#5B626E')+'"/>'+
      '<text x="'+(x+bw*.3).toFixed(1)+'" y="'+(h-33-hh).toFixed(1)+'" fill="#B0B6C0" font-size="10" text-anchor="middle">'+(fmt?fmt(v):v)+'</text>'+
      '<text x="'+(x+bw*.3).toFixed(1)+'" y="'+(h-10)+'" fill="#7B828E" font-size="10" text-anchor="middle">'+labels[i]+'</text>'});
  return s+'</svg>';
}

    '<td>'+(c.email?'<a href="mailto:'+esc(c.email.split(/[,;\s]+/)[0])+'">'+esc(c.email)+'</a>':'<span class="mini">нет</span>')+(c.site?'<div class="mini"><a href="'+esc(c.site)+'" target="_blank" rel="noopener">сайт</a> · <a href="'+esc(c.source)+'" target="_blank" rel="noopener">источник</a></div>':'')+'</td>'+

  return '<div class="grid g-kpi" style="margin-bottom:14px">'+kpiTile('Компаний в базе',KZ_COMPANIES.length,'Казахстан, открытые источники')+kpiTile('С почтой',KZ_COMPANIES.filter(c=>c.email).length,'можно написать письмо')+
    kpiTile('Написали',cnt('sent')+cnt('talk')+cnt('demo'),'ответили '+cnt('talk')+', смотрят демо '+cnt('demo'))+kpiTile('Подключены',cnt('won'),'панель и сайт бесплатно','up')+'</div>'+
   '<div class="alert-row warn" style="margin-bottom:12px"><div><b style="font-size:12.5px">Как писать, чтобы не нарушать правила</b><div class="mini" style="margin-top:3px">Контакты взяты с сайтов компаний и из открытых справочников, у каждой строки есть ссылка на источник. Первое письмо отправляйте лично и по делу. Массовые рассылки, SMS и сообщения в WhatsApp без согласия получателя не отправляйте: этого требуют закон о рекламе и правила WhatsApp Business.</div></div></div>'+
   '<div class="card"><div class="card-head"><div class="card-title">Логистические компании Казахстана</div><div class="card-actions">'+
     '<input class="num-in" style="width:190px;font-family:inherit" placeholder="Поиск: название, город, услуги" value="'+esc(f.q||'')+'" onchange="state.sub.q=this.value;render()">'+
     '<select class="num-in" style="width:150px;font-family:inherit" onchange="state.sub.city=this.value;render()"><option value="">Все города</option>'+cities.map(x=>'<option'+(f.city===x?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'+
     '<select class="num-in" style="width:150px;font-family:inherit" onchange="state.sub.st=this.value;render()"><option value="">Все статусы</option>'+Object.keys(LEAD_ST).map(k=>'<option value="'+k+'"'+(f.st===k?' selected':'')+'>'+LEAD_ST[k][0]+'</option>').join('')+'</select>'+
     '<button class="btn btn-sm" onclick="leadsCSV()">Скачать CSV</button><a class="btn btn-sm" href="companies.html" target="_blank" rel="noopener">Казахстан, Россия, Узбекистан, Кыргызстан</a></div></div>'+
    ROWS(['Компания','Город','Чем занимается','Телефон','Почта и сайт','Статус',''],[rows||'<tr><td colspan="7" class="empty">Ничего не найдено</td></tr>'])+'</div>';
};

/* ================= ВАЛЮТЫ И КУРСЫ ================= */
VIEWS.fx=()=>{
  const R=fxRates(), own=LS.get('operelleFx',{})||{};
  return '<div class="alert-row info" style="margin-bottom:14px"><div><b style="font-size:12.5px">Расчёт в валютах, а не обмен</b><div class="mini" style="margin-top:3px">Все суммы во всех программах считаются в тенге. Человек выбирает валюту вверху страницы: суммы показываются крупно в ней, ниже мелко в тенге. Курсы здесь демо: в боевой версии они раз в день загружаются с сайта Нацбанка РК, а головная панель может поправить их вручную.</div></div></div>'+
   '<div class="card"><div class="card-head"><div class="card-title">Валюты и курсы к тенге</div><div class="card-actions"><span class="mini">выбрана сейчас: '+CUR+'</span><button class="btn btn-sm" onclick="LS.set(\'operelleFx\',{});render();toast(\'Курсы сброшены к демо-значениям.\',\'info\')">Сбросить курсы</button></div></div>'+
    ROWS(['Валюта','Знак','Где используется','1 единица = ₸','1 000 000 ₸ =',''],FX_LIST.map(x=>'<tr><td><b>'+x[0]+'</b> <span class="mini">'+x[3]+'</span></td><td style="font-size:16px">'+x[1]+'</td><td class="mini">'+x[4]+'</td>'+
      '<td>'+(x[0]==='KZT'?'1':'<input class="num-in" type="number" step="any" value="'+R[x[0]]+'" onchange="setRate(\''+x[0]+'\',this.value)">')+(own[x[0]]!=null?' <span class="badge b-gold">вручную</span>':'')+'</td>'+
      '<td class="nowrap">'+fxPlain(1e6,x[0])+'</td><td><button class="btn btn-sm'+(CUR===x[0]?' btn-g':'')+'" onclick="setCur(\''+x[0]+'\')">'+(CUR===x[0]?'выбрана':'показывать')+'</button></td></tr>'))+'</div>';
};
function setRate(code,v){const n=+String(v).replace(',','.');if(!(n>0)){toast('Курс должен быть больше нуля.','warn');return}const o=LS.get('operelleFx',{})||{};o[code]=n;LS.set('operelleFx',o);render();toast('Курс '+code+' сохранён: 1 '+code+' = '+n+' ₸. Панель компании и сайт пересчитают суммы по нему.','ok')}
</script>
