nconst badge=s=>'<span class=\"badge '+ST[s][1]+'\">'+ST[s][0]+'<\/span>';\nconst route=r=>'<span class=\"route\">'+esc(apn(r.from))+'<i>→<\/i>'+esc(apn(r.to))+'<\/span>';\nconst wide=()=>typeof window==='undefined'||!window.innerWidth||window.innerWidth>1180;\nconst demoNote=t=>'<div class=\"src-tag\">'+t+'<\/div>';\n\n/* ---------- расписание на ближайшие двое суток (демо) ---------- */\nfunction board(){\n  const out=[], mk=(al,a,b,pw,acode,tr,via)=>{\n    for(let d=0;d<3;d++){const day=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+d);\n      if(!legDays(pw).includes(day.getDay())) continue;\n      [[a,b],[b,a]].forEach((p,di)=>{ if(tr&&di) return;\n        const h=hash(al+p[0]+p[1]+d), t=new Date(day.getTime()+(1+Math.floor(h*22))*36e5+Math.floor(hash(al+p[1]+d)*4)*9e5), fl=distKm(p[0],p[1])/820+.7;\n        const arr=new Date(t.getTime()+fl*36e5), dt=(t-NOW)/36e5; if(dt<-fl-2||dt>40) return;\n        const delay=h>.86?20+Math.floor(h*60):0;\n        out.push({no:(al.length>2?al.slice(0,2):al)+' '+(100+Math.floor(hash(al+a+b)*800)+di),al,from:p[0],to:p[1],dep:t,arr,ac:acode,tr:tr||0,via,delay,\n          free:Math.round(AC[acode][2]*(.15+hash(al+p[0]+d+'f')*.6)*10)/10,\n          st:NOW>arr?'Прибыл':NOW>t?'В воздухе':delay?'Задержка '+delay+' мин':'По расписанию'});\n      });\n    }};\n  LEGS.forEach(L=>mk(L[0],L[1],L[2],Math.min(L[3],7),L[4]));\n  TRANSIT.forEach(L=>mk(L[0],L[1],L[2],Math.min(L[3],7),L[4],1,L[5]));\n  return out.sort((a,b)=>a.dep-b.dep);\n}\nconst kindBadge=f=>f.tr?'<span class=\"badge b-slate\">Транзит<\/span>':acFreighter(f.ac)?'<span class=\"badge b-gold\">Грузовой<\/span>':'<span class=\"badge b-blue\">Багажный отсек<\/span>';\nconst flStatus=f=>'<span class=\"badge '+(f.st==='Прибыл'?'b-green':f.st==='В воздухе'?'b-amber':f.delay?'b-red':'b-slate')+'\">'+f.st+'<\/span>';\n\n/* ---------- что требует внимания ---------- */\nfunction attention(){\n  const a=[], now=NOW.getTime();\n  R().filter(r=>r.st==='new').forEach(r=>a.push({sev:'warn',t:'Новая заявка '+r.id,d:apn(r.from)+' → '+apn(r.to)+' · '+wt(airWeight(r.cargo).chg),act:\"openReq('\"+r.id+\"')\",b:'Открыть'}));\n  R().filter(r=>r.st==='rfq'&&now-new Date(r.at).getTime()>2*36e5).forEach(r=>a.push({sev:'crit',t:'Нет цен дольше двух часов',d:r.id+' · запрос у экспедиторов: '+r.sent.length,act:\"openReq('\"+r.id+\"')\",b:'Открыть'}));\n  R().filter(r=>r.st==='arrived').forEach(r=>a.push({sev:'info',t:'Груз прибыл, ждёт выдачи',d:r.id+' · '+apn(r.to)+' · накладная '+r.awb,act:\"openReq('\"+r.id+\"','track')\",b:'Открыть'}));\n  getFw().filter(f=>f.st==='review').forEach(f=>a.push({sev:'warn',t:'Экспедитор ждёт проверки',d:f.name+' · '+f.city,act:\"openFw('\"+f.id+\"')\",b:'Проверить'}));\n  return a;\n}\nfunction openAlerts(){\n  const a=attention();\n  openModal(mhead('Требует внимания',a.length?'Записей: '+a.length:'')+'<div class=\"modal-body\"><div class=\"stack\">'+(a.length?a.map(x=>'<div class=\"alert-row '+x.sev+'\"><div style=\"flex:1;min-width:0\"><b>'+esc(x.t)+'<\/b><div class=\"mini\">'+esc(x.d)+'<\/div><\/div><button class=\"btn btn-sm\" onclick=\"'+x.act+'\">'+x.b+'<\/button><\/div>').join(''):'<div class=\"empty\">Всё спокойно<\/div>')+'<\/div><\/div>','narrow');\n}\n\n/* ============================================================\n   РАЗДЕЛЫ\n   ============================================================ */\nconst VIEWS={};\nconst flyList=()=>R().filter(r=>r.st==='transit'||r.st==='booked'||r.st==='arrived');\nfunction mapData(sel){\n  const routes=[], planes=[], seen={};\n  LEGS.filter(L=>!isKZ(L[1])||!isKZ(L[2])).forEach(L=>{const k=L[1]+L[2]; if(seen[k]) return; seen[k]=1; routes.push({a:L[1],b:L[2],flow:0})});\n  R().filter(r=>r.st==='transit').forEach(r=>{const t=genTrack(r); if(!t.leg) return;\n    routes.push({a:t.leg.from,b:t.leg.to,main:1}); planes.push({a:t.leg.from,b:t.leg.to,t:t.leg.t,ground:t.leg.ground,label:r.id.slice(4),id:\"openReq('\"+r.id+\"','track')\",sel:sel===r.id})});\n  return {routes,planes};\n}\nVIEWS.center=function(){\n  const m=mapData(), w=wide(), fee=R().reduce((s,r)=>s+(stageIdx(r.st)>=3?reqFee(r):0),0), at=attention();\n  const kp=[['Новые заявки',cnt('new')],['Ждут цены',cnt('rfq')],['Выбирают',cnt('offers')],['В воздухе',cnt('transit')],['Ждут выдачи',cnt('arrived')]];\n  const fl=board().filter(f=>f.dep>NOW&&isKZ(f.to)).slice(0,6);\n  return '<div class=\"gl cr-strip\">'+kp.map(k=>'<div class=\"cr-kp\">'+k[0]+' <b>'+k[1]+'<\/b><\/div>').join('')+'<div class=\"cr-kp\">Комиссия <b>'+mln(fee)+'<\/b><\/div>'+\n    '<div class=\"cr-acts\"><button class=\"btn btn-g\" onclick=\"openNew()\">Новая заявка<\/button><button class=\"btn\" onclick=\"go(\\'flights\\')\">Табло рейсов<\/button><\/div><\/div>'+\n   '<div class=\"cr\"><div class=\"map-wrap\">'+airMap(Object.assign({id:'c',box:w?[-420,0,MW+420,MH]:[0,0,MW,MH],labels:['CAN','DXB','IST','FRA','GYD','TAS','DOH','PEK','ICN','DEL','LGG','URC']},m))+'<\/div>'+\n    '<div class=\"gl cr-left\"><div class=\"card-head\"><div class=\"card-title\">Грузы в пути<\/div><div class=\"card-actions\"><span class=\"badge b-gold\">'+flyList().length+'<\/span><\/div><\/div><div class=\"trip-list\">'+\n     (flyList().map(r=>{const o=reqOffer(r),t=genTrack(r);return '<button class=\"cr-trip\" onclick=\"openReq(\\''+r.id+'\\',\\'track\\')\"><span class=\"row-between\"><span class=\"cr-no\">'+r.id+' · '+r.awb+'<\/span>'+badge(r.st)+'<\/span>'+\n       '<b>'+esc(apn(r.from))+'<u>→<\/u>'+esc(apn(r.to))+'<\/b><span class=\"mini\">'+esc(AL[o.air].n)+' · '+wt(airWeight(r.cargo).chg)+(t.eta?' · прилёт '+fDT(t.eta):'')+'<\/span><\/button>'}).join('')||'<div class=\"empty\">Нет грузов в пути<\/div>')+'<\/div><\/div>'+\n    '<div class=\"gl cr-legend legend\"><span><i style=\"background:#fff\"><\/i>в воздухе<\/span><span><i style=\"background:var(--amber)\"><\/i>на земле в узле<\/span><span><i style=\"background:var(--gold)\"><\/i>аэропорты Казахстана<\/span><\/div><\/div>'+\n   '<div class=\"section-label\">Требует внимания<\/div><div class=\"priority-grid\">'+(at.slice(0,4).map(x=>'<div class=\"priority-card '+x.sev+'\"><div class=\"priority-title\">'+esc(x.t)+'<\/div><div class=\"priority-desc\">'+esc(x.d)+'<\/div><button class=\"btn btn-sm\" onclick=\"'+x.act+'\">'+x.b+'<\/button><\/div>').join('')||'<div class=\"priority-card ok\"><div class=\"priority-title\">Всё спокойно<\/div><div class=\"priority-desc\">Нет заявок без движения<\/div><\/div>')+'<\/div>'+\n   '<div class=\"grid g-main\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Ближайшие рейсы в Казахстан<\/div><div class=\"card-actions\"><button class=\"btn btn-sm\" onclick=\"go(\\'flights\\')\">Всё табло<\/button><\/div><\/div><div class=\"tbl-wrap\"><table><thead><tr><th>Вылет<\/th><th>Рейс<\/th><th>Маршрут<\/th><th>Самолёт<\/th><th>Свободно<\/th><\/tr><\/thead><tbody>'+\n     fl.map(f=>'<tr><td class=\"nowrap\">'+fDT(f.dep)+'<\/td><td class=\"nowrap\"><b>'+f.no+'<\/b><div class=\"mini\">'+esc(AL[f.al].n)+'<\/div><\/td><td><span class=\"route\">'+esc(apn(f.from))+'<i>→<\/i>'+esc(apn(f.to))+'<\/span><\/td><td>'+AC[f.ac][0]+'<div>'+kindBadge(f)+'<\/div><\/td><td class=\"nowrap\">'+(f.tr?'—':dec(f.free)+' т')+'<\/td><\/tr>').join('')+\n    '<\/tbody><\/table><\/div><\/div>'+\n    '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Агенты сегодня<\/div><div class=\"card-actions\"><button class=\"btn btn-sm\" onclick=\"go(\\'agents\\')\">Настроить<\/button><\/div><\/div><div class=\"log\">'+agentLog().slice(0,9).map(l=>'<div><span class=\"t\">'+l.t+'<\/span> <span class=\"'+l.c+'\">'+esc(l.who)+'<\/span> '+esc(l.text)+'<\/div>').join('')+'<\/div><\/div><\/div>';\n};\nfunction agentLog(){\n  const out=[]; R().forEach(r=>(r.log||[]).forEach(l=>out.push({at:new Date(l.at),t:fT(new Date(l.at)),who:l.who,text:r.id+': '+l.text,c:'inf'})));\n  R().slice(0,10).forEach((r,i)=>{const d=hoursAdd(-(i*.7+.2)), w=airWeight(r.cargo);\n    out.push({at:d,t:fT(d),who:'Агент «Разбор заявки»',text:r.id+': оплачиваемый вес '+wt(w.chg)+(w.byVol?', считается по объёму':''),c:'ok'});\n    if(stageIdx(r.st)>=1) out.push({at:new Date(d.getTime()-6e5),t:fT(new Date(d.getTime()-6e5)),who:'Агент «Маршрут»',text:r.id+': найдено рейсов: '+airOptions(r.from,r.to,r.cargo).filter(o=>o.ok).length,c:'inf'});\n    if(r.st==='transit') out.push({at:new Date(d.getTime()-3e5),t:fT(new Date(d.getTime()-3e5)),who:'Агент «Слежение»',text:r.id+': статус обновлён по накладной '+r.awb,c:'warn'})});\n  return out.sort((a,b)=>b.at-a.at);\n}\n\nVIEWS.reqs=function(){\n  const tab=state.sub.tab||'all', q=(state.q||'').toLowerCase();\n  const G={all:()=>true,new:r=>r.st==='new',price:r=>r.st==='rfq'||r.st==='offers',deal:r=>r.st==='agreed'||r.st==='booked',fly:r=>r.st==='transit'||r.st==='arrived',done:r=>r.st==='done'};\n  const T=[['all','Все'],['new','Новые'],['price','Подбор цен'],['deal','Согласование'],['fly','В пути'],['done','Завершены']];\n  const list=R().filter(G[tab]).filter(r=>!q||(r.id+' '+(r.awb||'')+' '+r.client.name+' '+r.client.company+' '+r.cargo.name).toLowerCase().includes(q));\n  return '<div class=\"row-between\" style=\"margin-bottom:12px;flex-wrap:wrap\"><div class=\"tabs\">'+T.map(t=>'<button class=\"'+(tab===t[0]?'on':'')+'\" onclick=\"go(\\'reqs\\',{tab:\\''+t[0]+'\\'})\">'+t[1]+' <span class=\"muted\">'+R().filter(G[t[0]]).length+'<\/span><\/button>').join('')+'<\/div>'+\n    '<button class=\"btn btn-g\" onclick=\"openNew()\">Новая заявка<\/button><\/div>'+\n   '<div class=\"card\"><div class=\"tbl-wrap\"><table><thead><tr><th>Заявка<\/th><th>Маршрут<\/th><th>Груз<\/th><th>Оплачиваемый вес<\/th><th>Заказчик<\/th><th>Статус<\/th><th>Цена<\/th><\/tr><\/thead><tbody>'+\n   (list.map(r=>{const w=airWeight(r.cargo),o=reqOffer(r),best=r.offers[0];\n     return '<tr class=\"click\" onclick=\"openReq(\\''+r.id+'\\')\"><td class=\"nowrap\"><b>'+r.id+'<\/b><div class=\"mini\">'+fDT(new Date(r.at))+(r.src==='site'?' · с сайта':'')+'<\/div><\/td><td>'+route(r)+'<\/td>'+\n      '<td><div class=\"row\" style=\"gap:8px\"><span class=\"ct-ico\">'+ctArt(r.cargo.type,26)+'<\/span><div style=\"min-width:0\"><div>'+esc(r.cargo.name)+'<\/div><div class=\"mini\">'+ct(r.cargo.type)[1]+' · мест: '+r.cargo.pcs+'<\/div><\/div><\/div><\/td>'+\n      '<td class=\"nowrap\"><b>'+wt(w.chg)+'<\/b>'+(w.byVol?'<div class=\"mini\">по объёму<\/div>':'')+'<\/td><td>'+esc(r.client.company)+'<div class=\"mini\">'+esc(r.client.name)+'<\/div><\/td><td>'+badge(r.st)+'<\/td>'+\n      '<td class=\"nowrap\">'+(o?'<b>'+money(o.total)+'<\/b>':best?'<span>от<\/span> '+money(best.total):'<span class=\"muted\">ориентир<\/span> '+money(reqQuote(r).total))+'<\/td><\/tr>'}).join('')||'<tr><td colspan=\"7\"><div class=\"empty\">Заявок нет<\/div><\/td><\/tr>')+\n   '<\/tbody><\/table><\/div><\/div>';\n};\n\n/* ---------- новая заявка ---------- */\nfunction openNew(){\n  state.nf=state.nf||{imp:1,far:'CAN',kz:'ALA',name:'',type:'gen',pcs:10,kg:300,l:60,w:40,h:40,cn:'',cc:'',cp:''};\n  renderNew();\n}\nfunction nfSet(k,v){ state.nf[k]=(['pcs','kg','l','w','h'].includes(k)?+v:v); if(k==='imp') state.nf.imp=+v; renderNew(k); }\nfunction renderNew(focus){\n  const f=state.nf, from=f.imp?f.far:f.kz, to=f.imp?f.kz:f.far, w=airWeight(f), opts=airOptions(from,to,f), ok=opts.filter(o=>o.ok), q=ok[0]?ok[0].q:airQuote(f.far,f.kz,f,null);\n  const sel=(k,list)=>'<select onchange=\"nfSet(\\''+k+'\\',this.value)\">'+list.map(x=>'<option value=\"'+x+'\"'+(f[k]===x?' selected':'')+'>'+esc(apn(x))+' · '+x+'<\/option>').join('')+'<\/select>';\n  const inp=(k,lab,type)=>'<div class=\"field\"><label>'+lab+'<\/label><input '+(type==='n'?'type=\"number\" min=\"0\" inputmode=\"decimal\"':'type=\"text\"')+' id=\"nf-'+k+'\" value=\"'+esc(f[k])+'\" onchange=\"nfSet(\\''+k+'\\',this.value)\"><\/div>';\n  openModal(mhead('Новая заявка','Заказчик позвонил или написал: заявку заводит оператор')+'<div class=\"modal-body\"><div class=\"stack\">'+\n   '<div class=\"seg\"><button class=\"'+(f.imp?'on':'')+'\" onclick=\"nfSet(\\'imp\\',1)\">В Казахстан<\/button><button class=\"'+(f.imp?'':'on')+'\" onclick=\"nfSet(\\'imp\\',0)\">Из Казахстана<\/button><\/div>'+\n   '<div class=\"grid c2\"><div class=\"field\"><label>'+(f.imp?'Откуда':'Куда')+'<\/label>'+sel('far',FAR_AP)+'<\/div><div class=\"field\"><label>'+(f.imp?'Куда':'Откуда')+'<\/label>'+sel('kz',KZ_AP)+'<\/div><\/div>'+\n   '<div class=\"grid c2\">'+inp('name','Что везём')+'<div class=\"field\"><label>Вид груза<\/label><select onchange=\"nfSet(\\'type\\',this.value)\">'+CT.map(c=>'<option value=\"'+c[0]+'\"'+(f.type===c[0]?' selected':'')+'>'+c[1]+'<\/option>').join('')+'<\/select><\/div><\/div>'+\n   '<div class=\"grid nf5\">'+inp('pcs','Мест','n')+inp('kg','Вес всего, кг','n')+inp('l','Длина, см','n')+inp('w','Ширина, см','n')+inp('h','Высота, см','n')+'<\/div>'+\n   weightBox(w)+\n   '<div class=\"tile\"><div class=\"row-between\"><div><div class=\"label\">Ориентир цены<\/div><div class=\"kpi-val\">'+money(q.total)+'<\/div><div class=\"mini\">'+money(q.rate,'/кг')+' · <span>подходящих рейсов: '+ok.length+'<\/span><\/div><\/div>'+(ok[0]?'<div class=\"art-box\">'+acArt(ok[0].ac)+'<\/div>':'')+'<\/div><\/div>'+\n   '<div class=\"grid c3\">'+inp('cn','Заказчик: имя')+inp('cc','Компания')+inp('cp','Телефон')+'<\/div>'+\n   '<\/div><\/div><div class=\"modal-foot\"><button class=\"btn\" onclick=\"closeModal()\">Отмена<\/button><button class=\"btn btn-g\" onclick=\"saveNew()\">Создать заявку<\/button><\/div>','');\n}\nfunction weightBox(w){\n  const m=Math.max(w.kg,w.volKg,1);\n  return '<div class=\"tile wbox\"><div class=\"label\">Оплачиваемый вес: берётся больший<\/div>'+\n   '<div class=\"wrow'+(w.byVol?'':' on')+'\"><span>По весам<\/span><i><b style=\"width:'+(w.kg/m*100).toFixed(0)+'%\"><\/b><\/i><b>'+wt(w.kg)+'<\/b><\/div>'+\n   '<div class=\"wrow'+(w.byVol?' on':'')+'\"><span>По объёму<\/span><i><b style=\"width:'+(w.volKg/m*100).toFixed(0)+'%\"><\/b><\/i><b>'+wt(w.volKg)+'<\/b><\/div>'+\n   '<div class=\"mini\">Объём '+dec(w.m3)+' м³. Один кубометр считается как 167 кг<\/div><\/div>';\n}\nfunction saveNew(){\n  const f=state.nf; if(!f.name||!String(f.name).trim()){ toast('Напишите, что везём','warn'); return; }\n  const r={id:newReqId(),from:f.imp?f.far:f.kz,to:f.imp?f.kz:f.far,cargo:{name:String(f.name).trim(),type:f.type,pcs:f.pcs,kg:f.kg,l:f.l,w:f.w,h:f.h},\n    client:{name:f.cn||'Заказчик',company:f.cc||'Без компании',phone:f.cp||'—'},st:'new',at:new Date().toISOString(),src:'panel',sent:[],offers:[],log:[]};\n  logReq(r,'Заявку завёл оператор','Оператор'); saveReq(r); state.nf=null; closeModal(); toast('Заявка '+r.id+' создана'); render(); openReq(r.id);\n}\n\n/* ---------- пульт заявки ---------- */\nfunction openReq(id,tab){\n  const r=req(id); if(!r) return;\n  const si=stageIdx(r.st); tab=tab||(si===0?'req':si<=2?'fw':si<=4?'deal':'track'); state.rq={id,tab};\n  const T=[['req','Заявка'],['air','Рейсы'],['fw','Экспедиторы и цены'],['deal','Сделка'],['track','Отслеживание'],['log','История']];\n  const next={new:['reqAct(\\''+id+'\\',\\'send\\')','Запросить цены у экспедиторов'],rfq:['reqAct(\\''+id+'\\',\\'offers\\')','Получить предложения'],agreed:['reqAct(\\''+id+'\\',\\'book\\')','Экспедитор забронировал рейс'],\n    booked:['reqAct(\\''+id+'\\',\\'dep\\')','Груз вылетел'],transit:['reqAct(\\''+id+'\\',\\'arr\\')','Груз прибыл'],arrived:['reqAct(\\''+id+'\\',\\'done\\')','Груз выдан']}[r.st];\n  openModal('<div class=\"modal-head\"><div style=\"flex:1;min-width:0\"><div class=\"row\" style=\"flex-wrap:wrap;gap:8px\"><div class=\"card-title\">'+r.id+' · '+esc(apn(r.from))+' → '+esc(apn(r.to))+'<\/div>'+badge(r.st)+'<\/div>'+stageBar(r)+'<\/div><button class=\"icon-btn\" onclick=\"closeModal()\" aria-label=\"Закрыть\">✕<\/button><\/div>'+\n   '<div class=\"modal-body\"><div class=\"tabs\" style=\"margin-bottom:14px\">'+T.map(t=>'<button class=\"'+(tab===t[0]?'on':'')+'\" onclick=\"openReq(\\''+id+'\\',\\''+t[0]+'\\')\">'+t[1]+'<\/button>').join('')+'<\/div>'+RQ[tab](r)+'<\/div>'+\n   '<div class=\"modal-foot\"><span class=\"mini\" style=\"margin-right:auto\">'+(r.st==='offers'?'Заказчик выбирает предложение в своём кабинете на сайте':si>=4&&r.st!=='done'?'В боевой версии статусы приходят сами по номеру накладной':'')+'<\/span>'+\n    '<button class=\"btn\" onclick=\"closeModal()\">Закрыть<\/button>'+(next?'<button class=\"btn btn-g\" onclick=\"'+next[0]+'\">'+next[1]+'<\/button>':'')+'<\/div>','xl');\n}\nfunction reqAct(id,a,x){\n  const r=req(id); if(!r) return;\n  if(a==='send'){ const ids=fwFor(r).map(f=>f.id); if(!ids.length){ toast('Нет проверенных экспедиторов под это направление и вид груза','warn'); return; } reqSend(r,ids); toast('Запрос ушёл экспедиторам: '+ids.length); }\n  if(a==='offers'){ reqOffers(r); toast(r.offers.length?'Получены предложения: '+r.offers.length:'Экспедиторы пока не ответили','info'); }\n  if(a==='pick'){ reqPick(r,x,'Оператор по поручению заказчика'); toast('Предложение выбрано. Контакты открыты обеим сторонам'); }\n  if(a==='book'){ reqBook(r); toast('Авианакладная '+r.awb); }\n  if(a==='dep'){ reqDepart(r); toast('Груз в воздухе','info'); }\n  if(a==='arr'){ reqArrive(r); toast('Груз прибыл'); }\n  if(a==='done'){ reqDone(r); toast('Сделка закрыта'); }\n  render(); openReq(id);\n}\nconst optRow=(o,extra)=>'<div class=\"opt'+(o.ok===false?' off':'')+'\"><div class=\"art-box sm2\">'+acArt(o.ac)+'<\/div><div style=\"flex:1;min-width:0\"><b>'+esc(optTitle(o))+'<\/b> '+(acFreighter(o.ac)?'<span class=\"badge b-gold\">Грузовой<\/span>':'<span class=\"badge b-blue\">Багажный отсек<\/span>')+\n  '<div class=\"mini\">'+esc(pathText(o.path))+' · '+optSub(o)+'<\/div><div class=\"mini\">'+o.days[0]+'–'+o.days[1]+' дня'+(o.pw?' · вылеты: '+daysText(o.pw)+' · ближайший '+fDs(o.dep instanceof Date?o.dep:new Date(o.dep)):'')+' · до '+dec(AC[o.ac][2])+' т на рейс<\/div>'+\n  (o.why&&o.why.length?'<div class=\"why-no\">'+o.why.map(esc).join(' · ')+'<\/div>':'')+'<\/div>'+(extra||'')+'<\/div>';\nconst RQ={\n req(r){\n  const w=airWeight(r.cargo), q=reqQuote(r), imp=isKZ(r.to), docs=(DOCS[r.cargo.type]||DOCS.gen).concat(imp?DOCS_KZ:[]);\n  return '<div class=\"grid g2\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Груз<\/div><\/div><div class=\"row\" style=\"margin-bottom:10px\"><span class=\"ct-ico lg\">'+ctArt(r.cargo.type,40)+'<\/span><div><b>'+esc(r.cargo.name)+'<\/b><div class=\"mini\">'+ct(r.cargo.type)[1]+' · '+ct(r.cargo.type)[2]+'<\/div><\/div><\/div>'+\n    '<div class=\"kv\"><span>Мест<\/span><b>'+r.cargo.pcs+'<\/b><\/div><div class=\"kv\"><span>Вес партии<\/span><b>'+wt(r.cargo.kg)+'<\/b><\/div><div class=\"kv\"><span>Размер места<\/span><b>'+r.cargo.l+' × '+r.cargo.w+' × '+r.cargo.h+' см<\/b><\/div>'+\n    '<div style=\"margin-top:10px\">'+weightBox(w)+'<\/div><div class=\"kv\" style=\"margin-top:8px\"><span>Ориентир цены<\/span><b>'+money(q.total)+'<\/b><\/div><div class=\"mini\"><span>Перевозка<\/span> '+money(q.freight)+' · <span>обработка в аэропорту<\/span> '+money(q.term)+' · <span>авианакладная<\/span> '+money(q.awb)+'<\/div><div class=\"mini\">Точную цену дают экспедиторы<\/div><\/div>'+\n   '<div class=\"stack\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Заказчик<\/div><div class=\"card-actions\">'+(r.src==='site'?'<span class=\"badge b-gold\">с сайта<\/span>':'')+'<\/div><\/div><div class=\"kv\"><span>Компания<\/span><b>'+esc(r.client.company)+'<\/b><\/div><div class=\"kv\"><span>Контакт<\/span><b>'+esc(r.client.name)+'<\/b><\/div><div class=\"kv\"><span>Телефон<\/span><b>'+esc(r.client.phone)+'<\/b><\/div>'+\n    '<div class=\"mini\" style=\"margin-top:8px\">Экспедитор увидит контакты заказчика только после того, как заказчик выберет его предложение<\/div><\/div>'+\n   '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Документы<\/div><div class=\"card-actions\"><span class=\"mini\">Агент «Документы»<\/span><\/div><\/div>'+docs.map(d=>'<div class=\"check-row\"><span class=\"ck wait\">·<\/span><span>'+esc(d)+'<\/span><\/div>').join('')+'<\/div><\/div><\/div>';\n },\n air(r){\n  const o=airOptions(r.from,r.to,r.cargo);\n  return demoNote('Агент «Маршрут». Расписание демонстрационное: в боевой версии рейсы приходят из API рейсов')+'<div class=\"stack\" style=\"margin-top:10px\">'+\n   (o.map(x=>optRow(x,'<div class=\"opt-price\"><b>'+money(x.q.total)+'<\/b><div class=\"mini\">'+money(x.q.rate,'/кг')+'<\/div><\/div>')).join('')||'<div class=\"empty\">Регулярных рейсов по этому направлению не нашлось. Вариант: грузовой чартер<\/div>')+'<\/div>';\n },\n fw(r){\n  const fit=fwFor(r), si=stageIdx(r.st);\n  if(si===0) return '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Кому уйдёт запрос<\/div><div class=\"card-actions\"><span class=\"mini\">Агент «Подбор»<\/span><\/div><\/div>'+\n    (fit.map(f=>fwRow(f)).join('')||'<div class=\"empty\">Проверенных экспедиторов под это направление и вид груза нет. Посмотрите кандидатов в разделе «Экспедиторы»<\/div>')+\n    '<div class=\"mini\" style=\"margin-top:10px\">Подходят по стране направления и виду груза. Экспедиторы на проверке запрос не получают<\/div><\/div>';\n  if(!r.offers.length) return '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Запрос отправлен<\/div><\/div>'+r.sent.map(id=>fwRow(fw(id),'<span class=\"badge b-violet\">ждём ответа<\/span>')).join('')+'<\/div>';\n  return '<div class=\"stack\">'+r.offers.map((o,i)=>{const f=fw(o.fw),sel=r.pick===i;\n    return '<div class=\"offer'+(sel?' sel':'')+'\"><div class=\"row-between\" style=\"flex-wrap:wrap\"><div style=\"min-width:0\"><b>'+esc(f.name)+'<\/b> <span class=\"stars\">★ '+dec(f.rating)+'<\/span><div class=\"mini\">'+esc(f.city)+' · сделок: '+f.deals+(f.iata?' · аккредитация IATA':'')+'<\/div><\/div>'+\n     '<div class=\"opt-price\"><b>'+money(o.total)+'<\/b><div class=\"mini\">'+money(o.rate,'/кг')+'<\/div><\/div><\/div>'+\n     '<div class=\"kv\"><span>Рейс<\/span><b>'+esc(AL[o.air].n)+' · '+esc(pathText(o.path))+'<\/b><\/div><div class=\"kv\"><span>Срок<\/span><b>'+o.days[0]+'–'+o.days[1]+' дня, вылет '+fDs(new Date(o.dep))+'<\/b><\/div>'+\n     '<div class=\"mini\">'+esc(o.note)+' · действует до '+fDT(new Date(o.valid))+'<\/div>'+\n     (r.st==='offers'?'<div style=\"margin-top:9px\"><button class=\"btn btn-sm\" onclick=\"reqAct(\\''+r.id+'\\',\\'pick\\','+i+')\">Выбрать за заказчика<\/button><\/div>':sel?'<div style=\"margin-top:9px\"><span class=\"badge b-green\">Выбрано заказчиком<\/span><\/div>':'')+'<\/div>'}).join('')+'<\/div>';\n },\n deal(r){\n  const o=reqOffer(r); if(!o) return '<div class=\"empty\">Сделка появится, когда заказчик выберет предложение экспедитора<\/div>';\n  const f=fw(o.fw);\n  return '<div class=\"grid g2\"><div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Заказчик<\/div><\/div><div class=\"kv\"><span>Компания<\/span><b>'+esc(r.client.company)+'<\/b><\/div><div class=\"kv\"><span>Контакт<\/span><b>'+esc(r.client.name)+'<\/b><\/div><div class=\"kv\"><span>Телефон<\/span><b>'+esc(r.client.phone)+'<\/b><\/div><\/div>'+\n   '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Экспедитор<\/div><div class=\"card-actions\"><span class=\"stars\">★ '+dec(f.rating)+'<\/span><\/div><\/div><div class=\"kv\"><span>Компания<\/span><b>'+esc(f.name)+'<\/b><\/div><div class=\"kv\"><span>Контакт<\/span><b>'+esc(f.person)+'<\/b><\/div><div class=\"kv\"><span>Телефон<\/span><b>'+esc(f.phone)+'<\/b><\/div><\/div><\/div>'+\n   '<div class=\"card\" style=\"margin-top:14px\"><div class=\"card-head\"><div class=\"card-title\">Условия<\/div><\/div><div class=\"kv\"><span>Рейс<\/span><b>'+esc(AL[o.air].n)+' · '+esc(pathText(o.path))+'<\/b><\/div><div class=\"kv\"><span>Цена перевозки<\/span><b>'+money(o.total)+'<\/b><\/div>'+\n   '<div class=\"kv\"><span>Комиссия площадки, 3 %<\/span><b>'+money(reqFee(r))+'<\/b><\/div><div class=\"kv\"><span>Авианакладная<\/span><b>'+(r.awb||'появится после брони')+'<\/b><\/div>'+\n   '<div class=\"mini\" style=\"margin-top:8px\">Заказчик платит экспедитору напрямую. Комиссию площадке платит экспедитор. За груз отвечают экспедитор и авиакомпания по авианакладной<\/div><\/div>'+\n   (r.rate?'<div class=\"card\" style=\"margin-top:14px\"><div class=\"card-head\"><div class=\"card-title\">Оценки сторон<\/div><\/div><div class=\"kv\"><span>Заказчик экспедитору<\/span><b class=\"stars\">'+'★'.repeat(r.rate.c)+'<\/b><\/div><div class=\"kv\"><span>Экспедитор заказчику<\/span><b class=\"stars\">'+'★'.repeat(r.rate.f)+'<\/b><\/div><\/div>':'');\n },\n track(r){\n  const t=genTrack(r), o=reqOffer(r); if(!r.awb) return '<div class=\"empty\">Отслеживание начнётся, когда экспедитор забронирует рейс и появится номер авианакладной<\/div>';\n  const p=airPath(r,o), routes=[]; for(let i=0;i<p.length-1;i++) routes.push({a:p[i],b:p[i+1],main:1});\n  return '<div class=\"grid trip-grid\"><div><div class=\"map-wrap\">'+airMap({id:'t',routes,planes:t.leg?[{a:t.leg.from,b:t.leg.to,t:t.leg.t,ground:t.leg.ground}]:[],labels:p,box:fitBox(p)})+'<\/div>'+\n    '<div class=\"grid c3\" style=\"margin-top:10px\"><div class=\"tile\"><div class=\"label\">Авианакладная<\/div><b class=\"mono\">'+r.awb+'<\/b><\/div><div class=\"tile\"><div class=\"label\">Авиакомпания<\/div><b>'+esc(AL[o.air].n)+'<\/b><\/div><div class=\"tile\"><div class=\"label\">Прилёт<\/div><b>'+(t.eta?fDT(t.eta):'—')+'<\/b><\/div><\/div><\/div>'+\n   '<div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Статусы<\/div><div class=\"card-actions\"><span class=\"mini\">Агент «Слежение»<\/span><\/div><\/div><div class=\"tline\">'+\n    t.ev.map((e,i)=>'<div class=\"ev '+(i<t.done?'ok':'todo')+'\"><b>'+EV[e[0]]+'<\/b> <span class=\"muted\">'+e[0]+'<\/span><div class=\"mini\">'+esc(apn(e[2]))+' · '+fDT(e[1])+'<\/div><\/div>').join('')+'<\/div><\/div><\/div>';\n },\n log(r){\n  const l=(r.log||[]).slice().reverse();\n  return '<div class=\"card\"><div class=\"tline\">'+(l.map(x=>'<div class=\"ev ok\"><b>'+esc(x.text)+'<\/b><div class=\"mini\">'+esc(x.who)+' · '+fDT(new Date(x.at))+'<\/div><\/div>').join('')||'<div class=\"ev\"><b>Заявка создана<\/b><div class=\"mini\">'+fDT(new Date(r.at))+'<\/div><\/div>')+'<\/div><\/div>';\n }\n};\nconst fwRow=(f,extra)=>'<div class=\"fleet-row\"><div style=\"flex:1;min-width:0\"><b>'+esc(f.name)+'<\/b> <span class=\"stars\">★ '+dec(f.rating)+'<\/span><div class=\"mini\">'+esc(f.city)+' · сделок: '+f.deals+' · отвечает за '+f.resp+' мин'+(f.agent?' · агент: '+esc(f.agent):'')+'<\/div><\/div>'+(extra||'<span class=\"badge b-green\">проверен<\/span>')+'<\/div>';\n/* окно карты под маршрут */\nfunction fitBox(p){\n  const xs=p.map(k=>apxy(k)[0]), ys=p.map(k=>apxy(k)[1]), d=Math.hypot(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));\n  let x0=Math.min(...xs)-70,x1=Math.max(...xs)+90,y0=Math.min(...ys)-d*.24-40,y1=Math.max(...ys)+50, w=x1-x0,h=y1-y0;\n  if(w<560){x0-=(560-w)/2;w=560}\n  if(w/h<1.9){const nw=h*1.9;x0-=(nw-w)/2;w=nw}else{const nh=w/1.9;y0-=(nh-h)/2;h=nh}\n  return [Math.round(x0),Math.round(y0),Math.round(w),Math.round(h)];\n}\n\nVIEWS.flights=function(){\n  const ap=state.sub.ap||'all', only=state.sub.f, all=board(), list=all.filter(f=>(ap==='all'||f.from===ap||f.to===ap)&&(!only||acFreighter(f.ac)));\n  const routes=[], seen={}; LEGS.concat(TRANSIT).filter(L=>!isKZ(L[1])||!isKZ(L[2])).forEach((L,i)=>{const k=L[1]+L[2]; if(seen[k]) return; seen[k]=1; routes.push({a:L[1],b:L[2],main:acFreighter(L[4]),fly:acFreighter(L[4]),dur:14+hash(k)*14,delay:hash(k+'d')*12,flow:0})});\n  return '<div class=\"card\" style=\"padding:8px;margin-bottom:14px\"><div class=\"map-wrap\" style=\"border:none\">'+airMap({id:'f',routes,labels:FAR_AP})+'<\/div><\/div>'+\n   '<div class=\"row-between\" style=\"margin-bottom:12px;flex-wrap:wrap\"><div class=\"seg\">'+['all'].concat(KZ_AP).map(k=>'<button class=\"'+(ap===k?'on':'')+'\" onclick=\"go(\\'flights\\',{ap:\\''+k+'\\',f:'+(only?1:0)+'})\">'+(k==='all'?'Все p:14px\"><div class=\"card-head\"><div class=\"card-title\">Что нужно для запуска<\/div><\/div>'+\n    [['Экспедиторы-партнёры','Два-три экспедитора в Алматы и агент в Китае с договором. Без них схема не работает'],['Источники данных','Рейсы и отслеживание по накладной: ключи выдают после обычной регистрации'],['Свой справочник','Авиакомпании по направлениям, правила по видам груза, контакты: ведётся вручную'],['Юрист','Правила площадки и договор с экспедитором должен проверить юрист в Казахстане']].map(x=>'<div class=\"kv\"><span><b style=\"color:var(--txt)\">'+x[0]+'<\/b><\/span><b style=\"font-weight:400;max-width:62%\">'+x[1]+'<\/b><\/div>').join('')+'<\/div>';\n};\n\n/* ---------- запуск ---------- */\nfunction onCurChange(){ render(); if(state.rq&&$('#modal-root').innerHTML) openReq(state.rq.id,state.rq.tab); }\nfunction onLangChange(){ render(); }\n(function init(){\n  $('#brand-logo').innerHTML=airLogo(36);\n  const d=new Date(); $('#date-main').textContent=fD(d); $('#date-sub').textContent=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][d.getDay()];\n  const gs=$('#global-search'); if(gs&&gs.addEventListener) gs.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=gs.value.trim(), r=findAwb(v)||req(v.toUpperCase()); if(r){ openReq(r.id); } else { state.q=v; go('reqs'); } } });\n  if(typeof window!=='undefined'&&window.addEventListener){\n    window.addEventListener('storage',e=>{ if(!e.key||syncPrefs(e.key)) return; if(e.key.indexOf('operelleAir')===0){ reloadStore(); render(); if(state.rq&&$('#modal-root').innerHTML.indexOf(state.rq.id)>0) openReq(state.rq.id,state.rq.tab); } });\n    let ww=wide(); window.addEventListener('resize',()=>{ if(wide()!==ww){ ww=wide(); if(state.view==='center') render(); } });\n    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });\n  }\n  fxRefresh(); render();\n})();\n\n<\/script>\n<\/body>\n<\/html>\n"};
const AIR_LINKS=null;
(function(){
  var L={ru:['Сайт для заказчиков','Панель управления','Рядом','Сайт','Панель'],kk:['Тапсырыс берушілер сайты','Басқару панелі','Қатар','Сайт','Панель'],en:['Customer site','Dashboard','Side by side','Site','Dashboard'],zh:['客户网站','管理控制台','并排','网站','控制台']};
  var ls=function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};

  }

    var check=function(){if(done)return;done=true;var ok=false;try{var d=f.contentDocument;ok=!!(d&&d.body&&d.body.childElementCount>1)}catch(e){}if(!ok)failed()};
    f.addEventListener('load',function(){setTimeout(check,60)});setTimeout(check,6000);

  }

})();
