<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090B">
<title>OPERELLE AIR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Один файл с двумя программами: сверху переключатель, ниже сайт для заказчиков и панель управления.
   Обе программы встроены целиком и открываются во внутренних окнах; данные у них общие, поэтому заявка с сайта сразу видна в панели. */
:root{--w-bg:#08090B;--w-bar:#0E0F12;--w-line:#262A31;--w-text:#F2F3F5;--w-muted:#A7ADB8;--w-accent:#FF6B1A;--w-ink:#180900;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--w-bg);color:var(--w-text);font-family:"Fira Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.w-bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;background:var(--w-bar);border-bottom:1px solid var(--w-line)}
.w-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13px;letter-spacing:.1em;white-space:nowrap}
.w-seg{display:flex;gap:3px;margin-left:auto;padding:3px;border:1px solid var(--w-line);border-radius:10px;background:var(--w-bg)}
.w-seg button{min-height:34px;padding:0 14px;border:none;border-radius:7px;background:none;color:var(--w-muted);font:700 13.5px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.w-seg button:hover{color:var(--w-text)}
.w-seg button.on{background:var(--w-accent);color:var(--w-ink)}
.w-seg button:focus-visible{outline:2px solid var(--w-accent);outline-offset:2px}
.w-frames{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);background:var(--w-line);gap:1px}
.w-frames.both{grid-template-columns:minmax(360px,410px) minmax(0,1fr)}
.w-frames iframe{width:100%;height:100%;border:0;display:block;background:var(--w-bg)}
.w-frames iframe[hidden]{display:none}
.w-frames iframe[data-k="site"]{order:1}
.w-frames iframe[data-k="dash"]{order:2}
.w-fall{flex:1;display:grid;place-content:center;gap:12px;padding:24px;text-align:center}
.w-fall[hidden]{display:none}
.w-fall p{margin:0;color:var(--w-muted);max-width:30em}
.w-fall a{display:block;padding:14px 20px;border-radius:10px;background:var(--w-accent);color:var(--w-ink);font-weight:700;text-decoration:none}
@media (max-width:1099px){.w-seg button[data-m="both"]{display:none}}
@media (max-width:520px){.w-bar{gap:8px;padding:5px 10px;min-height:44px}.w-brand span{display:none}.w-seg{flex:1}.w-seg button{flex:1;padding:0 8px}}
</style>
</head>
<body>
<div class="w-bar">
  <div class="w-brand"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#FF6B1A"/><path d="M11 0L3 -1.5L-1 -8H-3.2L-1.4 -1.5L-7.4 -1.1L-9.4 -3.8H-10.8L-9.8 0L-10.8 3.8H-9.4L-7.4 1.1L-1.4 1.5L-3.2 8H-1L3 1.5Z" transform="translate(20 20) rotate(-38) scale(1.35)" fill="#180900"/></svg><span>OPERELLE AIR</span></div>
  <div class="w-seg" id="wSeg" role="tablist" aria-label="Программа">
    <button type="button" role="tab" data-m="site">Сайт для заказчиков</button>
    <button type="button" role="tab" data-m="dash">Панель управления</button>
    <button type="button" role="tab" data-m="both">Рядом</button>
  </div>
</div>
<div class="w-frames" id="wFrames"></div>
<div class="w-fall" id="wFall" hidden></div>
<script>
const AIR_SRC={site:"<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#08090B\">\n<title>OPERELLE AIR — авиаперевозки грузов в Казахстан<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700;800&family=Fira+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap\">\n<style>\n/* Стиль «Ночной рейс», как у сайта и панели автоперевозок: чёрный фон, один акцент (сигнальный оранжевый, переменная --gold).\n   Шрифты Fira Sans и Fira Sans Condensed содержат все казахские буквы. Цены и цифры: моноширинный шрифт. */\n:root{\n  --bg:#08090B;--bg-2:#0D0F12;--card:#111316;--card-2:#181B20;--line:#262A31;--text:#F2F3F5;--muted:#A7ADB8;--dim:#7A818D;\n  --gold:#FF6B1A;--gold-ink:#180900;--ok:#4ADE95;--green:#22C55E;--amber:#F59E0B;--red:#EF4444;\n  --r-card:10px;--r-field:8px;\n  --font:\"Fira Sans\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  --cd:\"Fira Sans Condensed\",\"Arial Narrow\",\"Roboto Condensed\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}\na{text-decoration:none;color:inherit}\nbutton{font:inherit;cursor:pointer;color:inherit;border:none;background:none}\nh1,h2,h3,p{margin:0}\n.wrap{width:min(1240px,92vw);margin:0 auto}\nsection[id]{scroll-margin-top:76px}\n:focus-visible{outline:2px solid var(--gold);outline-offset:2px}\n\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:14px 24px;font-weight:700;font-size:15px;border:1px solid transparent;white-space:nowrap;transition:transform .2s cubic-bezier(.16,1,.3,1),background .2s,border-color .2s}\n.btn:active{transform:scale(.98)}\n.btn-gold{background:var(--gold);color:var(--gold-ink)}\n.btn-gold:hover{background:#FF8440}\n.btn-line{background:transparent;border-color:#3A3F49;color:var(--text)}\n.btn-line:hover{border-color:var(--gold);color:var(--gold)}\n.btn-sm{padding:10px 16px;font-size:14px}\n.btn-block{width:100%}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n\n/* шапка */\n.top{position:fixed;inset:0 0 auto 0;z-index:30;height:64px;background:rgba(8,9,11,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1)}\n.top .wrap{height:100%;display:flex;align-items:center;gap:22px}\n.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.1em;font-size:14px}\n.brand .bn{display:flex;flex-direction:column;line-height:1.1;white-space:nowrap}\n.brand .bn small{font-size:10px;font-weight:600;letter-spacing:.34em;color:var(--muted);text-transform:lowercase;margin-top:3px}\n.nav{display:flex;gap:22px;margin-left:auto;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}\n.nav a{padding:13px 0}\n.nav a:hover{color:var(--gold)}\n.cab-btn .s{display:none}\n.burger{flex:0 0 40px;display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:9px;place-items:center}\n.mnav{position:fixed;top:64px;left:0;right:0;z-index:29;background:rgba(8,9,11,.97);border-bottom:1px solid var(--line);padding:6px 4vw 16px;display:grid}\n.mnav[hidden]{display:none}\n.mnav a{padding:14px 2px;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}\n\n/* первый экран */\n.hero{position:relative;overflow:hidden;min-height:100dvh;padding:132px 0 48px;display:flex;align-items:center}\n.tick{position:absolute;left:0;right:0;top:64px;z-index:2;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(8,9,11,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;white-space:nowrap;padding:9px 0;font:500 12.5px var(--mono);color:#C9CED6}\n.tick div{display:inline-flex;animation:run 70s linear infinite}\n.tick span{padding:0 22px}\n.tick b{color:var(--gold);font-weight:500}\n.tick i,.quote .price i{font-style:normal}\n@keyframes run{to{transform:translateX(-50%)}}\n@keyframes blink{50%{opacity:.35}}\n.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:44px;align-items:start}\n.hero-grid>div:first-child{display:flex;flex-direction:column;align-items:flex-start;min-width:0}\n.live{display:inline-flex;align-items:center;gap:9px;margin-bottom:16px;font:500 12.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#FFC9A6}\n.live i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(255,107,26,.22);animation:blink 1.6s ease-in-out infinite}\n.hero h1{font-family:var(--cd);font-size:clamp(44px,5.6vw,86px);line-height:.92;font-weight:800;text-transform:uppercase;text-wrap:balance}\n.hero h1 em{font-style:normal;color:var(--gold)}\n.hero .lead{font-size:20px;color:var(--muted);margin:18px 0 24px;max-width:28em}\n.hero-cta{display:flex;gap:12px;flex-wrap:wrap}\n/* карта рейсов под заголовком: уходит к левому краю окна, по краям растворяется */\n.hero-map{align-self:stretch;margin:10px -70px 0 calc((100vw - min(1240px,92vw))/-2);\n  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 86%,transparent 100%),linear-gradient(90deg,#000 0,#000 88%,transparent 100%);-webkit-mask-composite:source-in;\n  mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 86%,transparent 100%),linear-gradient(90deg,#000 0,#000 88%,transparent 100%);mask-composite:intersect}\n\n/* расчёт */\n.calc{position:relative;z-index:1;background:rgba(17,19,22,.92);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}\n.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg-2);padding:4px;border-radius:10px;margin-bottom:14px}\n.tabs2 button{padding:10px;border-radius:7px;font-weight:700;font-size:14px;color:var(--muted)}\n.tabs2 button.on{background:var(--card-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}\n.field{margin-bottom:10px;min-width:0}\nlabel{display:block;margin-bottom:5px;font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\nlabel.check{display:flex;gap:10px;align-items:flex-start;font-family:var(--font);font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--muted);cursor:pointer}\nlabel.check input{width:22px;height:22px;flex:0 0 22px;margin-top:0;padding:0;accent-color:var(--gold)}\ninput,select,textarea{width:100%;padding:12px 13px;border-radius:var(--r-field);border:1px solid var(--line);background:var(--bg-2);color:var(--text);font:inherit;font-size:16px;outline:none}\ninput::placeholder{color:#7A818D}\ninput:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,107,26,.18)}\n.wbox{display:grid;gap:7px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-card);padding:12px;margin-bottom:10px}\n.wbox .cap{font:500 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.wrow{display:grid;grid-template-columns:86px minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px;color:var(--dim)}\n.wrow i{display:block;height:10px;border-radius:10px;background:#20232A;overflow:hidden}\n.wrow i b{display:block;height:100%;border-radius:10px;background:#4A505B;transition:width .3s}\n.wrow>b{font:600 13.5px var(--mono);text-align:right;color:var(--muted)}\n.wrow.on{color:var(--text)} .wrow.on i b{background:var(--gold)} .wrow.on>b{color:var(--gold)}\n.quote{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px;margin-bottom:12px}\n.quote-top{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:center}\n.quote-top b{display:block;font-size:15px}\n.quote-top small{display:block;color:var(--muted);font-size:12.5px}\n.quote .price{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}\n.quote .price b{font:600 25px var(--mono);letter-spacing:-.04em;color:var(--gold)}\n.quote .price span{font-size:12.5px;color:var(--muted)}\n.hint{font-size:12px;color:var(--dim);margin-top:9px}\n\n/* разделы */\n.sec{padding:84px 0;border-top:1px solid rgba(255,255,255,.06)}\n.sec.alt{background:var(--bg-2)}\n.eyebrow{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}\n.sec h2{font:800 clamp(34px,4vw,58px)/.95 var(--cd);text-transform:uppercase;text-wrap:balance}\n.sec .sub{color:var(--muted);font-size:18px;margin-top:12px;max-width:34em}\n.sec-head{margin-bottom:36px}\n\n/* как это работает: линия полёта с пятью точками */\n.how{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;padding-top:34px}\n.how::before{content:\"\";position:absolute;left:0;right:0;top:11px;border-top:2px dashed #3A3F49}\n.how-plane{position:absolute;top:0;left:0;width:24px;height:24px;color:var(--gold);animation:howfly 9s linear infinite}\n@keyframes howfly{from{left:0}to{left:calc(100% - 24px)}}\n.how-step{position:relative}\n.how-step::before{content:\"\";position:absolute;top:-29px;left:0;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}\n.how-step .n{font:600 13px var(--mono);color:var(--gold)}\n.how-step b{display:block;font:800 23px/1.05 var(--cd);text-transform:uppercase;margin:6px 0 6px}\n.how-step p{color:var(--muted);font-size:14.5px}\n\n/* чем летит груз */\n.planes{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.plane-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:22px}\n.plane-card .ac-art{max-width:520px;margin:0 auto 14px}\n.plane-card h3{font:800 28px/1 var(--cd);text-transform:uppercase}\n.plane-card p{color:var(--muted);margin-top:8px}\n.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}\n.fact{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}\n.fact b{color:var(--text);font-family:var(--mono);font-weight:600}\n.caps{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:22px}\n.caps h3{font:800 22px/1 var(--cd);text-transform:uppercase;margin-bottom:14px}\n.cap-row{display:grid;grid-template-columns:170px minmax(0,1fr) 70px;gap:14px;align-items:center;padding:7px 0;font-size:14px}\n.cap-row i{display:block;height:12px;border-radius:12px;background:#20232A;overflow:hidden}\n.cap-row i b{display:block;height:100%;border-radius:12px;background:var(--gold)}\n.cap-row.belly i b{background:#5B626E}\n.cap-row>b{font:600 14px var(--mono);text-align:right}\n.cap-row small{display:block;color:var(--dim);font-size:12px}\n\n/* за какой вес платят */\n.wgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:center}\n.wdraw{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px}\n.wdraw svg{display:block;width:100%;height:auto}\n.wex{display:grid;gap:10px}\n.wex-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px}\n.wex-row b{font-size:16px}\n.wex-row small{display:block;color:var(--muted);font-size:13.5px}\n.wex-row .res{text-align:right;font:600 20px var(--mono);letter-spacing:-.04em;color:var(--gold);white-space:nowrap}\n.wex-row .res small{font:400 12px var(--font);letter-spacing:0;color:var(--dim)}\n\n/* виды груза */\n.ctl{border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--card)}\n.ct-row{display:grid;grid-template-columns:56px minmax(0,1.1fr) minmax(0,1.5fr) auto;gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}\n.ct-row:first-child{border-top:none}\n.ct-row .ct-art{color:var(--gold)}\n.ct-row b{font:800 21px/1.05 var(--cd);text-transform:uppercase}\n.ct-row p{color:var(--muted);font-size:14.5px}\n.ct-how{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}\n.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}\n.chip.y{border-color:rgba(74,222,149,.4);color:#8FEFBF}\n.chip.n{color:var(--dim);text-decoration:line-through}\n\n/* направления */\n.dirs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.dir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;transition:border-color .2s}\n.dir:hover{border-color:var(--gold)}\n.dir b{font:800 22px/1.05 var(--cd);text-transform:uppercase}\n.dir b u{text-decoration:none;color:var(--gold)}\n.dir small{display:block;color:var(--muted);font-size:13px;margin-top:3px}\n.dir .p{text-align:right;font:600 18px var(--mono);letter-spacing:-.04em;color:var(--gold);white-space:nowrap}\n.dir .p small{font:400 12px var(--font);color:var(--dim);letter-spacing:0}\n\n/* отслеживание */\n.trk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;max-width:640px}\n.trk input{font-family:var(--mono);font-size:18px;letter-spacing:.04em}\n.demo-awb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:13px;color:var(--dim)}\n.demo-awb button{font:500 13px var(--mono);border:1px solid var(--line);border-radius:999px;padding:11px 14px;color:var(--muted)}\n.demo-awb button:hover{border-color:var(--gold);color:var(--gold)}\n.trk-out{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}\n.trk-out[hidden]{display:none}\n.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;min-width:0}\n.panel h3{font:800 20px/1 var(--cd);text-transform:uppercase;margin-bottom:12px}\n.mapbox{background:#08090B;border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}\n.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}\n.kv:last-child{border-bottom:none}\n.kv span{color:var(--muted)}\n.kv b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}\n.tline{display:flex;flex-direction:column}\n.tline .ev{position:relative;padding:0 0 12px 18px;border-left:2px solid var(--line);margin-left:5px;font-size:14px}\n.tline .ev:last-child{border-left-color:transparent;padding-bottom:0}\n.tline .ev::before{content:\"\";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--card)}\n.tline .ev.todo{color:var(--dim)} .tline .ev.todo::before{background:#2A2E36}\n.tline .ev small{display:block;color:var(--dim);font-size:12.5px}\n\n/* экспедиторам */\n.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}\n.ck-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}\n.ck-row:last-child{border-bottom:none}\n.ck-row i{flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;background:rgba(74,222,149,.16);color:#8FEFBF}\n.ck-row b{display:block;font-size:16px}\n.ck-row small{color:var(--muted);font-size:14px}\n.cbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}\n.cbs button{border:1px solid var(--line);border-radius:999px;padding:11px 15px;font-size:13.5px;color:var(--muted)}\n.cbs button.on{border-color:var(--gold);color:var(--text);background:rgba(255,107,26,.12)}\n\n/* правила и подвал */\n.rules{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n.rules .panel p{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px;color:var(--muted)}\n.rules .panel p:last-child{border-bottom:none}\n.rules .panel p::before{content:\"✓\";color:#8FEFBF;font-weight:800}\n.rules .panel.no p::before{content:\"✕\";color:#FCA5A5}\n.foot{padding:34px 0 46px;border-top:1px solid rgba(255,255,255,.08);color:var(--dim);font-size:13.5px}\n.foot .wrap{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap}\n\n/* метки статусов и полоса этапов */\n.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}\n.b-green{background:rgba(34,197,94,.15);color:#6EE7A0}.b-blue{background:rgba(59,130,246,.16);color:#93B8FB}.b-amber{background:rgba(245,158,11,.15);color:#FBD38D}\n.b-red{background:rgba(239,68,68,.15);color:#FCA5A5}.b-violet{background:rgba(168,85,247,.16);color:#D8B4FE}.b-slate{background:rgba(100,116,139,.2);color:#B4C2D6}\n.b-cyan{background:rgba(6,182,212,.16);color:#7DD8E8}.b-gold{background:rgba(255,107,26,.16);color:#FFB184}\n.stage{display:flex;gap:4px;margin:10px 0 4px}\n.stage div{flex:1;min-width:0}\n.stage i{display:block;height:4px;border-radius:4px;background:#2A2E36}\n.stage .d i{background:var(--green)} .stage .c i{background:var(--gold)}\n.stage span{display:block;font-size:10.5px;color:var(--dim);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.stage .c span{color:#FFB184;font-weight:700} .stage .d span{color:#7EE8AC}\n.stars{color:#F5C542;font-weight:700;white-space:nowrap}\n\n/* окна: заявка и кабинет */\n.ov{position:fixed;inset:0;z-index:60;background:rgba(4,6,10,.76);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;animation:fade .18s ease}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n.dlg{width:min(560px,100%);max-height:92dvh;display:flex;flex-direction:column;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.6)}\n.dlg.cab{width:min(1080px,100%);height:min(760px,92dvh)}\n.dlg-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}\n.dlg-head h3{font:800 24px/1 var(--cd);text-transform:uppercase;flex:1;min-width:0}\n.x{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:0 0 38px}\n.x:hover{color:var(--text);border-color:#4A505B}\n.dlg-body{padding:18px;overflow-y:auto;min-width:0;flex:1}\n.dlg-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}\n.cab-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;height:100%}\n.cab-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}\n.cab-item{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 13px}\n.cab-item.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}\n.cab-item b{display:block;font:800 19px/1.1 var(--cd);text-transform:uppercase;margin:5px 0 2px}\n.cab-item small{color:var(--muted);font-size:12.5px}\n.cab-no{font:500 12px var(--mono);color:var(--dim)}\n.cab-main{overflow-y:auto;min-height:0;min-width:0}\n.cab-back{display:none}\n.offer{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin-bottom:10px}\n.offer.sel{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}\n.offer-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}\n.offer-top .p{text-align:right;font:600 21px var(--mono);letter-spacing:-.04em;color:var(--gold);white-space:nowrap}\n.offer-top .p small{display:block;font:400 12px var(--font);color:var(--dim);letter-spacing:0}\n.offer small.m{display:block;color:var(--muted);font-size:13px}\n.wait{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;margin-bottom:10px;color:var(--muted)}\n.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid #3A3F49;border-top-color:var(--gold);animation:spin 1s linear infinite;flex:0 0 20px}\n@keyframes spin{to{transform:rotate(360deg)}}\n.opt{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:10px 12px;margin-bottom:8px}\n.opt.off{opacity:.6}\n.opt b{font-size:14.5px}\n.opt small{display:block;color:var(--muted);font-size:12.5px}\n.opt .no{color:#FCA5A5}\n.empty{padding:30px 10px;text-align:center;color:var(--dim)}\n.rate{display:flex;gap:4px}\n.rate button{font-size:30px;line-height:1;color:#3A3F49}\n.rate button.on{color:#F5C542}\n#toast-root{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:360px}\n.toast{background:var(--card-2);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.5);font-size:14px}\n.toast.warn{border-left-color:var(--amber)} .toast.info{border-left-color:#3B82F6}\n\n/* планшет и телефон */\n@media (max-width:1080px){\n  .nav{display:none}\n  .burger{display:grid}\n  .top .wrap{gap:10px}\n  .top .fx-slot{margin-left:auto}\n  .hero{padding-top:124px;min-height:0}\n  .hero-grid{grid-template-columns:minmax(0,1fr);gap:22px}\n  .hero-map{margin:6px -4vw 0}\n  .how{grid-template-columns:minmax(0,1fr);gap:0;padding:0 0 0 30px}\n  .how::before{left:5px;right:auto;top:6px;bottom:6px;border-top:none;border-left:2px dashed #3A3F49}\n  .how-plane{display:none}\n  .how-step{padding-bottom:22px}\n  .how-step::before{top:5px;left:-30px}\n  .planes,.wgrid,.pgrid,.rules,.trk-out{grid-template-columns:minmax(0,1fr)}\n  .sec{padding:60px 0}\n}\n@media (max-width:700px){\n  .brand .bn{display:none}\n  .top .wrap{gap:8px}\n  .top .btn-sm{padding:9px 12px;font-size:13px}\n  .cab-btn .l{display:none}\n  .cab-btn .s{display:inline}\n  .hero .lead{font-size:17px}\n  .hero-cta .btn{flex:1 1 auto}\n  .calc{padding:14px}\n  .grid3{grid-template-columns:1fr 1fr 1fr;gap:8px}\n  .sec .sub{font-size:16px}\n  .sec-head{margin-bottom:24px}\n  .dirs{grid-template-columns:minmax(0,1fr)}\n  .dir b{font-size:19px}\n  .dir .p{font-size:16px}\n  .ct-row{grid-template-columns:44px minmax(0,1fr);gap:8px 12px;padding:14px}\n  .ct-row p,.ct-how{grid-column:2}\n  .ct-how{justify-content:flex-start}\n  .cap-row{grid-template-columns:118px minmax(0,1fr) 56px;gap:10px;font-size:13px}\n  .trk{grid-template-columns:minmax(0,1fr)}\n  .wex-row{grid-template-columns:minmax(0,1fr)}\n  .wex-row .res{text-align:left}\n  .ov{padding:0}\n  .dlg,.dlg.cab{width:100%;height:100dvh;max-height:100dvh;border-radius:0;border:none}\n  .cab-grid{grid-template-columns:minmax(0,1fr)}\n  .cab-grid.has .cab-list{display:none}\n  .cab-grid:not(.has) .cab-main{display:none}\n  .cab-back{display:inline-flex;margin-bottom:12px}\n  .dlg-foot .btn{flex:1 1 auto}\n  .stage span{font-size:9.5px}\n  #toast-root{left:12px;right:12px;bottom:12px;max-width:none}\n  .quote-top{grid-template-columns:92px minmax(0,1fr)}\n  .opt{grid-template-columns:86px minmax(0,1fr)}\n}\n@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}html{scroll-behavior:auto}}\n<\/style>\n<\/head>\n<body>\n<header class=\"top\">\n  <div class=\"wrap\">\n    <a class=\"brand\" href=\"#top\" data-noi18n><span id=\"brandLogo\"><\/span><span class=\"bn\"><b>OPERELLE AIR<\/b><small>cargo<\/small><\/span><\/a>\n    <nav class=\"nav\" aria-label=\"Разделы сайта\">\n      <a href=\"#how\">Как работает<\/a><a href=\"#planes\">Самолёты<\/a><a href=\"#cargo\">Грузы<\/a><a href=\"#routes\">Направления<\/a><a href=\"#track\">Отследить<\/a><a href=\"#partners\">Экспедиторам<\/a>\n    <\/nav>\n    <div class=\"fx-slot\" id=\"fxSlot\"><\/div>\n    <button class=\"btn btn-line btn-sm cab-btn\" type=\"button\" onclick=\"openCab()\"><span class=\"l\">Мои заявки<\/span><span class=\"s\">Заявки<\/span><\/button>\n    <button class=\"burger\" type=\"button\" aria-label=\"Меню\" onclick=\"toggleNav()\"><svg viewBox=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"currentColor\"><path d=\"M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z\"/><\/svg><\/button>\n  <\/div>\n<\/header>\n<nav class=\"mnav\" id=\"mnav\" hidden aria-label=\"Разделы сайта\">\n  <a href=\"#calc\" onclick=\"toggleNav()\">Расчёт<\/a><a href=\"#how\" onclick=\"toggleNav()\">Как работает<\/a><a href=\"#planes\" onclick=\"toggleNav()\">Самолёты<\/a><a href=\"#cargo\" onclick=\"toggleNav()\">Грузы<\/a><a href=\"#routes\" onclick=\"toggleNav()\">Направления<\/a><a href=\"#track\" onclick=\"toggleNav()\">Отследить<\/a><a href=\"#partners\" onclick=\"toggleNav()\">Экспедиторам<\/a>\n<\/nav>\n\n<main>\n<section class=\"hero\" id=\"top\">\n  <div class=\"tick\" id=\"tick\" aria-hidden=\"true\"><\/div>\n  <div class=\"wrap hero-grid\">\n    <div>\n      <div class=\"live\"><i><\/i><span>Агенты ищут рейсы круглосуточно<\/span><\/div>\n      <h1 id=\"heroH\" data-noi18n>Груз самолётом в <em>Казахстан<\/em><\/h1>\n      <p class=\"lead\">Покажем рейсы. Соберём цены проверенных экспедиторов. Груз на карте до выдачи.<\/p>\n      <div class=\"hero-cta\">\n        <a class=\"btn btn-gold\" href=\"#calc\">Рассчитать перевозку<\/a>\n        <a class=\"btn btn-line\" href=\"#track\">Отследить груз<\/a>\n      <\/div>\n      <div class=\"hero-map\" id=\"heroMap\"><\/div>\n    <\/div>\n    <aside class=\"calc\" id=\"calc\" aria-label=\"Расчёт перевозки\">\n      <div class=\"tabs2\" id=\"dirTabs\">\n        <button type=\"button\" data-imp=\"1\">В Казахстан<\/button>\n        <button type=\"button\" data-imp=\"0\">Из Казахстана<\/button>\n      <\/div>\n      <div id=\"calcBody\"><\/div>\n      <div id=\"calcOut\"><\/div>\n      <button class=\"btn btn-gold btn-block\" type=\"button\" onclick=\"openOrder()\">Получить цены экспедиторов<\/button>\n      <p class=\"hint\">Цена на этой странице — ориентир. Точную цену и место на рейсе подтверждает экспедитор.<\/p>\n    <\/aside>\n  <\/div>\n<\/section>\n\n<section class=\"sec alt\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Как это работает<\/p><h2>Пять шагов до выдачи груза<\/h2><\/div>\n    <div class=\"how\">\n      <svg class=\"how-plane\" viewBox=\"-12 -12 24 24\" aria-hidden=\"true\"><path d=\"M11 0L3 -1.5L-1 -8H-3.2L-1.4 -1.5L-7.4 -1.1L-9.4 -3.8H-10.8L-9.8 0L-10.8 3.8H-9.4L-7.4 1.1L-1.4 1.5L-3.2 8H-1L3 1.5Z\" fill=\"currentColor\"/><\/svg>\n      <div class=\"how-step\"><span class=\"n\">01<\/span><b>Заявка<\/b><p>Вес, размеры и вид груза. Две минуты.<\/p><\/div>\n      <div class=\"how-step\"><span class=\"n\">02<\/span><b>Рейсы<\/b><p>Показываем, какие авиакомпании возьмут ваш груз.<\/p><\/div>\n      <div class=\"how-step\"><span class=\"n\">03<\/span><b>Цены<\/b><p>Проверенные экспедиторы отвечают ценой и сроком.<\/p><\/div>\n      <div class=\"how-step\"><span class=\"n\">04<\/span><b>Выбор<\/b><p>Вы выбираете предложение, и открываются контакты.<\/p><\/div>\n      <div class=\"how-step\"><span class=\"n\">05<\/span><b>Груз на карте<\/b><p>Статусы по номеру авианакладной до выдачи.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"planes\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Чем летит груз<\/p><h2>Два вида рейсов<\/h2><p class=\"sub\">Оранжевым показано, где лежит груз.<\/p><\/div>\n    <div class=\"planes\">\n      <div class=\"plane-card\"><div id=\"artBelly\"><\/div><h3>Пассажирский рейс<\/h3><p>Груз летит в нижнем отсеке под салоном. Рейсы чаще, цена ниже.<\/p>\n        <div class=\"facts\"><span class=\"fact\">на рейс до <b>2,5 т<\/b><\/span><span class=\"fact\">место до <b>150 кг<\/b><\/span><span class=\"fact\">длина до <b>150 см<\/b><\/span><\/div><\/div>\n      <div class=\"plane-card\"><div id=\"artFr\"><\/div><h3>Грузовой самолёт<\/h3><p>Груз занимает весь самолёт. Берёт тяжёлое, длинное и опасное.<\/p>\n        <div class=\"facts\"><span class=\"fact\">на рейс до <b>134 т<\/b><\/span><span class=\"fact\">место до <b>5 т<\/b><\/span><span class=\"fact\">опасные грузы<\/span><\/div><\/div>\n    <\/div>\n    <div class=\"caps\"><h3>Сколько берёт один рейс<\/h3><div id=\"caps\"><\/div><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec alt\" id=\"weight\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">За какой вес платят<\/p><h2>Вес или объём: берут больший<\/h2><p class=\"sub\">Лёгкий, но большой груз считают по объёму. Один кубометр равен 167 кг.<\/p><\/div>\n    <div class=\"wgrid\">\n      <div class=\"wdraw\">\n        <svg viewBox=\"0 0 420 250\" role=\"img\" aria-label=\"Коробка с размерами и весы\">\n          <g fill=\"none\" stroke=\"#5B626E\" stroke-width=\"2\" stroke-linejoin=\"round\"><path d=\"M40 88l110-44 110 44v104l-110 44-110-44z\" fill=\"#191C21\"/><path d=\"M40 88l110 44 110-44M150 132v104\"/><\/g>\n          <g stroke=\"#FF6B1A\" stroke-width=\"2\" fill=\"none\"><path d=\"M40 208l110 44M28 96v104M160 252l100-40\"/><\/g>\n          <g font-family=\"JetBrains Mono,monospace\" font-size=\"15\" fill=\"#FF6B1A\" font-weight=\"600\"><text x=\"62\" y=\"246\">60<\/text><text x=\"4\" y=\"152\">40<\/text><text x=\"218\" y=\"246\">40<\/text><\/g>\n          <g font-family=\"JetBrains Mono,monospace\" font-size=\"12\" fill=\"#7A818D\"><text x=\"88\" y=\"246\">см<\/text><text x=\"4\" y=\"168\">см<\/text><text x=\"244\" y=\"246\">см<\/text><\/g>\n          <path d=\"M300 172h100v14H300z\" fill=\"#22262D\" stroke=\"#5B626E\" stroke-width=\"2\"/><path d=\"M318 172v-22h64v22\" fill=\"none\" stroke=\"#5B626E\" stroke-width=\"2\"/>\n          <text x=\"350\" y=\"140\" text-anchor=\"middle\" font-family=\"JetBrains Mono,monospace\" font-size=\"22\" font-weight=\"600\" fill=\"#F2F3F5\">10<\/text><text x=\"350\" y=\"204\" text-anchor=\"middle\" font-family=\"JetBrains Mono,monospace\" font-size=\"12\" fill=\"#7A818D\">кг<\/text><text x=\"300\" y=\"228\" font-family=\"JetBrains Mono,monospace\" font-size=\"11\" letter-spacing=\"1.2\" fill=\"#7A818D\">ПО ВЕСАМ<\/text>\n          <text x=\"300\" y=\"34\" font-family=\"JetBrains Mono,monospace\" font-size=\"11\" letter-spacing=\"1.2\" fill=\"#7A818D\">ПО ОБЪЁМУ<\/text><text x=\"300\" y=\"60\" font-family=\"JetBrains Mono,monospace\" font-size=\"13\" fill=\"#A7ADB8\">60 × 40 × 40<\/text><text x=\"300\" y=\"80\" font-family=\"JetBrains Mono,monospace\" font-size=\"13\" fill=\"#A7ADB8\">÷ 6000 =<\/text><text x=\"300\" y=\"108\" font-family=\"JetBrains Mono,monospace\" font-size=\"24\" font-weight=\"600\" fill=\"#FF6B1A\">16<\/text><text x=\"336\" y=\"108\" font-family=\"JetBrains Mono,monospace\" font-size=\"13\" fill=\"#7A818D\">кг<\/text>\n        <\/svg>\n      <\/div>\n      <div class=\"wex\" id=\"wex\"><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"cargo\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Что возим<\/p><h2>Семь видов груза<\/h2><\/div>\n    <div class=\"ctl\" id=\"ctl\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec alt\" id=\"routes\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Направления<\/p><h2>Откуда везём чаще всего<\/h2><p class=\"sub\">Цена за килограмм для партии в 100 кг. Нажмите, чтобы посчитать свой груз.<\/p><\/div>\n    <div class=\"dirs\" id=\"dirs\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"track\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Где мой груз<\/p><h2>Отследить по авианакладной<\/h2><p class=\"sub\">Номер из 11 цифр даёт экспедитор после брони рейса.<\/p><\/div>\n    <div class=\"trk\"><input id=\"awbIn\" inputmode=\"numeric\" autocomplete=\"off\" placeholder=\"465-14716995\" aria-label=\"Номер авианакладной\"><button class=\"btn btn-gold\" type=\"button\" onclick=\"trackFind()\">Найти груз<\/button><\/div>\n    <div class=\"demo-awb\" id=\"demoAwb\"><\/div>\n    <div class=\"trk-out\" id=\"trkOut\" hidden><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec alt\" id=\"partners\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Экспедиторам<\/p><h2>Получайте заявки на авиаперевозку<\/h2><p class=\"sub\">Заявки приходят уже с весом, размерами и подходящими рейсами. Вы отвечаете ценой.<\/p><\/div>\n    <div class=\"pgrid\">\n      <div class=\"panel\"><h3>Что мы проверяем<\/h3><div id=\"checks\"><\/div><\/div>\n      <form class=\"panel\" id=\"pForm\" onsubmit=\"return submitPartner(event)\">\n        <h3>Заявка на подключение<\/h3>\n        <div class=\"field\"><label for=\"pName\">Компания<\/label><input id=\"pName\" required maxlength=\"80\" placeholder=\"ТОО «Название»\"><\/div>\n        <div class=\"grid2\"><div class=\"field\"><label for=\"pCity\">Город<\/label><input id=\"pCity\" required maxlength=\"40\" placeholder=\"Алматы\"><\/div><div class=\"field\"><label for=\"pPhone\">Телефон<\/label><input id=\"pPhone\" required type=\"tel\" maxlength=\"24\" placeholder=\"+7 700 000 00 00\"><\/div><\/div>\n        <div class=\"field\"><label for=\"pPerson\">Кто отвечает на заявки<\/label><input id=\"pPerson\" required maxlength=\"60\" placeholder=\"Имя и фамилия\"><\/div>\n        <label>Откуда возите<\/label><div class=\"cbs\" id=\"pDirs\"><\/div>\n        <label class=\"check\"><input type=\"checkbox\" id=\"pIata\"><span>Есть аккредитация IATA или договор с авиакомпанией<\/span><\/label>\n        <button class=\"btn btn-gold btn-block\" type=\"submit\" style=\"margin-top:14px\">Отправить на проверку<\/button>\n      <\/form>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"sec\" id=\"rules\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><p class=\"eyebrow\">Правила площадки<\/p><h2>Мы сводим стороны<\/h2><p class=\"sub\">Перевозит авиакомпания, бронирует и отвечает за груз экспедитор.<\/p><\/div>\n    <div class=\"rules\">\n      <div class=\"panel\"><h3>Что делает площадка<\/h3><p>Считает оплачиваемый вес и ориентир цены<\/p><p>Показывает рейсы, которые возьмут ваш груз<\/p><p>Собирает цены проверенных экспедиторов<\/p><p>Показывает статусы груза по авианакладной<\/p><\/div>\n      <div class=\"panel no\"><h3>Чего площадка не делает<\/h3><p>Не принимает деньги за перевозку: вы платите экспедитору<\/p><p>Не бронирует рейс и не выдаёт авианакладную<\/p><p>Не отвечает за груз: отвечают экспедитор и авиакомпания<\/p><p>Не гарантирует цену и место: их подтверждает экспедитор<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<\/main>\n\n<footer class=\"foot\"><div class=\"wrap\"><span data-noi18n>OPERELLE AIR · cargo<\/span><span>Пробная версия. Расписания, цены и компании-экспедиторы на сайте демонстрационные.<\/span><\/div><\/footer>\n<div id=\"modal-root\"><\/div>\n<div id=\"toast-root\"><\/div>\n<script>\n\n/* ============================================================\n   ВАЛЮТЫ (общий блок трёх программ)\n   Это не обмен валют. Все суммы считаются и хранятся в тенге, а показываются в валюте,\n   которую человек выбрал вверху страницы: крупно в валюте, ниже мелко в тенге.\n   Выбор хранится в браузере и действует сразу в головной панели, панели компании и на сайте.\n   Курсы демо: ориентир к тенге; в боевой версии загружаются раз в день с сайта Нацбанка РК,\n   головная панель OPERELLE может поправить их вручную (ключ operelleFx).\n   ============================================================ */\nconst fxLS=(k,d)=>{let v=null;try{v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return typeof d==='string'&&typeof v==='string'&&v?v:d}};\nconst fxSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};\n/* код, знак, знак перед числом, название, страны, курс к тенге за 1 единицу */\nconst FX_LIST=[\n ['KZT','₸',0,'Казахстанский тенге','Казахстан',1],\n ['USD','$',1,'Доллар США','США, международные расчёты',520],\n ['EUR','€',1,'Евро','Евросоюз',600],\n ['RUB','₽',0,'Российский рубль','Россия',6.4],\n ['CNY','¥',0,'Китайский юань','Китай',73],\n ['UZS','сўм',0,'Узбекский сум','Узбекистан',0.041],\n ['KGS','сом',0,'Кыргызский сом','Кыргызстан',5.95],\n ['TJS','смн',0,'Таджикский сомони','Таджикистан',48],\n ['TMT','TMT',0,'Туркменский манат','Туркменистан',148],\n ['AZN','₼',0,'Азербайджанский манат','Азербайджан',306],\n ['GEL','₾',0,'Грузинский лари','Грузия',190],\n ['AMD','֏',0,'Армянский драм','Армения',1.34],\n ['BYN','Br',0,'Белорусский рубль','Беларусь',160],\n ['TRY','₺',0,'Турецкая лира','Турция',12.5],\n ['MNT','₮',0,'Монгольский тугрик','Монголия',0.15],\n ['AED','AED',0,'Дирхам ОАЭ','ОАЭ',141.6],\n ['GBP','£',1,'Фунт стерлингов','Великобритания',690],\n ['PLN','zł',0,'Польский злотый','Польша, транзит в ЕС',140],\n ['KRW','₩',0,'Южнокорейская вона','Южная Корея',0.37],\n ['INR','₹',0,'Индийская рупия','Индия',6]\n];\nconst FX=code=>FX_LIST.find(x=>x[0]===code)||FX_LIST[0];\n/* знак валюты: кириллические знаки (сўм, сом, смн) на английском и китайском заменяются кодом */\nconst fxSym=c=>(typeof LANG!=='undefined'&&(LANG==='en'||LANG==='zh')&&/[а-яёў]/i.test(c[1]))?c[0]:c[1];\nconst fxRates=()=>{const o={};FX_LIST.forEach(x=>o[x[0]]=x[5]);return Object.assign(o,fxLS('operelleFx',{}))};\nlet CUR=fxLS('operelleCur','KZT'); if(!FX_LIST.some(x=>x[0]===CUR)) CUR='KZT';\nconst kzt=n=>Math.round(n).toLocaleString('ru-RU')+' ₸';\nconst FX_WORD={ru:['тыс','млн'],kk:['мың','млн'],en:['K','M'],zh:['千','百万']};\nconst fxWord=i=>(FX_WORD[typeof LANG!=='undefined'?LANG:'ru']||FX_WORD.ru)[i];\n/* число в валюте: крупные суммы без копеек, мелкие с двумя знаками, совсем мелкие с тремя */\nconst fxLoc=()=>(typeof LANG!=='undefined'&&(LANG==='en'||LANG==='zh'))?'en-US':'ru-RU';\nconst fxDec=s=>fxLoc()==='en-US'?s:s.replace('.',',');\nfunction fxNum(v){\n  const a=Math.abs(v), d=a>=100?0:a>=1?2:3;\n  return v.toLocaleString(fxLoc(),{minimumFractionDigits:0,maximumFractionDigits:d});\n}\n/* единица после суммы на языке страницы: /км, /т, /ч */\nconst FX_UNIT={kk:{'км':'км','т':'т','м³':'м³','ч':'сағ','час':'сағ','сут':'тәул','мес':'ай','рейс':'рейс','место':'орын'},\n  en:{'км':'km','т':'t','м³':'m³','ч':'h','час':'h','сут':'day','мес':'mo','рейс':'trip','место':'slot'},\n  zh:{'км':'公里','т':'吨','м³':'立方米','ч':'小时','час':'小时','сут':'天','мес':'月','рейс':'趟','место':'个'}};\nconst fxUnit=u=>{if(!u)return '';const m=FX_UNIT[typeof LANG!=='undefined'?LANG:'ru'];const k=u.slice(1);return '/'+(m&&m[k]||k)};\nfunction fxPlain(n,code){\n  const c=FX(code||CUR), v=n/(fxRates()[c[0]]||1);\n  const y=fxSym(c); return c[2]?y+fxNum(v):fxNum(v)+' '+y;\n}\n/* сумма для страницы: в тенге как раньше; в другой валюте крупно валюта, мелко тенге */\nfunction fxMoney(n,u){\n  u=fxUnit(u);\n  if(CUR==='KZT') return kzt(n)+u;\n  return '<span class=\"fx\"><b>'+fxPlain(n)+u+'<\/b><small>'+kzt(n)+u+'<\/small><\/span>';\n}\nfunction fxMln(n){\n  const tenge=(CUR==='KZT'?(n/1e6).toFixed(n>=1e7?1:2).replace('.',','):fxDec((n/1e6).toFixed(n>=1e7?1:2)))+' '+fxWord(1)+' ₸';\n  if(CUR==='KZT') return tenge;\n  const c=FX(CUR), v=n/(fxRates()[c[0]]||1), a=Math.abs(v);\n  const s=a>=1e6?fxDec((v/1e6).toFixed(a>=1e7?1:2))+' '+fxWord(1):a>=1e4?fxDec((v/1e3).toFixed(1))+' '+fxWord(0):fxNum(v);\n  const y=fxSym(c); return '<span class=\"fx\"><b>'+(c[2]?y+s:s+' '+y)+'<\/b><small>'+tenge+'<\/small><\/span>';\n}\n/* суммы внутри готового текста: «от 3 000 ₸», «29 000 ₸ в месяц», «от 170 ₸/км» (единица остаётся при обеих суммах) */\nfunction fxStr(s){\n  if(CUR==='KZT'||!s) return s;\n  return String(s).replace(/(\\d+(?:[   ]\\d{3})*(?:,\\d+)?)[  ]?(млн[  ])?₸(\\/(?:км|т|м³|ч|час|сут|мес|рейс|место))?/g,(m,a,ml,u)=>{\n    const n=parseFloat(a.replace(/[   ]/g,'').replace(',','.'))*(ml?1e6:1);\n    return isFinite(n)?fxMoney(n,u):m});\n}\n/* та же сумма одной строкой, где разметка не допускается: всплывающие подсказки, поля, обычный текст */\nconst fxText=s=>String(s).replace(/<span class=\"fx\"><b>([^<]*)<\\/b><small>([^<]*)<\\/small><\\/span>/g,'$1 ($2)').replace(/<[^>]+>/g,'');\nfunction setCur(code){\n  if(!FX_LIST.some(x=>x[0]===code)) return;\n  CUR=code; fxSet('operelleCur',code);\n  if(typeof onCurChange==='function') onCurChange();\n  fxRefresh();\n}\n/* переключатели валюты и языка для верхней панели: кнопка с кодом и раскрывающийся список; part: 'cur', 'lang' или оба */\nfunction fxSelHTML(langs,part){\n  const L=langs||['ru','kk','en','zh'], lg=typeof LANG!=='undefined'?LANG:'ru';\n  const cur='<div class=\"fxs fxs-cur\"><button type=\"button\" class=\"fxs-btn\" onclick=\"fxToggle(this)\" aria-haspopup=\"listbox\" aria-label=\"Валюта\" title=\"Суммы показываются в этой валюте, ниже мелко в тенге\"><span class=\"fxs-ic\">'+FX(CUR)[1]+'<\/span>'+CUR+'<\/button>'+\n    '<div class=\"fxs-menu\" role=\"listbox\">'+FX_LIST.map(x=>'<button type=\"button\" role=\"option\" class=\"'+(x[0]===CUR?'on':'')+'\" onclick=\"setCur(\\''+x[0]+'\\')\"><b>'+x[0]+'<\/b><span>'+x[3]+'<\/span><i>'+x[1]+'<\/i><\/button>').join('')+'<\/div><\/div>';\n  const lang='<div class=\"fxs fxs-lang\"><button type=\"button\" class=\"fxs-btn\" onclick=\"fxToggle(this)\" aria-haspopup=\"listbox\" aria-label=\"Язык\">'+LANG_NAMES[L.includes(lg)?lg:L[0]][0]+'<\/button>'+\n    '<div class=\"fxs-menu\" role=\"listbox\">'+L.map(k=>'<button type=\"button\" role=\"option\" class=\"'+(k===lg?'on':'')+'\" onclick=\"setLang(\\''+k+'\\')\"><b>'+LANG_NAMES[k][0]+'<\/b><span>'+LANG_NAMES[k][1]+'<\/span><\/button>').join('')+'<\/div><\/div>';\n  return '<div class=\"fxsel\" data-noi18n>'+(part!=='lang'?cur:'')+(part!=='cur'?lang:'')+'<\/div>';\n}\n/* места для переключателей: <div class=\"fx-slot\" data-part=\"cur\" data-langs=\"ru,kk,en\"><\/div> */\nfunction fxRefresh(){if(typeof document==='undefined'||!document.querySelectorAll)return;document.querySelectorAll('.fx-slot').forEach(el=>{el.innerHTML=fxSelHTML(el.dataset.langs?el.dataset.langs.split(','):null,el.dataset.part)})}\nfunction fxToggle(b){const w=b.parentNode,o=w.classList.contains('open');document.querySelectorAll('.fxs.open').forEach(x=>x.classList.remove('open'));if(!o)w.classList.add('open')}\nif(typeof document!=='undefined'&&document.addEventListener) document.addEventListener('click',e=>{if(!(e.target.closest&&e.target.closest('.fxs')))document.querySelectorAll('.fxs.open').forEach(x=>x.classList.remove('open'))});\nconst LANG_NAMES={ru:['RU','Русский'],kk:['KZ','Қазақша'],en:['EN','English'],zh:['ZH','中文']};\nconst FX_CSS='.fx{display:inline-flex;flex-direction:column;line-height:1.1;vertical-align:middle;max-width:100%}.fx b{font-weight:inherit;white-space:nowrap}'+\n  '.fx small{display:block;font-size:.64em;font-weight:500;opacity:.62;letter-spacing:0;white-space:nowrap;font-family:inherit}'+\n  '.tick .fx,p .fx,li .fx,.mini .fx,.toast .fx,.hint .fx,.why .fx,.lead2 .fx,.note-row .fx,.notice .fx,.sub .fx,.ins-sum .fx,.src-tag .fx,.log .fx{display:inline;line-height:inherit}'+\n  '.tick .fx small,p .fx small,li .fx small,.mini .fx small,.toast .fx small,.hint .fx small,.why .fx small,.lead2 .fx small,.note-row .fx small,.notice .fx small,.sub .fx small,.ins-sum .fx small,.src-tag .fx small,.log .fx small{display:inline;font-size:.86em}'+\n  '.tick .fx small::before,p .fx small::before,li .fx small::before,.mini .fx small::before,.toast .fx small::before,.hint .fx small::before,.why .fx small::before,.lead2 .fx small::before,.note-row .fx small::before,.notice .fx small::before,.sub .fx small::before,.ins-sum .fx small::before,.src-tag .fx small::before,.log .fx small::before{content:\" (\"}'+\n h:'+(w.kg/m*100).toFixed(0)+'%\"><\/b><\/i><b>'+wt(w.kg)+'<\/b><\/div>'+\n   '<div class=\"wrow'+(w.byVol?' on':'')+'\"><span>По объёму<\/span><i><b style=\"width:'+(w.volKg/m*100).toFixed(0)+'%\"><\/b><\/i><b>'+wt(w.volKg)+'<\/b><\/div><\/div>';\n}\nfunction renderQuote(){\n  const w=airWeight(C), b=bestOf(cFrom(),cTo(),C);\n  let h=weightBox(w);\n  if(b){ const o=b.o;\n    h+='<div class=\"quote\"><div class=\"quote-top\"><div>'+acArt(o.ac)+'<\/div><div><b>'+esc(AL[o.air].n)+'<\/b><small>'+esc(pathText(o.path))+'<\/small><small>'+o.days[0]+'–'+o.days[1]+' дня · '+(acFreighter(o.ac)?'грузовой самолёт':'пассажирский рейс')+'<\/small><\/div><\/div>'+\n      '<div class=\"price\"><b>'+(b.min===b.max?'':'<i>от<\/i> ')+money(b.min)+'<\/b><span>'+money(b.rate,'/кг')+' · <span>подходящих рейсов: '+b.n+'<\/span><\/span><\/div><\/div>';\n  } else {\n    const any=airOptions(cFrom(),cTo(),C);\n    h+='<div class=\"quote\"><b>'+(any.length?'Регулярный рейс этот груз не возьмёт':'Регулярных рейсов по направлению нет')+'<\/b>'+(any.length?'<small style=\"display:block;color:#FCA5A5;font-size:13px;margin-top:4px\">'+esc(any[0].why[0])+'<\/small>':'')+'<small style=\"display:block;color:var(--muted);font-size:13px;margin-top:4px\">Оставьте заявку: экспедиторы предложат грузовой чартер<\/small><\/div>';\n  }\n  $('#calcOut').innerHTML=h;\n}\n\n/* ---------- разделы ---------- */\nfunction renderSections(){\n  $('#artBelly').innerHTML=acArt('A321'); $('#artFr').innerHTML=acArt('B748F');\n  const caps=[['A321','Пассажирский'],['B763','Пассажирский широкий'],['B763F','Грузовой'],['B77F','Грузовой'],['B748F','Грузовой']];\n  $('#caps').innerHTML=caps.map(c=>'<div class=\"cap-row'+(acFreighter(c[0])?'':' belly')+'\"><span>'+AC[c[0]][0]+'<small>'+c[1]+'<\/small><\/span><i><b style=\"width:'+Math.max(2,AC[c[0]][2]/134*100).toFixed(1)+'%\"><\/b><\/i><b>'+dec(AC[c[0]][2])+' т<\/b><\/div>').join('');\n  const ex=[['Запчасти: 1 место 80 кг','60 × 40 × 40 см',{pcs:1,kg:80,l:60,w:40,h:40}],['Пуховики: 10 коробок, 120 кг','60 × 50 × 50 см каждая',{pcs:10,kg:120,l:60,w:50,h:50}],['Подушки: 20 коробок, 90 кг','70 × 50 × 50 см каждая',{pcs:20,kg:90,l:70,w:50,h:50}]];\n  $('#wex').innerHTML=ex.map(e=>{const w=airWeight(e[2]);return '<div class=\"wex-row\"><div><b>'+e[0]+'<\/b><small>'+e[1]+' · по весам '+wt(w.kg)+', по объёму '+wt(w.volKg)+'<\/small><\/div><div class=\"res\">'+wt(w.chg)+'<small>'+(w.byVol?'платят за объём':'платят за вес')+'<\/small><\/div><\/div>'}).join('');\n  const belly={gen:1,exp:1,temp:1,dg:0,val:1,big:0,live:1};\n  $('#ctl').innerHTML=CT.map(c=>'<div class=\"ct-row\">'+ctArt(c[0],44)+'<b>'+c[1]+'<\/b><p>'+c[2]+'<\/p><div class=\"ct-how\"><span class=\"chip '+(belly[c[0]]?'y':'n')+'\">пассажирский рейс<\/span><span class=\"chip y\">грузовой самолёт<\/span><\/div><\/div>').join('');\n  $('#checks').innerHTML=CHECKS.map(c=>'<div class=\"ck-row\"><i>✓<\/i><div><b>'+c[1]+'<\/b><small>'+c[2]+'<\/small><\/div><\/div>').join('');\n  const D=[['CN','Китай'],['AE','ОАЭ'],['TR','Турция'],['DE','Европа'],['KR','Южная Корея'],['IN','Индия'],['UZ','Узбекистан']];\n  $('#pDirs').innerHTML=D.map(d=>'<button type=\"button\" data-c=\"'+d[0]+'\" onclick=\"this.classList.toggle(\\'on\\')\">'+d[1]+'<\/button>').join('');\n  const tr=getReqs().filter(r=>r.st==='transit'&&r.awb).slice(0,3);\n  $('#demoAwb').innerHTML='<span>Примеры:<\/span>'+tr.map(r=>'<button type=\"button\" data-noi18n onclick=\"trackFind(\\''+r.awb+'\\')\">'+r.awb+'<\/button>').join('');\n  renderDirs();\n}\nfunction renderDirs(){\n  $('#dirs').innerHTML=POP.map(p=>{const b=bestOf(p[0],p[1],popCargo); if(!b) return '';\n    return '<button class=\"dir\" type=\"button\" onclick=\"pickDir(\\''+p[0]+'\\',\\''+p[1]+'\\')\"><span><b>'+esc(apn(p[0]))+' <u>→<\/u> '+esc(apn(p[1]))+'<\/b><small>'+[...new Set(b.all.map(o=>AL[o.air].n))].slice(0,3).map(esc).join(', ')+' · '+b.o.days[0]+'–'+b.o.days[1]+' дня<\/small><\/span><span class=\"p\">'+money(b.rate,'/кг')+'<small>рейсов: '+b.n+'<\/small><\/span><\/button>'}).join('');\n}\nfunction pickDir(a,b){ C.imp=1; C.far=a; C.kz=b; LS.set('operelleAirCalc',C); renderCalc(); const el=$('#calc'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'}); }\n\n/* ---------- отслеживание ---------- */\nfunction trackHTML(r,id){\n  const t=genTrack(r), o=reqOffer(r), p=airPath(r,o), routes=[]; for(let i=0;i<p.length-1;i++) routes.push({a:p[i],b:p[i+1],main:1});\n  const cur=t.ev[Math.max(0,t.done-1)];\n  return '<div><div class=\"mapbox\">'+airMap({id:id||'k',codes:0,routes,planes:t.leg?[{a:t.leg.from,b:t.leg.to,t:t.leg.t,ground:t.leg.ground}]:[],labels:p,box:fitBox(p)})+'<\/div>'+\n    '<div class=\"panel\" style=\"margin-top:14px\"><div class=\"kv\"><span>Авианакладная<\/span><b data-noi18n>'+r.awb+'<\/b><\/div><div class=\"kv\"><span>Маршрут<\/span><b>'+esc(pathText(p))+'<\/b><\/div><div class=\"kv\"><span>Авиакомпания<\/span><b>'+esc(AL[o.air].n)+'<\/b><\/div>'+\n    '<div class=\"kv\"><span>Сейчас<\/span><b>'+(cur?EV[cur[0]]+' · '+esc(apn(cur[2])):'—')+'<\/b><\/div><div class=\"kv\"><span>Прилёт<\/span><b>'+(t.eta?fDT(t.eta):'—')+'<\/b><\/div><\/div><\/div>'+\n   '<div class=\"panel\"><h3>Статусы<\/h3><div class=\"tline\">'+t.ev.map((e,i)=>'<div class=\"ev'+(i<t.done?'':' todo')+'\"><b>'+EV[e[0]]+'<\/b><small>'+esc(apn(e[2]))+' · '+fDT(e[1])+'<\/small><\/div>').join('')+'<\/div><\/div>';\n}\nfunction fitBox(p){\n  const xs=p.map(k=>apxy(k)[0]), ys=p.map(k=>apxy(k)[1]), d=Math.hypot(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));\n  let x0=Math.min(...xs)-70,x1=Math.max(...xs)+90,y0=Math.min(...ys)-d*.24-40,y1=Math.max(...ys)+50, w=x1-x0,h=y1-y0;\n  if(w<560){x0-=(560-w)/2;w=560}\n  if(w/h<1.9){const nw=h*1.9;x0-=(nw-w)/2;w=nw}else{const nh=w/1.9;y0-=(nh-h)/2;h=nh}\n  return [Math.round(x0),Math.round(y0),Math.round(w),Math.round(h)];\n}\nfunction trackFind(v){\n  const inp=$('#awbIn'); if(v) inp.value=v; const r=findAwb(inp.value), out=$('#trkOut');\n  if(!r){ out.hidden=true; toast('Груз с такой накладной не найден. Проверьте 11 цифр номера','warn'); return; }\n  out.hidden=false; out.innerHTML=trackHTML(r,'k');\n}\n\n/* ---------- заявка ---------- */\nfunction openModal(html,cls){ $('#modal-root').innerHTML='<div class=\"ov\" onclick=\"if(event.target===this)closeModal()\"><div class=\"dlg '+(cls||'')+'\" role=\"dialog\" aria-modal=\"true\">'+html+'<\/div><\/div>'; if(document.body&&document.body.style) document.body.style.overflow='hidden'; }\nfunction closeModal(){ $('#modal-root').innerHTML=''; if(document.body&&document.body.style) document.body.style.overflow=''; cab.open=false; }\nconst dhead=t=>'<div class=\"dlg-head\"><h3>'+t+'<\/h3><button class=\"x\" type=\"button\" onclick=\"closeModal()\" aria-label=\"Закрыть\">✕<\/button><\/div>';\nfunction openOrder(){\n  const w=airWeight(C), me=LS.get('operelleAirMe',{});\n  if(!w.kg||!w.m3){ toast('Укажите вес и размеры груза','warn'); return; }\n  openModal(dhead('Заявка на перевозку')+'<form onsubmit=\"return submitOrder(event)\" style=\"display:flex;flex-direction:column;min-height:0;flex:1\"><div class=\"dlg-body\">'+\n   '<div class=\"kv\"><span>Маршрут<\/span><b>'+esc(apn(cFrom()))+' → '+esc(apn(cTo()))+'<\/b><\/div><div class=\"kv\" style=\"margin-bottom:14px\"><span>Оплачиваемый вес<\/span><b>'+wt(w.chg)+' · '+ct(C.type)[1].toLowerCase()+'<\/b><\/div>'+\n   '<div class=\"field\"><label for=\"oName\">Что везём<\/label><input id=\"oName\" required maxlength=\"80\" placeholder=\"например: смартфоны, 24 коробки\"><\/div>'+\n   '<div class=\"grid2\"><div class=\"field\"><label for=\"oMe\">Ваше имя<\/label><input id=\"oMe\" required maxlength=\"60\" value=\"'+esc(me.name||'')+'\"><\/div><div class=\"field\"><label for=\"oPhone\">Телефон<\/label><input id=\"oPhone\" required type=\"tel\" maxlength=\"24\" placeholder=\"+7 700 000 00 00\" value=\"'+esc(me.phone||'')+'\"><\/div><\/div>'+\n   '<div class=\"field\"><label for=\"oCo\">Компания<\/label><input id=\"oCo\" maxlength=\"80\" placeholder=\"ТОО или ИП\" value=\"'+esc(me.company||'')+'\"><\/div>'+\n   '<label class=\"check\"><input type=\"checkbox\" id=\"oOk\" required><span>Согласен с правилами площадки: она сводит стороны, перевозку оплачиваю экспедитору<\/span><\/label>'+\n   '<\/div><div class=\"dlg-foot\"><button class=\"btn btn-line\" type=\"button\" onclick=\"closeModal()\">Отмена<\/button><button class=\"btn btn-gold\" type=\"submit\">Отправить заявку<\/button><\/div><\/form>');\n}\nfunction submitOrder(e){\n  if(e&&e.preventDefault) e.preventDefault();\n  const me={name:$('#oMe').value.trim(),phone:$('#oPhone').value.trim(),company:$('#oCo').value.trim()}; LS.set('operelleAirMe',me);\n  const r={id:newReqId(),from:cFrom(),to:cTo(),cargo:{name:$('#oName').value.trim(),type:C.type,pcs:C.pcs,kg:C.kg,l:C.l,w:C.w,h:C.h},\n    client:{name:me.name,company:me.company||'Частное лицо',phone:me.phone},st:'new',at:new Date().toISOString(),src:'site',sent:[],offers:[],log:[]};\n  logReq(r,'Заявка с сайта','Заказчик'); saveReq(r);\n  openCab(r.id); simulate(r.id); return false;\n}\n/* агенты ведут заявку сами: подбор рейсов, запрос цен, ответы экспедиторов (в пробной версии по таймеру) */\nconst TM={};\nfunction later(id,ms,fn){ clearTimeout(TM[id]); TM[id]=setTimeout(()=>{ reloadStore(); const r=req(id); if(r){ fn(r); refreshCab(); } },ms); }\nfunction simulate(id){\n  if(!getCfg().auto) return;\n  const r=req(id); if(!r) return;\n  if(r.st==='new') later(id,2600,x=>{ if(x.st!=='new') return; if(fwFor(x).length){ reqSend(x); simulate(id); } });\n  else if(r.st==='rfq') later(id,4200,x=>{ if(x.st!=='rfq') return; reqOffers(x); if(x.st==='offers') toast('Экспедиторы ответили: предложений '+x.offers.length); });\n  else if(r.st==='agreed') later(id,4200,x=>{ if(x.st!=='agreed') return; reqBook(x); toast('Рейс забронирован. Авианакладная '+x.awb); simulate(id); });\n  else if(r.st==='booked') later(id,5200,x=>{ if(x.st!=='booked') return; reqDepart(x); toast('Груз вылетел','info'); });\n}\n\n/* ---------- кабинет: мои заявки ---------- */\nconst cab={open:false,id:null};\nconst myReqs=()=>getReqs().filter(r=>r.src==='site');\nfunction openCab(id){\n  cab.open=true; reloadStore(); const mine=myReqs(); cab.id=id||cab.id||(mine[0]&&mine[0].id)||null;\n  if(cab.id&&!req(cab.id)) cab.id=mine[0]?mine[0].id:null;\n  renderCab();\n}\nfunction refreshCab(){ if(cab.open) renderCab(); }\nfunction cabPick(id){ cab.id=id; renderCab(); if(id) simulate(id); }\nfunction renderCab(){\n  const mine=myReqs(), r=cab.id?req(cab.id):null, demo=getReqs().find(x=>x.id==='AIR-26045');\n  const item=x=>'<button class=\"cab-item'+(r&&r.id===x.id?' on':'')+'\" type=\"button\" onclick=\"cabPick(\\''+x.id+'\\')\"><span style=\"display:flex;justify-content:space-between;gap:8px;align-items:center\"><span class=\"cab-no\">'+x.id+'<\/span><span class=\"badge '+ST[x.st][1]+'\">'+ST[x.st][0]+'<\/span><\/span><b>'+esc(apn(x.from))+' → '+esc(apn(x.to))+'<\/b><small>'+esc(x.cargo.name)+' · '+wt(airWeight(x.cargo).chg)+'<\/small><\/button>';\n  const list=mine.length?mine.map(item).join(''):'<div class=\"empty\">Заявок пока нет.<br>Посчитайте груз и нажмите «Получить цены экспедиторов»<\/div>'+(demo?'<button class=\"btn btn-line btn-sm\" type=\"button\" onclick=\"cabPick(\\'AIR-26045\\')\">Показать пример заявки<\/button>':'');\n  openModal(dhead('Мои заявки')+'<div class=\"dlg-body\"><div class=\"cab-grid'+(r?' has':'')+'\"><div class=\"cab-list\">'+list+'<\/div><div class=\"cab-main\">'+(r?cabDetail(r):'<div class=\"empty\">Выберите заявку слева<\/div>')+'<\/div><\/div><\/div>','cab');\n  cab.open=true;\n}\nfunction cabDetail(r){\n  const w=airWeight(r.cargo), o=reqOffer(r), si=stageIdx(r.st), demo=r.src!=='site';\n  let h='<button class=\"btn btn-line btn-sm cab-back\" type=\"button\" onclick=\"cabPick(null)\">← Все заявки<\/button>'+\n   '<div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center\"><h3 style=\"font:800 30px/1 var(--cd);text-transform:uppercase\">'+esc(apn(r.from))+' → '+esc(apn(r.to))+'<\/h3><span class=\"badge '+ST[r.st][1]+'\">'+ST[r.st][0]+'<\/span><\/div>'+\n   '<p style=\"color:var(--muted);margin-top:6px\">'+r.id+' · '+esc(r.cargo.name)+' · мест: '+r.cargo.pcs+' · оплачиваемый вес '+wt(w.chg)+(demo?' · пример':'')+'<\/p>'+stageBar(r)+'<div style=\"height:14px\"><\/div>';\n  if(si===0){\n    const op=airOptions(r.from,r.to,r.cargo);\n    h+='<div class=\"wait\"><span class=\"spin\"><\/span><span>Агент «Маршрут» подобрал рейсы. Агент «Подбор» отправляет запрос экспедиторам<\/span><\/div>'+op.map(optHTML).join('');\n  } else if(si===1){\n    h+='<div class=\"wait\"><span class=\"spin\"><\/span><span>Запрос получили экспедиторы: '+r.sent.length+'. Ждём цены<\/span><\/div>'+airOptions(r.from,r.to,r.cargo).filter(x=>x.ok).map(optHTML).join('');\n  } else if(si===2){\n    h+='<p style=\"color:var(--muted);margin-bottom:12px\">Выберите предложение. После выбора откроются контакты экспедитора, а он увидит ваши.<\/p>'+r.offers.map((x,i)=>offerHTML(r,x,i,true)).join('');\n  } else {\n    const f=fw(o.fw);\n    if(r.awb) h+='<div class=\"trk-out\" style=\"margin:0 0 14px\">'+trackHTML(r,'cb')+'<\/div>';\n    else h+='<div class=\"wait\"><span class=\"spin\"><\/span><span>Экспедитор бронирует рейс. Номер авианакладной появится здесь<\/span><\/div>';\n    h+='<div class=\"panel\"><h3>Ваш экспедитор<\/h3><div class=\"kv\"><span>Компания<\/span><b>'+esc(f.name)+' <span class=\"stars\">★ '+dec(f.rating)+'<\/span><\/b><\/div><div class=\"kv\"><span>Контакт<\/span><b>'+esc(f.person)+'<\/b><\/div><div class=\"kv\"><span>Телефон<\/span><b>'+esc(f.phone)+'<\/b><\/div>'+\n       '<div class=\"kv\"><span>Цена перевозки<\/span><b>'+money(o.total)+'<\/b><\/div><div class=\"kv\"><span>Кому платить<\/span><b>Экспедитору напрямую<\/b><\/div><\/div>';\n    if(r.st==='arrived') h+='<div class=\"panel\" style=\"margin-top:14px\"><h3>Груз прибыл<\/h3><p style=\"color:var(--muted)\">Экспедитор сообщит, когда груз пройдёт тамо n  const r=req(id); if(!r||r.st!=='offers') return;\n  if(r.src!=='site'){ toast('Это пример. Выбирать можно в своей заявке','info'); return; }\n  reqPick(r,i,'Заказчик'); toast('Контакты экспедитора открыты'); renderCab(); simulate(id);\n}\nfunction cabDone(id){ const r=req(id); if(!r) return; reqDone(r); renderCab(); }\nfunction cabRate(id,n){ const r=req(id); if(!r||r.src!=='site') return; r.rate=Object.assign({f:5},r.rate,{c:n}); logReq(r,'Заказчик поставил оценку: '+n,'Заказчик'); saveReq(r); renderCab(); toast('Спасибо. Оценка попадёт в рейтинг экспедитора'); }\n\n/* ---------- анкета экспедитора ---------- */\nfunction submitPartner(e){\n  if(e&&e.preventDefault) e.preventDefault();\n  const dirs=[...document.querySelectorAll('#pDirs button.on')].map(b=>b.dataset.c);\n  if(!dirs.length){ toast('Отметьте хотя бы одно направление','warn'); return false; }\n  const all=dirs.includes('DE')?dirs.concat(['BE','NL','LU']):dirs, n=Object.keys(LS.get('operelleAirFw',{})).filter(k=>k.indexOf('FW-S')===0).length+1;\n  const iata=$('#pIata').checked?1:0;\n  saveFw({id:'FW-S'+n,name:$('#pName').value.trim(),city:$('#pCity').value.trim(),iata,since:new Date().getFullYear(),dirs:all,types:['gen','exp'],rating:0,deals:0,resp:0,st:'review',\n    person:$('#pPerson').value.trim(),phone:$('#pPhone').value.trim(),mail:'—',agent:'',checks:{reg:0,iata:0,contract:0,ins:0,ref:0},src:'site'});\n  $('#pForm').reset(); document.querySelectorAll('#pDirs button.on').forEach(b=>b.classList.remove('on'));\n  toast('Заявка отправлена. Проверим документы и свяжемся с вами'); return false;\n}\n\n/* ---------- запуск ---------- */\nfunction onCurChange(){ renderTick(); renderQuote(); renderDirs(); if(cab.open) renderCab(); const o=$('#trkOut'); if(o&&!o.hidden) trackFind(); }\nconst HERO_H={ru:'Груз самолётом в <em>Казахстан<\/em>',kk:'<em>Қазақстанға<\/em> ұшақпен жүк',en:'Air cargo to <em>Kazakhstan<\/em>',zh:'空运货物至<em>哈萨克斯坦<\/em>'};\nfunction heroTitle(){ $('#heroH').innerHTML=HERO_H[LANG]| n,.seg button{min-height:38px}#bell{order:3}}\n@media(max-width:700px){\n  .nf5{grid-template-columns:1fr 1fr}\n  .opt{flex-wrap:wrap}\n  .art-box.sm2{width:120px;flex-basis:120px}\n  .opt-price{text-align:left;flex:1 1 100%}\n  .wrow{grid-template-columns:74px minmax(0,1fr) 66px}\n  .modal-head .stage span{display:none}\n  /* таблицы на телефоне: строка становится карточкой, ничего не прячется */\n  .tbl-wrap{overflow:visible}\n  .tbl-wrap thead{display:none}\n  .tbl-wrap tr{display:block;padding:12px 0;border-bottom:1px solid var(--line-soft)}\n  .tbl-wrap tbody tr:last-child{border-bottom:none}\n  .tbl-wrap td{display:block;border:none;padding:3px 0;min-width:0;white-space:normal}\n  .tbl-wrap td:first-child{font-size:14.5px}\n  .cr-legend{display:flex;flex-wrap:wrap;gap:6px 14px}\n  .tbl-wrap td .route{white-space:normal}\n}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n  <aside class=\"sidebar\" id=\"sidebar\">\n    <div class=\"brand\">\n      <div class=\"brand-logo-box\" id=\"brand-logo\"><\/div>\n      <div>\n        <div class=\"brand-name\" id=\"brand-name\" data-noi18n>OPERELLE AIR<\/div>\n        <div class=\"brand-sub\" id=\"brand-sub\" data-noi18n>cargo<\/div>\n      <\/div>\n    <\/div>\n    <nav class=\"nav\" id=\"nav\"><\/nav>\n    <div class=\"sidebar-foot\">\n      <div class=\"ai-status\">\n        <div class=\"ai-dot\"><\/div>\n        <div style=\"flex:1\">\n          <div style=\"font-size:12.5px;font-weight:600\">DURUS.AI<\/div>\n          <div style=\"font-size:11px;color:var(--txt-3)\" id=\"ai-count\">6 агентов на связи<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/aside>\n\n  <div class=\"main\">\n    <header class=\"topbar\">\n      <button class=\"icon-btn burger\" onclick=\"document.getElementById('sidebar').classList.toggle('open')\" aria-label=\"Меню\">\n        <svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"currentColor\"><path d=\"M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z\"/><\/svg>\n      <\/button>\n      <div class=\"title-block\">\n        <div class=\"page-title\" id=\"page-title\">Командный центр<\/div>\n        <div class=\"page-sub\" id=\"page-sub\">Обзор авиаперевозок<\/div>\n      <\/div>\n      <div class=\"search\">\n        <svg viewBox=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"currentColor\"><path d=\"M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z\"/><\/svg>\n        <input id=\"global-search\" placeholder=\"Заявка, накладная, заказчик…\" autocomplete=\"off\">\n      <\/div>\n      <div class=\"date-chip\">\n        <b id=\"date-main\">—<\/b><span id=\"date-sub\">—<\/span>\n      <\/div>\n      <div class=\"fx-slot\" data-part=\"cur\" id=\"fx-cur\"><\/div>\n      <div class=\"fx-slot\" data-part=\"lang\" id=\"fx-lang\"><\/div>\n      <button class=\"icon-btn\" id=\"bell\" onclick=\"openAlerts()\" aria-label=\"Уведомления\">\n        <svg viewBox=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"currentColor\"><path d=\"M12 2a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3V8a6 6 0 0 0-6-6zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z\"/><\/svg>\n        <span class=\"dot\"><\/span>\n      <\/button>\n      <div class=\"user-chip\">\n        <div class=\"avatar\" id=\"user-initials\">АС<\/div>\n        <div style=\"line-height:1.25\">\n          <div style=\"font-size:13px;font-weight:600\" id=\"user-name\">Айдана Серикова<\/div>\n          <div style=\"font-size:11px;color:var(--txt-3)\" id=\"user-role\">Оператор<\/div>\n        <\/div>\n      <\/div>\n    <\/header>\n    <div class=\"view\" id=\"view\"><\/div>\n  <\/div>\n<\/div>\n<nav class=\"tabbar\" id=\"tabbar\" aria-label=\"Быстрые разделы\"><\/nav>\n<div id=\"modal-root\"><\/div>\n<div id=\"toast-root\"><\/div>\n<script>\n\n/* ============================================================\n   ВАЛЮТЫ (общий блок трёх программ)\n   Это не обмен валют. Все суммы считаются и хранятся в тенге, а показываются в валюте,\n   которую человек выбрал вверху страницы: крупно в валюте, ниже мелко в тенге.\n   Выбор хранится в браузере и действует сразу в головной панели, панели компании и на сайте.\n   Курсы демо: ориентир к тенге; в боевой версии загружаются раз в день с сайта Нацбанка РК,\n   головная панель OPERELLE может поправить их вручную (ключ operelleFx).\n   ============================================================ */\nconst fxLS=(k,d)=>{let v=null;try{v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return typeof d==='string'&&typeof v==='string'&&v?v:d}};\nconst fxSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};\n/* код, знак, знак перед числом, название, страны, курс к тенге за 1 единицу */\nconst FX_LIST=[\n ['KZT','₸',0,'Казахстанский тенге','Казахстан',1],\n ['USD','$',1,'Доллар США','США, международные расчёты',520],\n ['EUR','€',1,'Евро','Евросоюз',600],\n ['RUB','₽',0,'Российский рубль','Россия',6.4],\n ['CNY','¥',0,'Китайский юань','Китай',73],\n ['UZS','сўм',0,'Узбекский сум','Узбекистан',0.041],\n ['KGS','сом',0,'Кыргызский сом','Кыргызстан',5.95],\n ['TJS','смн',0,'Таджикский сомони','Таджикистан',48],\n ['TMT','TMT',0,'Туркменский манат','Туркменистан',148],\n ['AZN','₼',0,'Азербайджанский манат','Азербайджан',306],\n ['GEL','₾',0,'Грузинский лари','Грузия',190],\n ['AMD','֏',0,'Армянский драм','Армения',1.34],\n ['BYN','Br',0,'Белорусский рубль','Беларусь',160],\n ['TRY','₺',0,'Турецкая лира','Турция',12.5],\n ['MNT','₮',0,'Монгольский тугрик','Монголия',0.15],\n ['AED','AED',0,'Дирхам ОАЭ','ОАЭ',141.6],\n ['GBP','£',1,'Фунт стерлингов','Великобритания',690],\n ['PLN','zł',0,'Польский злотый','Польша, транзит в ЕС',140],\n ['KRW','₩',0,'Южнокорейская вона','Южная Корея',0.37],\n ['INR','₹',0,'Индийская рупия','Индия',6]\n];\nconst FX=code=>FX_LIST.find(x=>x[0]===code)||FX_LIST[0];\n/* знак валюты: кириллические знаки (сўм, сом, смн) на английском и китайском заменяются кодом */\nconst fxSym=c=>(typeof LANG!=='undefined'&&(LANG==='en'||LANG==='zh')&&/[а-яёў]/i.test(c[1]))?c[0]:c[1];\nconst fxRates=()=>{const o={};FX_LIST.forEach(x=>o[x[0]]=x[5]);return Object.assign(o,fxLS('operelleFx',{}))};\nlet CUR=fxLS('operelleCur','KZT'); if(!FX_LIST.some(x=>x[0]===CUR)) CUR='KZT';\nconst kzt=n=>Math.round(n).toLocaleString('ru-RU')+' ₸';\nconst FX_WORD={ru:['тыс','млн'],kk:['мың','млн'],en:['K','M'],zh:['千','百万']};\nconst fxWord=i=>(FX_WORD[typeof LANG!=='undefined'?LANG:'ru']||FX_WORD.ru)[i];\n/* число в валюте: крупные суммы без копеек, мелкие с двумя знаками, совсем мелкие с тремя */\nconst fxLoc=()=>(typeof LANG!=='undefined'&&(LANG==='en'||LANG==='zh'))?'en-US':'ru-RU';\nconst fxDec=s=>fxLoc()==='en-US'?s:s.replace('.',',');\nfunction fxNum(v){\n  const a=Math.abs(v), d=a>=100?0:a>=1?2:3;\n  return v.toLocaleString(fxLoc(),{minimumFractionDigits:0,maximumFractionDigits:d});\n}\n/* единица после суммы на языке страницы: /км, /т, /ч */\nconst FX_UNIT={kk:{'км':'км','т':'т','м³':'м³','ч':'сағ','час':'сағ','сут':'тәул','мес':'ай','рейс':'рейс','место':'орын'},\n  en:{'км':'km','т':'t','м³':'m³','ч':'h','час':'h','сут':'day','мес':'mo','рейс':'trip','место':'slot'},\n  zh:{'км':'公里','т':'吨','м³':'立方米','ч':'小时','час':'小时','сут':'天','мес':'月','рейс':'趟','место':'个'}};\nconst fxUnit=u=>{if(!u)return '';const m=FX_UNIT[typeof LANG!=='undefined'?LANG:'ru'];const k=u.slice(1);return '/'+(m&&m[k]||k)};\nfunction fxPlain(n,code){\n  const c=FX(code||CUR), v=n/(fxRates()[c[0]]||1);\n  const y=fxSym(c); return c[2]?y+fxNum(v):fxNum(v)+' '+y;\n}\n/* сумма для страницы: в тенге как раньше; в другой валюте крупно валюта, мелко тенге */\nfunction fxMoney(n,u){\n  u=fxUnit(u);\n  if(CUR==='KZT') return kzt(n)+u;\n  return '<span class=\"fx\"><b>'+fxPlain(n)+u+'<\/b><small>'+kzt(n)+u+'<\/small><\/span>';\n}\nfunction fxMln(n){\n  const tenge=(CUR==='KZT'?(n/1e6).toFixed(n>=1e7?1:2).replace('.',','):fxDec((n/1e6).toFixed(n>=1e7?1:2)))+' '+fxWord(1)+' ₸';\n  if(CUR==='KZT') return tenge;\n  const c=FX(CUR), v=n/(fxRates()[c[0]]||1), a=Math.abs(v);\n  const s=a>=1e6?fxDec((v/1e6).toFixed(a>=1e7?1:2))+' '+fxWord(1):a>=1e4?fxDec((v/1e3).toFixed(1))+' '+fxWord(0):fxNum(v);\n  const y=fxSym(c); return '<span class=\"fx\"><b>'+(c[2]?y+s:s+' '+y)+'<\/b><small>'+tenge+'<\/small><\/span>';\n}\n/* суммы внутри готового текста: «от 3 000 ₸», «29 000 ₸ в месяц», «от 170 ₸/км» (единица остаётся при обеих суммах) */\nfunction fxStr(s){\n  if(CUR==='KZT'||!s) return s;\n  return String(s).replace(/(\\d+(?:[   ]\\d{3})*(?:,\\d+)?)[  ]?(млн[  ])?₸(\\/(?:км|т|м³|ч|час|сут|мес|рейс|место))?/g,(m,a,ml,u)=>{\n    const n=parseFloat(a.replace(/[   ]/g,'').replace(',','.'))*(ml?1e6:1);\n    return isFinite(n)?fxMoney(n,u):m});\n}\n/* та же сумма одной строкой, где разметка не допускается: всплывающие подсказки, поля, обычный текст */\nconst fxText=s=>String(s).replace(/<span class=\"fx\"><b>([^<]*)<\\/b><small>([^<]*)<\\/small><\\/span>/g,'$1 ($2)').replace(/<[^>]+>/g,'');\nfunction setCur(code){\n  if(!FX_LIST.some(x=>x[0]===code)) return;\n  CUR=code; fxSet('operelleCur',code);\n  if(typeof onCurChange==='function') onCurChange();\n  fxRefresh();\n}\n/* переключатели валюты и языка для верхней панели: кнопка с кодом и раскрывающийся список; part: 'cur', 'lang' или оба */\nfunction fxSelHTML(langs,part){\n  const L=langs||['ru','kk','en','zh'], lg=typeof LANG!=='undefined'?LANG:'ru';\n  const cur='<div class=\"fxs fxs-cur\"><button type=\"button\" class=\"fxs-btn\" onclick=\"fxToggle(this)\" aria-haspopup=\"listbox\" aria-label=\"Валюта\" title=\"Суммы показываются в этой валюте, ниже мелко в тенге\"><span class=\"fxs-ic\">'+FX(CUR)[1]+'<\/span>'+CUR+'<\/button>'+\n    '<div class=\"fxs-menu\" role=\"listbox\">'+FX_LIST.map(x=>'<button type=\"button\" role=\"option\" class=\"'+(x[0]===CUR?'on':'')+'\" onclick=\"setCur(\\''+x[0]+'\\')\"><b>'+x[0]+'<\/b><span>'+x[3]+'<\/span><i>'+x[1]+'<\/i><\/button>').join('')+'<\/div><\/div>';\n  const lang='<div class=\"fxs fxs-lang\"><button type=\"button\" class=\"fxs-btn\" onclick=\"fxToggle(this)\" aria-haspopup=\"listbox\" aria-label=\"Язык\">'+LANG_NAMES[L.includes(lg)?lg:L[0]][0]+'<\/button>'+\n    '<div class=\"fxs-menu\" role=\"listbox\">'+L.map(k=>'<button type=\"button\" role=\"option\" class=\"'+(k===lg?'on':'')+'\" onclick=\"setLang(\\''+k+'\\')\"><b>'+LANG_NAMES[k][0]+'<\/b><span>'+LANG_NAMES[k][1]+'<\/span><\/button>').join('')+'<\/div><\/div>';\n  return '<div class=\"fxsel\" data-noi18n>'+(part!=='lang'?cur:'')+(part!=='cur'?lang:'')+'<\/div>';\n}\n/* места для переключателей: <div class=\"fx-slot\" data-part=\"cur\" data-langs=\"ru,kk,en\"><\/div> */\nfunction fxRefresh(){if(typeof document==='undefined'||!document.querySelectorAll)return;document.querySelectorAll('.fx-slot').forEach(el=>{el.innerHTML=fxSelHTML(el.dataset.langs?el.dataset.langs.split(','):null,el.dataset.part)})}\nfunction fxToggle(b){const w=b.parentNode,o=w.classList.contains('open');document.querySelectorAll('.fxs.open').forEach(x=>x.classList.remove('open'));if(!o)w.classList.add('open')}\nif(typeof document!=='undefined'&&document.addEventListener) document.addEventListener('click',e=>{if(!(e.target.closest&&e.target.closest('.fxs')))document.querySelectorAll('.fxs.open').forEach(x=>x.classList.remove('open'))});\nconst LANG_NAMES={ru:['RU','Русский'],kk:['KZ','Қазақша'],en:['EN','English'],zh:['ZH','中文']};\nconst FX_CSS='.fx{display:inline-flex;flex-direction:column;line-height:1.1;vertical-align:middle;max-width:100%}.fx b{font-weight:inherit;white-space:nowrap}'+\n  '.fx small{display:block;font-size:.64em;font-weight:500;opacity:.62;letter-spacing:0;white-space:nowrap;font-family:inherit}'+\n  '.tick .fx,p .fx,li .fx,.mini .fx,.toast .fx,.hint .fx,.why .fx,.lead2 .fx,.note-row .fx,.notice .fx,.sub .fx,.ins-sum .fx,.src-tag .fx,.log .fx{display:inline;line-height:inherit}'+\n  '.tick .fx small,p .fx small,li .fx small,.mini .fx small,.toast .fx small,.hint .fx small,.why .fx small,.lead2 .fx small,.note-row .fx small,.notice .fx small,.sub .fx small,.ins-sum .fx small,.src-tag
